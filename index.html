<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Геоастро — подготовка к экзамену</title>
<meta name="description" content="Карточки, тесты, подбор и билеты по геодезической астрономии: 39 вопросов, интервальные повторения, конспект со схемами.">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M16 6l2.6 6.4L25 13l-5 4.2L21.6 24 16 20.4 10.4 24 12 17.2 7 13l6.4-.6z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface-2:#f1f3f9; --border:#e3e6ef; --text:#151a2d; --muted:#5b6478;
  --primary:#4f46e5; --primary-ink:#ffffff; --primary-soft:#eef0ff; --primary-strong:#3730a3;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#b91c1c; --bad-soft:#fee2e2; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  --shadow-lg:0 10px 40px rgba(16,24,40,.14);
  --r:14px; --r-sm:10px; --fig-bg:#ffffff;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1120; --surface:#161a2e; --surface-2:#1e2340; --border:#2a3052; --text:#e8eaf6; --muted:#a2a9c6;
    --primary:#818cf8; --primary-ink:#0e1120; --primary-soft:#232a52; --primary-strong:#c7d2fe;
    --ok:#4ade80; --ok-soft:#14321f; --bad:#f87171; --bad-soft:#3b1717; --warn:#fbbf24; --warn-soft:#3a2c0b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --shadow-lg:0 10px 40px rgba(0,0,0,.5);
    --fig-bg:#f8fafc; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1120; --surface:#161a2e; --surface-2:#1e2340; --border:#2a3052; --text:#e8eaf6; --muted:#a2a9c6;
  --primary:#818cf8; --primary-ink:#0e1120; --primary-soft:#232a52; --primary-strong:#c7d2fe;
  --ok:#4ade80; --ok-soft:#14321f; --bad:#f87171; --bad-soft:#3b1717; --warn:#fbbf24; --warn-soft:#3a2c0b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --shadow-lg:0 10px 40px rgba(0,0,0,.5);
  --fig-bg:#f8fafc; color-scheme:dark;
}
*{box-sizing:border-box}
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--bg); color:var(--text); font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; min-height:100vh; }
a{ color:var(--primary); }
svg:not([role="img"]){ stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
.skip{ position:absolute; left:-999px; top:8px; background:var(--primary); color:var(--primary-ink); padding:8px 12px; border-radius:8px; z-index:99;}
.skip:focus{ left:8px; }
:focus-visible{ outline:3px solid var(--primary); outline-offset:2px; border-radius:6px; }

/* top bar */
.topbar{ position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:16px; padding:10px 20px; background:color-mix(in srgb,var(--bg) 85%,transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
.brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text); font-weight:700; }
.logo{ width:34px; height:34px; border-radius:10px; background:var(--primary); display:grid; place-items:center; }
.logo svg{ width:20px; height:20px; fill:var(--primary-ink); stroke:none; }
.brand-text{ display:flex; flex-direction:column; line-height:1.05; font-size:17px; }
.brand-text small{ font-weight:500; font-size:11px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }
.topnav{ display:flex; gap:2px; margin-left:12px; flex:1; }
.topnav a{ text-decoration:none; color:var(--muted); font-weight:500; font-size:15px; padding:8px 12px; border-radius:10px; transition:background .15s,color .15s; }
.topnav a:hover{ background:var(--surface-2); color:var(--text); }
.topnav a.active{ background:var(--primary-soft); color:var(--primary-strong); }
.top-actions{ display:flex; gap:6px; margin-left:auto; }
.icon-btn{ width:44px; height:44px; display:grid; place-items:center; border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:12px; cursor:pointer; }
.icon-btn svg{ width:20px; height:20px; }
.icon-btn:hover{ background:var(--surface-2); }

.bottomnav{ display:none; }
main{ max-width:1080px; margin:0 auto; padding:28px 20px 60px; outline:none; }

@media (max-width:860px){
  .topnav{ display:none; }
  .bottomnav{ display:flex; position:fixed; bottom:0; left:0; right:0; z-index:20; background:var(--surface); border-top:1px solid var(--border); padding:4px 4px calc(4px + env(safe-area-inset-bottom)); }
  .bottomnav a{ flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0; min-height:52px; text-decoration:none; color:var(--muted); font-size:11px; font-weight:500; border-radius:10px; }
  .bottomnav a svg{ width:22px; height:22px; }
  .bottomnav a.active{ color:var(--primary); }
  main{ padding:18px 16px 96px; }
  .topbar{ padding:8px 16px; }
}

/* generic */
h1.page{ font-size:clamp(24px,4vw,32px); line-height:1.15; margin:0 0 6px; letter-spacing:-.02em; }
.lead{ color:var(--muted); margin:0 0 22px; max-width:68ch; }
.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow); padding:20px; }
.grid{ display:grid; gap:14px; }
.g2{ grid-template-columns:repeat(2,minmax(0,1fr)); } .g3{ grid-template-columns:repeat(3,minmax(0,1fr)); } .g4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
@media (max-width:860px){ .g3,.g4{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:520px){ .g2,.g3{ grid-template-columns:1fr; } }
.row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.spacer{ flex:1; }
.muted{ color:var(--muted); }
.small{ font-size:14px; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:10px 18px; border-radius:12px; border:1px solid transparent; background:var(--primary); color:var(--primary-ink); font:600 15px/1.2 inherit; font-family:inherit; cursor:pointer; text-decoration:none; transition:transform .12s var(--ease),background .15s,box-shadow .15s; }
.btn:hover{ box-shadow:0 4px 14px color-mix(in srgb,var(--primary) 35%,transparent); }
.btn:active{ transform:scale(.97); }
.btn svg{ width:18px; height:18px; }
.btn.ghost{ background:var(--surface); color:var(--text); border-color:var(--border); }
.btn.ghost:hover{ background:var(--surface-2); box-shadow:none; }
.btn.ok{ background:var(--ok); color:#fff; } .btn.bad{ background:var(--bad); color:#fff; } .btn.warn{ background:var(--warn); color:#fff; }
:root[data-theme="dark"] .btn.ok, :root[data-theme="dark"] .btn.bad, :root[data-theme="dark"] .btn.warn{ color:#0e1120; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .btn.ok,:root:not([data-theme="light"]) .btn.bad,:root:not([data-theme="light"]) .btn.warn{ color:#0e1120; } }
.btn.sm{ min-height:36px; padding:6px 12px; font-size:14px; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
kbd{ font:600 12px/1 ui-monospace,monospace; border:1px solid var(--border); border-bottom-width:2px; border-radius:6px; padding:2px 6px; background:var(--surface-2); color:var(--muted); }
.chip{ display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text); font:500 14px/1.2 inherit; font-family:inherit; cursor:pointer; white-space:nowrap; }
.chip[aria-pressed="true"]{ background:var(--primary-soft); border-color:var(--primary); color:var(--primary-strong); }
.chips{ display:flex; gap:8px; flex-wrap:wrap; }
.tag{ display:inline-block; font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--muted); }
.tag.ok{ background:var(--ok-soft); color:var(--ok);} .tag.bad{ background:var(--bad-soft); color:var(--bad);} .tag.warn{ background:var(--warn-soft); color:var(--warn);} .tag.pri{ background:var(--primary-soft); color:var(--primary-strong);}
.bar{ height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden; }
.bar > i{ display:block; height:100%; background:var(--primary); border-radius:99px; transition:width .5s var(--ease); }
.bar.ok > i{ background:var(--ok); }
.stack-bar{ display:flex; height:10px; border-radius:99px; overflow:hidden; background:var(--surface-2); }
.stack-bar i{ display:block; height:100%; }
select,input[type=number]{ min-height:44px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--text); padding:8px 12px; font:inherit; }
label.field{ display:flex; flex-direction:column; gap:6px; font-weight:600; font-size:14px; }

/* home */
.hero{ display:grid; grid-template-columns:1.3fr 1fr; gap:16px; margin-bottom:16px; }
@media (max-width:860px){ .hero{ grid-template-columns:1fr; } }
.hero .card.primary{ background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 60%,#06b6d4)); color:var(--primary-ink); border:none; }
.hero .card.primary .muted{ color:color-mix(in srgb,var(--primary-ink) 80%,transparent); }
.hero .card.primary .btn{ background:var(--primary-ink); color:var(--primary); }
.big-num{ font-size:40px; font-weight:700; letter-spacing:-.03em; line-height:1; }
.stat{ display:flex; flex-direction:column; gap:4px; }
.stat b{ font-size:26px; letter-spacing:-.02em; }
.mode{ display:flex; flex-direction:column; gap:8px; text-decoration:none; color:var(--text); transition:transform .15s var(--ease),box-shadow .15s; min-height:150px; }
.mode:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); }
.mode .ic{ width:42px; height:42px; border-radius:12px; display:grid; place-items:center; background:var(--primary-soft); color:var(--primary-strong); }
.mode .ic svg{ width:22px; height:22px; }
.mode h3{ margin:4px 0 0; font-size:17px; }
.mode p{ margin:0; color:var(--muted); font-size:14px; }
.block-row{ display:grid; grid-template-columns:1fr 160px 48px; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); }
.block-row:last-child{ border-bottom:none; }
@media (max-width:520px){ .block-row{ grid-template-columns:1fr 70px 40px; } }
.section-title{ font-size:18px; margin:28px 0 12px; }

/* flashcards */
.fc-wrap{ perspective:1600px; margin:16px 0; }
.fc{ position:relative; width:100%; min-height:min(52vh,380px); cursor:pointer; transform-style:preserve-3d; transition:transform .5s var(--ease); border:none; background:none; padding:0; font:inherit; color:inherit; text-align:inherit; display:block; }
.fc.flipped{ transform:rotateY(180deg); }
.fc-face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 28px; text-align:center; }
.fc-back{ transform:rotateY(180deg); }
.fc-face .txt{ font-size:clamp(19px,2.6vw,26px); line-height:1.4; font-weight:600; max-width:44ch; }
.fc-back .txt{ font-weight:500; font-size:clamp(17px,2.2vw,22px); }
.fc-face .corner{ position:absolute; top:14px; left:16px; right:16px; display:flex; justify-content:space-between; font-size:13px; color:var(--muted); }
.fc-face .hint{ position:absolute; bottom:14px; font-size:13px; color:var(--muted); }
.star{ width:44px; height:44px; display:grid; place-items:center; border-radius:12px; border:1px solid var(--border); background:var(--surface); cursor:pointer; color:var(--muted); }
.star svg{ width:20px; height:20px; }
.star[aria-pressed="true"]{ color:#eab308; } .star[aria-pressed="true"] svg{ fill:#eab308; }
.grade{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.grade .btn{ flex-direction:column; gap:2px; min-height:56px; }
.grade small{ font-weight:500; opacity:.85; font-size:12px; }
.progress-line{ display:flex; align-items:center; gap:12px; font-size:14px; color:var(--muted); }
.progress-line .bar{ flex:1; }

/* quiz */
.q-card{ padding:24px; }
.q-title{ font-size:clamp(18px,2.4vw,22px); font-weight:600; line-height:1.4; margin:6px 0 18px; }
.opts{ display:grid; gap:10px; }
.opt{ display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%; min-height:52px; padding:12px 16px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface); color:var(--text); font:inherit; font-size:16px; cursor:pointer; transition:border-color .15s,background .15s,transform .1s; }
.opt:hover:not([disabled]){ border-color:var(--primary); background:var(--primary-soft); }
.opt .k{ flex:none; width:26px; height:26px; border-radius:8px; display:grid; place-items:center; background:var(--surface-2); font-size:13px; font-weight:700; color:var(--muted); }
.opt.right{ border-color:var(--ok); background:var(--ok-soft); }
.opt.right .k{ background:var(--ok); color:#fff; }
.opt.wrong{ border-color:var(--bad); background:var(--bad-soft); animation:shake .3s; }
.opt.wrong .k{ background:var(--bad); color:#fff; }
.opt[disabled]{ cursor:default; }
@keyframes shake{ 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
.explain{ margin-top:16px; padding:14px 16px; border-radius:12px; background:var(--surface-2); border-left:4px solid var(--primary); }
.explain.ok{ border-color:var(--ok); } .explain.bad{ border-color:var(--bad); }
.fig-q{ background:var(--fig-bg); border-radius:12px; padding:10px; border:1px solid var(--border); }
.fig-q svg, .note-body svg{ width:100%; height:auto; max-height:420px; display:block; margin:0 auto; }
.result-ring{ width:150px; height:150px; }
.result-ring circle{ fill:none; stroke-width:12; }

/* match */
.match-grid{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
@media (max-width:700px){ .match-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
.tile{ min-height:110px; padding:12px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface); color:var(--text); font:inherit; font-size:14px; line-height:1.35; cursor:pointer; box-shadow:var(--shadow); transition:transform .15s var(--ease),opacity .3s,border-color .15s,background .15s; }
.tile.sel{ border-color:var(--primary); background:var(--primary-soft); transform:translateY(-2px); }
.tile.bad{ border-color:var(--bad); background:var(--bad-soft); animation:shake .3s; }
.tile.done{ opacity:0; transform:scale(.85); pointer-events:none; }
.tile.term{ font-weight:600; }
.timer{ font:700 28px/1 ui-monospace,monospace; letter-spacing:-.02em; }

/* tickets & notes */
.t-list{ display:grid; gap:8px; }
.t-item{ display:flex; align-items:center; gap:14px; padding:12px 16px; border-radius:12px; background:var(--surface); border:1px solid var(--border); text-decoration:none; color:var(--text); min-height:56px; transition:border-color .15s,background .15s; }
.t-item:hover{ border-color:var(--primary); }
.t-num{ flex:none; width:38px; height:38px; border-radius:10px; display:grid; place-items:center; font-weight:700; background:var(--surface-2); }
.t-num.k2{ background:var(--ok-soft); color:var(--ok);} .t-num.k1{ background:var(--warn-soft); color:var(--warn);} .t-num.k0{ background:var(--bad-soft); color:var(--bad);}
.t-title{ flex:1; font-weight:500; }
.note-body{ font-size:16.5px; line-height:1.65; }
.note-body h3{ font-size:14px; letter-spacing:.06em; text-transform:uppercase; color:var(--primary); margin:26px 0 8px; }
.note-body p, .note-body li{ max-width:75ch; }
.note-body table{ border-collapse:collapse; width:100%; font-size:14.5px; margin:10px 0 16px; display:block; overflow-x:auto; }
.note-body th{ text-align:left; background:var(--surface-2); padding:8px 10px; border-bottom:2px solid var(--border); }
.note-body td{ padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
.note-body figure{ margin:18px 0; background:var(--fig-bg); border:1px solid var(--border); border-radius:14px; padding:12px; color:#1e293b; }
.note-body figcaption{ font-size:13.5px; color:#475569; text-align:center; margin-top:6px; }
.note-body math[display="block"]{ display:block math; margin:12px 0; overflow-x:auto; overflow-y:hidden; padding:4px 0; }
.note-body .ans, .box-short{ background:var(--primary-soft); border-left:4px solid var(--primary); padding:12px 16px; border-radius:0 12px 12px 0; margin:12px 0; }
.note-body .key, .box-key{ background:var(--warn-soft); border-left:4px solid var(--warn); padding:12px 16px; border-radius:0 12px 12px 0; margin:12px 0; }
.box-short p, .box-key p, .note-body .ans p, .note-body .key p{ margin:0; }
.note-body .src{ display:block; text-align:right; color:var(--muted); font-size:13px; }
.toc{ position:sticky; top:80px; }
.notes-layout{ display:grid; grid-template-columns:260px 1fr; gap:24px; align-items:start; }
@media (max-width:860px){ .notes-layout{ grid-template-columns:1fr; } .toc{ position:static; } .toc-list{ display:none; } }
.toc-list{ display:flex; flex-direction:column; gap:2px; max-height:calc(100vh - 120px); overflow:auto; font-size:14px; }
.toc-list a{ text-decoration:none; color:var(--muted); padding:6px 10px; border-radius:8px; }
.toc-list a:hover{ background:var(--surface-2); color:var(--text); }
.toc-list a.active{ background:var(--primary-soft); color:var(--primary-strong); font-weight:600; }
.toc-list .blk{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text); padding:12px 10px 4px; }
.exam-timer{ font:700 44px/1 ui-monospace,monospace; text-align:center; letter-spacing:-.02em; }
.reveal{ animation:fadeUp .35s var(--ease); }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }

/* search modal */
.modal{ position:fixed; inset:0; z-index:50; background:rgba(10,12,24,.45); display:flex; justify-content:center; align-items:flex-start; padding:10vh 16px 16px; }
.modal[hidden]{ display:none; }
.modal-box{ width:min(680px,100%); background:var(--surface); border-radius:18px; box-shadow:var(--shadow-lg); overflow:hidden; border:1px solid var(--border); }
.search-row{ display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border); }
.search-row svg{ width:20px; height:20px; color:var(--muted); flex:none; }
.search-row input{ flex:1; border:none; background:none; font:inherit; font-size:17px; color:var(--text); outline:none; min-height:40px; }
.search-results{ max-height:60vh; overflow:auto; padding:8px; }
.search-results a{ display:block; padding:10px 12px; border-radius:10px; text-decoration:none; color:var(--text); }
.search-results a:hover, .search-results a:focus{ background:var(--surface-2); }
.search-results .sub{ display:block; color:var(--muted); font-size:13.5px; margin-top:2px; }
mark{ background:color-mix(in srgb,#facc15 45%,transparent); color:inherit; border-radius:3px; padding:0 1px; }
.toast{ position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:12px; font-size:14px; font-weight:500; opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; z-index:60; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.empty{ text-align:center; padding:40px 20px; color:var(--muted); }
.kbd-help{ font-size:13px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:14px; }
@media (max-width:860px){ .kbd-help{ display:none; } }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
@media (max-width:860px){ .toc-list{ display:none; } article{ min-width:0; } }
.notes-layout > *{ min-width:0; }
#rndWeak{ white-space:normal; text-align:left; }

</style>
<script>
  try { var t = localStorage.getItem('ga.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#main">К содержимому</a>
<header class="topbar">
  <a class="brand" href="#/" aria-label="На главную">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.5 6.2 6.6.5-5 4.3 1.6 6.5L12 16.4 6.3 20l1.6-6.5-5-4.3 6.6-.5z"/></svg></span>

<script>
window.DATA={"blocks": [{"title": "I. Общие вопросы", "tickets": [1, 2, 3]}, {"title": "II. Принципы, способы и инструменты", "tickets": [4, 5, 6, 7, 8]}, {"title": "III. Время, хронометры, радиосигналы", "tickets": [9, 10, 11, 12, 13]}, {"title": "IV. Общая теория зенитальных способов", "tickets": [14, 15, 16, 17, 18, 19, 20, 21]}, {"title": "V. Способы Сомнера, Талькотта, Цингера и Певцова", "tickets": [22, 23, 24, 25, 26, 27, 28, 29, 30]}, {"title": "VI. Азимут, Полярная и Солнце", "tickets": [31, 32, 33, 34, 35, 36, 37]}, {"title": "VII. Редукции к центру знака и к среднему полюсу", "tickets": [38, 39]}], "tickets": [{"n": 1, "title": "Предмет и задачи геодезической астрономии. Общие принципы определения φ, λ и a", "block": 0, "short": "<p>Геодезическая астрономия — раздел\nастрономии, который разрабатывает теорию и методы определения\nастрономических широты φ, долготы λ и азимута a направлений из\nнаблюдений небесных светил. Эти величины отнесены к <strong>отвесной\nлинии</strong> в точке наблюдения. Принцип: положение зенита на небесной\nсфере задаёт сразу широту (δ<sub>Z</sub> = φ) и местное звёздное время\n(α<sub>Z</sub> = s). Зенит находят по зенитным расстояниям или азимутам\nминимум двух светил. Долгота — это разность местного и гринвичского\nвремени, а азимут предмета = азимут светила + измеренный угол.</p>", "key": "<p>δ<sub>Z</sub> = φ, α<sub>Z</sub> = s. Два\nсветила в перпендикулярных вертикалах. λ = s − S, a = A + Q.\nАстрономические координаты — относительно <strong>отвеса</strong>,\nгеодезические — относительно <strong>нормали к эллипсоиду</strong>; их\nразность — уклонение отвеса.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Геодезическая астрономия — раздел\nастрономии, который разрабатывает теорию и методы определения\nастрономических широты φ, долготы λ и азимута a направлений из\nнаблюдений небесных светил. Эти величины отнесены к <strong>отвесной\nлинии</strong> в точке наблюдения. Принцип: положение зенита на небесной\nсфере задаёт сразу широту (δ<sub>Z</sub> = φ) и местное звёздное время\n(α<sub>Z</sub> = s). Зенит находят по зенитным расстояниям или азимутам\nминимум двух светил. Долгота — это разность местного и гринвичского\nвремени, а азимут предмета = азимут светила + измеренный угол.</p>\n</div>\n<h3 id=\"теория\">Теория</h3>\n<p><strong>Что такое астрономические координаты.</strong> Направление\nотвесной линии в точке — это ось, относительно которой мы\n«привязываемся» к небу.</p>\n<ul>\n<li><strong>Широта φ</strong> — угол между отвесной линией и плоскостью\nэкватора. На небесной сфере это <strong>высота полюса мира</strong> над\nгоризонтом (рис. 1) и одновременно <strong>склонение\nзенита</strong>.</li>\n<li><strong>Долгота λ</strong> — двугранный угол между плоскостью\nастрономического меридиана пункта и плоскостью начального (гринвичского)\nмеридиана. В единицах времени: λ = s − S.</li>\n<li><strong>Азимут a</strong> — двугранный угол между плоскостью\nмеридиана и вертикальной плоскостью, проходящей через предмет.\nОтсчитывается от точки севера по ходу часовой стрелки.</li>\n</ul>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 470 350\" style=\"max-width:400px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><circle cx=\"230.0\" cy=\"185.0\" r=\"135.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" fill=\"none\"/><ellipse cx=\"230.0\" cy=\"185.0\" rx=\"135.0\" ry=\"34.0\" stroke=\"#059669\" stroke-width=\"1.4\" fill=\"none\" transform=\"rotate(0 230.0 185.0)\"/><line x1=\"95.0\" y1=\"185.0\" x2=\"365.0\" y2=\"185.0\" stroke=\"#059669\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><line x1=\"307.4\" y1=\"295.6\" x2=\"152.6\" y2=\"74.4\" stroke=\"#2563eb\" stroke-width=\"1.4\"/><line x1=\"119.4\" y1=\"262.4\" x2=\"340.6\" y2=\"107.6\" stroke=\"#d97706\" stroke-width=\"1.6\"/><line x1=\"230.0\" y1=\"50.0\" x2=\"230.0\" y2=\"320.0\" stroke=\"#64748b\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><path d=\"M79.0,185.0 A151,151 0 0 1 143.4,61.3\" stroke=\"#2563eb\" stroke-width=\"2\" fill=\"none\"/><text x=\"83.6\" y=\"108.8\" fill=\"#2563eb\" font-size=\"15\" text-anchor=\"middle\" font-style=\"italic\">φ</text><path d=\"M230.0,34.0 A151,151 0 0 1 353.7,98.4\" stroke=\"#d97706\" stroke-width=\"2\" fill=\"none\"/><text x=\"306.2\" y=\"38.6\" fill=\"#d97706\" font-size=\"15\" text-anchor=\"middle\" font-style=\"italic\">φ</text><circle cx=\"230.0\" cy=\"50.0\" r=\"3.2\" fill=\"#1e293b\"/><text x=\"230.0\" y=\"42.0\" fill=\"#1e293b\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"600\">Z</text><circle cx=\"230.0\" cy=\"320.0\" r=\"3.2\" fill=\"#1e293b\"/><text x=\"230.0\" y=\"338.0\" fill=\"#1e293b\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"600\">Z′</text><circle cx=\"152.6\" cy=\"74.4\" r=\"3.2\" fill=\"#1e293b\"/><text x=\"140.6\" y=\"70.4\" fill=\"#1e293b\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"600\">P</text><circle cx=\"307.4\" cy=\"295.6\" r=\"3.2\" fill=\"#1e293b\"/><text x=\"317.4\" y=\"309.6\" fill=\"#1e293b\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"600\">P′</text><circle cx=\"95.0\" cy=\"185.0\" r=\"3.2\" fill=\"#1e293b\"/><text x=\"81.0\" y=\"190.0\" fill=\"#1e293b\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"600\">N</text><circle cx=\"365.0\" cy=\"185.0\" r=\"3.2\" fill=\"#1e293b\"/><text x=\"379.0\" y=\"190.0\" fill=\"#1e293b\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"600\">S</text><circle cx=\"340.6\" cy=\"107.6\" r=\"3.2\" fill=\"#1e293b\"/><text x=\"350.6\" y=\"103.6\" fill=\"#1e293b\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"600\">Q</text><circle cx=\"119.4\" cy=\"262.4\" r=\"3.2\" fill=\"#1e293b\"/><text x=\"107.4\" y=\"276.4\" fill=\"#1e293b\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"600\">Q′</text><circle cx=\"230.0\" cy=\"185.0\" r=\"3.2\" fill=\"#1e293b\"/><text x=\"242.0\" y=\"201.0\" fill=\"#1e293b\" font-size=\"12\" text-anchor=\"middle\">O</text><text x=\"335.0\" y=\"233.0\" fill=\"#059669\" font-size=\"11\" text-anchor=\"middle\">горизонт</text><text x=\"179.4\" y=\"234.4\" fill=\"#d97706\" font-size=\"11\" text-anchor=\"middle\">экватор</text><text x=\"196.6\" y=\"76.4\" fill=\"#2563eb\" font-size=\"11\" text-anchor=\"middle\">ось мира</text><polygon points=\"265.4,103.1 267.0,107.0 271.1,107.3 267.9,110.0 268.9,114.0 265.4,111.8 261.8,114.0 262.8,110.0 259.7,107.3 263.8,107.0\" fill=\"#dc2626\"/><text x=\"277.4\" y=\"103.1\" fill=\"#dc2626\" font-size=\"14\" text-anchor=\"middle\" font-style=\"italic\">σ</text></svg><figcaption><b>Рис. 2.</b> Небесная сфера в плоскости меридиана. Высота полюса над горизонтом равна широте φ; склонение зенита δ<sub>Z</sub> = φ.</figcaption></figure>\n<p><strong>Ключевая мысль (Уралов, § 2).</strong> Если в момент T мы\nзнаем, где на небе находится наш зенит Z, то:</p>\n<ul>\n<li>склонение зенита δ<sub>Z</sub> = φ → получили\n<strong>широту</strong>;</li>\n<li>прямое восхождение зенита α<sub>Z</sub> = s → получили\n<strong>местное звёздное время</strong>;</li>\n<li>большой круг через P и Z — это <strong>меридиан</strong>, т. е.\nнаправление на север.</li>\n</ul>\n<p>Зенит «невидим», но его положение относительно звёзд можно измерить.\nДля этого нужны минимум <strong>два светила</strong> с известными α, δ\n(из АЕ):</p>\n<ol type=\"1\">\n<li><strong>Зенитальный принцип</strong> — измеряем зенитные расстояния\nz₁, z₂. Зенит лежит на пересечении двух кругов равных высот\n(альмукантаратов).</li>\n<li><strong>Азимутальный принцип</strong> — измеряем горизонтальные\nнаправления на светила. Зенит лежит на пересечении двух вертикалов.</li>\n</ol>\n<p>Точнее всего — когда светила в <strong>двух взаимно перпендикулярных\nвертикалах</strong> (линии пересекаются под 90°).</p>\n<p><strong>Долгота.</strong> Местное время s находим из наблюдений\nзвёзд, а гринвичское S в тот же момент — из приёма радиосигналов точного\nвремени. Тогда λ = s − S (или λ = m − UT1).</p>\n<p><strong>Азимут.</strong> Вычисляем азимут светила A на момент\nнаблюдения и измеряем горизонтальный угол Q между светилом и предметом:\na = A + Q.</p>\n<h3 id=\"формулы\">Формулы</h3>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>φ</mi><mo>=</mo><msub><mi>δ</mi><mi>Z</mi></msub><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>s</mi><mo>=</mo><msub><mi>α</mi><mi>Z</mi></msub><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>λ</mi><mo>=</mo><mi>s</mi><mo>−</mo><mi>S</mi><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>a</mi><mo>=</mo><mi>A</mi><mo>+</mo><mi>Q</mi><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>t</mi><mo>=</mo><mi>s</mi><mo>−</mo><mi>α</mi><mo>=</mo><mi>T</mi><mo>+</mo><mi>u</mi><mo>−</mo><mi>α</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\varphi = \\delta_Z ,\\qquad s = \\alpha_Z ,\\qquad \\lambda = s - S ,\\qquad a = A + Q ,\\qquad t = s - \\alpha = T + u - \\alpha .</annotation></semantics></math></p>\n<p><strong>Задачи геодезической астрономии</strong> (Уралов, § 1):</p>\n<ul>\n<li>определение φ, λ, a на <strong>пунктах Лапласа</strong> —\nориентирование государственной геодезической сети и контроль накопления\nошибок в азимутах;</li>\n<li>определение <strong>уклонений отвесной линии</strong> ξ = φ − B, η =\n(λ − L)·cos φ — для астрономо-гравиметрического нивелирования (форма\nгеоида/квазигеоида) и редуцирования измерений на эллипсоид;</li>\n<li>автономное определение азимутов и дирекционных углов (при\nвосстановлении сетей, в прикладной геодезии, при эталонировании\nгиротеодолитов, в маркшейдерии);</li>\n<li>контроль угловых измерений в точной полигонометрии, задачи\nкосмической геодезии.</li>\n</ul>\n<div class=\"key\">\n<p><strong>Запомни.</strong> δ<sub>Z</sub> = φ, α<sub>Z</sub> = s. Два\nсветила в перпендикулярных вертикалах. λ = s − S, a = A + Q.\nАстрономические координаты — относительно <strong>отвеса</strong>,\nгеодезические — относительно <strong>нормали к эллипсоиду</strong>; их\nразность — уклонение отвеса.</p>\n</div>\n<p><span class=\"src\">Уралов, § 1–2, с. 5–9</span></p>"}, {"n": 2, "title": "Роль геодезической астрономии при создании геодезических сетей", "block": 0, "short": "<p>Астрономические определения дают сети\n<strong>ориентировку</strong> и <strong>контроль</strong> её азимутов:\nна пунктах Лапласа из астрономического азимута и уклонения отвеса по\nуравнению Лапласа получают безошибочный (в смысле накопления)\nгеодезический азимут. Кроме того, разности астрономических и\nгеодезических координат дают уклонения отвесных линий, нужные для\nастрономо-гравиметрического нивелирования, вывода высот квазигеоида и\nредуцирования измерений на эллипсоид.</p>", "key": "<p>Уравнение Лапласа: α<sub>г</sub> = a − (λ −\nL)·sin φ. Пункт Лапласа = φ + λ + a. Через 70–110 км; 18–20 на полигон.\nБез астрономии сеть «поворачивается», с азимутами Лапласа — нет.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Астрономические определения дают сети\n<strong>ориентировку</strong> и <strong>контроль</strong> её азимутов:\nна пунктах Лапласа из астрономического азимута и уклонения отвеса по\nуравнению Лапласа получают безошибочный (в смысле накопления)\nгеодезический азимут. Кроме того, разности астрономических и\nгеодезических координат дают уклонения отвесных линий, нужные для\nастрономо-гравиметрического нивелирования, вывода высот квазигеоида и\nредуцирования измерений на эллипсоид.</p>\n</div>\n<h3 id=\"теория-1\">Теория</h3>\n<p>В рядах триангуляции и полигонометрии ошибки измерения углов\n<strong>накапливаются</strong>: азимут дальней стороны известен всё хуже\nи хуже. Астрономия даёт азимут «из космоса» — независимо от длины ряда.\nНо астрономический азимут a отнесён к отвесной линии, а сети нужен\n<strong>геодезический азимут</strong> α<sub>г</sub> (относительно\nнормали). Связь между ними — <strong>уравнение Лапласа</strong>:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>α</mi><mtext mathvariant=\"normal\">г</mtext></msub><mo>=</mo><mi>a</mi><mo>−</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>λ</mi><mo>−</mo><mi>L</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>sin</mo><mi>φ</mi><mspace width=\"1.0em\"></mspace><mrow><mtext mathvariant=\"normal\">(в секундах дуги: </mtext><mspace width=\"0.333em\"></mspace></mrow><mi>a</mi><mo>−</mo><mn>15</mn><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msup><mi>λ</mi><mi>s</mi></msup><mo>−</mo><msup><mi>L</mi><mi>s</mi></msup><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>sin</mo><mi>B</mi><mtext mathvariant=\"normal\">)</mtext><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\alpha_{\\text{г}} = a - (\\lambda - L)\\sin\\varphi \\quad\\text{(в секундах дуги: } a - 15(\\lambda^{s}-L^{s})\\sin B\\text{)} .</annotation></semantics></math></p>\n<p>Пункт, на котором определены φ, λ и a, называется <strong>пунктом\nЛапласа</strong>, а азимут α<sub>г</sub> — <strong>азимутом\nЛапласа</strong>. Азимуты Лапласа называют «угловыми базисами»: они\nделят сеть на звенья, внутри которых накопление азимутальной ошибки\nограничено.</p>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 500 205\" style=\"max-width:470px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><line x1=\"30.0\" y1=\"60.0\" x2=\"85.0\" y2=\"110.0\" stroke=\"#64748b\" stroke-width=\"1.1\"/><line x1=\"85.0\" y1=\"110.0\" x2=\"140.0\" y2=\"60.0\" stroke=\"#64748b\" stroke-width=\"1.1\"/><line x1=\"140.0\" y1=\"60.0\" x2=\"195.0\" y2=\"110.0\" stroke=\"#64748b\" stroke-width=\"1.1\"/><line x1=\"195.0\" y1=\"110.0\" x2=\"250.0\" y2=\"60.0\" stroke=\"#64748b\" stroke-width=\"1.1\"/><line x1=\"250.0\" y1=\"60.0\" x2=\"305.0\" y2=\"110.0\" stroke=\"#64748b\" stroke-width=\"1.1\"/><line x1=\"305.0\" y1=\"110.0\" x2=\"360.0\" y2=\"60.0\" stroke=\"#64748b\" stroke-width=\"1.1\"/><line x1=\"360.0\" y1=\"60.0\" x2=\"415.0\" y2=\"110.0\" stroke=\"#64748b\" stroke-width=\"1.1\"/><line x1=\"415.0\" y1=\"110.0\" x2=\"470.0\" y2=\"60.0\" stroke=\"#64748b\" stroke-width=\"1.1\"/><line x1=\"30.0\" y1=\"60.0\" x2=\"140.0\" y2=\"60.0\" stroke=\"#64748b\" stroke-width=\"1.1\"/><line x1=\"85.0\" y1=\"110.0\" x2=\"195.0\" y2=\"110.0\" stroke=\"#64748b\" stroke-width=\"1.1\"/><line x1=\"140.0\" y1=\"60.0\" x2=\"250.0\" y2=\"60.0\" stroke=\"#64748b\" stroke-width=\"1.1\"/><line x1=\"195.0\" y1=\"110.0\" x2=\"305.0\" y2=\"110.0\" stroke=\"#64748b\" stroke-width=\"1.1\"/><line x1=\"250.0\" y1=\"60.0\" x2=\"360.0\" y2=\"60.0\" stroke=\"#64748b\" stroke-width=\"1.1\"/><line x1=\"305.0\" y1=\"110.0\" x2=\"415.0\" y2=\"110.0\" stroke=\"#64748b\" stroke-width=\"1.1\"/><line x1=\"360.0\" y1=\"60.0\" x2=\"470.0\" y2=\"60.0\" stroke=\"#64748b\" stroke-width=\"1.1\"/><circle cx=\"30.0\" cy=\"60.0\" r=\"3\" fill=\"#1e293b\"/><circle cx=\"85.0\" cy=\"110.0\" r=\"3\" fill=\"#1e293b\"/><circle cx=\"140.0\" cy=\"60.0\" r=\"3\" fill=\"#1e293b\"/><circle cx=\"195.0\" cy=\"110.0\" r=\"3\" fill=\"#1e293b\"/><circle cx=\"250.0\" cy=\"60.0\" r=\"3\" fill=\"#1e293b\"/><circle cx=\"305.0\" cy=\"110.0\" r=\"3\" fill=\"#1e293b\"/><circle cx=\"360.0\" cy=\"60.0\" r=\"3\" fill=\"#1e293b\"/><circle cx=\"415.0\" cy=\"110.0\" r=\"3\" fill=\"#1e293b\"/><circle cx=\"470.0\" cy=\"60.0\" r=\"3\" fill=\"#1e293b\"/><rect x=\"24\" y=\"54\" width=\"12\" height=\"12\" fill=\"#dc2626\"/><rect x=\"79\" y=\"104\" width=\"12\" height=\"12\" fill=\"#dc2626\"/><rect x=\"409\" y=\"104\" width=\"12\" height=\"12\" fill=\"#dc2626\"/><rect x=\"464\" y=\"54\" width=\"12\" height=\"12\" fill=\"#dc2626\"/><line x1=\"30.0\" y1=\"60.0\" x2=\"85.0\" y2=\"110.0\" stroke=\"#dc2626\" stroke-width=\"3\"/><line x1=\"415.0\" y1=\"110.0\" x2=\"470.0\" y2=\"60.0\" stroke=\"#dc2626\" stroke-width=\"3\"/><text x=\"58.0\" y=\"145.0\" fill=\"#dc2626\" font-size=\"11\" text-anchor=\"middle\">базисная сторона</text><text x=\"442.0\" y=\"145.0\" fill=\"#dc2626\" font-size=\"11\" text-anchor=\"middle\">базисная сторона</text><line x1=\"85.0\" y1=\"175.0\" x2=\"415.0\" y2=\"175.0\" stroke=\"#1e293b\" stroke-width=\"1.4\" marker-end=\"url(#ar)\" marker-start=\"url(#ar)\"/><text x=\"250.0\" y=\"192.0\" fill=\"#1e293b\" font-size=\"12\" text-anchor=\"middle\">70–110 км (ряды 1 класса)</text><rect x=\"20\" y=\"10\" width=\"12\" height=\"12\" fill=\"#dc2626\"/><text x=\"40.0\" y=\"21.0\" fill=\"#1e293b\" font-size=\"12\" text-anchor=\"start\">— пункт Лапласа (φ, λ, a)</text></svg><figcaption><b>Рис. 3.</b> Пункты Лапласа в ряду триангуляции: на концах базисных сторон, через 70–110 км.</figcaption></figure>\n<p><strong>Где размещают</strong> (по Инструкции, Уралов § 1):</p>\n<ul>\n<li>на промежуточных пунктах рядов 1 класса — через <strong>70–110\nкм</strong>;</li>\n<li>в сплошных сетях 1 и 2 класса — на <strong>обоих концах базисной\nстороны</strong>;</li>\n<li>в каждом полигоне 1 класса — минимум <strong>18–20 пунктов\nЛапласа</strong>;</li>\n<li>на линиях <strong>астрономо-гравиметрического нивелирования\n(АГН)</strong> — астропункты через ≤ 125 км при грависъёмке плотностью 1\nпункт на 200 км², и примерно через 60 км там, где детальной грависъёмки\nнет.</li>\n</ul>\n<p><strong>Уклонения отвеса.</strong> На астропунктах находят\nсоставляющие</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ξ</mi><mo>=</mo><mi>φ</mi><mo>−</mo><mi>B</mi><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>η</mi><mo>=</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>λ</mi><mo>−</mo><mi>L</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>cos</mo><mi>φ</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\xi = \\varphi - B ,\\qquad \\eta = (\\lambda - L)\\cos\\varphi .</annotation></semantics></math></p>\n<p>Они нужны, чтобы перевычислить измеренные направления и азимуты на\nповерхность эллипсоида, найти высоты квазигеоида\n(астрономо-гравиметрическое нивелирование) и ориентировать\nреференц-эллипсоид в теле Земли.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> Уравнение Лапласа: α<sub>г</sub> = a − (λ −\nL)·sin φ. Пункт Лапласа = φ + λ + a. Через 70–110 км; 18–20 на полигон.\nБез астрономии сеть «поворачивается», с азимутами Лапласа — нет.</p>\n</div>\n<p><span class=\"src\">Уралов, § 1, с. 5–7</span></p>"}, {"n": 3, "title": "Требования Инструкции к точности астрономических определений", "block": 0, "short": "<p>На пунктах Лапласа в сетях 1 и 2 классов и\nна пунктах основных линий АГН астрономические определения выполняют с\nодинаковой точностью. По внутренней сходимости средние квадратические\nпогрешности не должны превышать: <strong>широты — 0,3″</strong>,\n<strong>долготы — 0,03ˢ</strong> (≈ 0,45″·cos φ по дуге),\n<strong>астрономического азимута — 0,5″</strong>. Для этого Инструкция\nзадаёт приборы, программы (число пар звёзд, приёмов, вечеров), допуски\nна расхождения и требования к хронометрам.</p>", "key": "<p>0,3″ — 0,03ˢ — 0,5″ (φ — λ — a). Вариация\nсуточного хода хронометра ≤ 0,5ˢ. Это точность <strong>по внутренней\nсходимости</strong> (из уравнивания на пункте).</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> На пунктах Лапласа в сетях 1 и 2 классов и\nна пунктах основных линий АГН астрономические определения выполняют с\nодинаковой точностью. По внутренней сходимости средние квадратические\nпогрешности не должны превышать: <strong>широты — 0,3″</strong>,\n<strong>долготы — 0,03ˢ</strong> (≈ 0,45″·cos φ по дуге),\n<strong>астрономического азимута — 0,5″</strong>. Для этого Инструкция\nзадаёт приборы, программы (число пар звёзд, приёмов, вечеров), допуски\nна расхождения и требования к хронометрам.</p>\n</div>\n<h3 id=\"теория-2\">Теория</h3>\n<p>Точность выбирается так, чтобы ошибка астрономических данных была\n<strong>меньше</strong> ошибок, которые астрономия должна контролировать\nв геодезической сети, и чтобы уклонения отвеса получались с погрешностью\nоколо 0,5″.</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Величина</th>\n<th>Требование (СКП, не более)</th>\n<th>Чем достигается</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Широта φ</td>\n<td>0,3″</td>\n<td>способ Талькотта: 10–12 пар (АУ 2″/10″) или 16–18 пар (У5)</td>\n</tr>\n<tr class=\"even\">\n<td>Долгота λ</td>\n<td>0,03ˢ</td>\n<td>способ Цингера + приём радиосигналов + учёт лично-инструментальной\nразности</td>\n</tr>\n<tr class=\"odd\">\n<td>Азимут a</td>\n<td>0,5″</td>\n<td>по часовому углу Полярной, ≥ 18 приёмов, ≥ 3 дней</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Почему 0,03ˢ, а не 0,3″?</strong> 1ˢ времени = 15″ дуги, но\nпо параллели дуга сжимается в cos φ раз: 0,03ˢ × 15 × cos φ ≈ 0,45″·cos\nφ — это примерно 0,25–0,3″ на средних широтах. То есть требования к φ и\nλ <strong>согласованы по линейной мере на местности</strong>.</p>\n<p><strong>Дополнительные требования Инструкции:</strong></p>\n<ul>\n<li>хронометры: средняя квадратическая <strong>вариация суточного хода ≤\n0,5ˢ</strong>, вариация двухчасового хода ≤ 0,06ˢ;</li>\n<li>передача поправки хронометра на момент наблюдения — с ошибкой не\nболее 0,1ˢ (для способа Талькотта);</li>\n<li>приведение к центру знака: расстояние — с погрешностью ≤ 5 см,\nазимут направления на центр — ≤ 30″;</li>\n<li>лично-инструментальную разность наблюдателя определяют на основном\nпункте до и после сезона.</li>\n</ul>\n<p>Для приближённых определений (контроль, прикладные задачи) точность\nниже: например, азимут с ошибкой 15″ и грубее определяют по Полярной\nупрощённо — широту достаточно знать до 1′, поправку часов — до 3–4ˢ.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> 0,3″ — 0,03ˢ — 0,5″ (φ — λ — a). Вариация\nсуточного хода хронометра ≤ 0,5ˢ. Это точность <strong>по внутренней\nсходимости</strong> (из уравнивания на пункте).</p>\n</div>\n<p><span class=\"src\">Уралов, § 1, с. 6; § 18, с. 88; § 40, с.\n196</span></p>"}, {"n": 4, "title": "Зенитальные способы определения широты и долготы", "block": 1, "short": "<p>Зенитальные способы основаны на измерении\n<strong>зенитных расстояний</strong> светил (или на фиксации моментов,\nкогда светила достигают заданного z). Зависимость z от φ и t дана\nформулой cos z = sin φ sin δ + cos φ cos δ cos t. Широту выгодно\nопределять по светилам <strong>в меридиане</strong> (там z чувствительно\nк φ и нечувствительно к времени), время и долготу — по светилам\n<strong>в первом вертикале</strong>. Чтобы исключить постоянные\nсистематические ошибки, светила наблюдают <strong>парами</strong>\nсимметрично: N и S (широта), E и W (время).</p>", "key": "<p>Широта — меридиан (cos A); время — первый\nвертикал (sin A). Пары на равных z исключают постоянные ошибки. Талькотт\nрекомендован Инструкцией для пунктов 1–2 класса (|z<sub>S</sub> −\nz<sub>N</sub>| ≤ 20–30′).</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Зенитальные способы основаны на измерении\n<strong>зенитных расстояний</strong> светил (или на фиксации моментов,\nкогда светила достигают заданного z). Зависимость z от φ и t дана\nформулой cos z = sin φ sin δ + cos φ cos δ cos t. Широту выгодно\nопределять по светилам <strong>в меридиане</strong> (там z чувствительно\nк φ и нечувствительно к времени), время и долготу — по светилам\n<strong>в первом вертикале</strong>. Чтобы исключить постоянные\nсистематические ошибки, светила наблюдают <strong>парами</strong>\nсимметрично: N и S (широта), E и W (время).</p>\n</div>\n<h3 id=\"теория-3\">Теория</h3>\n<p>Продифференцируем основную формулу (Уралов, § 2). Получаем, как\nизменится z при малых ошибках:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Δ</mi><mi>z</mi><mo>=</mo><mo>cos</mo><mi>A</mi><mspace width=\"0.167em\"></mspace><mi>Δ</mi><mi>φ</mi><mo>+</mo><mn>15</mn><mo>cos</mo><mi>φ</mi><mspace width=\"0.167em\"></mspace><mo>sin</mo><mi>A</mi><mspace width=\"0.167em\"></mspace><mi>Δ</mi><mi>t</mi><mo>−</mo><mo>cos</mo><mi>q</mi><mspace width=\"0.167em\"></mspace><mi>Δ</mi><mi>δ</mi><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>Δ</mi><mi>t</mi><mo>=</mo><mi>Δ</mi><mi>T</mi><mo>+</mo><mi>Δ</mi><mi>u</mi><mo>−</mo><mi>Δ</mi><mi>α</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta z = \\cos A\\,\\Delta\\varphi + 15\\cos\\varphi\\,\\sin A\\,\\Delta t - \\cos q\\,\\Delta\\delta ,\\qquad \\Delta t = \\Delta T + \\Delta u - \\Delta\\alpha</annotation></semantics></math></p>\n<p>(азимут A отсчитан от юга). Отсюда сразу видны <strong>выгоднейшие\nусловия</strong>:</p>\n<ul>\n<li><strong>Широта:</strong> коэффициент при Δφ равен cos A — максимум\n(±1) в <strong>меридиане</strong> (A = 0° или 180°). Там же sin A = 0,\nт. е. ошибка времени <strong>не влияет</strong> на широту.</li>\n<li><strong>Время (долгота):</strong> коэффициент при Δt равен 15·cos\nφ·sin A — максимум в <strong>первом вертикале</strong> (A = ±90°). Там\ncos A = 0, т. е. ошибка широты <strong>не влияет</strong> на время.</li>\n<li>Ошибка времени, выраженная в дуге, растёт как <strong>sec φ</strong>\n— в высоких широтах время определять труднее.</li>\n</ul>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 560 300\" style=\"max-width:520px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><text x=\"110.0\" y=\"22.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">Зенитальный принцип</text><circle cx=\"30.0\" cy=\"160.0\" r=\"120.0\" stroke=\"#2563eb\" stroke-width=\"1.4\" fill=\"none\"/><circle cx=\"150.0\" cy=\"50.0\" r=\"110.0\" stroke=\"#dc2626\" stroke-width=\"1.4\" fill=\"none\"/><polygon points=\"30.0,154.0 31.6,157.8 35.7,158.1 32.6,160.8 33.5,164.9 30.0,162.7 26.5,164.9 27.4,160.8 24.3,158.1 28.4,157.8\" fill=\"#2563eb\"/><polygon points=\"150.0,44.0 151.6,47.8 155.7,48.1 152.6,50.8 153.5,54.9 150.0,52.7 146.5,54.9 147.4,50.8 144.3,48.1 148.4,47.8\" fill=\"#dc2626\"/><text x=\"36.0\" y=\"148.0\" fill=\"#2563eb\" font-size=\"13\" text-anchor=\"middle\">σ₁</text><text x=\"164.0\" y=\"54.0\" fill=\"#dc2626\" font-size=\"13\" text-anchor=\"middle\">σ₂</text><line x1=\"30.0\" y1=\"160.0\" x2=\"150.0\" y2=\"160.0\" stroke=\"#2563eb\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/><text x=\"90.0\" y=\"176.0\" fill=\"#2563eb\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">z₁</text><line x1=\"150.0\" y1=\"50.0\" x2=\"150.0\" y2=\"160.0\" stroke=\"#dc2626\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/><text x=\"160.0\" y=\"110.0\" fill=\"#dc2626\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">z₂</text><circle cx=\"150.0\" cy=\"160.0\" r=\"5\" fill=\"#1e293b\"/><text x=\"164.0\" y=\"176.0\" fill=\"#1e293b\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"600\">Z</text><text x=\"420.0\" y=\"22.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">Азимутальный принцип</text><line x1=\"340.0\" y1=\"80.0\" x2=\"520.0\" y2=\"260.0\" stroke=\"#2563eb\" stroke-width=\"1.6\"/><line x1=\"340.0\" y1=\"240.0\" x2=\"520.0\" y2=\"60.0\" stroke=\"#dc2626\" stroke-width=\"1.6\"/><polygon points=\"360.0,94.0 361.6,97.8 365.7,98.1 362.6,100.8 363.5,104.9 360.0,102.7 356.5,104.9 357.4,100.8 354.3,98.1 358.4,97.8\" fill=\"#2563eb\"/><text x=\"360.0\" y=\"86.0\" fill=\"#2563eb\" font-size=\"13\" text-anchor=\"middle\">σ₁</text><polygon points=\"490.0,84.0 491.6,87.8 495.7,88.1 492.6,90.8 493.5,94.9 490.0,92.7 486.5,94.9 487.4,90.8 484.3,88.1 488.4,87.8\" fill=\"#dc2626\"/><text x=\"490.0\" y=\"76.0\" fill=\"#dc2626\" font-size=\"13\" text-anchor=\"middle\">σ₂</text><circle cx=\"430.0\" cy=\"170.0\" r=\"5\" fill=\"#1e293b\"/><text x=\"446.0\" y=\"176.0\" fill=\"#1e293b\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"600\">Z</text><text x=\"430.0\" y=\"290.0\" fill=\"#64748b\" font-size=\"11\" text-anchor=\"middle\">пересечение вертикалов</text><text x=\"150.0\" y=\"290.0\" fill=\"#64748b\" font-size=\"11\" text-anchor=\"middle\">пересечение альмукантаратов</text></svg><figcaption><b>Рис. 4.</b> Положение зенита: слева — по зенитным расстояниям двух светил (круги равных высот), справа — по азимутам (вертикалам). Точнее всего — когда линии пересекаются под 90°.</figcaption></figure>\n<p><strong>Зачем пары.</strong> Есть ошибки, одинаковые для всех звёзд\nпри одном z: остаточная рефракция, ошибка места зенита, гнутие трубы.\nЕсли взять две звезды на <strong>одинаковых z</strong> по разные стороны\nот зенита (N и S или E и W), то такие ошибки войдут с противоположными\nзнаками и <strong>сократятся</strong> в среднем.</p>\n<p><strong>Основные зенитальные способы</strong> (подробно — в вопросах\n19, 22–30):</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Способ</th>\n<th>Что измеряют</th>\n<th>Что получают</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Сомнера–Акимова</td>\n<td>z светил в разных вертикалах</td>\n<td>φ и λ совместно</td>\n</tr>\n<tr class=\"even\">\n<td>Струве</td>\n<td>z пар звёзд в меридиане по вертикальному кругу</td>\n<td>φ</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Талькотта</strong></td>\n<td>малую разность z<sub>S</sub> − z<sub>N</sub> в меридиане окулярным\nмикрометром</td>\n<td>φ (основной для пунктов Лапласа)</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Певцова</strong></td>\n<td>моменты прохождения пары N/S через один альмукантарат вблизи\nмеридиана</td>\n<td>φ</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Цингера</strong></td>\n<td>моменты прохождения пары E/W через один альмукантарат вблизи I\nвертикала</td>\n<td>u, λ</td>\n</tr>\n<tr class=\"even\">\n<td>Равных высот n звёзд (идея Гаусса, способ Мазаева)</td>\n<td>моменты прохождения n звёзд через один альмукантарат</td>\n<td>φ и λ</td>\n</tr>\n</tbody>\n</table>\n<p>Певцов и Цингер — русские военные геодезисты (1880-е годы). Их\nспособы не требуют точного отсчёта по вертикальному кругу: z должно быть\nтолько <strong>одинаковым</strong> для двух звёзд, а измеряется\nвремя.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> Широта — меридиан (cos A); время — первый\nвертикал (sin A). Пары на равных z исключают постоянные ошибки. Талькотт\nрекомендован Инструкцией для пунктов 1–2 класса (|z<sub>S</sub> −\nz<sub>N</sub>| ≤ 20–30′).</p>\n</div>\n<p><span class=\"src\">Уралов, § 2–3, с. 7–14</span></p>"}, {"n": 5, "title": "Азимутальные способы определения широты, долготы и азимута", "block": 1, "short": "<p>Азимутальные способы основаны на измерении\n<strong>горизонтальных направлений</strong> на светила (и на земной\nпредмет). Азимут светила связан с φ и t формулой ctg A = sin φ ctg t −\ncos φ tg δ cosec t. Поскольку отсчёт лимба, соответствующий северу\n(«место севера» M<sub>N</sub>), заранее неизвестен, он входит в\nуравнения как ещё одно неизвестное. Главное практическое применение —\n<strong>определение азимута</strong> земного предмета; для этого лучше\nвсего подходит <strong>Полярная</strong>.</p>", "key": "<p>a = A + Q (или a = M − M<sub>N</sub>).\nПолярная выгодна: ошибка времени умножается на cos δ ≈ 0,014.\nСистематика ∝ ctg z, случайные ∝ cosec z.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Азимутальные способы основаны на измерении\n<strong>горизонтальных направлений</strong> на светила (и на земной\nпредмет). Азимут светила связан с φ и t формулой ctg A = sin φ ctg t −\ncos φ tg δ cosec t. Поскольку отсчёт лимба, соответствующий северу\n(«место севера» M<sub>N</sub>), заранее неизвестен, он входит в\nуравнения как ещё одно неизвестное. Главное практическое применение —\n<strong>определение азимута</strong> земного предмета; для этого лучше\nвсего подходит <strong>Полярная</strong>.</p>\n</div>\n<h3 id=\"теория-4\">Теория</h3>\n<p>Измеряем на горизонтальном круге отсчёт на светило N и отсчёт на\nпредмет M. Если бы мы знали отсчёт, соответствующий направлению на север\nM<sub>N</sub>, то a = M − M<sub>N</sub>. Но M<sub>N</sub> неизвестен —\nего и находят: M<sub>N</sub> = N − A, где A вычислено на момент\nнаблюдения.</p>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 380 310\" style=\"max-width:340px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><circle cx=\"190.0\" cy=\"160.0\" r=\"120.0\" stroke=\"#64748b\" stroke-width=\"1.2\" fill=\"none\"/><line x1=\"190.0\" y1=\"280.0\" x2=\"190.0\" y2=\"32.0\" stroke=\"#1e293b\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"190.0\" y=\"26.0\" fill=\"#1e293b\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"600\">N</text><text x=\"190.0\" y=\"298.0\" fill=\"#1e293b\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"600\">S</text><text x=\"324.0\" y=\"165.0\" fill=\"#1e293b\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"600\">E</text><text x=\"56.0\" y=\"165.0\" fill=\"#1e293b\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"600\">W</text><line x1=\"190.0\" y1=\"160.0\" x2=\"240.7\" y2=\"51.2\" stroke=\"#dc2626\" stroke-width=\"1.8\" marker-end=\"url(#arr)\"/><polygon points=\"245.8,34.4 247.4,38.2 251.5,38.5 248.4,41.2 249.3,45.2 245.8,43.1 242.3,45.2 243.2,41.2 240.1,38.5 244.2,38.2\" fill=\"#dc2626\"/><text x=\"253.4\" y=\"24.1\" fill=\"#dc2626\" font-size=\"14\" text-anchor=\"middle\">σ</text><line x1=\"190.0\" y1=\"160.0\" x2=\"302.8\" y2=\"201.0\" stroke=\"#2563eb\" stroke-width=\"1.8\" marker-end=\"url(#arb)\"/><rect x=\"304.8\" y=\"199.0\" width=\"12\" height=\"12\" fill=\"#2563eb\"/><text x=\"342.8\" y=\"221.0\" fill=\"#2563eb\" font-size=\"12\" text-anchor=\"middle\">предмет</text><path d=\"M190.0,120.0 A40,40 0 0 1 206.9,123.7\" stroke=\"#dc2626\" stroke-width=\"1.8\" fill=\"none\"/><text x=\"208.0\" y=\"112.0\" fill=\"#dc2626\" font-size=\"14\" text-anchor=\"middle\" font-style=\"italic\">A</text><path d=\"M219.6,96.6 A70,70 0 0 1 255.8,183.9\" stroke=\"#059669\" stroke-width=\"1.8\" fill=\"none\"/><text x=\"266.0\" y=\"154.0\" fill=\"#059669\" font-size=\"14\" text-anchor=\"middle\" font-style=\"italic\">Q</text><path d=\"M190.0,65.0 A95,95 0 0 1 279.3,192.5\" stroke=\"#2563eb\" stroke-width=\"1.2\" fill=\"none\" stroke-dasharray=\"4 3\"/><text x=\"252.0\" y=\"68.0\" fill=\"#2563eb\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">a = A + Q</text><circle cx=\"190.0\" cy=\"160.0\" r=\"3.2\" fill=\"#1e293b\"/></svg><figcaption><b>Рис. 5.</b> Азимут земного предмета: a = A + Q, где A — азимут светила (из вычислений), Q — измеренный горизонтальный угол.</figcaption></figure>\n<p><strong>Формула азимута по часовому углу</strong> (из\nпараллактического треугольника):</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>ctg</mo><mi>A</mi><mo>=</mo><mo>sin</mo><mi>φ</mi><mspace width=\"0.167em\"></mspace><mo>ctg</mo><mi>t</mi><mo>−</mo><mo>cos</mo><mi>φ</mi><mspace width=\"0.167em\"></mspace><mo>tg</mo><mi>δ</mi><mspace width=\"0.167em\"></mspace><mo>cosec</mo><mi>t</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\operatorname{ctg} A = \\sin\\varphi\\,\\operatorname{ctg} t - \\cos\\varphi\\,\\operatorname{tg}\\delta\\,\\operatorname{cosec} t .</annotation></semantics></math></p>\n<p><strong>Дифференциальная формула</strong> (Уралов, § 109):</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Δ</mi><mi>A</mi><mo>=</mo><mn>15</mn><mspace width=\"0.167em\"></mspace><mfrac><mrow><mo>cos</mo><mi>δ</mi><mo>cos</mo><mi>q</mi></mrow><mrow><mo>sin</mo><mi>z</mi></mrow></mfrac><mspace width=\"0.167em\"></mspace><mi>Δ</mi><mi>t</mi><mo>+</mo><mfrac><mrow><mo>sin</mo><mi>A</mi></mrow><mrow><mo>tg</mo><mi>z</mi></mrow></mfrac><mspace width=\"0.167em\"></mspace><mi>Δ</mi><mi>φ</mi><mo>+</mo><mfrac><mrow><mo>sin</mo><mi>q</mi></mrow><mrow><mo>sin</mo><mi>z</mi></mrow></mfrac><mspace width=\"0.167em\"></mspace><mi>Δ</mi><mi>δ</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta A = 15\\,\\frac{\\cos\\delta\\cos q}{\\sin z}\\,\\Delta t + \\frac{\\sin A}{\\operatorname{tg} z}\\,\\Delta\\varphi + \\frac{\\sin q}{\\sin z}\\,\\Delta\\delta .</annotation></semantics></math></p>\n<p>Что из неё следует:</p>\n<ul>\n<li>ошибка времени входит с множителем cos δ — у\n<strong>близполюсной</strong> звезды (δ ≈ 89°) он мал, поэтому азимут по\nПолярной почти не зависит от ошибки часов;</li>\n<li><strong>систематические</strong> ошибки (наклон горизонтальной оси\nb, коллимация) входят как b·ctg z и c·cosec z — растут с высотой\nсветила, т. е. как <strong>tg φ</strong> для Полярной;</li>\n<li><strong>случайные</strong> ошибки визирования и отсчёта входят с\nмножителем cosec z (≈ sec φ).</li>\n</ul>\n<p>Поэтому в высоких широтах (севернее ~65–70°) Полярная стоит слишком\nвысоко, и применяют способы по звёздам <strong>вблизи\nгоризонта</strong>. Полярная до широты 65° отклоняется от меридиана не\nболее чем на ±2°40′.</p>\n<p><strong>Азимутальные способы для широты и времени</strong> (по\nмоментам прохождения звёзд через вертикал Полярной, через меридиан —\nпассажный инструмент) существуют, но в точной геодезии для φ и λ\nприменяют зенитальные способы, а азимутальные — для\n<strong>азимута</strong>.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> a = A + Q (или a = M − M<sub>N</sub>).\nПолярная выгодна: ошибка времени умножается на cos δ ≈ 0,014.\nСистематика ∝ ctg z, случайные ∝ cosec z.</p>\n</div>\n<p><span class=\"src\">Уралов, § 4, с. 14–19; § 108–109</span></p>"}, {"n": 6, "title": "Инструменты для астрономических определений", "block": 1, "short": "<p>Основные угломерные приборы —\n<strong>астрономические теодолиты</strong> (АУ 2″/10″, АУ 01, У5, Wild\nT-4, ДКМ-3А), для менее точных работ — геодезические теодолиты Т-2, Theo\n010 с уровнем и окулярным микрометром. Специальные инструменты:\n<strong>зенит-телескоп</strong> (широта по Талькотту), <strong>пассажный\nинструмент</strong> (время по прохождениям через меридиан),\n<strong>призменная астролябия</strong> (способ равных высот). Для\nрегистрации времени: хронометры, кварцевые часы, хронографы,\nрадиоприёмники сигналов времени.</p>", "key": "<p>АУ 2″/10″ (2″ — горизонтальный круг, 10″ —\nвертикальный), У5, Wild T-4, ДКМ-3А. Для Талькотта — зенит-телескоп или\nАУ с уровнем Талькотта и окулярным микрометром.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Основные угломерные приборы —\n<strong>астрономические теодолиты</strong> (АУ 2″/10″, АУ 01, У5, Wild\nT-4, ДКМ-3А), для менее точных работ — геодезические теодолиты Т-2, Theo\n010 с уровнем и окулярным микрометром. Специальные инструменты:\n<strong>зенит-телескоп</strong> (широта по Талькотту), <strong>пассажный\nинструмент</strong> (время по прохождениям через меридиан),\n<strong>призменная астролябия</strong> (способ равных высот). Для\nрегистрации времени: хронометры, кварцевые часы, хронографы,\nрадиоприёмники сигналов времени.</p>\n</div>\n<h3 id=\"теория-5\">Теория</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Класс</th>\n<th>Примеры</th>\n<th>Назначение</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Астрономические универсальные теодолиты</td>\n<td>АУ 2″/10″, АУ 01, У5, Wild T-4, ДКМ-3А</td>\n<td>все высокоточные способы: Талькотт, Цингер, Певцов, азимут по\nПолярной</td>\n</tr>\n<tr class=\"even\">\n<td>Геодезические теодолиты</td>\n<td>Т-2, Theo 010, Т-1</td>\n<td>приближённые определения, азимут по Солнцу и Полярной</td>\n</tr>\n<tr class=\"odd\">\n<td>Зенит-телескоп</td>\n<td>—</td>\n<td>широта по Талькотту, службы широты</td>\n</tr>\n<tr class=\"even\">\n<td>Пассажный инструмент</td>\n<td>—</td>\n<td>время по меридианным прохождениям</td>\n</tr>\n<tr class=\"odd\">\n<td>Призменная астролябия</td>\n<td>—</td>\n<td>моменты прохождения звёзд через альмукантарат 30° или 45°</td>\n</tr>\n<tr class=\"even\">\n<td>Время</td>\n<td>хронометры, кварцевые часы (ПКХ-4, «Альтаир»), секундомеры,\nхронографы, приёмники</td>\n<td>хранение, сравнение, регистрация моментов</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Что отличает астрономический теодолит от\nгеодезического:</strong></p>\n<ul>\n<li><strong>ломаная труба</strong> — окуляр на конце горизонтальной оси,\nчтобы удобно наблюдать светила у зенита;</li>\n<li><strong>окулярный (контактный) микрометр</strong> с подвижной нитью\n— для точного визирования движущейся звезды и для измерения малых\nуглов;</li>\n<li><strong>уровень Талькотта</strong> при трубе и <strong>накладной\nуровень</strong> на горизонтальной оси;</li>\n<li>высокая точность отсчитывания кругов микроскопами-микрометрами (до\n0,1–0,2″);</li>\n<li>искусственное освещение поля зрения (нити светлые на тёмном фоне или\nнаоборот).</li>\n</ul>\n<div class=\"key\">\n<p><strong>Запомни.</strong> АУ 2″/10″ (2″ — горизонтальный круг, 10″ —\nвертикальный), У5, Wild T-4, ДКМ-3А. Для Талькотта — зенит-телескоп или\nАУ с уровнем Талькотта и окулярным микрометром.</p>\n</div>\n<p><span class=\"src\">Уралов, гл. 1, § 6–13, с. 24–64</span></p>"}, {"n": 7, "title": "Конструкция астрономических теодолитов", "block": 1, "short": "<p>Астрономический теодолит — это теодолит с\nломаной трубой, у которого есть три оси (вертикальная, горизонтальная,\nвизирная), горизонтальный и вертикальный круги с\nмикроскопами-микрометрами, накладной уровень на горизонтальной оси,\nуровень при вертикальном круге, уровень Талькотта на трубе и окулярный\n(контактный) микрометр. Основные геометрические условия: вертикальная\nось отвесна, горизонтальная ей перпендикулярна, визирная ось\nперпендикулярна горизонтальной.</p>", "key": "<p>Три оси и три условия. Влияние наклона\nb·ctg z, коллимации c·cosec z. Уровень Талькотта держит постоянный\nнаклон трубы, накладной уровень меряет наклон горизонтальной оси.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Астрономический теодолит — это теодолит с\nломаной трубой, у которого есть три оси (вертикальная, горизонтальная,\nвизирная), горизонтальный и вертикальный круги с\nмикроскопами-микрометрами, накладной уровень на горизонтальной оси,\nуровень при вертикальном круге, уровень Талькотта на трубе и окулярный\n(контактный) микрометр. Основные геометрические условия: вертикальная\nось отвесна, горизонтальная ей перпендикулярна, визирная ось\nперпендикулярна горизонтальной.</p>\n</div>\n<h3 id=\"теория-6\">Теория</h3>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 470 340\" style=\"max-width:420px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><path d=\"M90,300 L290,300 L270,280 L110,280 Z\" stroke=\"#1e293b\" stroke-width=\"1.4\" fill=\"#e2e8f0\"/><line x1=\"110.0\" y1=\"300.0\" x2=\"110.0\" y2=\"318.0\" stroke=\"#1e293b\" stroke-width=\"3\"/><line x1=\"190.0\" y1=\"300.0\" x2=\"190.0\" y2=\"318.0\" stroke=\"#1e293b\" stroke-width=\"3\"/><line x1=\"270.0\" y1=\"300.0\" x2=\"270.0\" y2=\"318.0\" stroke=\"#1e293b\" stroke-width=\"3\"/><text x=\"330.0\" y=\"312.0\" fill=\"#64748b\" font-size=\"11\" text-anchor=\"start\">подъёмные винты</text><ellipse cx=\"190.0\" cy=\"270.0\" rx=\"90.0\" ry=\"14.0\" stroke=\"#2563eb\" stroke-width=\"1.8\" fill=\"#eff6ff\" transform=\"rotate(0 190.0 270.0)\"/><text x=\"300.0\" y=\"268.0\" fill=\"#2563eb\" font-size=\"11\" text-anchor=\"start\">горизонтальный круг</text><path d=\"M130,260 L150,140 L165,140 L150,260 Z\" stroke=\"#1e293b\" stroke-width=\"1.4\" fill=\"#e2e8f0\"/><path d=\"M250,260 L230,140 L215,140 L230,260 Z\" stroke=\"#1e293b\" stroke-width=\"1.4\" fill=\"#e2e8f0\"/><line x1=\"190.0\" y1=\"330.0\" x2=\"190.0\" y2=\"40.0\" stroke=\"#dc2626\" stroke-width=\"1.4\" stroke-dasharray=\"6 4\"/><text x=\"190.0\" y=\"34.0\" fill=\"#dc2626\" font-size=\"11\" text-anchor=\"middle\">вертикальная ось ZZ′</text><line x1=\"110.0\" y1=\"140.0\" x2=\"270.0\" y2=\"140.0\" stroke=\"#059669\" stroke-width=\"1.4\" stroke-dasharray=\"6 4\"/><text x=\"300.0\" y=\"136.0\" fill=\"#059669\" font-size=\"11\" text-anchor=\"start\">горизонтальная ось</text><path d=\"M120,170 L265,95 L272,108 L127,183 Z\" stroke=\"#1e293b\" stroke-width=\"1.6\" fill=\"#f8fafc\"/><line x1=\"100.0\" y1=\"186.0\" x2=\"300.0\" y2=\"82.0\" stroke=\"#d97706\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><text x=\"300.0\" y=\"74.0\" fill=\"#d97706\" font-size=\"11\" text-anchor=\"start\">визирная ось</text><circle cx=\"150.0\" cy=\"140.0\" r=\"34.0\" stroke=\"#2563eb\" stroke-width=\"1.8\" fill=\"none\"/><text x=\"70.0\" y=\"112.0\" fill=\"#2563eb\" font-size=\"11\" text-anchor=\"middle\">вертикальный круг</text><path d=\"M180,128 L232,101\" stroke=\"#1e293b\" stroke-width=\"6\" fill=\"none\"/><text x=\"230.0\" y=\"60.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"middle\">уровень Талькотта</text><line x1=\"212.0\" y1=\"108.0\" x2=\"226.0\" y2=\"66.0\" stroke=\"#64748b\" stroke-width=\"0.8\"/><rect x=\"108\" y=\"176\" width=\"18\" height=\"16\" fill=\"#d97706\" transform=\"rotate(-27 117 184)\"/><text x=\"70.0\" y=\"214.0\" fill=\"#d97706\" font-size=\"11\" text-anchor=\"middle\">окулярный микрометр</text><path d=\"M150,148 L230,148\" stroke=\"#64748b\" stroke-width=\"4\" fill=\"none\"/></svg><figcaption><b>Рис. 6.</b> Схема астрономического теодолита: три оси (вертикальная, горизонтальная, визирная), два круга, уровни, окулярный микрометр.</figcaption></figure>\n<p><strong>Узлы прибора:</strong></p>\n<ol type=\"1\">\n<li><strong>Подставка</strong> с тремя подъёмными винтами и\n<strong>вертикальной осью</strong>.</li>\n<li><strong>Горизонтальный круг</strong> (лимб) и алидада с\nмикроскопами-микрометрами.</li>\n<li><strong>Колонки</strong> с подшипниками <strong>горизонтальной\nоси</strong>; на ось ставят <strong>накладной уровень</strong> — им\nизмеряют наклон оси i (b).</li>\n<li><strong>Ломаная зрительная труба</strong>: свет после объектива\nотражается призмой вдоль горизонтальной оси в окуляр. Увеличение\n50–80×.</li>\n<li><strong>Вертикальный круг</strong> с микроскопами; при нём —\n<strong>уровень при вертикальном круге</strong> (определяет место\nзенита).</li>\n<li><strong>Уровень Талькотта</strong> — чувствительный уровень,\nскреплённый с трубой; позволяет держать неизменным угол наклона трубы\nпри её повороте на 180° по азимуту.</li>\n<li><strong>Окулярный микрометр</strong> с подвижной нитью (часто —\n<strong>контактный</strong>, с барабаном и контактами для хронографа).\nОкулярный микрометр поворачивают: нить горизонтальна (измерение z) или\nвертикальна (моменты прохождения, азимут).</li>\n<li>Сетка нитей: несколько вертикальных и горизонтальных «постоянных»\nнитей.</li>\n</ol>\n<p><strong>Погрешности осей</strong> (их исследуют и учитывают):</p>\n<ul>\n<li><strong>i (b)</strong> — наклон горизонтальной оси, по накладному\nуровню: i = ¼[(Л + П)<sub>1</sub> − (Л + П)<sub>2</sub>]·τ;</li>\n<li><strong>c</strong> — коллимационная ошибка: визирная ось не ⟂\nгоризонтальной;</li>\n<li><strong>k</strong> — азимутальная ошибка установки (для пассажного\nинструмента);</li>\n<li><strong>g</strong> — гнутие трубы (Δz = g·sin z),\n<strong>MZ</strong> — место зенита;</li>\n<li>эксцентриситет и ошибки делений кругов, рен микроскопов, ход винта\nмикрометра.</li>\n</ul>\n<p>Влияние на направления при наблюдении на зенитном расстоянии z: от\nнаклона оси — <strong>b·ctg z</strong>, от коллимации — <strong>c·cosec\nz</strong>. Поэтому для визирования на высокие светила эти ошибки\nособенно важны.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> Три оси и три условия. Влияние наклона\nb·ctg z, коллимации c·cosec z. Уровень Талькотта держит постоянный\nнаклон трубы, накладной уровень меряет наклон горизонтальной оси.</p>\n</div>\n<p><span class=\"src\">Уралов, § 6–7, с. 24–43</span></p>"}, {"n": 8, "title": "Подготовка астрономического инструмента к наблюдениям", "block": 1, "short": "<p>Подготовка включает: установку прибора на\n<strong>астрономическом столбе</strong> (или штативе) и его защиту от\nсолнца и ветра, температурное выравнивание,\n<strong>горизонтирование</strong>, <strong>ориентирование в\nмеридиане</strong> (по Полярной или по известному азимуту), фокусировку\nна бесконечность, установку окулярного микрометра, проверку освещения, а\nтакже <strong>исследования</strong>: цена деления уровней (в т. ч.\nТалькотта), цена оборота винта микрометра, мёртвый ход и ширина\nконтактов, рен, коллимация, гнутие, место зенита.</p>", "key": "<p>Столб — в 2–3 высотах знака от центра.\nОриентирование по Полярной. Исследования: τ уровня Талькотта, R\nмикрометра, мёртвый ход и ширина контактов, c, i, MZ, g.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Подготовка включает: установку прибора на\n<strong>астрономическом столбе</strong> (или штативе) и его защиту от\nсолнца и ветра, температурное выравнивание,\n<strong>горизонтирование</strong>, <strong>ориентирование в\nмеридиане</strong> (по Полярной или по известному азимуту), фокусировку\nна бесконечность, установку окулярного микрометра, проверку освещения, а\nтакже <strong>исследования</strong>: цена деления уровней (в т. ч.\nТалькотта), цена оборота винта микрометра, мёртвый ход и ширина\nконтактов, рен, коллимация, гнутие, место зенита.</p>\n</div>\n<h3 id=\"теория-7\">Теория</h3>\n<p><strong>1. Установка.</strong> Астрономический столб ставят в стороне\nот геодезического знака (на расстоянии 2–3 высот знака), чтобы\nконструкция знака не закрывала небо. Поэтому потом нужно\n<strong>приведение к центру</strong> (вопрос 38). Над прибором — палатка\nили будка, открывающаяся при наблюдениях. Прибор выставляют за 30–60 мин\nдо начала, чтобы его температура сравнялась с наружной.</p>\n<p><strong>2. Горизонтирование</strong> — по накладному уровню и уровню\nпри алидаде: пузырёк в нуль-пункте при любом положении алидады.\nОстаточный наклон учитывают по отсчётам уровня.</p>\n<p><strong>3. Ориентирование в меридиане.</strong> По заранее\nвычисленному отсчёту на Полярную в данный момент, либо по известному\nазимуту земного предмета. Для Талькотта на постоянных нитях — с ошибкой\nне более 1,5–2′.</p>\n<p><strong>4. Оптика.</strong> Окуляр — на резкое изображение нитей;\nобъектив — на «бесконечность» (по звезде). Освещение поля — так, чтобы\nбыли видны и нити, и слабые звёзды.</p>\n<p><strong>5. Исследования</strong> (Уралов, § 24–30):</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Что</th>\n<th>Зачем</th>\n<th>Как</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Цена деления уровня Талькотта τ</td>\n<td>поправка за наклон трубы между звёздами пары</td>\n<td>на экзаменаторе (способ Васильева) или в поле — способ Комстока:\nповороты алидады вокруг наклонённой на ~1° вертикальной оси</td>\n</tr>\n<tr class=\"even\">\n<td>Цена оборота микрометра R</td>\n<td>перевод отсчётов микрометра в секунды дуги</td>\n<td>по наблюдениям звёзд в элонгации (звезда движется почти по\nвертикалу, dz/dt известна)</td>\n</tr>\n<tr class=\"odd\">\n<td>Мёртвый ход, ширина контактов</td>\n<td>поправки за безличный микрометр</td>\n<td>каждый вечер / на каждом пункте</td>\n</tr>\n<tr class=\"even\">\n<td>Коллимация c, наклон оси</td>\n<td>поправки в направления</td>\n<td>по КЛ/КП, по накладному уровню</td>\n</tr>\n<tr class=\"odd\">\n<td>Место зенита MZ, гнутие g</td>\n<td>вычисление z по вертикальному кругу</td>\n<td>из наблюдений КЛ/КП</td>\n</tr>\n<tr class=\"even\">\n<td>Рен микроскопов</td>\n<td>исправление отсчётов кругов</td>\n<td>по соседним штрихам</td>\n</tr>\n</tbody>\n</table>\n<p><strong>6. Перед наблюдениями</strong> — эфемериды звёзд\n(установочные z, A, моменты), сверка хронометра, проверка приёмника\nсигналов времени.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> Столб — в 2–3 высотах знака от центра.\nОриентирование по Полярной. Исследования: τ уровня Талькотта, R\nмикрометра, мёртвый ход и ширина контактов, c, i, MZ, g.</p>\n</div>\n<p><span class=\"src\">Уралов, § 24–30, с. 131–150</span></p>"}, {"n": 9, "title": "Типы хронометров. Оценка качества хронометра", "block": 2, "short": "<p>Хронометр — точные часы для хранения\nвремени во время наблюдений. Типы: <strong>механические</strong> морские\nхронометры (средние и звёздные), палубные часы, двухстрелочные\nсекундомеры; <strong>кварцевые</strong> хронометры (ПКХ-4, «Альтаир») и\n<strong>атомные</strong> стандарты частоты. Качество хронометра\nопределяется <strong>не величиной хода, а постоянством хода</strong> —\nвариациями. Инструкция для пунктов 1–2 класса допускает хронометры со\nсредней квадратической вариацией суточного хода ≤ 0,5ˢ и двухчасового ≤\n0,06ˢ.</p>", "key": "<p>Качество = вариация хода. Допуск: суточный\n≤ 0,5ˢ, двухчасовой ≤ 0,06ˢ. Кварцевые — лучше механических.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Хронометр — точные часы для хранения\nвремени во время наблюдений. Типы: <strong>механические</strong> морские\nхронометры (средние и звёздные), палубные часы, двухстрелочные\nсекундомеры; <strong>кварцевые</strong> хронометры (ПКХ-4, «Альтаир») и\n<strong>атомные</strong> стандарты частоты. Качество хронометра\nопределяется <strong>не величиной хода, а постоянством хода</strong> —\nвариациями. Инструкция для пунктов 1–2 класса допускает хронометры со\nсредней квадратической вариацией суточного хода ≤ 0,5ˢ и двухчасового ≤\n0,06ˢ.</p>\n</div>\n<h3 id=\"теория-8\">Теория</h3>\n<p><strong>Механический хронометр</strong> — пружинные часы с балансом и\nспусковым механизмом, температурной компенсацией, ударом каждые 0,5ˢ\n(слышен — для метода «глаз-ухо»). Бывают <strong>звёздные</strong> (идут\nпо звёздному времени) и <strong>средние</strong>. Есть контакт для\nхронографа.</p>\n<p><strong>Палубные часы</strong> и <strong>секундомеры</strong> — для\nменее точных работ (двухстрелочный секундомер позволяет «остановить»\nодну стрелку в момент события).</p>\n<p><strong>Кварцевые хронометры</strong> — генератор с кварцевым\nрезонатором (частота стабильна до 10⁻⁸…10⁻⁹), делитель частоты и\nсекундные импульсы. Они точнее механических на 1–2 порядка, не боятся\nтряски, удобны для автоматической регистрации.</p>\n<p><strong>Оценка качества</strong> (Уралов, § 23). Определяют поправки\nu<sub>1</sub>, u<sub>2</sub
