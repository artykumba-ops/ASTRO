>, …, u<sub>n</sub> в течение нескольких\nсуток (по радиосигналам), вычисляют ходы и их отклонения от\nсреднего:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ω</mi><mi>i</mi></msub><mo>=</mo><mfrac><mrow><msub><mi>u</mi><mrow><mi>i</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>−</mo><msub><mi>u</mi><mi>i</mi></msub></mrow><mrow><msub><mi>T</mi><mrow><mi>i</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>−</mo><msub><mi>T</mi><mi>i</mi></msub></mrow></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><mover><mi>ω</mi><mo accent=\"true\">‾</mo></mover><mo>=</mo><mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>ω</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mi>n</mi></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>Δ</mi><msub><mi>ω</mi><mi>i</mi></msub><mo>=</mo><msub><mi>ω</mi><mi>i</mi></msub><mo>−</mo><mover><mi>ω</mi><mo accent=\"true\">‾</mo></mover><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>m</mi><mrow><mi>Δ</mi><mi>ω</mi></mrow></msub><mo>=</mo><msqrt><mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>Δ</mi><msup><mi>ω</mi><mn>2</mn></msup><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow></mfrac></msqrt><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\omega_i = \\frac{u_{i+1}-u_i}{T_{i+1}-T_i},\\qquad \\bar\\omega = \\frac{[\\omega]}{n},\\qquad \\Delta\\omega_i = \\omega_i - \\bar\\omega ,\\qquad m_{\\Delta\\omega} = \\sqrt{\\frac{[\\Delta\\omega^2]}{n-1}} .</annotation></semantics></math></p>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 440 200\" style=\"max-width:420px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><line x1=\"50.0\" y1=\"170.0\" x2=\"420.0\" y2=\"170.0\" stroke=\"#1e293b\" stroke-width=\"1.4\" marker-end=\"url(#ar)\"/><line x1=\"50.0\" y1=\"190.0\" x2=\"50.0\" y2=\"20.0\" stroke=\"#1e293b\" stroke-width=\"1.4\" marker-end=\"url(#ar)\"/><text x=\"42.0\" y=\"30.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"end\" font-style=\"italic\">ω</text><text x=\"410.0\" y=\"188.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"middle\">сутки</text><rect x=\"68\" y=\"54.5\" width=\"24\" height=\"115.5\" fill=\"#dbeafe\" stroke=\"#2563eb\"/><rect x=\"112\" y=\"38.0\" width=\"24\" height=\"132.0\" fill=\"#dbeafe\" stroke=\"#2563eb\"/><rect x=\"156\" y=\"71.0\" width=\"24\" height=\"99.0\" fill=\"#dbeafe\" stroke=\"#2563eb\"/><rect x=\"200\" y=\"49.0\" width=\"24\" height=\"121.0\" fill=\"#dbeafe\" stroke=\"#2563eb\"/><rect x=\"244\" y=\"27.0\" width=\"24\" height=\"143.0\" fill=\"#dbeafe\" stroke=\"#2563eb\"/><rect x=\"288\" y=\"60.0\" width=\"24\" height=\"110.0\" fill=\"#dbeafe\" stroke=\"#2563eb\"/><rect x=\"332\" y=\"65.5\" width=\"24\" height=\"104.5\" fill=\"#dbeafe\" stroke=\"#2563eb\"/><rect x=\"376\" y=\"43.5\" width=\"24\" height=\"126.5\" fill=\"#dbeafe\" stroke=\"#2563eb\"/><line x1=\"50.0\" y1=\"51.1\" x2=\"410.0\" y2=\"51.1\" stroke=\"#dc2626\" stroke-width=\"1.6\" stroke-dasharray=\"5 3\"/><text x=\"412.0\" y=\"55.1\" fill=\"#dc2626\" font-size=\"13\" text-anchor=\"start\" font-style=\"italic\">ω̄</text><text x=\"230.0\" y=\"18.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"middle\">качество = малый разброс ω вокруг среднего, а не малый ход</text></svg><figcaption><b>Рис. 7.</b> Суточные ходы хронометра и их вариации Δω = ω − ω̄.</figcaption></figure>\n<p>Пример, почему величина хода не важна: звёздный хронометр\nотносительно среднего времени имеет ход около −3ᵐ56ˢ в сутки — огромный,\nно <strong>постоянный</strong> и потому безвредный. Плохой хронометр —\nтот, чей ход «скачет»: тогда передать поправку на момент наблюдения\nнельзя.</p>\n<p>Дополнительно исследуют зависимость хода от\n<strong>температуры</strong> (коэффициент на 1 °C) и от\nположения/транспортировки.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> Качество = вариация хода. Допуск: суточный\n≤ 0,5ˢ, двухчасовой ≤ 0,06ˢ. Кварцевые — лучше механических.</p>\n</div>\n<p><span class=\"src\">Уралов, § 14–17, 23, с. 64–86, 126–130</span></p>"}, {"n": 10, "title": "Поправка и ход хронометра. Передача поправки на другие моменты", "block": 2, "short": "<p><strong>Поправка хронометра</strong> u —\nвеличина, которую надо прибавить к показанию T, чтобы получить точное\nвремя в принятой системе: u = s − T (звёздное) или u = m − T (среднее).\n<strong>Ход</strong> ω — изменение поправки за единицу времени: ω =\n(u<sub>2</sub> − u<sub>1</sub>)/(T<sub>2</sub> − T<sub>1</sub>). Если\nход постоянен, поправку на любой момент находят по формуле u =\nu<sub>1</sub> + ω(T − T<sub>1</sub>) — внутри интервала это\n<strong>интерполирование</strong>, вне —\n<strong>экстраполирование</strong>.</p>", "key": "<p>u = (точное время) − T. ω &lt; 0 — спешит,\nω &gt; 0 — отстаёт. u = u<sub>1</sub> + ω(T − T<sub>1</sub>). Принимать\nсигналы до и после наблюдений.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> <strong>Поправка хронометра</strong> u —\nвеличина, которую надо прибавить к показанию T, чтобы получить точное\nвремя в принятой системе: u = s − T (звёздное) или u = m − T (среднее).\n<strong>Ход</strong> ω — изменение поправки за единицу времени: ω =\n(u<sub>2</sub> − u<sub>1</sub>)/(T<sub>2</sub> − T<sub>1</sub>). Если\nход постоянен, поправку на любой момент находят по формуле u =\nu<sub>1</sub> + ω(T − T<sub>1</sub>) — внутри интервала это\n<strong>интерполирование</strong>, вне —\n<strong>экстраполирование</strong>.</p>\n</div>\n<h3 id=\"теория-9\">Теория</h3>\n<p><strong>Определения (Уралов, § 18):</strong></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>u</mi><mo>*</mo></msup><mo>=</mo><mi>s</mi><mo>−</mo><mi>T</mi><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>u</mi><mo>=</mo><mi>m</mi><mo>−</mo><mi>T</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">u^{*} = s - T,\\qquad u = m - T .</annotation></semantics></math></p>\n<p>Поправка всегда относится к <strong>конкретному моменту</strong> и\n<strong>конкретной системе</strong> времени: относительно местного\nзвёздного s, местного среднего m, гринвичского звёздного S, всемирного\nUT1 и т. д. «Определить поправку хронометра» = «определить время в этот\nмомент».</p>\n<p><strong>Знак хода.</strong> Интервал T<sub>2</sub> − T<sub>1</sub>\nвсегда положителен, поэтому знак ω — это знак u<sub>2</sub> −\nu<sub>1</sub>:</p>\n<ul>\n<li>ω &lt; 0 — поправка уменьшается → хронометр <strong>уходит\nвперёд</strong> (спешит);</li>\n<li>ω &gt; 0 — поправка растёт → хронометр\n<strong>отстаёт</strong>.</li>\n</ul>\n<p>Ход бывает суточный, часовой, десятиминутный — в зависимости от\nединицы интервала.</p>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 450 260\" style=\"max-width:420px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><line x1=\"50.0\" y1=\"230.0\" x2=\"430.0\" y2=\"230.0\" stroke=\"#1e293b\" stroke-width=\"1.4\" marker-end=\"url(#ar)\"/><text x=\"425.0\" y=\"248.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">T</text><line x1=\"50.0\" y1=\"230.0\" x2=\"50.0\" y2=\"25.0\" stroke=\"#1e293b\" stroke-width=\"1.4\" marker-end=\"url(#ar)\"/><text x=\"36.0\" y=\"32.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">u</text><line x1=\"110.0\" y1=\"170.0\" x2=\"290.0\" y2=\"95.0\" stroke=\"#2563eb\" stroke-width=\"2\"/><line x1=\"290.0\" y1=\"95.0\" x2=\"400.0\" y2=\"49.2\" stroke=\"#2563eb\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><line x1=\"110.0\" y1=\"170.0\" x2=\"110.0\" y2=\"230.0\" stroke=\"#64748b\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"50.0\" y1=\"170.0\" x2=\"110.0\" y2=\"170.0\" stroke=\"#64748b\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><circle cx=\"110.0\" cy=\"170.0\" r=\"4.5\" fill=\"#2563eb\"/><text x=\"110.0\" y=\"248.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">T<tspan baseline-shift=\"sub\" font-size=\"9\">1</tspan></text><text x=\"36.0\" y=\"174.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">u<tspan baseline-shift=\"sub\" font-size=\"9\">1</tspan></text><line x1=\"290.0\" y1=\"95.0\" x2=\"290.0\" y2=\"230.0\" stroke=\"#64748b\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"50.0\" y1=\"95.0\" x2=\"290.0\" y2=\"95.0\" stroke=\"#64748b\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><circle cx=\"290.0\" cy=\"95.0\" r=\"4.5\" fill=\"#2563eb\"/><text x=\"290.0\" y=\"248.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">T<tspan baseline-shift=\"sub\" font-size=\"9\">2</tspan></text><text x=\"36.0\" y=\"99.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">u<tspan baseline-shift=\"sub\" font-size=\"9\">2</tspan></text><circle cx=\"200.0\" cy=\"132.5\" r=\"4.5\" fill=\"#059669\"/><line x1=\"200.0\" y1=\"132.5\" x2=\"200.0\" y2=\"230.0\" stroke=\"#059669\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><text x=\"200.0\" y=\"248.0\" fill=\"#059669\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">T</text><text x=\"210.0\" y=\"120.5\" fill=\"#059669\" font-size=\"11\" text-anchor=\"start\">интерполяция</text><circle cx=\"370.0\" cy=\"61.7\" r=\"4.5\" fill=\"#dc2626\"/><text x=\"360.0\" y=\"85.0\" fill=\"#dc2626\" font-size=\"11\" text-anchor=\"middle\">экстраполяция</text><text x=\"160.0\" y=\"70.0\" fill=\"#2563eb\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">ω = (u₂ − u₁)/(T₂ − T₁)</text></svg><figcaption><b>Рис. 8.</b> Передача поправки хронометра: u = u₁ + ω(T − T₁). Внутри интервала — интерполирование, вне — экстраполирование (хуже).</figcaption></figure>\n<p><strong>Передача поправки:</strong></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>u</mi><mo>=</mo><msub><mi>u</mi><mn>1</mn></msub><mo>+</mo><mi>ω</mi><mspace width=\"0.167em\"></mspace><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>T</mi><mo>−</mo><msub><mi>T</mi><mn>1</mn></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">u = u_1 + \\omega\\,(T - T_1) .</annotation></semantics></math></p>\n<p>На практике: принимают сигналы времени <strong>до и после</strong>\nнаблюдений (две радиостанции), из них — u<sub>1</sub> в момент\nX<sub>1</sub> и u<sub>2</sub> в момент X<sub>2</sub>, отсюда часовой\nход, и интерполируют на момент каждой звезды. Интерполирование надёжнее\nэкстраполирования: ошибка хода при экстраполяции нарастает\nпропорционально удалению от интервала.</p>\n<p>Если поправка известна в системе UT1 (из сигналов), то местное\nзвёздное время получают через гринвичское звёздное время и долготу: s =\nS + λ.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> u = (точное время) − T. ω &lt; 0 — спешит,\nω &gt; 0 — отстаёт. u = u<sub>1</sub> + ω(T − T<sub>1</sub>). Принимать\nсигналы до и после наблюдений.</p>\n</div>\n<p><span class=\"src\">Уралов, § 18, с. 86–89</span></p>"}, {"n": 11, "title": "Радиосигналы точного времени. Служба времени", "block": 2, "short": "<p><strong>Служба времени</strong> определяет\nвремя из астрономических (сейчас — РСДБ, спутниковых) наблюдений, хранит\nего эталонами частоты и распространяет <strong>радиосигналами</strong>.\nШкалы: всемирное время UT1 (по вращению Земли, отнесено к среднему\nполюсу), атомное TAI, <strong>координированное UTC</strong> — атомная\nсекунда, но |UT1 − UTC| &lt; 0,9ˢ за счёт скачков (leap second). Сигналы\nпередаются в UTC, а для астрономии нужна UT1: UT1 = UTC + DUT1 + dUT1. В\nРоссии — Государственная служба времени, частоты и определения\nпараметров вращения Земли (ГСВЧ), станции типа РВМ (Москва).</p>", "key": "<p>UTC — в сигналах; UT1 — для астрономии; UT1\n= UTC + DUT1 + dUT1; |DUT1| &lt; 0,9ˢ. Поправка за распространение =\nD/c.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> <strong>Служба времени</strong> определяет\nвремя из астрономических (сейчас — РСДБ, спутниковых) наблюдений, хранит\nего эталонами частоты и распространяет <strong>радиосигналами</strong>.\nШкалы: всемирное время UT1 (по вращению Земли, отнесено к среднему\nполюсу), атомное TAI, <strong>координированное UTC</strong> — атомная\nсекунда, но |UT1 − UTC| &lt; 0,9ˢ за счёт скачков (leap second). Сигналы\nпередаются в UTC, а для астрономии нужна UT1: UT1 = UTC + DUT1 + dUT1. В\nРоссии — Государственная служба времени, частоты и определения\nпараметров вращения Земли (ГСВЧ), станции типа РВМ (Москва).</p>\n</div>\n<h3 id=\"теория-10\">Теория</h3>\n<p><strong>Шкалы времени</strong> (Уралов, § 20):</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Шкала</th>\n<th>Основа</th>\n<th>Замечание</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>UT0</td>\n<td>наблюдения звёзд на станции</td>\n<td>содержит влияние движения полюса</td>\n</tr>\n<tr class=\"even\">\n<td><strong>UT1</strong></td>\n<td>UT0, исправленное за движение полюса</td>\n<td>неравномерно (вращение Земли), именно оно нужно для λ</td>\n</tr>\n<tr class=\"odd\">\n<td>UT2</td>\n<td>UT1 + сезонная поправка</td>\n<td>исторически для сигналов</td>\n</tr>\n<tr class=\"even\">\n<td>ET / TT</td>\n<td>равномерное (эфемеридное / земное)</td>\n<td>для эфемерид</td>\n</tr>\n<tr class=\"odd\">\n<td>TAI</td>\n<td>международное атомное время</td>\n<td>1ˢ СИ, цезиевые стандарты</td>\n</tr>\n<tr class=\"even\">\n<td><strong>UTC</strong></td>\n<td>атомная секунда + скачки по 1ˢ</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Связь для обработки:</strong></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>U</mi><mi>T</mi><mn>1</mn><mo>=</mo><mi>U</mi><mi>T</mi><mi>C</mi><mo>+</mo><mi>D</mi><mi>U</mi><mi>T</mi><mn>1</mn><mo>+</mo><mi>d</mi><mi>U</mi><mi>T</mi><mn>1</mn><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">UT1 = UTC + DUT1 + dUT1 .</annotation></semantics></math></p>\n<p>DUT1 (с точностью 0,1ˢ) и dUT1 (уточнение 0,02ˢ) передаются в самих\nсигналах — кодом Морзе или «окрашиванием» (сдвоенными) секундных\nимпульсов. Для окончательной обработки разность UT1 − UTC берут из\nбюллетеней службы времени («Всемирное время», сейчас — IERS) с точностью\n0,0001ˢ.</p>\n<p><strong>Виды сигналов:</strong> шеститочечные (5 коротких + 1 длинный\nв конце часа), ритмические/эталонные секундные (каждую секунду, начало\nминуты выделено), сигналы на длинных и коротких волнах, сейчас также\nGPS/ГЛОНАСС-время и интернет-синхронизация.</p>\n<p><strong>Время распространения радиоволн</strong> — задержка D/c (D —\nрасстояние до станции, c ≈ 300 000 км/с); для 3000 км это 0,01ˢ —\nучитывать обязательно (поэтому φ, λ пункта нужно знать приближённо).</p>\n<p><strong>Служба времени</strong> включает: определение UT1 (раньше —\nпассажные инструменты, сейчас РСДБ), хранение времени атомными часами,\nформирование и передачу сигналов, публикацию поправок (DUT1, координаты\nполюса x, y).</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> UTC — в сигналах; UT1 — для астрономии; UT1\n= UTC + DUT1 + dUT1; |DUT1| &lt; 0,9ˢ. Поправка за распространение =\nD/c.</p>\n</div>\n<p><span class=\"src\">Уралов, § 20–21, с. 100–121</span></p>"}, {"n": 12, "title": "Обработка приёма радиосигналов", "block": 2, "short": "<p>Цель приёма — найти <strong>поправку\nхронометра u</strong> относительно местного звёздного (или всемирного)\nвремени на средний момент приёма и <strong>ход</strong> хронометра.\nСигналы принимают <strong>до и после</strong> наблюдений. Для каждого\nсигнала: момент по хронометру T<sub>i</sub> и его время в UTC; вычисляют\nu<sub>UT1</sub> = UTC + (UT1 − UTC) + Δ<sub>распр</sub> − T, переводят в\nзвёздное S, затем s = S + λ, u = s − T. По двум приёмам — часовой ход\nω.</p>", "key": "<p>Сигналы — до и после. u = s − T, s = S + λ,\nS = S<sub>0</sub> + UT1·(1 + μ). Совпадения — каждые ~6 мин. Учитывать\nзадержку D/c и UT1 − UTC.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Цель приёма — найти <strong>поправку\nхронометра u</strong> относительно местного звёздного (или всемирного)\nвремени на средний момент приёма и <strong>ход</strong> хронометра.\nСигналы принимают <strong>до и после</strong> наблюдений. Для каждого\nсигнала: момент по хронометру T<sub>i</sub> и его время в UTC; вычисляют\nu<sub>UT1</sub> = UTC + (UT1 − UTC) + Δ<sub>распр</sub> − T, переводят в\nзвёздное S, затем s = S + λ, u = s − T. По двум приёмам — часовой ход\nω.</p>\n</div>\n<h3 id=\"теория-11\">Теория</h3>\n<p><strong>Способы приёма (Уралов, § 22):</strong></p>\n<ol type=\"1\">\n<li><strong>На слух («глаз-ухо»)</strong> — оценивают момент сигнала\nотносительно ударов хронометра. Точность ~0,05–0,1ˢ.</li>\n<li><strong>Метод совпадений.</strong> Если хронометр звёздный, а\nсигналы — среднего времени, звёздная секунда короче средней на 1/366.\nУдары хронометра постепенно «обгоняют» сигналы и примерно каждые 6 минут\n(365 сигналов) <strong>совпадают</strong> с ними. Момент совпадения ухо\nфиксирует очень точно (~0,01ˢ).</li>\n<li><strong>С хронографом</strong> — сигналы и контакты хронометра\nпишутся на ленте/в регистраторе; моменты измеряются по ленте. Сейчас —\nэлектронные регистраторы и компьютер.</li>\n</ol>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 510 160\" style=\"max-width:480px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><text x=\"10.0\" y=\"40.0\" fill=\"#dc2626\" font-size=\"11\" text-anchor=\"start\">сигналы (UTC)</text><text x=\"10.0\" y=\"110.0\" fill=\"#2563eb\" font-size=\"11\" text-anchor=\"start\">удары хронометра</text><text x=\"10.0\" y=\"124.0\" fill=\"#2563eb\" font-size=\"11\" text-anchor=\"start\">(звёздное время)</text><line x1=\"130.0\" y1=\"50.0\" x2=\"130.0\" y2=\"75.0\" stroke=\"#dc2626\" stroke-width=\"2\"/><line x1=\"160.0\" y1=\"50.0\" x2=\"160.0\" y2=\"75.0\" stroke=\"#dc2626\" stroke-width=\"2\"/><line x1=\"190.0\" y1=\"50.0\" x2=\"190.0\" y2=\"75.0\" stroke=\"#dc2626\" stroke-width=\"2\"/><line x1=\"220.0\" y1=\"50.0\" x2=\"220.0\" y2=\"75.0\" stroke=\"#dc2626\" stroke-width=\"2\"/><line x1=\"250.0\" y1=\"50.0\" x2=\"250.0\" y2=\"75.0\" stroke=\"#dc2626\" stroke-width=\"2\"/><line x1=\"280.0\" y1=\"50.0\" x2=\"280.0\" y2=\"75.0\" stroke=\"#dc2626\" stroke-width=\"2\"/><line x1=\"310.0\" y1=\"50.0\" x2=\"310.0\" y2=\"75.0\" stroke=\"#dc2626\" stroke-width=\"2\"/><line x1=\"340.0\" y1=\"50.0\" x2=\"340.0\" y2=\"75.0\" stroke=\"#dc2626\" stroke-width=\"2\"/><line x1=\"370.0\" y1=\"50.0\" x2=\"370.0\" y2=\"75.0\" stroke=\"#dc2626\" stroke-width=\"2\"/><line x1=\"400.0\" y1=\"50.0\" x2=\"400.0\" y2=\"75.0\" stroke=\"#dc2626\" stroke-width=\"2\"/><line x1=\"430.0\" y1=\"50.0\" x2=\"430.0\" y2=\"75.0\" stroke=\"#dc2626\" stroke-width=\"2\"/><line x1=\"460.0\" y1=\"50.0\" x2=\"460.0\" y2=\"75.0\" stroke=\"#dc2626\" stroke-width=\"2\"/><line x1=\"142.0\" y1=\"85.0\" x2=\"142.0\" y2=\"110.0\" stroke=\"#2563eb\" stroke-width=\"2\"/><line x1=\"169.5\" y1=\"85.0\" x2=\"169.5\" y2=\"110.0\" stroke=\"#2563eb\" stroke-width=\"2\"/><line x1=\"197.0\" y1=\"85.0\" x2=\"197.0\" y2=\"110.0\" stroke=\"#2563eb\" stroke-width=\"2\"/><line x1=\"224.5\" y1=\"85.0\" x2=\"224.5\" y2=\"110.0\" stroke=\"#2563eb\" stroke-width=\"2\"/><line x1=\"252.0\" y1=\"85.0\" x2=\"252.0\" y2=\"110.0\" stroke=\"#2563eb\" stroke-width=\"2\"/><line x1=\"279.5\" y1=\"85.0\" x2=\"279.5\" y2=\"110.0\" stroke=\"#2563eb\" stroke-width=\"2\"/><line x1=\"307.0\" y1=\"85.0\" x2=\"307.0\" y2=\"110.0\" stroke=\"#2563eb\" stroke-width=\"2\"/><line x1=\"334.5\" y1=\"85.0\" x2=\"334.5\" y2=\"110.0\" stroke=\"#2563eb\" stroke-width=\"2\"/><line x1=\"362.0\" y1=\"85.0\" x2=\"362.0\" y2=\"110.0\" stroke=\"#2563eb\" stroke-width=\"2\"/><line x1=\"389.5\" y1=\"85.0\" x2=\"389.5\" y2=\"110.0\" stroke=\"#2563eb\" stroke-width=\"2\"/><line x1=\"417.0\" y1=\"85.0\" x2=\"417.0\" y2=\"110.0\" stroke=\"#2563eb\" stroke-width=\"2\"/><line x1=\"444.5\" y1=\"85.0\" x2=\"444.5\" y2=\"110.0\" stroke=\"#2563eb\" stroke-width=\"2\"/><line x1=\"472.0\" y1=\"85.0\" x2=\"472.0\" y2=\"110.0\" stroke=\"#2563eb\" stroke-width=\"2\"/><rect x=\"450\" y=\"44\" width=\"28\" height=\"72\" fill=\"none\" stroke=\"#059669\" stroke-width=\"1.6\" rx=\"4\"/><text x=\"464.0\" y=\"136.0\" fill=\"#059669\" font-size=\"11\" text-anchor=\"middle\">совпадение</text><line x1=\"130.0\" y1=\"150.0\" x2=\"400.0\" y2=\"150.0\" stroke=\"#64748b\" stroke-width=\"1\"/></svg><figcaption><b>Рис. 9.</b> Метод совпадений: удары звёздного хронометра постепенно «обгоняют» секундные сигналы среднего времени; момент совпадения ловят на слух и фиксируют точно.</figcaption></figure>\n<p><strong>Схема вычислений:</strong></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>U</mi><mi>T</mi><msub><mn>1</mn><mi>i</mi></msub><mo>=</mo><mi>U</mi><mi>T</mi><msub><mi>C</mi><mi>i</mi></msub><mo>+</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>U</mi><mi>T</mi><mn>1</mn><mo>−</mo><mi>U</mi><mi>T</mi><mi>C</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>+</mo><msub><mi>Δ</mi><mtext mathvariant=\"normal\">распр</mtext></msub><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>Δ</mi><mtext mathvariant=\"normal\">распр</mtext></msub><mo>=</mo><mi>D</mi><mi>/</mi><mi>c</mi><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">UT1_i = UTC_i + (UT1-UTC) + \\Delta_{\\text{распр}},\\qquad \\Delta_{\\text{распр}} = D/c ,</annotation></semantics></math></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>S</mi><mi>i</mi></msub><mo>=</mo><msub><mi>S</mi><mn>0</mn></msub><mo>+</mo><mi>U</mi><mi>T</mi><msub><mn>1</mn><mi>i</mi></msub><mspace width=\"0.167em\"></mspace><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>1</mn><mo>+</mo><mi>μ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>s</mi><mi>i</mi></msub><mo>=</mo><msub><mi>S</mi><mi>i</mi></msub><mo>+</mo><mi>λ</mi><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>u</mi><mi>i</mi></msub><mo>=</mo><msub><mi>s</mi><mi>i</mi></msub><mo>−</mo><msub><mi>T</mi><mi>i</mi></msub><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">S_i = S_0 + UT1_i\\,(1+\\mu),\\qquad s_i = S_i + \\lambda ,\\qquad u_i = s_i - T_i ,</annotation></semantics></math></p>\n<p>где S<sub>0</sub> — гринвичское звёздное время в 0ʰ UT1 (из АЕ), μ =\n0,0027379 — коэффициент перевода среднего интервала в звёздный.</p>\n<p>Затем: среднее u из всех сигналов приёма на средний момент X; по двум\nприёмам</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mo>=</mo><mfrac><mrow><msub><mi>u</mi><mn>2</mn></msub><mo>−</mo><msub><mi>u</mi><mn>1</mn></msub></mrow><mrow><msub><mi>X</mi><mn>2</mn></msub><mo>−</mo><msub><mi>X</mi><mn>1</mn></msub></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">\\omega = \\frac{u_2 - u_1}{X_2 - X_1}</annotation></semantics></math></p>\n<p>и передача поправки на момент каждой звезды (вопрос 10). Контроль —\nсходимость поправок по отдельным сигналам и по двум станциям.</p>\n<p>Если <strong>долгота неизвестна</strong> (её как раз определяют),\nсначала берут λ<sub>0</sub> — предварительную; тогда u<sub>0</sub>\nотносится к λ<sub>0</sub>, а из наблюдений звёзд находят поправку y → λ\n= λ<sub>0</sub> + (y/15)·sec φ.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> Сигналы — до и после. u = s − T, s = S + λ,\nS = S<sub>0</sub> + UT1·(1 + μ). Совпадения — каждые ~6 мин. Учитывать\nзадержку D/c и UT1 − UTC.</p>\n</div>\n<p><span class=\"src\">Уралов, § 22, с. 121–126</span></p>"}, {"n": 13, "title": "Методы визирования и регистрации моментов наблюдений", "block": 2, "short": "<p>Момент прохождения звезды через нить можно\nзафиксировать: методом <strong>«глаз-ухо»</strong> (оценка на глаз\nдесятых долей секунды между ударами хронометра), методом\n<strong>«глаз-рука»</strong> (нажатие ключа хронографа),\n<strong>контактным (безличным) микрометром</strong> (наблюдатель\nудерживает подвижную нить на звезде, контакты сами пишут моменты),\n<strong>фотоэлектрической</strong> регистрацией. Для z вблизи меридиана\nиспользуют <strong>наведения</strong> нитью под счёт ударов хронометра.\nЧем «безличнее» метод, тем меньше и стабильнее лично-инструментальная\nошибка.</p>", "key": "<p>«Глаз-ухо» — до 0,5ˢ личной ошибки и\nнестабильно; контактный микрометр уменьшает её до сотых и делает\nстабильной. Поправки к нему: ширина контактов и мёртвый ход.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Момент прохождения звезды через нить можно\nзафиксировать: методом <strong>«глаз-ухо»</strong> (оценка на глаз\nдесятых долей секунды между ударами хронометра), методом\n<strong>«глаз-рука»</strong> (нажатие ключа хронографа),\n<strong>контактным (безличным) микрометром</strong> (наблюдатель\nудерживает подвижную нить на звезде, контакты сами пишут моменты),\n<strong>фотоэлектрической</strong> регистрацией. Для z вблизи меридиана\nиспользуют <strong>наведения</strong> нитью под счёт ударов хронометра.\nЧем «безличнее» метод, тем меньше и стабильнее лично-инструментальная\nошибка.</p>\n</div>\n<h3 id=\"теория-12\">Теория</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Метод</th>\n<th>Как</th>\n<th>Точность / личная ошибка</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Глаз-ухо</td>\n<td>слушаем удары хронометра (через 0,5ˢ), на глаз делим интервал</td>\n<td>личное уравнение до 0,5ˢ (редко 0,8ˢ), нестабильно (меняется на\n0,2–0,3ˢ)</td>\n</tr>\n<tr class=\"even\">\n<td>Глаз-рука (ключ)</td>\n<td>нажимаем ключ в момент прохождения, хронограф пишет</td>\n<td>меньше, но тоже есть</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Контактный микрометр</strong></td>\n<td>ведём подвижную нить за звездой; барабан с контактами замыкает цепь\nпри фиксированных положениях нити</td>\n<td>личная ошибка — несколько сотых секунды и стабильна</td>\n</tr>\n<tr class=\"even\">\n<td>Фотоэлектрический</td>\n<td>звезда проходит щели, фотоприёмник даёт импульсы</td>\n<td>практически безличный</td>\n</tr>\n<tr class=\"odd\">\n<td>Наведения</td>\n<td>нить ставится на звезду в момент удара хронометра; отсчитываем\nкруг/микрометр</td>\n<td>для измерения z вблизи меридиана</td>\n</tr>\n</tbody>\n</table>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 500 240\" style=\"max-width:470px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><circle cx=\"110.0\" cy=\"120.0\" r=\"80.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" fill=\"#f8fafc\"/><path d=\"M110,120 L190.0,120.0 A80,80 0 0 0 189.0,107.5 Z\" stroke=\"none\" stroke-width=\"1.4\" fill=\"#d97706\"/><path d=\"M110,120 L174.7,73.0 A80,80 0 0 0 166.6,63.4 Z\" stroke=\"none\" stroke-width=\"1.4\" fill=\"#d97706\"/><path d=\"M110,120 L134.7,43.9 A80,80 0 0 0 122.5,41.0 Z\" stroke=\"none\" stroke-width=\"1.4\" fill=\"#d97706\"/><path d=\"M110,120 L85.3,43.9 A80,80 0 0 0 73.7,48.7 Z\" stroke=\"none\" stroke-width=\"1.4\" fill=\"#d97706\"/><path d=\"M110,120 L45.3,73.0 A80,80 0 0 0 38.7,83.7 Z\" stroke=\"none\" stroke-width=\"1.4\" fill=\"#d97706\"/><path d=\"M110,120 L30.0,120.0 A80,80 0 0 0 31.0,132.5 Z\" stroke=\"none\" stroke-width=\"1.4\" fill=\"#d97706\"/><path d=\"M110,120 L45.3,167.0 A80,80 0 0 0 53.4,176.6 Z\" stroke=\"none\" stroke-width=\"1.4\" fill=\"#d97706\"/><path d=\"M110,120 L85.3,196.1 A80,80 0 0 0 97.5,199.0 Z\" stroke=\"none\" stroke-width=\"1.4\" fill=\"#d97706\"/><path d=\"M110,120 L134.7,196.1 A80,80 0 0 0 146.3,191.3 Z\" stroke=\"none\" stroke-width=\"1.4\" fill=\"#d97706\"/><path d=\"M110,120 L174.7,167.0 A80,80 0 0 0 181.3,156.3 Z\" stroke=\"none\" stroke-width=\"1.4\" fill=\"#d97706\"/><circle cx=\"110.0\" cy=\"120.0\" r=\"30.0\" stroke=\"#1e293b\" stroke-width=\"1.2\" fill=\"white\"/><line x1=\"110.0\" y1=\"18.0\" x2=\"110.0\" y2=\"46.0\" stroke=\"#dc2626\" stroke-width=\"3\"/><text x=\"126.0\" y=\"26.0\" fill=\"#dc2626\" font-size=\"11\" text-anchor=\"start\">щётка</text><text x=\"110.0\" y=\"220.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"middle\">барабан с контактами</text><path d=\"M200.0,120.0 A90,90 0 0 0 198.9,105.9\" stroke=\"#1e293b\" stroke-width=\"2\" fill=\"none\"/><text x=\"218.0\" y=\"118.0\" fill=\"#1e293b\" font-size=\"12\" text-anchor=\"start\" font-style=\"italic\">Ш</text><circle cx=\"380.0\" cy=\"120.0\" r=\"80.0\" stroke=\"#1e293b\" stroke-width=\"1.4\" fill=\"#0f172a\"/><line x1=\"340.0\" y1=\"42.0\" x2=\"340.0\" y2=\"198.0\" stroke=\"#94a3b8\" stroke-width=\"1\"/><line x1=\"420.0\" y1=\"42.0\" x2=\"420.0\" y2=\"198.0\" stroke=\"#94a3b8\" stroke-width=\"1\"/><line x1=\"388.0\" y1=\"41.0\" x2=\"388.0\" y2=\"199.0\" stroke=\"#fbbf24\" stroke-width=\"1.8\"/><polygon points=\"388.0,113.0 389.9,117.5 394.7,117.8 391.0,121.0 392.1,125.7 388.0,123.2 383.9,125.7 385.0,121.0 381.3,117.8 386.1,117.5\" fill=\"#fef3c7\"/><line x1=\"400.0\" y1=\"150.0\" x2=\"440.0\" y2=\"150.0\" stroke=\"#fef3c7\" stroke-width=\"1.2\"/><text x=\"380.0\" y=\"224.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"middle\">поле зрения: подвижная нить «держит» звезду</text><text x=\"420.0\" y=\"168.0\" fill=\"#fef3c7\" font-size=\"10\" text-anchor=\"middle\">движение</text></svg><figcaption><b>Рис. 10.</b> Контактный (безличный) микрометр: наблюдатель вращает винт, удерживая нить на звезде; при замыкании/размыкании контактов хронограф ставит отметки. Ш — ширина контакта.</figcaption></figure>\n<p><strong>Контактный микрометр подробнее.</strong> Подвижная нить\nдвижется винтом; на барабане винта — металлические контакты, по которым\nскользит щётка. При каждом замыкании (или размыкании) хронограф ставит\nотметку. Отметке соответствует положение нити, известное по\nисследованиям. Неточности: <strong>ширина контактов</strong> Ш\n(замыкание происходит не в точке) и <strong>мёртвый ход</strong> винта —\nих определяют и учитывают поправкой (вопрос 21).</p>\n<p><strong>Регистрация.</strong> Хронограф (ленточный, печатающий,\nэлектронный) одновременно записывает секундные контакты хронометра и\nотметки наблюдений; затем моменты отсчитывают по ленте.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> «Глаз-ухо» — до 0,5ˢ личной ошибки и\nнестабильно; контактный микрометр уменьшает её до сотых и делает\nстабильной. Поправки к нему: ширина контактов и мёртвый ход.</p>\n</div>\n<p><span class=\"src\">Уралов, § 11, 13, 19, 40.5, с. 53–64, 89–100,\n192–193</span></p>"}, {"n": 14, "title": "Измерение зенитных расстояний. Редукции к измеренным z", "block": 3, "short": "<p>Зенитное расстояние измеряют по\nвертикальному кругу: z = L − MZ (при КЛ) или z = MZ − R (при КП), а при\nдвух кругах z = ½(L − R) и место зенита исключается. Отсчёт исправляют\nза <strong>наклон</strong> по уровню при вертикальном круге. К\nполученному «измеренному» z вводят <strong>редукции</strong>: рефракция\nρ (главная, ~60″·tg z), гнутие трубы g·sin z, суточная аберрация, для\nСолнца — параллакс и радиус; если вычисления ведут со средним моментом —\nпоправку за <strong>ускорение</strong> (кривизну) движения светила.</p>", "key": "<p>z = ½(L − R); z = z′ + ρ; ρ ≈ 60″·tg z;\nредукции: уровень, рефракция, гнутие, аберрация, ускорение; для Солнца —\nпараллакс и радиус.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Зенитное расстояние измеряют по\nвертикальному кругу: z = L − MZ (при КЛ) или z = MZ − R (при КП), а при\nдвух кругах z = ½(L − R) и место зенита исключается. Отсчёт исправляют\nза <strong>наклон</strong> по уровню при вертикальном круге. К\nполученному «измеренному» z вводят <strong>редукции</strong>: рефракция\nρ (главная, ~60″·tg z), гнутие трубы g·sin z, суточная аберрация, для\nСолнца — параллакс и радиус; если вычисления ведут со средним моментом —\nпоправку за <strong>ускорение</strong> (кривизну) движения светила.</p>\n</div>\n<h3 id=\"теория-13\">Теория</h3>\n<p><strong>Отсчёт и место зенита.</strong> MZ — отсчёт вертикального\nкруга, когда визирная ось направлена в зенит. При двух положениях\nкруга</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi><mi>Z</mi><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>L</mi><mo>+</mo><mi>R</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>z</mi><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>L</mi><mo>−</mo><mi>R</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">MZ = \\tfrac12 (L + R),\\qquad z = \\tfrac12 (L - R)</annotation></semantics></math></p>\n<p>(с точностью до оцифровки конкретного прибора). Наблюдения при одном\nкруге быстрее, но MZ тогда входит как неизвестная постоянная ζ.</p>\n<p><strong>Поправка за уровень</strong> при вертикальном круге: i = ½[(Л\n+ П) − m]·τ, где m — «место нуля» шкалы уровня, τ — цена деления; L = L′\n+ i.</p>\n<p><strong>Рефракция</strong> (рис. 10): атмосфера искривляет луч,\nсветило кажется выше. Измеренное (видимое) z′ меньше истинного:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>z</mi><mo>=</mo><mi>z</mi><mi>′</mi><mo>+</mo><mi>ρ</mi><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>ρ</mi><mo>=</mo><msub><mi>ρ</mi><mn>0</mn></msub><mspace width=\"0.167em\"></mspace><mi>γ</mi><mspace width=\"0.167em\"></mspace><mi>B</mi><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>ρ</mi><mn>0</mn></msub><mo>≈</mo><mn>60,4</mn><mi>″</mi><mspace width=\"0.167em\"></mspace><mo>tg</mo><mi>z</mi><mi>′</mi><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">z = z&#39; + \\rho ,\\qquad \\rho = \\rho_0\\,\\gamma\\,B ,\\qquad \\rho_0 \\approx 60{,}4&#39;&#39;\\,\\operatorname{tg} z&#39; ,</annotation></semantics></math></p>\n<p>где ρ<sub>0</sub> — средняя рефракция, γ — множитель за температуру,\nB — за давление (таблицы АТ). Поэтому в начале, середине и конце\nнаблюдений записывают температуру и давление.</p>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 470 260\" style=\"max-width:420px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><line x1=\"20.0\" y1=\"230.0\" x2=\"440.0\" y2=\"230.0\" stroke=\"#059669\" stroke-width=\"1.6\"/><text x=\"400.0\" y=\"248.0\" fill=\"#059669\" font-size=\"11\" text-anchor=\"middle\">горизонт</text><circle cx=\"120.0\" cy=\"230.0\" r=\"4\" fill=\"#1e293b\"/><text x=\"120.0\" y=\"248.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"middle\">наблюдатель</text><line x1=\"120.0\" y1=\"230.0\" x2=\"120.0\" y2=\"20.0\" stroke=\"#64748b\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/><text x=\"120.0\" y=\"16.0\" fill=\"#1e293b\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"600\">Z</text><polygon points=\"390.0,34.0 391.6,37.8 395.7,38.1 392.6,40.8 393.5,44.9 390.0,42.7 386.5,44.9 387.4,40.8 384.3,38.1 388.4,37.8\" fill=\"#dc2626\"/><text x=\"405.0\" y=\"36.0\" fill=\"#dc2626\" font-size=\"11\" text-anchor=\"start\">σ (истинное)</text><polygon points=\"330.0,14.0 331.6,17.8 335.7,18.1 332.6,20.8 333.5,24.9 330.0,22.7 326.5,24.9 327.4,20.8 324.3,18.1 328.4,17.8\" fill=\"#d97706\"/><text x=\"345.0\" y=\"18.0\" fill=\"#d97706\" font-size=\"11\" text-anchor=\"start\">σ′ (видимое)</text><path d=\"M390,40 Q240,120 120,230\" stroke=\"#dc2626\" stroke-width=\"1.6\" fill=\"none\"/><line x1=\"120.0\" y1=\"230.0\" x2=\"330.0\" y2=\"20.0\" stroke=\"#d97706\" stroke-width=\"1.4\" stroke-dasharray=\"5 3\"/><line x1=\"120.0\" y1=\"230.0\" x2=\"390.0\" y2=\"40.0\" stroke=\"#dc2626\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/><path d=\"M120.0,160.0 A70,70 0 0 1 169.5,180.5\" stroke=\"#d97706\" stroke-width=\"1.6\" fill=\"none\"/><text x=\"142.0\" y=\"152.0\" fill=\"#d97706\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">z′</text><path d=\"M120.0,120.0 A110,110 0 0 1 210.0,166.7\" stroke=\"#dc2626\" stroke-width=\"1.6\" fill=\"none\"/><text x=\"190.0\" y=\"118.0\" fill=\"#dc2626\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">z</text><text x=\"300.0\" y=\"150.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">ρ = z − z′ > 0</text><text x=\"300.0\" y=\"168.0\" fill=\"#64748b\" font-size=\"12\" text-anchor=\"middle\" font-style=\"italic\">ρ₀ ≈ 60″·tg z′</text></svg><figcaption><b>Рис. 11.</b> Рефракция поднимает светило: видимое зенитное расстояние z′ меньше истинного, поэтому z = z′ + ρ.</figcaption></figure>\n<p><strong>Полная формула (Уралов, § 42):</strong></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>z</mi><mtext mathvariant=\"normal\">изм</mtext></msub><mo>=</mo><mi>L</mi><mo>−</mo><mi>M</mi><mi>Z</mi><mo>+</mo><mi>ρ</mi><mo>+</mo><mi>g</mi><mo>sin</mo><mi>z</mi><mspace width=\"2.0em\"></mspace><mtext mathvariant=\"normal\">или</mtext><mspace width=\"2.0em\"></mspace><msub><mi>z</mi><mtext mathvariant=\"normal\">изм</mtext></msub><mo>=</mo><mi>M</mi><mi>Z</mi><mo>−</mo><mi>R</mi><mo>+</mo><mi>ρ</mi><mo>+</mo><mi>g</mi><mo>sin</mo><mi>z</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">z_{\\text{изм}} = L - MZ + \\rho + g\\sin z \\qquad\\text{или}\\qquad z_{\\text{изм}} = MZ - R + \\rho + g\\sin z .</annotation></semantics></math></p>\n<p><strong>Остальные редукции:</strong></p>\n<ul>\n<li><strong>суточная аберрация</strong> — Δz = −0,32″·cos φ·sin A·cos z,\nобычно вводится в момент: ΔT<sub>a</sub> = −0,021ˢ·cos z (вопрос\n21);</li>\n<li><strong>для Солнца</strong>: суточный параллакс −p<sub>0</sub>·sin z\n(p<sub>0</sub> ≈ 8,8″) и радиус ±R<sub>⊙</sub> ≈ 16′ (если наводили на\nкрай);</li>\n<li><strong>ускорение</strong> (кривизна изменения z): если z вычислено\nсо средним моментом T<sub>ср</sub>, а наблюдений n, то</li>\n</ul>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Δ</mi><msub><mi>z</mi><mi>w</mi></msub><mo>=</mo><mfrac><msup><mn>15</mn><mn>2</mn></msup><mrow><mn>2</mn><mi>ρ</mi><mi>″</mi></mrow></mfrac><mspace width=\"0.167em\"></mspace><mfrac><mrow><msup><mi>d</mi><mn>2</mn></msup><mi>z</mi></mrow><mrow><mi>d</mi><msup><mi>t</mi><mn>2</mn></msup></mrow></mfrac><mspace width=\"0.167em\"></mspace><mfrac><mrow><mo>∑</mo><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>T</mi><mi>i</mi></msub><mo>−</mo><msub><mi>T</mi><mtext mathvariant=\"normal\">ср</mtext></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mn>2</mn></msup></mrow><mi>n</mi></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><mfrac><mrow><msup><mi>d</mi><mn>2</mn></msup><mi>z</mi></mrow><mrow><mi>d</mi><msup><mi>t</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mi>m</mi><mo>+</mo><mi>n</mi><mspace width=\"0.167em\"></mspace><mo>ctg</mo><mi>z</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta z_w = \\frac{15^2}{2\\rho&#39;&#39;}\\,\\frac{d^2z}{dt^2}\\,\\frac{\\sum (T_i - T_{\\text{ср}})^2}{n} ,\\qquad \\frac{d^2z}{dt^2} = m + n\\,\\operatorname{ctg} z .</annotation></semantics></math></p>\n<p>Поправка за ускорение максимальна в меридиане и равна нулю в первом\nвертикале. Для наблюдений вблизи меридиана используют также\n<strong>приведение к меридиану</strong>.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> z = ½(L − R); z = z′ + ρ; ρ ≈ 60″·tg z;\nредукции: уровень, рефракция, гнутие, аберрация, ускорение; для Солнца —\nпараллакс и радиус.</p>\n</div>\n<p><span class=\"src\">Уралов, § 31–32, 40, 42, с. 150–160, 185–191,\n210</span></p>"}, {"n": 15, "title": "Влияние случайных ошибок на измерение зенитных расстояний", "block": 3, "short": "<p>Суммарная случайная ошибка измеренного z\nскладывается из ошибок <strong>визирования</strong>,\n<strong>отсчёта</strong> вертикального круга, <strong>определения\nнаклона</strong> по уровню и <strong>остаточного влияния рефракции и\nгнутия</strong>: m<sub>z</sub>² = m<sub>виз</sub>² + m<sub>L</sub>² +\nm<sub>i</sub>² + m<sub>ρ</sub>². Для 2-секундного теодолита каждая\nсоставляющая ≈ 0,3–0,5″, итог — около 1″, для 5-секундного ≈ 1,6″.\nСлучайные ошибки нельзя исключить методикой, их ослабляют числом\nнаблюдений (нитей, наведений, звёзд).</p>", "key": "<p>Четыре источника: визирование, отсчёт,\nуровень, рефракция+гнутие. Визирование ∝ b/(W√k). Против рефракции —\nравные z. m<sub>z</sub> ≈ 1″.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Суммарная случайная ошибка измеренного z\nскладывается из ошибок <strong>визирования</strong>,\n<strong>отсчёта</strong> вертикального круга, <strong>определения\nнаклона</strong> по уровню и <strong>остаточного влияния рефракции и\nгнутия</strong>: m<sub>z</sub>² = m<sub>виз</sub>² + m<sub>L</sub>² +\nm<sub>i</sub>² + m<sub>ρ</sub>². Для 2-секундного теодолита каждая\nсоставляющая ≈ 0,3–0,5″, итог — около 1″, для 5-секундного ≈ 1,6″.\nСлучайные ошибки нельзя исключить методикой, их ослабляют числом\nнаблюдений (нитей, наведений, звёзд).</p>\n</div>\n<h3 id=\"теория-14\">Теория</h3>\n<p><strong>1. Визирование.</strong> На неподвижный предмет m<sub>v</sub>\n= b/W, где b = 30–60″ — разрешающая способность глаза, W — увеличение.\nПри k наведениях: m<sub>v</sub>/√k.</p>\n<p>При наблюдении <strong>моментов прохождения</strong> через нити\nошибка момента</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msubsup><mi>m</mi><mi>T</mi><mn>2</mn></msubsup><mo>=</mo><mfrac><mn>1</mn><mi>k</mi></mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><mfrac><msup><mi>b</mi><mn>2</mn></msup><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>W</mi><mo>cos</mo><mi>φ</mi><mo>sin</mo><mi>A</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mn>2</mn></msup></mfrac><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">m_T^2 = \\frac{1}{k}\\left[a^2 + \\frac{b^2}{(W\\cos\\varphi\\sin A)^2}\\right],</annotation></semantics></math></p>\n<p>где a, b зависят от метода: «глаз-ухо» a = 0,10ˢ, b = 4,7ˢ;\nконтактный микрометр a = 0,02–0,04ˢ, b = 2,5–2,8ˢ. В z это переходит\nчерез скорость dz/dt = cos φ·sin A:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mi>z</mi></msub><mo>≈</mo><mfrac><mrow><mn>15</mn><mspace width=\"0.167em\"></mspace><msup><mi>b</mi><mi>s</mi></msup></mrow><mrow><mi>W</mi><msqrt><mi>k</mi></msqrt></mrow></mfrac><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">m_{z} \\approx \\frac{15\\,b^{s}}{W\\sqrt{k}} .</annotation></semantics></math></p>\n<p>Скорость светила сокращается, поэтому ошибка визирования в z\n<strong>почти не зависит от азимута</strong>. Для W = 50ˣ, k = 9:\n«глаз-ухо» 0,46″, контактный микрометр 0,28″, наведения в меридиане (k =\n6) 0,33″.</p>\n<p><strong>2. Отсчёт по кругу</strong> (два микроскопа, оба штриха):\nm<sub>L</sub>² = m₁²/4 + m₂²/4 + m₃²/2 ≈ (0,5″)² — сюда входят ошибки\nнаведения микроскопа и ошибки диаметров лимба. Поэтому круг\n<strong>переставляют</strong> между приёмами.</p>\n<p><strong>3. Уровень:</strong> m<sub>i</sub> = 0,20″·√τ (формула\nРейнгерца), практически ≈ 0,3″ при τ = 2″.</p>\n<p><strong>4. Остаточная рефракция и гнутие</strong> — до 1–2″ при 10°\n&lt; z &lt; 70°! Это главная причина наблюдать звёзды <strong>на равных\nz</strong> (разность ≤ 5–7°, z ≤ 50°) — тогда остаток ≤ 0,2–0,3″.</p>\n<p><strong>Итог:</strong> m<sub>z</sub> ≈ 1,0″ (2″-теодолит), 1,6″\n(5″-теодолит).</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> Четыре источника: визирование, отсчёт,\nуровень, рефракция+гнутие. Визирование ∝ b/(W√k). Против рефракции —\nравные z. m<sub>z</sub> ≈ 1″.</p>\n</div>\n<p><span class=\"src\">Уралов, § 33, с. 160–165</span></p>"}, {"n": 16, "title": "Общая теория зенитальных способов. Линейные уравнения поправок. Геометрическая интерпретация", "block": 3, "short": "<p>Приближённые φ<sub>0</sub>, u<sub>0</sub>\nизвестны. По ним для каждой звезды вычисляют z<sub>выч</sub> и\nсравнивают с измеренным z<sub>изм</sub>. Разность линейно связана с\nпоправками x = φ − φ<sub>0</sub>, y = 15·cos φ·(u − u<sub>0</sub>) и с\nпостоянной ошибкой зенитных расстояний ζ. Уравнение поправок:\n<strong>a·ζ + b·x + c·y + l = v</strong>, где a = −1, b = cos A, c = sin\nA (A от юга), l = z<sub>выч</sub> − z<sub>изм</sub>. Геометрически\nкаждое уравнение — <strong>линия положения</strong>, перпендикулярная\nазимуту звезды; зенит — их общая точка.</p>", "key": "<p>−ζ + cos A·x + sin A·y + l = v; l =\nz<sub>выч</sub> − z<sub>изм</sub>; x = Δφ, y = 15 cos φ Δu. Линия\nположения ⟂ азимуту звезды, отстоит на l. Нужно минимум 2 звезды (3 —\nесли есть ζ).</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Приближённые φ<sub>0</sub>, u<sub>0</sub>\nизвестны. По ним для каждой звезды вычисляют z<sub>выч</sub> и\nсравнивают с измеренным z<sub>изм</sub>. Разность линейно связана с\nпоправками x = φ − φ<sub>0</sub>, y = 15·cos φ·(u − u<sub>0</sub>) и с\nпостоянной ошибкой зенитных расстояний ζ. Уравнение поправок:\n<strong>a·ζ + b·x + c·y + l = v</strong>, где a = −1, b = cos A, c = sin\nA (A от юга), l = z<sub>выч</sub> − z<sub>изм</sub>. Геометрически\nкаждое уравнение — <strong>линия положения</strong>, перпендикулярная\nазимуту звезды; зенит — их общая точка.</p>\n</div>\n<h3 id=\"теория-15\">Теория</h3>\n<p><strong>Шаг 1. Вычисляем.</strong> По φ<sub>0</sub>, λ<sub>0</sub> и\nu<sub>0</sub>:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>t</mi><mn>0</mn></msub><mo>=</mo><mi>T</mi><mo>+</mo><mi>Δ</mi><msub><mi>T</mi><mi>a</mi></msub><mo>+</mo><msub><mi>u</mi><mn>0</mn></msub><mo>+</mo><mi>ω</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>T</mi><mo>−</mo><mi>X</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>−</mo><mi>α</mi><mo>,</mo><mspace width=\"2.0em\"></mspace><mo>cos</mo><msub><mi>z</mi><mtext mathvariant=\"normal\">выч</mtext></msub><mo>=</mo><mo>sin</mo><msub><mi>φ</mi><mn>0</mn></msub><mo>sin</mo><mi>δ</mi><mo>+</mo><mo>cos</mo><msub><mi>φ</mi><mn>0</mn></msub><mo>cos</mo><mi>δ</mi><mo>cos</mo><msub><mi>t</mi><mn>0</mn></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">t_0 = T + \\Delta T_a + u_0 + \\omega (T - X) - \\alpha ,\\qquad \\cos z_{\\text{выч}} = \\sin\\varphi_0\\sin\\delta + \\cos\\varphi_0\\cos\\delta\\cos t_0 .</annotation></semantics></math></p>\n<p><strong>Шаг 2. Сравниваем.</strong> Истинные φ, u отличаются на малые\nвеличины; разлагаем в ряд Тейлора (только линейные члены):</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>z</mi><mtext mathvariant=\"normal\">ист</mtext></msub><mo>=</mo><msub><mi>z</mi><mtext mathvariant=\"normal\">выч</mtext></msub><mo>+</mo><mfrac><mrow><mi>∂</mi><mi>z</mi></mrow><mrow><mi>∂</mi><mi>φ</mi></mrow></mfrac><mspace width=\"0.167em\"></mspace><mi>Δ</mi><mi>φ</mi><mo>+</mo><mfrac><mrow><mi>∂</mi><mi>z</mi></mrow><mrow><mi>∂</mi><mi>t</mi></mrow></mfrac><mspace width=\"0.167em\"></mspace><mi>Δ</mi><mi>u</mi><mo>,</mo><mspace width=\"2.0em\"></mspace><mfrac><mrow><mi>∂</mi><mi>z</mi></mrow><mrow><mi>∂</mi><mi>φ</mi></mrow></mfrac><mo>=</mo><mo>cos</mo><mi>A</mi><mo>,</mo><mspace width=\"1.0em\"></mspace><mfrac><mrow><mi>∂</mi><mi>z</mi></mrow><mrow><mi>∂</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mn>15</mn><mo>cos</mo><mi>φ</mi><mo>sin</mo><mi>A</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">z_{\\text{ист}} = z_{\\text{выч}} + \\frac{\\partial z}{\\partial\\varphi}\\,\\Delta\\varphi + \\frac{\\partial z}{\\partial t}\\,\\Delta u ,\\qquad \\frac{\\partial z}{\\partial \\varphi} = \\cos A ,\\quad \\frac{\\partial z}{\\partial t} = 15\\cos\\varphi\\sin A .</annotation></semantics></math></p>\n<p>Если все z измерены с одной неизвестной постоянной ошибкой ζ (место\nзенита при одном круге, остаточная рефракция), то</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><menclose notation=\"box\"><mrow><mspace width=\"0.278em\"></mspace><mo>−</mo><mi>ζ</mi><mo>+</mo><mo>cos</mo><msub><mi>A</mi><mi>i</mi></msub><mspace width=\"0.167em\"></mspace><mi>x</mi><mo>+</mo><mo>sin</mo><msub><mi>A</mi><mi>i</mi></msub><mspace width=\"0.167em\"></mspace><mi>y</mi><mo>+</mo><msub><mi>l</mi><mi>i</mi></msub><mo>=</mo><msub><mi>v</mi><mi>i</mi></msub><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>l</mi><mi>i</mi></msub><mo>=</mo><msub><mi>z</mi><mtext mathvariant=\"normal\">выч</mtext></msub><mo>−</mo><msub><mi>z</mi><mtext mathvariant=\"normal\">изм</mtext></msub><mspace width=\"0.278em\"></mspace></mrow></menclose><annotation encoding=\"application/x-tex\">\\boxed{\\;-\\zeta + \\cos A_i\\,x + \\sin A_i\\,y + l_i = v_i ,\\qquad l_i = z_{\\text{выч}} - z_{\\text{изм}}\\;}</annotation></semantics></math></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><mi>φ</mi><mo>−</mo><msub><mi>φ</mi><mn>0</mn></msub><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>y</mi><mo>=</mo><mn>15</mn><mo>cos</mo><mi>φ</mi><mspace width=\"0.167em\"></mspace><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>u</mi><mo>−</mo><msub><mi>u</mi><mn>0</mn></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mspace width=\"0.222em\"></mspace><mo>⇒</mo><mspace width=\"0.222em\"></mspace><mi>φ</mi><mo>=</mo><msub><mi>φ</mi><mn>0</mn></msub><mo>+</mo><mi>x</mi><mo>,</mo><mspace width=\"1.0em\"></mspace><mi>λ</mi><mo>=</mo><msub><mi>λ</mi><mn>0</mn></msub><mo>+</mo><mfrac><mi>y</mi><mn>15</mn></mfrac><mo>sec</mo><mi>φ</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">x = \\varphi - \\varphi_0 ,\\qquad y = 15\\cos\\varphi\\,(u - u_0)\\ \\Rightarrow\\ \\varphi = \\varphi_0 + x ,\\quad \\lambda = \\lambda_0 + \\frac{y}{15}\\sec\\varphi .</annotation></semantics></math></p>\n<p>(При счёте азимута от севера знаки при cos A, sin A меняются на\nпротивоположные.) Если вместо φ<sub>0</sub>, λ<sub>0</sub> взять\nгеодезические B, L, то неизвестными станут сразу составляющие уклонения\nотвеса ξ, η.</p>\n<p><strong>Шаг 3. Геометрия</strong> (Уралов, § 35). Возьмём на\nплоскости, касательной к сфере в предполагаемом зените Z<sub>0</sub>,\nоси x (к северу) и y (к востоку). Уравнение cos A·x + sin A·y = −l — это\nпрямая, <strong>перпендикулярная направлению на светило</strong> и\nотстоящая от Z<sub>0</sub> на |l|. На ней лежат все положения зенита,\nпри которых звезда имела бы измеренное z. Это и есть <strong>линия\nположения</strong> (линия Сомнера в мореходной астрономии). Две линии\nдают точку, много линий — «многоугольник погрешностей», МНК даёт\nнаиболее вероятную точку. Неизвестное ζ одинаково сдвигает все линии\n«от» или «к» звёздам.</p>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 460 340\" style=\"max-width:420px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><line x1=\"230.0\" y1=\"320.0\" x2=\"230.0\" y2=\"20.0\" stroke=\"#64748b\" stroke-width=\"1\" marker-end=\"url(#ar)\"/><text x=\"242.0\" y=\"30.0\" fill=\"#64748b\" font-size=\"11\" text-anchor=\"start\">x (к N)</text><line x1=\"30.0\" y1=\"170.0\" x2=\"430.0\" y2=\"170.0\" stroke=\"#64748b\" stroke-width=\"1\" marker-end=\"url(#ar)\"/><text x=\"420.0\" y=\"188.0\" fill=\"#64748b\" font-size=\"11\" text-anchor=\"middle\">y (к E)</text><line x1=\"121.4\" y1=\"88.3\" x2=\"365.7\" y2=\"177.3\" stroke=\"#2563eb\" stroke-width=\"1.8\"/><line x1=\"230.0\" y1=\"170.0\" x2=\"271.0\" y2=\"57.2\" stroke=\"#2563eb\" stroke-width=\"0.8\" stroke-dasharray=\"3 3\"/><text x=\"275.8\" y=\"48.1\" fill=\"#2563eb\" font-size=\"11\" text-anchor=\"middle\" font-style=\"italic\">A1</text><line x1=\"245.5\" y1=\"37.3\" x2=\"156.6\" y2=\"281.6\" stroke=\"#dc2626\" stroke-width=\"1.8\"/><line x1=\"230.0\" y1=\"170.0\" x2=\"342.8\" y2=\"211.0\" stroke=\"#dc2626\" stroke-width=\"0.8\" stroke-dasharray=\"3 3\"/><text x=\"355.9\" y=\"219.8\" fill=\"#dc2626\" font-size=\"11\" text-anchor=\"middle\" font-style=\"italic\">A2</text><line x1=\"344.6\" y1=\"235.1\" x2=\"100.3\" y2=\"146.2\" stroke=\"#059669\" stroke-width=\"1.8\"/><line x1=\"230.0\" y1=\"170.0\" x2=\"189.0\" y2=\"282.8\" stroke=\"#059669\" stroke-width=\"0.8\" stroke-dasharray=\"3 3\"/><text x=\"184.2\" y=\"299.9\" fill=\"#059669\" font-size=\"11\" text-anchor=\"middle\" font-style=\"italic\">A3</text><line x1=\"202.1\" y1=\"298.2\" x2=\"291.0\" y2=\"53.9\" stroke=\"#d97706\" stroke-width=\"1.8\"/><line x1=\"230.0\" y1=\"170.0\" x2=\"117.2\" y2=\"129.0\" stroke=\"#d97706\" stroke-width=\"0.8\" stroke-dasharray=\"3 3\"/><text x=\"104.1\" y=\"128.2\" fill=\"#d97706\" font-size=\"11\" text-anchor=\"middle\" font-style=\"italic\">A4</text><circle cx=\"230.0\" cy=\"170.0\" r=\"4\" fill=\"#1e293b\"/><text x=\"216.0\" y=\"162.0\" fill=\"#1e293b\" font-size=\"12\" text-anchor=\"middle\">Z₀</text><circle cx=\"234.0\" cy=\"164.0\" r=\"4\" fill=\"#dc2626\"/><text x=\"248.0\" y=\"156.0\" fill=\"#dc2626\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">Z</text></svg><figcaption><b>Рис. 12.</b> Геометрическая интерпретация: каждое уравнение поправок — линия положения, перпендикулярная азимуту светила и смещённая на свободный член l. Их «общая точка» (по МНК) — искомый зенит Z.</figcaption></figure>\n<div class=\"key\">\n<p><strong>Запомни.</strong> −ζ + cos A·x + sin A·y + l = v; l =\nz<sub>выч</sub> − z<sub>изм</sub>; x = Δφ, y = 15 cos φ Δu. Линия\nположения ⟂ азимуту звезды, отстоит на l. Нужно минимум 2 звезды (3 —\nесли есть ζ).</p>\n</div>\n<p><span class=\"src\">Уралов, § 34–35, с. 166–173</span></p>"}, {"n": 17, "title": "Решение уравнений поправок. Оценка точности", "block": 3, "short": "<p>Систему n уравнений a·ζ + b·x + c·y + l = v\nрешают <strong>по способу наименьших квадратов</strong> ([pvv] = min):\nсоставляют нормальные уравнения, находят ζ, x, y и их веса. Ошибка\nединицы веса μ = √([pvv]/(n − k)), где k — число неизвестных (2 или 3);\nошибки неизвестных m<sub>x</sub> = μ/√P<sub>x</sub>, m<sub>y</sub> =\nμ/√P<sub>y</sub>. При равномерном распределении звёзд по азимутам\nP<sub>x</sub> = P<sub>y</sub> = n/2 — широта и время получаются\nодинаково точно.</p>", "key": "<p>МНК: [pvv] = min. μ = √([pvv]/(n − k)). При\nравномерном распределении P<sub>x</sub> = P<sub>y</sub> = n/2,\nP<sub>ζ</sub> = n.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Систему n уравнений a·ζ + b·x + c·y + l = v\nрешают <strong>по способу наименьших квадратов</strong> ([pvv] = min):\nсоставляют нормальные уравнения, находят ζ, x, y и их веса. Ошибка\nединицы веса μ = √([pvv]/(n − k)), где k — число неизвестных (2 или 3);\nошибки неизвестных m<sub>x</sub> = μ/√P<sub>x</sub>, m<sub>y</sub> =\nμ/√P<sub>y</sub>. При равномерном распределении звёзд по азимутам\nP<sub>x</sub> = P<sub>y</sub> = n/2 — широта и время получаются\nодинаково точно.</p>\n</div>\n<h3 id=\"теория-16\">Теория</h3>\n<p><strong>Нормальные уравнения:</strong></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mtable><mtr><mtd columnalign=\"right\" style=\"text-align: right\"><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>a</mi><mi>a</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mi>ζ</mi><mo>+</mo><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>a</mi><mi>b</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mi>x</mi><mo>+</mo><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>a</mi><mi>c</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mi>y</mi><mo>+</mo><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>a</mi><mi>l</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow></mtd><mtd columnalign=\"left\" style=\"text-align: left\"><mo>=</mo><mn>0</mn></mtd></mtr><mtr><mtd columnalign=\"right\" style=\"text-align: right\"><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>a</mi><mi>b</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mi>ζ</mi><mo>+</mo><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mi>b</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mi>x</mi><mo>+</mo><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mi>c</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mi>y</mi><mo>+</mo><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mi>l</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow></mtd><mtd columnalign=\"left\" style=\"text-align: left\"><mo>=</mo><mn>0</mn></mtd></mtr><mtr><mtd columnalign=\"right\" style=\"text-align: right\"><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>a</mi><mi>c</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mi>ζ</mi><mo>+</mo><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mi>c</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mi>x</mi><mo>+</mo><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>c</mi><mi>c</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mi>y</mi><mo>+</mo><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>c</mi><mi>l</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow></mtd><mtd columnalign=\"left\" style=\"text-align: left\"><mo>=</mo><mn>0</mn></mtd></mtr></mtable><annotation encoding=\"application/x-tex\">\\begin{aligned}\n[aa]\\zeta + [ab]x + [ac]y + [al] &amp;= 0\\\\\n[ab]\\zeta + [bb]x + [bc]y + [bl] &amp;= 0\\\\\n[ac]\\zeta + [bc]x + [cc]y + [cl] &amp;= 0\n\\end{aligned}</annotation></semantics></math></p>\n<p>Решение — по Гауссу (схема исключения) или матрично: X =\n−(AᵀPA)⁻¹AᵀPl. Веса неизвестных — обратные диагональные элементы\nобратной матрицы.</p>\n<p><strong>Важный частный случай:</strong> если звёзды расположены\n<strong>равномерно по азимутам</strong> (или парами в перпендикулярных\nвертикалах, симметрично), то недиагональные суммы [ab] = [ac] = [bc] ≈\n0, и неизвестные находятся <strong>независимо</strong>:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ζ</mi><mo>=</mo><mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>l</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mi>n</mi></mfrac><mo>,</mo><mspace width=\"1.0em\"></mspace><mi>x</mi><mo>=</mo><mo>−</mo><mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mi>l</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mi>b</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow></mfrac><mo>,</mo><mspace width=\"1.0em\"></mspace><mi>y</mi><mo>=</mo><mo>−</mo><mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>c</mi><mi>l</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>c</mi><mi>c</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>P</mi><mi>ζ</mi></msub><mo>=</mo><mi>n</mi><mo>,</mo><mspace width=\"1.0em\"></mspace><msub><mi>P</mi><mi>x</mi></msub><mo>=</mo><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><msup><mo>cos</mo><mn>2</mn></msup><mi>A</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mo>=</mo><mfrac><mi>n</mi><mn>2</mn></mfrac><mo>,</mo><mspace width=\"1.0em\"></mspace><msub><mi>P</mi><mi>y</mi></msub><mo>=</mo><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><msup><mo>sin</mo><mn>2</mn></msup><mi>A</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mo>=</mo><mfrac><mi>n</mi><mn>2</mn></mfrac><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\zeta = \\frac{[l]}{n},\\quad x = -\\frac{[bl]}{[bb]},\\quad y = -\\frac{[cl]}{[cc]},\\qquad P_\\zeta = n ,\\quad P_x = [\\cos^2 A] = \\frac n2 ,\\quad P_y = [\\sin^2 A] = \\frac n2 .</annotation></semantics></math></p>\n<p><strong>Оценка точности:</strong></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi><mo>=</mo><msqrt><mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>p</mi><mi>v</mi><mi>v</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mrow><mi>n</mi><mo>−</mo><mi>k</mi></mrow></mfrac></msqrt><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>m</mi><mi>x</mi></msub><mo>=</mo><msub><mi>m</mi><mi>φ</mi></msub><mo>=</mo><mfrac><mi>μ</mi><msqrt><msub><mi>P</mi><mi>x</mi></msub></msqrt></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>m</mi><mi>y</mi></msub><mo>=</mo><mfrac><mi>μ</mi><msqrt><msub><mi>P</mi><mi>y</mi></msub></msqrt></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><msubsup><mi>m</mi><mi>λ</mi><mi>s</mi></msubsup><mo>=</mo><mfrac><msub><mi>m</mi><mi>y</mi></msub><mn>15</mn></mfrac><mo>sec</mo><mi>φ</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\mu = \\sqrt{\\frac{[pvv]}{n-k}} ,\\qquad m_x = m_\\varphi = \\frac{\\mu}{\\sqrt{P_x}},\\qquad m_y = \\frac{\\mu}{\\sqrt{P_y}},\\qquad m_\\lambda^{s} = \\frac{m_y}{15}\\sec\\varphi .</annotation></semantics></math></p>\n<p><strong>Пример (Уралов, § 42):</strong> теодолит У5, «глаз-ухо», μ =\n1,8″, n = 6 звёзд: P<sub>x</sub> = P<sub>y</sub> = 3, m<sub>φ</sub> =\n1,8/√3 ≈ 1,0″, m<sub>λ</sub> = 0,07ˢ·sec φ.</p>\n<p>Решать можно и <strong>графически</strong>: построить линии положения\nв крупном масштабе и найти центр многоугольника. Это хорошо для\nпонимания и контроля.</p>\n<p>Помните: оценка по МНК — это точность <strong>по внутренней\nсходимости</strong>. Реальная точность хуже из-за неисключённых\nсистематических ошибок (рефракция, гнутие, личная ошибка).</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> МНК: [pvv] = min. μ = √([pvv]/(n − k)). При\nравномерном распределении P<sub>x</sub> = P<sub>y</sub> = n/2,\nP<sub>ζ</sub> = n.</p>\n</div>\n<p><span class=\"src\">Уралов, § 36–37, с. 173–177</span></p>"}, {"n": 18, "title": "Выгоднейшие условия определения широты и долготы зенитальными способами", "block": 3, "short": "<p>Выгоднейшие условия — те, при которых\nискомая величина получается с <strong>наибольшим весом</strong>, а\nвлияние ошибок других величин и систематических ошибок\n<strong>минимально</strong>. Широта: светила <strong>в\nмеридиане</strong> (или вблизи), пары N–S на равных z. Время/долгота:\nсветила <strong>в первом вертикале</strong>, пары E–W на равных z.\nСовместно φ и λ: звёзды равномерно по азимутам. Зенитные расстояния — не\nболее 50–60° (рефракция), разность z в паре — малая.</p>", "key": "<p>Широта — меридиан, время — первый вертикал,\nпары — на равных z, совместно — по кругу азимутов. Вес пары: 2cos²A для\nφ, 2sin²A для времени.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Выгоднейшие условия — те, при которых\nискомая величина получается с <strong>наибольшим весом</strong>, а\nвлияние ошибок других величин и систематических ошибок\n<strong>минимально</strong>. Широта: светила <strong>в\nмеридиане</strong> (или вблизи), пары N–S на равных z. Время/долгота:\nсветила <strong>в первом вертикале</strong>, пары E–W на равных z.\nСовместно φ и λ: звёзды равномерно по азимутам. Зенитные расстояния — не\nболее 50–60° (рефракция), разность z в паре — малая.</p>\n</div>\n<h3 id=\"теория-17\">Теория</h3>\n<p>Из уравнения поправок −ζ + cos A·x + sin A·y + l = v:</p>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 440 230\" style=\"max-width:420px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><line x1=\"50.0\" y1=\"200.0\" x2=\"430.0\" y2=\"200.0\" stroke=\"#1e293b\" stroke-width=\"1.4\" marker-end=\"url(#ar)\"/><line x1=\"50.0\" y1=\"200.0\" x2=\"50.0\" y2=\"25.0\" stroke=\"#1e293b\" stroke-width=\"1.4\" marker-end=\"url(#ar)\"/><text x=\"426.0\" y=\"218.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">A</text><path d=\"M50.0,50.0 L56.0,50.2 L62.0,50.8 L68.0,51.8 L74.0,53.3 L80.0,55.1 L86.0,57.3 L92.0,60.0 L98.0,63.0 L104.0,66.3 L110.0,70.1 L116.0,74.2 L122.0,78.6 L128.0,83.4 L134.0,88.5 L140.0,93.9 L146.0,99.6 L152.0,105.6 L158.0,111.8 L164.0,118.3 L170.0,125.0 L176.0,131.9 L182.0,139.0 L188.0,146.2 L194.0,153.6 L200.0,161.2 L206.0,168.8 L212.0,176.5 L218.0,184.3 L224.0,192.1 L230.0,200.0 L236.0,192.1 L242.0,184.3 L248.0,176.5 L254.0,168.8 L260.0,161.2 L266.0,153.6 L272.0,146.2 L278.0,139.0 L284.0,131.9 L290.0,125.0 L296.0,118.3 L302.0,111.8 L308.0,105.6 L314.0,99.6 L320.0,93.9 L326.0,88.5 L332.0,83.4 L338.0,78.6 L344.0,74.2 L350.0,70.1 L356.0,66.3 L362.0,63.0 L368.0,60.0 L374.0,57.3 L380.0,55.1 L386.0,53.3 L392.0,51.8 L398.0,50.8 L404.0,50.2 L410.0,50.0 \" stroke=\"#2563eb\" stroke-width=\"2.2\" fill=\"none\"/><path d=\"M50.0,200.0 L56.0,192.1 L62.0,184.3 L68.0,176.5 L74.0,168.8 L80.0,161.2 L86.0,153.6 L92.0,146.2 L98.0,139.0 L104.0,131.9 L110.0,125.0 L116.0,118.3 L122.0,111.8 L128.0,105.6 L134.0,99.6 L140.0,93.9 L146.0,88.5 L152.0,83.4 L158.0,78.6 L164.0,74.2 L170.0,70.1 L176.0,66.3 L182.0,63.0 L188.0,60.0 L194.0,57.3 L200.0,55.1 L206.0,53.3 L212.0,51.8 L218.0,50.8 L224.0,50.2 L230.0,50.0 L236.0,50.2 L242.0,50.8 L248.0,51.8 L254.0,53.3 L260.0,55.1 L266.0,57.3 L272.0,60.0 L278.0,63.0 L284.0,66.3 L290.0,70.1 L296.0,74.2 L302.0,78.6 L308.0,83.4 L314.0,88.5 L320.0,93.9 L326.0,99.6 L332.0,105.6 L338.0,111.8 L344.0,118.3 L350.0,125.0 L356.0,131.9 L362.0,139.0 L368.0,146.2 L374.0,153.6 L380.0,161.2 L386.0,168.8 L392.0,176.5 L398.0,184.3 L404.0,192.1 L410.0,200.0 \" stroke=\"#dc2626\" stroke-width=\"2.2\" fill=\"none\"/><line x1=\"50.0\" y1=\"200.0\" x2=\"50.0\" y2=\"205.0\" stroke=\"#1e293b\" stroke-width=\"1.4\"/><text x=\"50.0\" y=\"220.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"middle\">0° (меридиан, S)</text><line x1=\"230.0\" y1=\"200.0\" x2=\"230.0\" y2=\"205.0\" stroke=\"#1e293b\" stroke-width=\"1.4\"/><text x=\"230.0\" y=\"220.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"middle\">90° (I вертикал)</text><line x1=\"410.0\" y1=\"200.0\" x2=\"410.0\" y2=\"205.0\" stroke=\"#1e293b\" stroke-width=\"1.4\"/><text x=\"410.0\" y=\"220.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"middle\">180° (N)</text><text x=\"42.0\" y=\"54.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"end\">1</text><text x=\"90.0\" y=\"42.0\" fill=\"#2563eb\" font-size=\"12\" text-anchor=\"start\">|∂z/∂φ| = |cos A| — для широты</text><text x=\"200.0\" y=\"80.0\" fill=\"#dc2626\" font-size=\"12\" text-anchor=\"start\">|∂z/∂t| ∝ |sin A| — для времени</text></svg><figcaption><b>Рис. 13.</b> Чувствительность зенитного расстояния: к широте — максимальна в меридиане, ко времени — в первом вертикале.</figcaption></figure>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Цель</th>\n<th>Условие</th>\n<th>Почему</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Широта x</td>\n<td>A = 0° или 180°</td>\n<td>вес cos²A = 1 максимален, sin A = 0 — ошибка времени не влияет</td>\n</tr>\n<tr class=\"even\">\n<td>Время y</td>\n<td>A = ±90°</td>\n<td>вес sin²A = 1 максимален, cos A = 0 — ошибка широты не влияет</td>\n</tr>\n<tr class=\"odd\">\n<td>Исключить ζ</td>\n<td>пары на <strong>равных z</strong> по разные стороны от зенита</td>\n<td>ζ входит в обе звезды одинаково и сокращается в разности</td>\n</tr>\n<tr class=\"even\">\n<td>Обе величины с равными весами</td>\n<td>равномерно по азимутам или пары в перпендикулярных вертикалах</td>\n<td>[ab] = [ac] = [bc] = 0, P<sub>x</sub> = P<sub>y</sub></td>\n</tr>\n<tr class=\"odd\">\n<td>Ослабить рефракцию</td>\n<td>z ≤ 50–60°, разность z в паре ≤ 5–7° (у Талькотта ≤ 20–30′)</td>\n<td>остаток рефракции растёт с z</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Для пары звёзд в одном вертикале</strong> по обе стороны от\nзенита (A₂ = A₁ + 180°) разность уравнений даёт величину, свободную от\nζ, с весом</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mi>x</mi></msub><mo>=</mo><mn>2</mn><msup><mo>cos</mo><mn>2</mn></msup><mi>A</mi><mspace width=\"1.0em\"></mspace><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mtext mathvariant=\"normal\">широта</mtext><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>P</mi><mi>y</mi></msub><mo>=</mo><mn>2</mn><msup><mo>sin</mo><mn>2</mn></msup><mi>A</mi><mspace width=\"1.0em\"></mspace><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mtext mathvariant=\"normal\">время</mtext><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">P_x = 2\\cos^2 A \\quad(\\text{широта}),\\qquad P_y = 2\\sin^2 A \\quad(\\text{время}).</annotation></semantics></math></p>\n<p>Например, в способе Цингера при азимуте пары A<sub>w</sub> вес\nP<sub>y</sub> = 2·sin²A<sub>w</sub>: при 90° — 2,0, при 60° — 1,5, при\n50° — 1,18 (Уралов, табл. 42). Поэтому пары Цингера выбирают в пределах\n±40° от первого вертикала, а пары Певцова — вблизи меридиана.</p>\n<p><strong>Для времени</strong> добавляется: ошибка момента в дуге равна\n15·cos φ·Δu, т. е. при той же ошибке z ошибка времени растёт как\n<strong>sec φ</strong>.</p>\n<p><strong>Для азимута</strong> (азимутальные способы): близполюсная\nзвезда (Полярная), z не слишком малое (в высоких широтах — звёзды у\nгоризонта).</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> Широта — меридиан, время — первый вертикал,\nпары — на равных z, совместно — по кругу азимутов. Вес пары: 2cos²A для\nφ, 2sin²A для времени.</p>\n</div>\n<p><span class=\"src\">Уралов, § 2, 38, с. 9–14, 177–183</span></p>"}, {"n": 19, "title": "Классификация зенитальных способов", "block": 3, "short": "<p>Зенитальные способы делят: (1) <strong>по\nизмеряемой величине</strong> — измерение z по вертикальному кругу;\nизмерение <strong>малой разности</strong> z окулярным микрометром;\nнаблюдение моментов прохождения звёзд через <strong>один\nальмукантарат</strong> (равные высоты); (2) <strong>по определяемым\nвеличинам</strong> — совместно φ и λ; только φ; только время/λ; (3)\n<strong>по числу звёзд</strong> — серии из n звёзд, пары звёзд,\nмногократные наблюдения одиночных светил.</p>", "key": "<p>Три признака: что измеряем (z / разность z\n/ моменты на равных z), что определяем (φ+λ / φ / λ), сколько звёзд (n /\nпары / одно светило).</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Зенитальные способы делят: (1) <strong>по\nизмеряемой величине</strong> — измерение z по вертикальному кругу;\nизмерение <strong>малой разности</strong> z окулярным микрометром;\nнаблюдение моментов прохождения звёзд через <strong>один\nальмукантарат</strong> (равные высоты); (2) <strong>по определяемым\nвеличинам</strong> — совместно φ и λ; только φ; только время/λ; (3)\n<strong>по числу звёзд</strong> — серии из n звёзд, пары звёзд,\nмногократные наблюдения одиночных светил.</p>\n</div>\n<h3 id=\"теория-18\">Теория</h3>\n<p><strong>Две большие группы по технике измерений</strong> (Уралов, §\n39):</p>\n<ol type=\"1\">\n<li><strong>Измеряют z</strong> (по кругу или малую разность z\nмикрометром) — способы Сомнера, Струве, Талькотта, по Полярной, по\nСолнцу.</li>\n<li><strong>Измеряют моменты</strong>, когда звёзды достигают одного и\nтого же (заранее установленного, «эфемеридного») z — способы равных\nвысот: Певцова, Цингера, Мазаева, призменная астролябия. Само z точно\nзнать не нужно: поправка к установочному z находится из обработки так\nже, как ζ в первой группе.</li>\n</ol>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Совместно φ, λ</th>\n<th>Широта</th>\n<th>Время (долгота)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Серии n звёзд</strong></td>\n<td>Сомнер–Акимов; равных высот (Гаусс–Мазаев)</td>\n<td>—</td>\n<td>—</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Пары звёзд</strong></td>\n<td>—</td>\n<td>Струве (меридиан, круг); <strong>Талькотт</strong> (меридиан,\nмикрометр); <strong>Певцов</strong> (равные высоты у меридиана)</td>\n<td><strong>Цингер</strong> (равные высоты у I вертикала)</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Одиночные светила, многократно</strong></td>\n<td>—</td>\n<td>по Полярной; по Солнцу (полуденная, околомеридианные z)</td>\n<td>по z Солнца; по z звезды у I вертикала</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Признаки качества способа:</strong> исключение\nсистематических ошибок (рефракция, гнутие, личная ошибка) за счёт\nсимметрии; простота наблюдений и вычислений; потребность в точных\nэфемеридах; производительность (пар в час).</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> Три признака: что измеряем (z / разность z\n/ моменты на равных z), что определяем (φ+λ / φ / λ), сколько звёзд (n /\nпары / одно светило).</p>\n</div>\n<p><span class=\"src\">Уралов, § 39, табл. 14, с. 183–185</span></p>"}, {"n": 20, "title": "Лично-инструментальная разность (уравнение) наблюдателя", "block": 3, "short": "<p><strong>Лично-инструментальное\nуравнение</strong> ΔT — постоянная составляющая погрешности, с которой\nданный наблюдатель с данным прибором фиксирует моменты прохождения\nсветил. При «глаз-ухо» достигает 0,5ˢ (редко 0,8ˢ). Оно сдвигает все\nмоменты одинаково и поэтому входит в долготу <strong>целиком</strong>:\nΔλ = −ΔT. Его определяют как <strong>лично-инструментальную\nразность</strong> — разность точной и наблюдённой долготы основного\n(фундаментального) пункта до и после сезона: Δλ = λ<sub>осн</sub> −\nλ′<sub>набл</sub>. Контактный микрометр уменьшает его до сотых секунды и\nделает стабильным.</p>", "key": "<p>ΔT до 0,5ˢ («глаз-ухо»); в широте\nисключается симметрией, в долготу входит целиком: Δλ = −ΔT. Определяют\nна основном пункте до и после сезона. Контактный микрометр — сотые доли\nсекунды.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> <strong>Лично-инструментальное\nуравнение</strong> ΔT — постоянная составляющая погрешности, с которой\nданный наблюдатель с данным прибором фиксирует моменты прохождения\nсветил. При «глаз-ухо» достигает 0,5ˢ (редко 0,8ˢ). Оно сдвигает все\nмоменты одинаково и поэтому входит в долготу <strong>целиком</strong>:\nΔλ = −ΔT. Его определяют как <strong>лично-инструментальную\nразность</strong> — разность точной и наблюдённой долготы основного\n(фундаментального) пункта до и после сезона: Δλ = λ<sub>осн</sub> −\nλ′<sub>набл</sub>. Контактный микром
