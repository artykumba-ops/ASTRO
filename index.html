етр уменьшает его до сотых секунды и\nделает стабильным.</p>\n</div>\n<h3 id=\"теория-19\">Теория</h3>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 480 150\" style=\"max-width:460px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><line x1=\"30.0\" y1=\"80.0\" x2=\"450.0\" y2=\"80.0\" stroke=\"#1e293b\" stroke-width=\"1.4\" marker-end=\"url(#ar)\"/><text x=\"445.0\" y=\"100.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"middle\">время</text><line x1=\"170.0\" y1=\"60.0\" x2=\"170.0\" y2=\"100.0\" stroke=\"#059669\" stroke-width=\"2.4\"/><text x=\"170.0\" y=\"50.0\" fill=\"#059669\" font-size=\"11\" text-anchor=\"middle\">истинный момент</text><line x1=\"290.0\" y1=\"60.0\" x2=\"290.0\" y2=\"100.0\" stroke=\"#dc2626\" stroke-width=\"2.4\"/><text x=\"290.0\" y=\"50.0\" fill=\"#dc2626\" font-size=\"11\" text-anchor=\"middle\">зарегистрированный</text><line x1=\"172.0\" y1=\"120.0\" x2=\"288.0\" y2=\"120.0\" stroke=\"#1e293b\" stroke-width=\"1.4\" marker-end=\"url(#ar)\" marker-start=\"url(#ar)\"/><text x=\"230.0\" y=\"140.0\" fill=\"#1e293b\" font-size=\"12\" text-anchor=\"middle\">ΔT — лично-инструментальное уравнение</text></svg><figcaption><b>Рис. 14.</b> Наблюдатель систематически запаздывает (или опережает) на ΔT. В долготу это входит целиком: Δλ = −ΔT.</figcaption></figure>\n<p><strong>Откуда берётся.</strong> Наблюдатель слышит удары хронометра\nи оценивает на глаз момент пересечения звездой нити. Реакция глаза,\nслуха, мозга, а также яркость звезды, толщина нитей, увеличение трубы\nсоздают <strong>систематическое</strong> запаздывание (или опережение).\nУ неподвижных предметов такой ошибки нет (или она исключается в разности\nнаправлений), а у движущихся звёзд она привязана ко времени.</p>\n<p><strong>Влияние на уравнения поправок</strong> (Уралов, § 40.5).\nОшибка момента ΔT меняет свободный член:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>δ</mi><msub><mi>l</mi><mi>i</mi></msub><mo>=</mo><mn>15</mn><mspace width=\"0.167em\"></mspace><mi>Δ</mi><mi>T</mi><mo>cos</mo><mi>φ</mi><mo>sin</mo><msub><mi>A</mi><mi>i</mi></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\delta l_i = 15\\,\\Delta T\\cos\\varphi\\sin A_i .</annotation></semantics></math></p>\n<p>Решая нормальные уравнения для этих «поправок», получаем:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Δ</mi><mi>ζ</mi><mo>=</mo><mn>15</mn><mi>Δ</mi><mi>T</mi><mo>cos</mo><mi>φ</mi><mspace width=\"0.167em\"></mspace><mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mo>sin</mo><msub><mi>A</mi><mi>i</mi></msub><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mi>n</mi></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>Δ</mi><mi>x</mi><mo>=</mo><mo>−</mo><mn>15</mn><mi>Δ</mi><mi>T</mi><mo>cos</mo><mi>φ</mi><mspace width=\"0.167em\"></mspace><mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mo>sin</mo><msub><mi>A</mi><mi>i</mi></msub><mo>cos</mo><msub><mi>A</mi><mi>i</mi></msub><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><msup><mo>cos</mo><mn>2</mn></msup><mi>A</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>Δ</mi><mi>y</mi><mo>=</mo><mo>−</mo><mn>15</mn><mi>Δ</mi><mi>T</mi><mo>cos</mo><mi>φ</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta\\zeta = 15\\Delta T\\cos\\varphi\\,\\frac{[\\sin A_i]}{n},\\qquad \\Delta x = -15\\Delta T\\cos\\varphi\\,\\frac{[\\sin A_i\\cos A_i]}{[\\cos^2 A]},\\qquad \\Delta y = -15\\Delta T\\cos\\varphi .</annotation></semantics></math></p>\n<p>Выводы:</p>\n<ul>\n<li><strong>на широту</strong> (Δx) и на ζ — влияние\n<strong>исключается</strong> при равномерном распределении звёзд по\nазимутам, при парах, симметричных относительно меридиана (Певцов,\nТалькотт) или первого вертикала;</li>\n<li><strong>на время/долготу</strong> (Δy) — влияние <strong>постоянно и\nне исключается</strong> никакой программой: Δλ = −ΔT.</li>\n</ul>\n<p><strong>Как учитывают.</strong> На основном пункте с точно известной\nдолготой (m<sub>λ</sub> ≤ 0,005ˢ) наблюдатель определяет долготу тем же\nприбором и методом:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Δ</mi><mi>λ</mi><mo>=</mo><msub><mi>λ</mi><mtext mathvariant=\"normal\">осн</mtext></msub><mo>−</mo><mi>λ</mi><msub><mi>′</mi><mtext mathvariant=\"normal\">набл</mtext></msub><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>λ</mi><mo>=</mo><mi>λ</mi><mi>′</mi><mo>+</mo><mi>Δ</mi><msub><mi>λ</mi><mtext mathvariant=\"normal\">ср</mtext></msub><mo>,</mo><mspace width=\"1.0em\"></mspace><mi>Δ</mi><msub><mi>λ</mi><mtext mathvariant=\"normal\">ср</mtext></msub><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>Δ</mi><msub><mi>λ</mi><mn>1</mn></msub><mo>+</mo><mi>Δ</mi><msub><mi>λ</mi><mn>2</mn></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta\\lambda = \\lambda_{\\text{осн}} - \\lambda&#39;_{\\text{набл}} ,\\qquad \\lambda = \\lambda&#39; + \\Delta\\lambda_{\\text{ср}},\\quad \\Delta\\lambda_{\\text{ср}} = \\tfrac12(\\Delta\\lambda_1 + \\Delta\\lambda_2).</annotation></semantics></math></p>\n<p>Определяют до начала и после окончания полевого сезона (иногда и в\nсередине) и берут среднее из соседних определений.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> ΔT до 0,5ˢ («глаз-ухо»); в широте\nисключается симметрией, в долготу входит целиком: Δλ = −ΔT. Определяют\nна основном пункте до и после сезона. Контактный микрометр — сотые доли\nсекунды.</p>\n</div>\n<p><span class=\"src\">Уралов, § 40.5, с. 192–195</span></p>"}, {"n": 21, "title": "Поправки z за суточную аберрацию, ширину контактов и мёртвый ход контактного микрометра", "block": 3, "short": "<p><strong>Суточная аберрация</strong> (из-за\nвращения наблюдателя вместе с Землёй со скоростью ≈ 465·cos φ м/с)\nсмещает светило к точке востока на 0,32″·cos φ·sin(σE); поправка Δz =\n−0,32″·cos φ·sin A·cos z, или в момент ΔT<sub>a</sub> = −0,021ˢ·cos z.\n<strong>Ширина контактов</strong> Ш<sub>к</sub> и <strong>мёртвый\nход</strong> M<sub>x</sub> контактного микрометра дают поправку\nΔz<sub>v</sub> = ±(±Ш<sub>к</sub> − M<sub>x</sub>)·R/2 (R — цена\nоборота): знак «+» для западных, «−» для восточных звёзд.</p>", "key": "<p>Аберрация: 0,32″·cos φ, к точке востока;\nΔT<sub>a</sub> = −0,021ˢ·cos z. Контакты: Δz = ±(±Ш<sub>к</sub> −\nM<sub>x</sub>)R/2; «+» — запад, «−» — восток.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> <strong>Суточная аберрация</strong> (из-за\nвращения наблюдателя вместе с Землёй со скоростью ≈ 465·cos φ м/с)\nсмещает светило к точке востока на 0,32″·cos φ·sin(σE); поправка Δz =\n−0,32″·cos φ·sin A·cos z, или в момент ΔT<sub>a</sub> = −0,021ˢ·cos z.\n<strong>Ширина контактов</strong> Ш<sub>к</sub> и <strong>мёртвый\nход</strong> M<sub>x</sub> контактного микрометра дают поправку\nΔz<sub>v</sub> = ±(±Ш<sub>к</sub> − M<sub>x</sub>)·R/2 (R — цена\nоборота): знак «+» для западных, «−» для восточных звёзд.</p>\n</div>\n<h3 id=\"теория-20\">Теория</h3>\n<p><strong>1. Суточная аберрация.</strong> Наблюдатель движется к точке\nвостока E (это апекс). Свет звезды приходит «наклонённым» на угол\nv/c. Постоянная суточной аберрации на широте φ равна 0,32″·cos φ.</p>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 400 290\" style=\"max-width:360px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><path d=\"M350.0,190.0 A150,150 0 0 0 50.0,190.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" fill=\"none\"/><ellipse cx=\"200.0\" cy=\"190.0\" rx=\"150.0\" ry=\"34.0\" stroke=\"#059669\" stroke-width=\"1.2\" fill=\"none\" transform=\"rotate(0 200.0 190.0)\"/><circle cx=\"200.0\" cy=\"40.0\" r=\"3.2\" fill=\"#1e293b\"/><text x=\"200.0\" y=\"32.0\" fill=\"#1e293b\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"600\">Z</text><circle cx=\"237.5\" cy=\"223.0\" r=\"3.2\" fill=\"#1e293b\"/><text x=\"241.5\" y=\"242.0\" fill=\"#2563eb\" font-size=\"12\" text-anchor=\"middle\">E — апекс</text><polygon points=\"120.0,84.0 121.6,87.8 125.7,88.1 122.6,90.8 123.5,94.9 120.0,92.7 116.5,94.9 117.4,90.8 114.3,88.1 118.4,87.8\" fill=\"#dc2626\"/><text x=\"106.0\" y=\"82.0\" fill=\"#dc2626\" font-size=\"14\" text-anchor=\"middle\">σ</text><path d=\"M120,90 Q208.75,116.5 237.5,223\" stroke=\"#2563eb\" stroke-width=\"1\" fill=\"none\" stroke-dasharray=\"4 3\"/><line x1=\"120.0\" y1=\"90.0\" x2=\"146.0\" y2=\"106.0\" stroke=\"#dc2626\" stroke-width=\"2.2\" marker-end=\"url(#arr)\"/><text x=\"150.0\" y=\"94.0\" fill=\"#dc2626\" font-size=\"11\" text-anchor=\"start\">σσ′</text><text x=\"200.0\" y=\"270.0\" fill=\"#1e293b\" font-size=\"12\" text-anchor=\"middle\" font-style=\"italic\">σσ′ = 0,32″·cos φ·sin(σE)</text></svg><figcaption><b>Рис. 15.</b> Суточная аберрация смещает светило к точке востока E на 0,32″·cos φ·sin(σE).</figcaption></figure>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>σ</mi><mi>σ</mi><mi>′</mi><mo>=</mo><mn>0,32</mn><mi>″</mi><mo>cos</mo><mi>φ</mi><mspace width=\"0.167em\"></mspace><mo>sin</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>σ</mi><mi>E</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>Δ</mi><mi>z</mi><mo>=</mo><mo>−</mo><mn>0,32</mn><mi>″</mi><mo>cos</mo><mi>φ</mi><mspace width=\"0.167em\"></mspace><mo>sin</mo><mi>A</mi><mspace width=\"0.167em\"></mspace><mo>cos</mo><mi>z</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\sigma\\sigma&#39; = 0{,}32&#39;&#39;\\cos\\varphi\\,\\sin(\\sigma E),\\qquad \\Delta z = -0{,}32&#39;&#39;\\cos\\varphi\\,\\sin A\\,\\cos z .</annotation></semantics></math></p>\n<p>Поправка максимальна в первом вертикале и равна нулю в меридиане\n(поэтому для Талькотта и Певцова мала, а для Цингера существенна).\nУдобнее вводить в момент:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Δ</mi><msub><mi>T</mi><mi>a</mi></msub><mo>=</mo><mfrac><mrow><mi>Δ</mi><mi>z</mi></mrow><mrow><mn>15</mn><mo>cos</mo><mi>φ</mi><mo>sin</mo><mi>A</mi></mrow></mfrac><mo>=</mo><mo>−</mo><mn>0</mn><mo>,</mo><msup><mn>021</mn><mi>s</mi></msup><mo>cos</mo><mi>z</mi><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\\Delta T_a = \\frac{\\Delta z}{15\\cos\\varphi\\sin A} = -0{,}021^{s}\\cos z ,</annotation></semantics></math></p>\n<p>её <strong>всегда вычитают</strong> из наблюдённых моментов\n(T<sub>н</sub> + ΔT<sub>a</sub>), либо исправляют поправку часов:\nΔu<sub>a</sub> = +0,021ˢ·cos z.</p>\n<p><strong>2. Контактный микрометр.</strong> Отметка на ленте появляется\nне тогда, когда нить в «идеальной» точке, а в момент замыкания (начало\nконтакта) или размыкания (конец контакта) — сдвиг на половину ширины\nконтакта. Кроме того, при вращении винта есть <strong>мёртвый\nход</strong> — люфт: нить начинает двигаться не сразу. Ширину контактов\nопределяют на каждом пункте, мёртвый ход — каждый вечер.</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Δ</mi><msub><mi>z</mi><mi>v</mi></msub><mo>=</mo><mo>±</mo><mfrac><mrow><mo>±</mo><msub><mi>Ш</mi><mi>к</mi></msub><mo>−</mo><msub><mi>M</mi><mi>x</mi></msub></mrow><mn>2</mn></mfrac><mspace width=\"0.167em\"></mspace><mi>R</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta z_v = \\pm\\frac{\\pm Ш_к - M_x}{2}\\,R .</annotation></semantics></math></p>\n<ul>\n<li>знак при Ш<sub>к</sub>: «+», если рабочая отметка — в момент\n<strong>размыкания</strong>; «−» — при <strong>замыкании</strong>;</li>\n<li>знак всей поправки: «+» для <strong>западных</strong> звёзд, «−» для\n<strong>восточных</strong> (они движутся в разные стороны относительно\nнити).</li>\n</ul>\n<p>Эти поправки важны в способах на равных высотах (Цингер, Певцов), где\nизмеряются моменты.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> Аберрация: 0,32″·cos φ, к точке востока;\nΔT<sub>a</sub> = −0,021ˢ·cos z. Контакты: Δz = ±(±Ш<sub>к</sub> −\nM<sub>x</sub>)R/2; «+» — запад, «−» — восток.</p>\n</div>\n<p><span class=\"src\">Уралов, § 40.1, 40.3, с. 185–186, 191</span></p>"}, {"n": 22, "title": "Способ Сомнера (Сомнера–Акимова): теория, эфемериды, методика наблюдений", "block": 4, "short": "<p>Способ Сомнера —\n<strong>совместное</strong> определение широты и долготы по измеренным\nзенитным расстояниям n светил (n ≥ 3, обычно 6–8) в <strong>разных\nвертикалах</strong>, по возможности равномерно по азимутам, на z =\n10–60°. Для каждого светила составляют уравнение поправок −ζ + cos A·x +\nsin A·y + l = v и решают по МНК. Это прямое применение общей теории\n(вопрос 16). Способ гибкий: не нужны специальные эфемериды, наблюдают\nяркие звёзды «в просветах облаков», днём — Солнце и планеты. Но он не\nисключает систематических ошибок, зависящих от z, поэтому применяется\nдля <strong>приближённых</strong> определений.</p>", "key": "<p>Сомнер = φ и λ вместе, n ≥ 3 звёзд по кругу\nазимутов, z 10–60°, уравнение −ζ + cos A·x + sin A·y + l = v. Без\nэфемерид, гибкий, но не для точных определений.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Способ Сомнера —\n<strong>совместное</strong> определение широты и долготы по измеренным\nзенитным расстояниям n светил (n ≥ 3, обычно 6–8) в <strong>разных\nвертикалах</strong>, по возможности равномерно по азимутам, на z =\n10–60°. Для каждого светила составляют уравнение поправок −ζ + cos A·x +\nsin A·y + l = v и решают по МНК. Это прямое применение общей теории\n(вопрос 16). Способ гибкий: не нужны специальные эфемериды, наблюдают\nяркие звёзды «в просветах облаков», днём — Солнце и планеты. Но он не\nисключает систематических ошибок, зависящих от z, поэтому применяется\nдля <strong>приближённых</strong> определений.</p>\n</div>\n<h3 id=\"теория-21\">Теория</h3>\n<p><strong>Идея.</strong> Каждое светило даёт линию положения. Если\nлинии направлены во все стороны (азимуты равномерно), то зенит «зажат»\nсо всех сторон, и x, y получаются с равными весами P<sub>x</sub> =\nP<sub>y</sub> = n/2.</p>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 380 310\" style=\"max-width:330px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><circle cx=\"170.0\" cy=\"160.0\" r=\"130.0\" stroke=\"#64748b\" stroke-width=\"1\" fill=\"none\"/><circle cx=\"170.0\" cy=\"160.0\" r=\"86.7\" stroke=\"#2563eb\" stroke-width=\"1\" fill=\"none\" stroke-dasharray=\"4 3\"/><circle cx=\"170.0\" cy=\"160.0\" r=\"14.4\" stroke=\"#2563eb\" stroke-width=\"1\" fill=\"none\" stroke-dasharray=\"4 3\"/><circle cx=\"170\" cy=\"160\" r=\"86.7\" fill=\"#dbeafe\" opacity=\"0.5\"/><circle cx=\"170\" cy=\"160\" r=\"14.4\" fill=\"white\"/><polygon points=\"162.5,111.3 164.1,115.1 168.2,115.5 165.0,118.2 166.0,122.2 162.5,120.0 158.9,122.2 159.9,118.2 156.8,115.5 160.9,115.1\" fill=\"#dc2626\"/><polygon points=\"203.1,106.7 204.7,110.5 208.8,110.8 205.7,113.5 206.7,117.5 203.1,115.4 199.6,117.5 200.6,113.5 197.4,110.8 201.6,110.5\" fill=\"#dc2626\"/><polygon points=\"241.1,141.5 242.7,145.3 246.8,145.6 243.7,148.3 244.7,152.3 241.1,150.2 237.6,152.3 238.6,148.3 235.4,145.6 239.5,145.3\" fill=\"#dc2626\"/><polygon points=\"205.5,178.9 207.1,182.7 211.2,183.0 208.1,185.7 209.0,189.7 205.5,187.6 202.0,189.7 202.9,185.7 199.8,183.0 203.9,182.7\" fill=\"#dc2626\"/><polygon points=\"180.0,210.9 181.6,214.7 185.7,215.0 182.6,217.7 183.6,221.8 180.0,219.6 176.5,221.8 177.5,217.7 174.3,215.0 178.4,214.7\" fill=\"#dc2626\"/><polygon points=\"128.6,213.2 130.2,217.0 134.3,217.3 131.1,220.0 132.1,224.0 128.6,221.9 125.0,224.0 126.0,220.0 122.9,217.3 127.0,217.0\" fill=\"#dc2626\"/><polygon points=\"127.3,161.5 128.9,165.3 133.0,165.7 129.9,168.4 130.9,172.4 127.3,170.2 123.8,172.4 124.8,168.4 121.6,165.7 125.7,165.3\" fill=\"#dc2626\"/><polygon points=\"122.7,120.9 124.3,124.7 128.4,125.0 125.2,127.7 126.2,131.7 122.7,129.6 119.1,131.7 120.1,127.7 117.0,125.0 121.1,124.7\" fill=\"#dc2626\"/><circle cx=\"170.0\" cy=\"160.0\" r=\"3.2\" fill=\"#1e293b\"/><text x=\"180.0\" y=\"156.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">Z</text><text x=\"170.0\" y=\"22.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">N</text><text x=\"170.0\" y=\"310.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">S</text><text x=\"312.0\" y=\"165.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">E</text><text x=\"28.0\" y=\"165.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">W</text><text x=\"320.0\" y=\"280.0\" fill=\"#2563eb\" font-size=\"11\" text-anchor=\"start\">зона z = 10°…60°</text></svg><figcaption><b>Рис. 16.</b> Программа Сомнера: 6–8 ярких звёзд, равномерно по азимутам, на z = 10°–60° (проекция на горизонт).</figcaption></figure>\n<p><strong>История.</strong> В мореходной астрономии способ известен по\nимени английского капитана Т. Самнера (Сомнера), предложившего в 1843 г.\nграфическую обработку высот Солнца на карте Меркатора (линии положения).\nРусский моряк <strong>Акимов</strong> решил эту задачу раньше — в 1839\nг. Отсюда «Сомнера–Акимова».</p>\n<p><strong>Эфемериды.</strong> Ночью специальные эфемериды не нужны —\nвыбирают яркие звёзды визуально. Для удобства опознавания заранее\nвычисляют приближённые z и A ярких звёзд на время наблюдений (на сетке\nазимутов через 45–60°). Днём — эфемериды ярких звёзд, Солнца,\nпланет.</p>\n<p><strong>Методика наблюдений</strong> (Уралов, § 42.2):</p>\n<ol type=\"1\">\n<li>Приём радиосигналов времени 1-й радиостанции.</li>\n<li>Измерение z 6–8 светил (одна серия).</li>\n<li>Приём радиосигналов 2-й радиостанции.</li>\n</ol>\n<p>Теодолит горизонтируют и <strong>ориентируют в меридиане</strong>.\nМожно наблюдать при <strong>одном круге</strong> (быстрее, но место\nзенита — неизвестное ζ) или при двух (точнее на звезду, но дольше) — по\nитоговой точности они практически равноценны. На каждую звезду при КЛ:\nнаведение; отсчёт уровня при вертикальном круге; моменты прохождения\nчерез <strong>три средние горизонтальные нити</strong>; снова уровень;\nотсчёт вертикального круга; отсчёт горизонтального круга до 0,1° (для\nопознавания звезды и коэффициентов cos A, sin A). Вблизи меридиана — три\nнаведения средней нитью под счёт ударов хронометра. Солнце — наведения\nна верхний и нижний края.</p>\n<p>Температуру и давление записывают в начале, середине и конце серии.\nОбычно 2–3 серии по 6–8 звёзд.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> Сомнер = φ и λ вместе, n ≥ 3 звёзд по кругу\nазимутов, z 10–60°, уравнение −ζ + cos A·x + sin A·y + l = v. Без\nэфемерид, гибкий, но не для точных определений.</p>\n</div>\n<p><span class=\"src\">Уралов, § 42, с. 205–209</span></p>"}, {"n": 23, "title": "Способ Сомнера: обработка, уравнивание, оценка точности", "block": 4, "short": "<p>Обработка: (1) приёмы радиосигналов →\nu<sub>0</sub> на средний момент и ход ω; (2) журнал → средний момент\nT<sub>н</sub>, наклон по уровню, отсчёт круга, рефракция, гнутие,\nz<sub>изм</sub>; (3) вычисление t<sub>0</sub> и z<sub>выч</sub> с\nпредварительными φ<sub>0</sub>, u<sub>0</sub>, свободные члены l =\nz<sub>выч</sub> − z<sub>изм</sub> (при двух кругах — с поправкой за\nускорение); (4) решение системы −ζ + cos A·x + sin A·y + l = v по МНК\n(или графически); (5) φ = φ<sub>0</sub> + x, λ = λ<sub>0</sub> +\n(y/15)·sec φ; (6) μ = √([vv]/(n − 3)), m<sub>x</sub> = μ/√P<sub>x</sub>,\nm<sub>y</sub> = μ/√P<sub>y</sub>.</p>", "key": "<p>3 неизвестных (ζ, x, y) → μ с n − 3\nстепенями свободы. 6 звёзд — около 1″ по φ. Главный недостаток —\nнеисключённая систематика по z.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Обработка: (1) приёмы радиосигналов →\nu<sub>0</sub> на средний момент и ход ω; (2) журнал → средний момент\nT<sub>н</sub>, наклон по уровню, отсчёт круга, рефракция, гнутие,\nz<sub>изм</sub>; (3) вычисление t<sub>0</sub> и z<sub>выч</sub> с\nпредварительными φ<sub>0</sub>, u<sub>0</sub>, свободные члены l =\nz<sub>выч</sub> − z<sub>изм</sub> (при двух кругах — с поправкой за\nускорение); (4) решение системы −ζ + cos A·x + sin A·y + l = v по МНК\n(или графически); (5) φ = φ<sub>0</sub> + x, λ = λ<sub>0</sub> +\n(y/15)·sec φ; (6) μ = √([vv]/(n − 3)), m<sub>x</sub> = μ/√P<sub>x</sub>,\nm<sub>y</sub> = μ/√P<sub>y</sub>.</p>\n</div>\n<h3 id=\"теория-22\">Теория</h3>\n<p><strong>Вычисление z<sub>изм</sub></strong> (вопрос 14):</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>z</mi><mtext mathvariant=\"normal\">изм</mtext></msub><mo>=</mo><mi>L</mi><mo>−</mo><mi>M</mi><msub><mi>Z</mi><mn>0</mn></msub><mo>+</mo><mi>ρ</mi><mo>+</mo><mi>g</mi><mo>sin</mo><mi>z</mi><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>ρ</mi><mo>=</mo><msub><mi>ρ</mi><mn>0</mn></msub><mi>γ</mi><mi>B</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">z_{\\text{изм}} = L - MZ_0 + \\rho + g\\sin z,\\qquad \\rho = \\rho_0\\gamma B .</annotation></semantics></math></p>\n<p><strong>Часовой угол и z<sub>выч</sub>:</strong></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>t</mi><mn>0</mn></msub><mo>=</mo><msub><mi>T</mi><mtext mathvariant=\"normal\">н</mtext></msub><mo>+</mo><mi>Δ</mi><msub><mi>T</mi><mi>a</mi></msub><mo>+</mo><msub><mi>u</mi><mn>0</mn></msub><mo>+</mo><mi>ω</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>T</mi><mtext mathvariant=\"normal\">н</mtext></msub><mo>−</mo><mi>X</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>−</mo><mi>α</mi><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>Δ</mi><msub><mi>T</mi><mi>a</mi></msub><mo>=</mo><mo>−</mo><mn>0</mn><mo>,</mo><msup><mn>021</mn><mi>s</mi></msup><mo>cos</mo><mi>z</mi><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">t_0 = T_{\\text{н}} + \\Delta T_a + u_0 + \\omega(T_{\\text{н}} - X) - \\alpha,\\qquad \\Delta T_a = -0{,}021^{s}\\cos z ,</annotation></semantics></math></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>cos</mo><msub><mi>z</mi><mtext mathvariant=\"normal\">выч</mtext></msub><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mo minsize=\"1.2\" maxsize=\"1.2\" stretchy=\"false\" form=\"prefix\">[</mo><mo>cos</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>φ</mi><mn>0</mn></msub><mo>−</mo><mi>δ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>1</mn><mo>+</mo><mo>cos</mo><msub><mi>t</mi><mn>0</mn></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>−</mo><mo>cos</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>φ</mi><mn>0</mn></msub><mo>+</mo><mi>δ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>1</mn><mo>−</mo><mo>cos</mo><msub><mi>t</mi><mn>0</mn></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo minsize=\"1.2\" maxsize=\"1.2\" stretchy=\"false\" form=\"postfix\">]</mo><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\cos z_{\\text{выч}} = \\tfrac12\\big[\\cos(\\varphi_0 - \\delta)(1+\\cos t_0) - \\cos(\\varphi_0+\\delta)(1-\\cos t_0)\\big].</annotation></semantics></math></p>\n<p>(Вторая форма удобна для ручного счёта — без двойного\nпроизведения.)</p>\n<p><strong>Уравнения поправок</strong> для каждой звезды: a = −1, b =\ncos A, c = sin A (A от юга), l = z<sub>выч</sub> − z<sub>изм</sub>.</p>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 460 340\" style=\"max-width:420px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><line x1=\"230.0\" y1=\"320.0\" x2=\"230.0\" y2=\"20.0\" stroke=\"#64748b\" stroke-width=\"1\" marker-end=\"url(#ar)\"/><text x=\"242.0\" y=\"30.0\" fill=\"#64748b\" font-size=\"11\" text-anchor=\"start\">x (к N)</text><line x1=\"30.0\" y1=\"170.0\" x2=\"430.0\" y2=\"170.0\" stroke=\"#64748b\" stroke-width=\"1\" marker-end=\"url(#ar)\"/><text x=\"420.0\" y=\"188.0\" fill=\"#64748b\" font-size=\"11\" text-anchor=\"middle\">y (к E)</text><line x1=\"100.0\" y1=\"148.0\" x2=\"360.0\" y2=\"148.0\" stroke=\"#2563eb\" stroke-width=\"1.8\"/><line x1=\"230.0\" y1=\"170.0\" x2=\"230.0\" y2=\"50.0\" stroke=\"#2563eb\" stroke-width=\"0.8\" stroke-dasharray=\"3 3\"/><text x=\"230.0\" y=\"40.0\" fill=\"#2563eb\" font-size=\"11\" text-anchor=\"middle\" font-style=\"italic\">A1</text><line x1=\"128.7\" y1=\"87.4\" x2=\"312.6\" y2=\"271.3\" stroke=\"#dc2626\" stroke-width=\"1.8\"/><line x1=\"230.0\" y1=\"170.0\" x2=\"314.9\" y2=\"85.1\" stroke=\"#dc2626\" stroke-width=\"0.8\" stroke-dasharray=\"3 3\"/><text x=\"324.8\" y=\"79.2\" fill=\"#dc2626\" font-size=\"11\" text-anchor=\"middle\" font-style=\"italic\">A2</text><line x1=\"247.6\" y1=\"40.0\" x2=\"247.6\" y2=\"300.0\" stroke=\"#059669\" stroke-width=\"1.8\"/><line x1=\"230.0\" y1=\"170.0\" x2=\"350.0\" y2=\"170.0\" stroke=\"#059669\" stroke-width=\"0.8\" stroke-dasharray=\"3 3\"/><text x=\"364.0\" y=\"174.0\" fill=\"#059669\" font-size=\"11\" text-anchor=\"middle\" font-style=\"italic\">A3</text><line x1=\"307.9\" y1=\"64.1\" x2=\"124.1\" y2=\"247.9\" stroke=\"#d97706\" stroke-width=\"1.8\"/><line x1=\"230.0\" y1=\"170.0\" x2=\"314.9\" y2=\"254.9\" stroke=\"#d97706\" stroke-width=\"0.8\" stroke-dasharray=\"3 3\"/><text x=\"324.8\" y=\"268.8\" fill=\"#d97706\" font-size=\"11\" text-anchor=\"middle\" font-style=\"italic\">A4</text><line x1=\"360.0\" y1=\"154.6\" x2=\"100.0\" y2=\"154.6\" stroke=\"#7c3aed\" stroke-width=\"1.8\"/><line x1=\"230.0\" y1=\"170.0\" x2=\"230.0\" y2=\"290.0\" stroke=\"#7c3aed\" stroke-width=\"0.8\" stroke-dasharray=\"3 3\"/><text x=\"230.0\" y=\"308.0\" fill=\"#7c3aed\" font-size=\"11\" text-anchor=\"middle\" font-style=\"italic\">A5</text><line x1=\"314.1\" y1=\"269.7\" x2=\"130.3\" y2=\"85.9\" stroke=\"#0891b2\" stroke-width=\"1.8\"/><line x1=\"230.0\" y1=\"170.0\" x2=\"145.1\" y2=\"254.9\" stroke=\"#0891b2\" stroke-width=\"0.8\" stroke-dasharray=\"3 3\"/><text x=\"135.2\" y=\"268.8\" fill=\"#0891b2\" font-size=\"11\" text-anchor=\"middle\" font-style=\"italic\">A6</text><line x1=\"247.6\" y1=\"300.0\" x2=\"247.6\" y2=\"40.0\" stroke=\"#be185d\" stroke-width=\"1.8\"/><line x1=\"230.0\" y1=\"170.0\" x2=\"110.0\" y2=\"170.0\" stroke=\"#be185d\" stroke-width=\"0.8\" stroke-dasharray=\"3 3\"/><text x=\"96.0\" y=\"174.0\" fill=\"#be185d\" font-size=\"11\" text-anchor=\"middle\" font-style=\"italic\">A7</text><line x1=\"128.7\" y1=\"252.6\" x2=\"312.6\" y2=\"68.7\" stroke=\"#4d7c0f\" stroke-width=\"1.8\"/><line x1=\"230.0\" y1=\"170.0\" x2=\"145.1\" y2=\"85.1\" stroke=\"#4d7c0f\" stroke-width=\"0.8\" stroke-dasharray=\"3 3\"/><text x=\"135.2\" y=\"79.2\" fill=\"#4d7c0f\" font-size=\"11\" text-anchor=\"middle\" font-style=\"italic\">A8</text><circle cx=\"230.0\" cy=\"170.0\" r=\"4\" fill=\"#1e293b\"/><text x=\"216.0\" y=\"162.0\" fill=\"#1e293b\" font-size=\"12\" text-anchor=\"middle\">Z₀</text><circle cx=\"234.0\" cy=\"164.0\" r=\"4\" fill=\"#dc2626\"/><text x=\"248.0\" y=\"156.0\" fill=\"#dc2626\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">Z</text></svg><figcaption><b>Рис. 17.</b> Способ Сомнера: 6–8 звёзд равномерно по азимутам — линии положения окружают зенит со всех сторон, и x, y получаются с равными весами.</figcaption></figure>\n<p><strong>Решение.</strong> Нормальные уравнения (вопрос 17) или\nграфически — линии положения в крупном масштабе. При равномерном\nраспределении по азимутам неизвестные практически независимы.</p>\n<p><strong>Результат:</strong> φ = φ<sub>0</sub> + x; λ = λ<sub>0</sub>\n+ (y/15)·sec φ; при необходимости поправка часов u = u<sub>0</sub> +\n(y/15)·sec φ. Если вместо φ<sub>0</sub>, λ<sub>0</sub> взяты\nгеодезические B, L, то сразу получаются ξ и η.</p>\n<p><strong>Оценка точности:</strong></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi><mo>=</mo><msqrt><mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>v</mi><mi>v</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mrow><mi>n</mi><mo>−</mo><mn>3</mn></mrow></mfrac></msqrt><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>m</mi><mi>φ</mi></msub><mo>=</mo><mfrac><mi>μ</mi><msqrt><msub><mi>P</mi><mi>x</mi></msub></msqrt></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><msubsup><mi>m</mi><mi>λ</mi><mi>s</mi></msubsup><mo>=</mo><mfrac><mi>μ</mi><mrow><mn>15</mn><msqrt><msub><mi>P</mi><mi>y</mi></msub></msqrt></mrow></mfrac><mo>sec</mo><mi>φ</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\mu = \\sqrt{\\frac{[vv]}{n-3}},\\qquad m_\\varphi = \\frac{\\mu}{\\sqrt{P_x}},\\qquad m_\\lambda^{s} = \\frac{\\mu}{15\\sqrt{P_y}}\\sec\\varphi .</annotation></semantics></math></p>\n<p><strong>Пример:</strong> У5, «глаз-ухо», μ = 1,8″, n = 6,\nP<sub>x</sub> = P<sub>y</sub> = 3 → m<sub>φ</sub> = 1,0″, m<sub>λ</sub>\n= 0,07ˢ·sec φ. Это точность по внутренней сходимости; реальная хуже\nиз-за систематики (рефракция, гнутие, ошибки диаметров вертикального\nкруга), которая в этом способе <strong>не исключается</strong> (звёзды\nна разных z).</p>\n<p><strong>Место в производстве:</strong> опорные сети специального\nназначения, экспедиции, авиационная и морская астрономия, контрольные\nопределения.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> 3 неизвестных (ζ, x, y) → μ с n − 3\nстепенями свободы. 6 звёзд — около 1″ по φ. Главный недостаток —\nнеисключённая систематика по z.</p>\n</div>\n<p><span class=\"src\">Уралов, § 42.3, с. 209–218</span></p>"}, {"n": 24, "title": "Способ Талькотта: теория, составление эфемерид", "block": 4, "short": "<p>Способ Талькотта (Горребоу–Талькотта) —\nопределение <strong>широты</strong> по измеренной окулярным микрометром\n<strong>малой разности зенитных расстояний</strong> двух звёзд,\nкульминирующих к северу и к югу от зенита на почти равных z\n(|z<sub>S</sub> − z<sub>N</sub>| ≤ 20–30′). Из φ = δ<sub>S</sub> +\nz<sub>S</sub> и φ = δ<sub>N</sub> − z<sub>N</sub> получаем φ =\n½(δ<sub>S</sub> + δ<sub>N</sub>) + ½(z<sub>S</sub> − z<sub>N</sub>).\nВертикальный круг не нужен: малая разность z измеряется микрометром,\nнаклон трубы контролирует уровень Талькотта. Рефракция, гнутие, ошибки\nкруга практически исключаются. Основной способ определения широты на\nпунктах Лапласа.</p>", "key": "<p>φ = ½(δ<sub>S</sub> + δ<sub>N</sub>) +\n½(z<sub>S</sub> − z<sub>N</sub>). Δz ≤ 20′ (30′). Микрометр + уровень\nТалькотта, круг не нужен. Горребоу 1740 — Талькотт 1857.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Способ Талькотта (Горребоу–Талькотта) —\nопределение <strong>широты</strong> по измеренной окулярным микрометром\n<strong>малой разности зенитных расстояний</strong> двух звёзд,\nкульминирующих к северу и к югу от зенита на почти равных z\n(|z<sub>S</sub> − z<sub>N</sub>| ≤ 20–30′). Из φ = δ<sub>S</sub> +\nz<sub>S</sub> и φ = δ<sub>N</sub> − z<sub>N</sub> получаем φ =\n½(δ<sub>S</sub> + δ<sub>N</sub>) + ½(z<sub>S</sub> − z<sub>N</sub>).\nВертикальный круг не нужен: малая разность z измеряется микрометром,\nнаклон трубы контролирует уровень Талькотта. Рефракция, гнутие, ошибки\nкруга практически исключаются. Основной способ определения широты на\nпунктах Лапласа.</p>\n</div>\n<h3 id=\"теория-23\">Теория</h3>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 470 292\" style=\"max-width:450px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><path d=\"M420.0,262.0 A190,190 0 0 0 40.0,262.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" fill=\"none\"/><line x1=\"30.0\" y1=\"262.0\" x2=\"430.0\" y2=\"262.0\" stroke=\"#059669\" stroke-width=\"1.6\"/><text x=\"410.0\" y=\"280.0\" fill=\"#059669\" font-size=\"11\" text-anchor=\"middle\">горизонт</text><text x=\"36.0\" y=\"280.0\" fill=\"#1e293b\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"600\">N</text><text x=\"424.0\" y=\"280.0\" fill=\"#1e293b\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"600\">S</text><line x1=\"230.0\" y1=\"262.0\" x2=\"230.0\" y2=\"72.0\" stroke=\"#64748b\" stroke-width=\"1.4\" stroke-dasharray=\"3 3\"/><circle cx=\"230.0\" cy=\"72.0\" r=\"3.2\" fill=\"#1e293b\"/><text x=\"230.0\" y=\"64.0\" fill=\"#1e293b\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"600\">Z</text><line x1=\"230.0\" y1=\"262.0\" x2=\"121.0\" y2=\"106.4\" stroke=\"#2563eb\" stroke-width=\"1.2\"/><circle cx=\"121.0\" cy=\"106.4\" r=\"3.2\" fill=\"#1e293b\"/><text x=\"107.0\" y=\"102.4\" fill=\"#1e293b\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"600\">P</text><line x1=\"230.0\" y1=\"262.0\" x2=\"385.6\" y2=\"153.0\" stroke=\"#d97706\" stroke-width=\"1.2\"/><circle cx=\"385.6\" cy=\"153.0\" r=\"3.2\" fill=\"#1e293b\"/><text x=\"399.6\" y=\"153.0\" fill=\"#1e293b\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"600\">Q</text><polygon points=\"301.2,77.8 303.3,82.9 308.8,83.4 304.6,86.9 305.9,92.3 301.2,89.4 296.5,92.3 297.8,86.9 293.6,83.4 299.1,82.9\" fill=\"#dc2626\"/><text x=\"309.2\" y=\"107.8\" fill=\"#dc2626\" font-size=\"11\" text-anchor=\"start\">S-звезда</text><polygon points=\"152.7,80.4 154.8,85.5 160.3,86.0 156.1,89.5 157.4,94.9 152.7,92.0 148.0,94.9 149.3,89.5 145.1,86.0 150.6,85.5\" fill=\"#2563eb\"/><text x=\"140.7\" y=\"82.4\" fill=\"#2563eb\" font-size=\"11\" text-anchor=\"end\">N-звезда</text><path d=\"M230.0,98.0 A164,164 0 0 1 291.4,109.9\" stroke=\"#dc2626\" stroke-width=\"2\" fill=\"none\"/><text x=\"257.9\" y=\"118.7\" fill=\"#dc2626\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">z<tspan baseline-shift=\"sub\" font-size=\"9\">S</tspan></text><path d=\"M230.0,98.0 A164,164 0 0 0 163.3,112.2\" stroke=\"#2563eb\" stroke-width=\"2\" fill=\"none\"/><text x=\"199.6\" y=\"119.2\" fill=\"#2563eb\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">z<tspan baseline-shift=\"sub\" font-size=\"9\">N</tspan></text><path d=\"M397.1,145.0 A204,204 0 0 0 306.4,72.9\" stroke=\"#dc2626\" stroke-width=\"1.4\" fill=\"none\"/><text x=\"377.3\" y=\"101.3\" fill=\"#dc2626\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">δ<tspan baseline-shift=\"sub\" font-size=\"9\">S</tspan></text><path d=\"M410.2,135.8 A220,220 0 0 0 140.5,61.0\" stroke=\"#2563eb\" stroke-width=\"1.4\" fill=\"none\" stroke-dasharray=\"4 3\"/><text x=\"254.5\" y=\"29.3\" fill=\"#2563eb\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">δ<tspan baseline-shift=\"sub\" font-size=\"9\">N</tspan></text><path d=\"M230.0,212.0 A50,50 0 0 1 271.0,233.3\" stroke=\"#d97706\" stroke-width=\"1.6\" fill=\"none\"/><text x=\"260.5\" y=\"203.5\" fill=\"#d97706\" font-size=\"14\" text-anchor=\"middle\" font-style=\"italic\">φ</text></svg><figcaption><b>Рис. 18.</b> Способ Талькотта (меридиан): φ = δ<sub>S</sub> + z<sub>S</sub> = δ<sub>N</sub> − z<sub>N</sub> ⇒ φ = ½(δ<sub>S</sub> + δ<sub>N</sub>) + ½(z<sub>S</sub> − z<sub>N</sub>).</figcaption></figure>\n<p><strong>Вывод формулы.</strong> Для звезды в верхней кульминации к\nюгу от зенита φ = δ<sub>S</sub> + z<sub>S</sub>, к северу φ =\nδ<sub>N</sub> − z<sub>N</sub>. Складываем:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>φ</mi><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>δ</mi><mi>S</mi></msub><mo>+</mo><msub><mi>δ</mi><mi>N</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>+</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>z</mi><mi>S</mi></msub><mo>−</mo><msub><mi>z</mi><mi>N</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\varphi = \\tfrac12(\\delta_S + \\delta_N) + \\tfrac12(z_S - z_N) .</annotation></semantics></math></p>\n<p>Первая часть берётся из каталога (АЕ, видимые места) — точно. Вторая\n— <strong>малая</strong> величина, её и измеряют:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>z</mi><mi>S</mi></msub><mo>−</mo><msub><mi>z</mi><mi>N</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>M</mi><mi>S</mi></msub><mo>−</mo><msub><mi>M</mi><mi>N</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mspace width=\"0.167em\"></mspace><mi>R</mi><mspace width=\"0.278em\"></mspace><mo>+</mo><mspace width=\"0.278em\"></mspace><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>i</mi><mi>S</mi></msub><mo>−</mo><msub><mi>i</mi><mi>N</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mspace width=\"0.167em\"></mspace><mi>τ</mi><mspace width=\"0.278em\"></mspace><mo>+</mo><mspace width=\"0.278em\"></mspace><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>ρ</mi><mi>S</mi></msub><mo>−</mo><msub><mi>ρ</mi><mi>N</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mspace width=\"0.278em\"></mspace><mo>+</mo><mspace width=\"0.278em\"></mspace><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>k</mi><mi>S</mi></msub><mo>+</mo><msub><mi>k</mi><mi>N</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\\tfrac12(z_S - z_N) = \\tfrac12(M_S - M_N)\\,R \\;+\\; \\tfrac12(i_S - i_N)\\,\\tau \\;+\\; \\tfrac12(\\rho_S - \\rho_N) \\;+\\; \\tfrac12(k_S + k_N) ,</annotation></semantics></math></p>\n<p>где M — отсчёты окулярного микрометра (знак зависит от того, растут\nли отсчёты с z), R — цена оборота винта, i — отсчёты уровня Талькотта\n(разность наклонов трубы между звёздами), ρ<sub>S</sub> − ρ<sub>N</sub>\n— дифференциальная рефракция, k — редукции к меридиану (если наблюдали\nне точно в меридиане).</p>\n<p><strong>Почему точно:</strong></p>\n<ul>\n<li>z почти равны → рефракция, гнутие, место зенита входят в обе звезды\nодинаково и <strong>вычитаются</strong>; разность рефракции мала:\n½(ρ<sub>S</sub> − ρ<sub>N</sub>) = 0,0175″·(ΔM·R/60)·sec²z;</li>\n<li>время почти не влияет — звёзды в меридиане (∂z/∂t = 0);</li>\n<li>от вертикального круга ничего не требуется.</li>\n</ul>\n<p><strong>Недостатки:</strong> работа винтом микрометра на 10–12\nоборотах (систематика хода винта), изменение цены оборота R со временем\nи с температурой (до 0,2–0,3″ — поэтому R уточняют уравниванием, вопрос\n26), необходимость точного каталога склонений.</p>\n<p><strong>История.</strong> Идея — датский астроном П. Горребоу (1740);\nпрактическая разработка с зенит-телескопом и уровнем при трубе —\nамериканский геодезист А. Талькотт (1840–50-е годы, публикация\n1857).</p>\n<p><strong>Составление эфемерид.</strong> Нужно подобрать пары: одна\nзвезда к югу, другая к северу от зенита, со склонениями такими, что</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>z</mi><mi>S</mi></msub><mo>=</mo><mi>φ</mi><mo>−</mo><msub><mi>δ</mi><mi>S</mi></msub><mo>≈</mo><msub><mi>z</mi><mi>N</mi></msub><mo>=</mo><msub><mi>δ</mi><mi>N</mi></msub><mo>−</mo><mi>φ</mi><mo>,</mo><mspace width=\"2.0em\"></mspace><mrow><mo stretchy=\"true\" form=\"prefix\">|</mo><msub><mi>z</mi><mi>S</mi></msub><mo>−</mo><msub><mi>z</mi><mi>N</mi></msub><mo stretchy=\"true\" form=\"postfix\">|</mo></mrow><mo>≤</mo><mn>20</mn><mtext mathvariant=\"normal\">–</mtext><mn>30</mn><mi>′</mi><mo>,</mo><mspace width=\"2.0em\"></mspace><mtext mathvariant=\"normal\">т. е.</mtext><mspace width=\"0.222em\"></mspace><mspace width=\"0.222em\"></mspace><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>δ</mi><mi>S</mi></msub><mo>+</mo><msub><mi>δ</mi><mi>N</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>≈</mo><mi>φ</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">z_S = \\varphi - \\delta_S \\approx z_N = \\delta_N - \\varphi ,\\qquad |z_S - z_N| \\le 20\\text{–}30&#39;,\\qquad \\text{т. е.}\\ \\ \\tfrac12(\\delta_S + \\delta_N) \\approx \\varphi .</annotation></semantics></math></p>\n<p>Кроме того: z пары не слишком большое (до ~45°, чтобы мала была\nрефракция), разность прямых восхождений — несколько минут (чтобы успеть\nповернуть инструмент и не ждать слишком долго), звёзды достаточно яркие.\nДля каждой пары в эфемериде дают: номера звёзд, α (моменты кульминации\nпо звёздному времени), установочное z<sub>ср</sub> = ½(z<sub>S</sub> +\nz<sub>N</sub>), какая звезда первая, Δz, звёздные величины. Существуют\nготовые рабочие эфемериды (ГАО АН СССР и ЦНИИГАиК, Д. Д. Положенцев): по\nкаталогу 2957 звёзд, 20154 пары; в среднем около 9 пар с Δz ≤ 16′ в\nчас.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> φ = ½(δ<sub>S</sub> + δ<sub>N</sub>) +\n½(z<sub>S</sub> − z<sub>N</sub>). Δz ≤ 20′ (30′). Микрометр + уровень\nТалькотта, круг не нужен. Горребоу 1740 — Талькотт 1857.</p>\n</div>\n<p><span class=\"src\">Уралов, § 44.1–3, с. 231–240</span></p>"}, {"n": 25, "title": "Способ Талькотта: методика наблюдений, место в производстве", "block": 4, "short": "<p>Наблюдения: приём сигналов времени —\nнаблюдения пар — приём сигналов. Для пары: труба на z<sub>ср</sub> пары,\nуровень Талькотта приводят на середину; первая звезда — наведения\nподвижной горизонтальной нитью микрометра (в малых часовых углах под\nсчёт хронометра или на постоянных вертикальных нитях), отсчёты\nмикрометра и уровня; затем поворот прибора на <strong>180° по азимуту\nбез изменения наклона трубы</strong> и такие же наблюдения второй\nзвезды. Два равноточных метода: в <strong>произвольных малых часовых\nуглах</strong> и на <strong>постоянных вертикальных нитях</strong>. Это\nосновной способ широты на пунктах Лапласа и АГН (m<sub>φ</sub> ≤\n0,3″).</p>", "key": "<p>Труба на z<sub>ср</sub> → звезда 1\n(микрометр + уровень) → поворот на 180°, наклон не трогать → звезда 2.\nДва метода: малые часовые углы / постоянные нити. 10–12 пар (АУ) или\n16–18 (У5) для 0,3″.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Наблюдения: приём сигналов времени —\nнаблюдения пар — приём сигналов. Для пары: труба на z<sub>ср</sub> пары,\nуровень Талькотта приводят на середину; первая звезда — наведения\nподвижной горизонтальной нитью микрометра (в малых часовых углах под\nсчёт хронометра или на постоянных вертикальных нитях), отсчёты\nмикрометра и уровня; затем поворот прибора на <strong>180° по азимуту\nбез изменения наклона трубы</strong> и такие же наблюдения второй\nзвезды. Два равноточных метода: в <strong>произвольных малых часовых\nуглах</strong> и на <strong>постоянных вертикальных нитях</strong>. Это\nосновной способ широты на пунктах Лапласа и АГН (m<sub>φ</sub> ≤\n0,3″).</p>\n</div>\n<h3 id=\"теория-24\">Теория</h3>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 560 270\" style=\"max-width:520px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><circle cx=\"150.0\" cy=\"130.0\" r=\"105.0\" stroke=\"#1e293b\" stroke-width=\"1.4\" fill=\"#0f172a\"/><line x1=\"90.0\" y1=\"30.0\" x2=\"90.0\" y2=\"230.0\" stroke=\"#94a3b8\" stroke-width=\"1\"/><line x1=\"120.0\" y1=\"30.0\" x2=\"120.0\" y2=\"230.0\" stroke=\"#94a3b8\" stroke-width=\"1\"/><line x1=\"150.0\" y1=\"30.0\" x2=\"150.0\" y2=\"230.0\" stroke=\"#94a3b8\" stroke-width=\"1\"/><line x1=\"180.0\" y1=\"30.0\" x2=\"180.0\" y2=\"230.0\" stroke=\"#94a3b8\" stroke-width=\"1\"/><line x1=\"210.0\" y1=\"30.0\" x2=\"210.0\" y2=\"230.0\" stroke=\"#94a3b8\" stroke-width=\"1\"/><line x1=\"46.0\" y1=\"144.0\" x2=\"254.0\" y2=\"144.0\" stroke=\"#fbbf24\" stroke-width=\"1.8\"/><line x1=\"60.0\" y1=\"147.0\" x2=\"240.0\" y2=\"141.0\" stroke=\"#fef3c7\" stroke-width=\"0.8\" stroke-dasharray=\"3 3\"/><polygon points=\"180.0,136.0 181.9,140.5 186.7,140.8 183.0,144.0 184.1,148.7 180.0,146.2 175.9,148.7 177.0,144.0 173.3,140.8 178.1,140.5\" fill=\"#fef3c7\"/><text x=\"150.0\" y=\"258.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"middle\">подвижная горизонтальная нить микрометра</text><text x=\"390.0\" y=\"40.0\" fill=\"#1e293b\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">Порядок для пары</text><text x=\"290.0\" y=\"66.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"start\">1. Труба на z<tspan baseline-shift=\"sub\" font-size=\"8\">ср</tspan> пары, уровень Талькотта → середина</text><text x=\"290.0\" y=\"86.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"start\">2. Первая звезда (напр. S): наведения нитью,</text><text x=\"290.0\" y=\"106.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"start\">    отсчёты микрометра M<tspan baseline-shift=\"sub\" font-size=\"8\">S</tspan> и уровня</text><text x=\"290.0\" y=\"126.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"start\">3. Поворот на 180° по азимуту,</text><text x=\"290.0\" y=\"146.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"start\">    z трубы НЕ трогаем</text><text x=\"290.0\" y=\"166.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"start\">4. Вторая звезда (N): отсчёты M<tspan baseline-shift=\"sub\" font-size=\"8\">N</tspan> и уровня</text></svg><figcaption><b>Рис. 19.</b> Измерение малой разности z<sub>S</sub> − z<sub>N</sub> окулярным микрометром; наклон трубы контролирует уровень Талькотта.</figcaption></figure>\n<p><strong>Общий порядок</strong> (Уралов, § 44.4): приём радиосигналов\n1-й станции → наблюдения пар → приём 2-й станции. Поправку хронометра на\nмомент наблюдения нужно знать с ошибкой ≤ 0,1ˢ (для редукций к\nмеридиану).</p>\n<p>Рекомендуется положение, при котором <strong>головка винта микрометра\nнаправлена вверх</strong> (пружина работает правильно). Наведение всегда\nзаканчивают <strong>вращением винта в положительном направлении</strong>\n(чтобы исключить мёртвый ход).</p>\n<p><strong>Метод 1 — в произвольных малых часовых углах.</strong> За 3–4\nмин до кульминации первой звезды трубу ставят на z<sub>ср</sub> пары,\nпузырёк уровня Талькотта — на середину. Звезда входит в поле зрения;\nнаблюдатель выполняет 5–6 наведений подвижной нитью на звезду под счёт\nсекундных ударов хронометра (записывая моменты T и отсчёты микрометра\nM), до и после — отсчёты уровня. Затем поворот на 180°, вторая звезда —\nтак же. В обработке — редукция каждого наведения к меридиану и поправка\nза ускорение.</p>\n<p><strong>Метод 2 — на постоянных вертикальных нитях.</strong> Прибор\nориентирован в меридиане с ошибкой ≤ 1,5–2′. Наведение подвижной нитью\nделают <strong>в моменты пересечения звездой постоянных вертикальных\nнитей</strong> сетки. Отсчёты хронометра не нужны (наблюдения\nсимметричны относительно меридиана), но нужны поправки за наблюдения в\nстороне от бесколлимационной плоскости.</p>\n<p><strong>Программа и точность:</strong> с АУ 2″/10″ ошибка широты по\nодной паре ≈ 0,7–0,8″, поэтому для m<sub>φ</sub> = 0,3″ нужно\n<strong>10–12 пар</strong>; с теодолитом У5 — <strong>16–18\nпар</strong>. Наблюдения выполняют в разные вечера и с разными парами\n(чтобы ослабить ошибки склонений).</p>\n<p><strong>Место в производстве:</strong></p>\n<ul>\n<li>основной (рекомендуемый Инструкцией) способ определения широты на\nпунктах Лапласа 1–2 класса и пунктах линий АГН;</li>\n<li>применяется во всех странах, в службах широты\n(зенит-телескопы);</li>\n<li>простые наблюдения и несложные вычисления, высокая\nпроизводительность (около 9 пар в час по эфемеридам);</li>\n<li>вариант «вне меридиана» (удаление до 30–40°) позволяет брать яркие\nзвёзды.</li>\n</ul>\n<div class=\"key\">\n<p><strong>Запомни.</strong> Труба на z<sub>ср</sub> → звезда 1\n(микрометр + уровень) → поворот на 180°, наклон не трогать → звезда 2.\nДва метода: малые часовые углы / постоянные нити. 10–12 пар (АУ) или\n16–18 (У5) для 0,3″.</p>\n</div>\n<p><span class=\"src\">Уралов, § 44.4, с. 240–248</span></p>"}, {"n": 26, "title": "Способ Талькотта: обработка, уравнивание, оценка точности", "block": 4, "short": "<p>Для каждой пары вычисляют видимые\nсклонения, средние моменты, разности отсчётов микрометра и уровня,\nпоправки за рефракцию и редукции к меридиану и получают широту\nφ<sub>i</sub>. Поскольку цена оборота микрометра R известна неточно\n(меняется на 0,2–0,3″), выполняют <strong>совместное\nуравнивание</strong>: уравнения поправок Δφ − b<sub>i</sub>·ΔR +\nl<sub>i</sub> = v<sub>i</sub>, где b<sub>i</sub> = ½(M<sub>S</sub> −\nM<sub>N</sub>)<sub>i</sub>, l<sub>i</sub> = φ<sub>ср</sub> −\nφ<sub>i</sub>. Из МНК — окончательные φ и R, затем μ = √([vv]/(n − 2)),\nm<sub>φ</sub> = μ/√P<sub>φ</sub>.</p>", "key": "<p>Неизвестные: Δφ и ΔR. b<sub>i</sub> =\n½(M<sub>S</sub> − M<sub>N</sub>). Пары с разными знаками b — чтобы [b] ≈\n0. μ с n − 2 степенями свободы.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Для каждой пары вычисляют видимые\nсклонения, средние моменты, разности отсчётов микрометра и уровня,\nпоправки за рефракцию и редукции к меридиану и получают широту\nφ<sub>i</sub>. Поскольку цена оборота микрометра R известна неточно\n(меняется на 0,2–0,3″), выполняют <strong>совместное\nуравнивание</strong>: уравнения поправок Δφ − b<sub>i</sub>·ΔR +\nl<sub>i</sub> = v<sub>i</sub>, где b<sub>i</sub> = ½(M<sub>S</sub> −\nM<sub>N</sub>)<sub>i</sub>, l<sub>i</sub> = φ<sub>ср</sub> −\nφ<sub>i</sub>. Из МНК — окончательные φ и R, затем μ = √([vv]/(n − 2)),\nm<sub>φ</sub> = μ/√P<sub>φ</sub>.</p>\n</div>\n<h3 id=\"теория-25\">Теория</h3>\n<p><strong>1. Вычисление широты по паре</strong> (Уралов, табл.\n28–31):</p>\n<ul>\n<li>видимые склонения δ<sub>S</sub>, δ<sub>N</sub> на дату (из АЕ, с\nучётом короткопериодической нутации);</li>\n<li>средние моменты T<sub>ср</sub> звёзд и часовые углы t =\nT<sub>ср</sub> + u − α (метод малых часовых углов);</li>\n<li>z<sub>0</sub> звёзд с φ<sub>0</sub> (или сразу формула\n½(z<sub>S</sub> − z<sub>N</sub>));</li>\n<li><strong>разность наклонов</strong> i<sub>S</sub> − i<sub>N</sub> по\nотсчётам уровня Талькотта (знак — по правилам, зависящим от оцифровки\nмикрометра и положения нуля уровня);</li>\n<li>½(M<sub>S</sub> − M<sub>N</sub>)·R + ½(i<sub>S</sub> −\ni<sub>N</sub>)·τ + δρ + ½(k<sub>S</sub> + k<sub>N</sub>);</li>\n<li>x<sub>i</sub> и φ<sub>i</sub> = φ<sub>0</sub> + x<sub>i</sub>.</li>\n</ul>\n<p><strong>2. Уравнивание.</strong> Пусть R<sub>0</sub> — цена оборота\nиз исследований, φ<sub>i</sub> — широты по парам, φ<sub>ср</sub> — их\nсреднее. Ищем R = R<sub>0</sub> + ΔR и φ = φ<sub>ср</sub> + Δφ. Для\nкаждой пары</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Δ</mi><mi>φ</mi><mo>−</mo><msub><mi>b</mi><mi>i</mi></msub><mspace width=\"0.167em\"></mspace><mi>Δ</mi><mi>R</mi><mo>+</mo><msub><mi>l</mi><mi>i</mi></msub><mo>=</mo><msub><mi>v</mi><mi>i</mi></msub><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>b</mi><mi>i</mi></msub><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>M</mi><mi>S</mi></msub><mo>−</mo><msub><mi>M</mi><mi>N</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>i</mi></msub><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>l</mi><mi>i</mi></msub><mo>=</mo><msub><mi>φ</mi><mtext mathvariant=\"normal\">ср</mtext></msub><mo>−</mo><msub><mi>φ</mi><mi>i</mi></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta\\varphi - b_i\\,\\Delta R + l_i = v_i ,\\qquad b_i = \\tfrac12 (M_S - M_N)_i ,\\qquad l_i = \\varphi_{\\text{ср}} - \\varphi_i .</annotation></semantics></math></p>\n<p>Нормальные уравнения:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mspace width=\"0.167em\"></mspace><mi>Δ</mi><mi>φ</mi><mo>−</mo><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mspace width=\"0.167em\"></mspace><mi>Δ</mi><mi>R</mi><mo>=</mo><mn>0</mn><mo>,</mo><mspace width=\"2.0em\"></mspace><mo>−</mo><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mspace width=\"0.167em\"></mspace><mi>Δ</mi><mi>φ</mi><mo>+</mo><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mi>b</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mspace width=\"0.167em\"></mspace><mi>Δ</mi><mi>R</mi><mo>−</mo><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mi>l</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">n\\,\\Delta\\varphi - [b]\\,\\Delta R = 0 ,\\qquad -[b]\\,\\Delta\\varphi + [bb]\\,\\Delta R - [bl] = 0</annotation></semantics></math></p>\n<p>(<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>l</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">[l] = 0</annotation></semantics></math>\nкак сумма уклонений от среднего). Решение и веса:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Δ</mi><mo>=</mo><mi>n</mi><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mi>b</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mo>−</mo><msup><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mn>2</mn></msup><mo>,</mo><mspace width=\"1.0em\"></mspace><mi>Δ</mi><mi>R</mi><mo>=</mo><mfrac><mrow><mi>n</mi><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mi>l</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow></mrow><mi>Δ</mi></mfrac><mo>,</mo><mspace width=\"1.0em\"></mspace><mi>Δ</mi><mi>φ</mi><mo>=</mo><mfrac><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mi>l</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow></mrow><mi>Δ</mi></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>P</mi><mi>φ</mi></msub><mo>=</mo><mi>n</mi><mo>−</mo><mfrac><msup><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mn>2</mn></msup><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mi>b</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow></mfrac><mo>,</mo><mspace width=\"1.0em\"></mspace><msub><mi>P</mi><mi>R</mi></msub><mo>=</mo><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mi>b</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mo>−</mo><mfrac><msup><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mn>2</mn></msup><mi>n</mi></mfrac><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta = n[bb] - [b]^2,\\quad \\Delta R = \\frac{n[bl]}{\\Delta},\\quad \\Delta\\varphi = \\frac{[b][bl]}{\\Delta},\\qquad P_\\varphi = n - \\frac{[b]^2}{[bb]},\\quad P_R = [bb] - \\frac{[b]^2}{n} .</annotation></semantics></math></p>\n<p>Веса максимальны, если [b] = ½[(M<sub>S</sub> − M<sub>N</sub>)] ≈ 0 —\nпоэтому в программу подбирают пары с <strong>разными знаками</strong>\nM<sub>S</sub> − M<sub>N</sub>, тогда ошибка R почти не влияет на среднюю\nшироту.</p>\n<p><strong>3. Оценка точности:</strong></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi><mo>=</mo><msqrt><mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>v</mi><mi>v</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mrow><mi>n</mi><mo>−</mo><mn>2</mn></mrow></mfrac></msqrt><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>m</mi><mi>φ</mi></msub><mo>=</mo><mfrac><mi>μ</mi><msqrt><msub><mi>P</mi><mi>φ</mi></msub></msqrt></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>m</mi><mi>R</mi></msub><mo>=</mo><mfrac><mi>μ</mi><msqrt><msub><mi>P</mi><mi>R</mi></msub></msqrt></mfrac><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\mu = \\sqrt{\\frac{[vv]}{n-2}},\\qquad m_\\varphi = \\frac{\\mu}{\\sqrt{P_\\varphi}},\\qquad m_R = \\frac{\\mu}{\\sqrt{P_R}} .</annotation></semantics></math></p>\n<p>μ — ошибка широты по одной паре (≈ 0,7–0,8″ для АУ 2″/10″); при 10–12\nпарах m<sub>φ</sub> ≈ 0,25–0,3″. Затем — <strong>редукции</strong>: к\nцентру знака (вопрос 38) и к среднему полюсу (вопрос 39).</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> Неизвестные: Δφ и ΔR. b<sub>i</sub> =\n½(M<sub>S</sub> − M<sub>N</sub>). Пары с разными знаками b — чтобы [b] ≈\n0. μ с n − 2 степенями свободы.</p>\n</div>\n<p><span class=\"src\">Уралов, § 44.5–6, с. 248–256</span></p>"}, {"n": 27, "title": "Способ Цингера: теория, эфемериды, методика наблюдений", "block": 4, "short": "<p>Способ Цингера — определение\n<strong>времени (долготы)</strong> по наблюдениям <strong>пар звёзд на\nравных высотах</strong> (соответствующих высотах): одна звезда на\nвостоке, другая на западе, <strong>симметрично относительно\nмеридиана</strong> (A<sub>E</sub> = 360° − A<sub>W</sub>), вблизи\nпервого вертикала. Измеряют моменты прохождения звёзд через одни и те же\nгоризонтальные нити при <strong>неизменном наклоне трубы</strong>. В\nразности уравнений поправок пары исключаются ζ (все систематические\nошибки по z: рефракция, гнутие, место зенита) и x (ошибка широты),\nостаётся y: y = −[cl]/[cc] с весом P = 2·sin²A<sub>W</sub>. Рекомендован\nИнструкцией как основной способ определения долготы на пунктах Лапласа\nдо широты 65°.</p>", "key": "<p>E и W на одной высоте, A<sub>E</sub> = 360°\n− A<sub>W</sub>, у первого вертикала. ζ и x исключаются. y =\n(l<sub>E</sub> − l<sub>W</sub>)/(2 sin A<sub>W</sub>), P = 2\nsin²A<sub>W</sub>. ≥ 6 серий по 6–8 пар. Цингер, Пулково, 1874.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Способ Цингера — определение\n<strong>времени (долготы)</strong> по наблюдениям <strong>пар звёзд на\nравных высотах</strong> (соответствующих высотах): одна звезда на\nвостоке, другая на западе, <strong>симметрично относительно\nмеридиана</strong> (A<sub>E</sub> = 360° − A<sub>W</sub>), вблизи\nпервого вертикала. Измеряют моменты прохождения звёзд через одни и те же\nгоризонтальные нити при <strong>неизменном наклоне трубы</strong>. В\nразности уравнений поправок пары исключаются ζ (все систематические\nошибки по z: рефракция, гнутие, место зенита) и x (ошибка широты),\nостаётся y: y = −[cl]/[cc] с весом P = 2·sin²A<sub>W</sub>. Рекомендован\nИнструкцией как основной способ определения долготы на пунктах Лапласа\nдо широты 65°.</p>\n</div>\n<h3 id=\"теория-26\">Теория</h3>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 400 360\" style=\"max-width:360px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><circle cx=\"200.0\" cy=\"170.0\" r=\"140.0\" stroke=\"#64748b\" stroke-width=\"1\" fill=\"none\"/><line x1=\"200.0\" y1=\"30.0\" x2=\"200.0\" y2=\"310.0\" stroke=\"#1e293b\" stroke-width=\"1\" stroke-dasharray=\"5 3\"/><line x1=\"60.0\" y1=\"170.0\" x2=\"340.0\" y2=\"170.0\" stroke=\"#1e293b\" stroke-width=\"1\" stroke-dasharray=\"5 3\"/><text x=\"200.0\" y=\"22.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">N</text><text x=\"200.0\" y=\"328.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">S</text><text x=\"354.0\" y=\"175.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">E</text><text x=\"46.0\" y=\"175.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">W</text><circle cx=\"200.0\" cy=\"170.0\" r=\"80.0\" stroke=\"#d97706\" stroke-width=\"2\" fill=\"none\"/><text x=\"263.6\" y=\"108.4\" fill=\"#d97706\" font-size=\"11\" text-anchor=\"start\">альмукантарат z = const</text><circle cx=\"200.0\" cy=\"170.0\" r=\"3.2\" fill=\"#1e293b\"/><text x=\"210.0\" y=\"184.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">Z</text><path d=\"M330,240 Q270,180 230,100\" stroke=\"#2563eb\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#arb)\"/><path d=\"M170,100 Q130,180 70,240\" stroke=\"#dc2626\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#arr)\"/><polygon points=\"279.2,152.9 280.8,156.7 284.9,157.0 281.8,159.7 282.7,163.7 279.2,161.6 275.7,163.7 276.7,159.7 273.5,157.0 277.6,156.7\" fill=\"#2563eb\"/><polygon points=\"120.8,152.9 122.4,156.7 126.5,157.0 123.3,159.7 124.3,163.7 120.8,161.6 117.3,163.7 118.2,159.7 115.1,157.0 119.2,156.7\" fill=\"#dc2626\"/><text x=\"273.2\" y=\"198.9\" fill=\"#2563eb\" font-size=\"11\" text-anchor=\"end\">восточная</text><text x=\"126.8\" y=\"198.9\" fill=\"#dc2626\" font-size=\"11\" text-anchor=\"start\">западная</text><text x=\"200.0\" y=\"350.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"middle\">E и W — симметрично относительно меридиана</text></svg><figcaption><b>Рис. 20.</b> Способ Цингера: восточная и западная звёзды пары на одинаковой высоте вблизи первого вертикала; по моментам находят поправку часов и долготу.</figcaption></figure>\n<p><strong>Почему исключается всё лишнее.</strong> Уравнения для звёзд\nпары:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mi>ζ</mi><mo>+</mo><mo>cos</mo><msub><mi>A</mi><mi>E</mi></msub><mspace width=\"0.167em\"></mspace><mi>x</mi><mo>+</mo><mo>sin</mo><msub><mi>A</mi><mi>E</mi></msub><mspace width=\"0.167em\"></mspace><mi>y</mi><mo>+</mo><msub><mi>l</mi><mi>E</mi></msub><mo>=</mo><msub><mi>v</mi><mi>E</mi></msub><mo>,</mo><mspace width=\"2.0em\"></mspace><mo>−</mo><mi>ζ</mi><mo>+</mo><mo>cos</mo><msub><mi>A</mi><mi>W</mi></msub><mspace width=\"0.167em\"></mspace><mi>x</mi><mo>+</mo><mo>sin</mo><msub><mi>A</mi><mi>W</mi></msub><mspace width=\"0.167em\"></mspace><mi>y</mi><mo>+</mo><msub><mi>l</mi><mi>W</mi></msub><mo>=</mo><msub><mi>v</mi><mi>W</mi></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">-\\zeta + \\cos A_E\\,x + \\sin A_E\\,y + l_E = v_E ,\\qquad -\\zeta + \\cos A_W\\,x + \\sin A_W\\,y + l_W = v_W .</annotation></semantics></math></p>\n<p>При симметрии A<sub>E</sub> = 360° − A<sub>W</sub>: cos A<sub>E</sub>\n= cos A<sub>W</sub>, sin A<sub>E</sub> = −sin A<sub>W</sub>. Вычитаем —\nζ и x <strong>исчезают</strong>:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>y</mi><mi>i</mi></msub><mo>=</mo><mo>−</mo><mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>c</mi><mi>l</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>c</mi><mi>c</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mi>l</mi><mi>E</mi></msub><mo>−</mo><msub><mi>l</mi><mi>W</mi></msub></mrow><mrow><mn>2</mn><mo>sin</mo><msub><mi>A</mi><mi>W</mi></msub></mrow></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>P</mi><msub><mi>y</mi><mi>i</mi></msub></msub><mo>=</mo><mn>2</mn><msup><mo>sin</mo><mn>2</mn></msup><msub><mi>A</mi><mi>W</mi></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">y_i = -\\frac{[cl]}{[cc]} = \\frac{l_E - l_W}{2\\sin A_W},\\qquad P_{y_i} = 2\\sin^2 A_W .</annotation></semantics></math></p>\n<p>Веса по азимуту западной звезды: 50° — 1,18; 60° — 1,50; 70° — 1,77;\n80° — 1,94; 90° — 2,00 (симметрично до 130°).</p>\n<p>Для симметрии нужны <strong>равные склонения</strong> δ<sub>E</sub> =\nδ<sub>W</sub> и равные по модулю часовые углы. Точно равных δ не бывает,\nно малой разности достаточно.</p>\n<p><strong>Итог по серии:</strong> y<sub>ср</sub> =\n[P<sub>y</sub>y]/[P<sub>y</sub>], затем</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi><mi>′</mi><mo>=</mo><msub><mi>λ</mi><mn>0</mn></msub><mo>+</mo><mfrac><msub><mi>y</mi><mtext mathvariant=\"normal\">ср</mtext></msub><mn>15</mn></mfrac><mo>sec</mo><mi>φ</mi><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>u</mi><mi>′</mi><mo>=</mo><msub><mi>u</mi><mn>0</mn></msub><mo>+</mo><mfrac><msub><mi>y</mi><mtext mathvariant=\"normal\">ср</mtext></msub><mn>15</mn></mfrac><mo>sec</mo><mi>φ</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda&#39; = \\lambda_0 + \\frac{y_{\\text{ср}}}{15}\\sec\\varphi,\\qquad u&#39; = u_0 + \\frac{y_{\\text{ср}}}{15}\\sec\\varphi .</annotation></semantics></math></p>\n<p><strong>История.</strong> Идея — немецкий астроном Кёлер (1780);\nвсестороннее исследование и разработка — <strong>Н. Я. Цингер</strong>,\nадъюнкт-астроном Пулковской обсерватории (1874). Позже — Кортацци,\nВитрам, Щёткин, Долгов, Цветков (таблицы и эфемериды).</p>\n<p><strong>Эфемериды</strong> (рабочие эфемериды пар Цингера, для широт\n+30…+70°, около 2000 пар). Для пары с близкими δ решают задачу: когда\nвосточная и западная звёзды на данной широте достигнут\n<strong>одинаковой высоты</strong>, и каковы при этом z<sub>0</sub>,\nA<sub>E</sub>, A<sub>W</sub>. Поскольку одновременно наблюдать обе\nзвезды нельзя, а на пару уходит около 5 мин, эфемерида учитывает сдвиг:\nдля порядка EW и WE даётся своё s, z и азимуты по аргументу φ.\nОтклонения от симметрии азимутов в эфемеридах не превышают 3°.</p>\n<p><strong>Условия выбора пар:</strong> z от 18–20° до 50–55°, азимуты\nзападных звёзд 60–120°.</p>\n<p><strong>Методика наблюдений:</strong></p>\n<ol type=\"1\">\n<li>Приём сигналов 1-й станции → n пар → приём 2-й станции (допускается\nи схема: n′ пар — сигналы — n″ пар).</li>\n<li>Теодолит или зенит-телескоп с <strong>контактным\nмикрометром</strong>; труба на установочное z пары, уровень Талькотта на\nсередину.</li>\n<li>Первую звезду ведут подвижной нитью — хронограф пишет контакты.\nЗатем алидаду ставят по азимуту второй звезды и, <strong>не меняя\nнаклона трубы</strong>, наблюдают её так же.</li>\n<li>Порядок в парах чередуют (WE, EW, WE…); между звёздами переключают\nперья хронографа (исключение параллакса перьев).</li>\n<li>За 2 часа между сигналами — 6–8 пар. Для пункта 1 класса —\n<strong>не менее 6 серий по 6–8 пар</strong>, в разные вечера разные\nпары.</li>\n</ol>\n<p>Широту для Цингера достаточно знать до ~2″ (одна-две пары Талькотта\nили по Полярной).</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> E и W на одной высоте, A<sub>E</sub> = 360°\n− A<sub>W</sub>, у первого вертикала. ζ и x исключаются. y =\n(l<sub>E</sub> − l<sub>W</sub>)/(2 sin A<sub>W</sub>), P = 2\nsin²A<sub>W</sub>. ≥ 6 серий по 6–8 пар. Цингер, Пулково, 1874.</p>\n</div>\n<p><span class=\"src\">Уралов, § 49.1–3, с. 286–296</span></p>"}, {"n": 28, "title": "Способ Цингера: обработка, уравнивание, оценка точности", "block": 4, "short": "<p>Для каждой пары: средние моменты наблюдений\nзвёзд по контактам; поправки за суточную аберрацию, ускорение, ширину\nконтактов и мёртвый ход, наклон по уровню Талькотта, разность наклонов;\nвычисляют свободные члены и y<sub>i</sub> = −[cl]/[cc] с весом 2\nsin²A<sub>W</sub>. По серии — весовое среднее y<sub>ср</sub>, λ′ =\nλ<sub>0</sub> + (y<sub>ср</sub>/15)·sec φ. По n сериям — весовое среднее\nλ, оценка μ = √([P v²]/(n − 1)), m<sub>λ</sub> = μ/(15·√[P])·sec φ.\nЗатем поправки: лично-инструментальная разность, UT1 − UTC, нутация,\nдвижение полюса, центр знака.</p>", "key": "<p>y<sub>ср</sub> = [Py]/[P], λ′ =\nλ<sub>0</sub> + y<sub>ср</sub>·sec φ/15, μ = √([Pv²]/(n − 1)). Аберрация\nи контакты в Цингере существенны. Потом — личная разность и\nредукции.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Для каждой пары: средние моменты наблюдений\nзвёзд по контактам; поправки за суточную аберрацию, ускорение, ширину\nконтактов и мёртвый ход, наклон по уровню Талькотта, разность наклонов;\nвычисляют свободные члены и y<sub>i</sub> = −[cl]/[cc] с весом 2\nsin²A<sub>W</sub>. По серии — весовое среднее y<sub>ср</sub>, λ′ =\nλ<sub>0</sub> + (y<sub>ср</sub>/15)·sec φ. По n сериям — весовое среднее\nλ, оценка μ = √([P v²]/(n − 1)), m<sub>λ</sub> = μ/(15·√[P])·sec φ.\nЗатем поправки: лично-инструментальная разность, UT1 − UTC, нутация,\nдвижение полюса, центр знака.</p>\n</div>\n<h3 id=\"теория-27\">Теория</h3>\n<p><strong>1. Обработка журнала:</strong> средние моменты T<sub>н</sub>\nкаждой звезды по контактам; средние суммы отсчётов уровня Талькотта;\nпоправки к y:</p>\n<ul>\n<li><strong>за наклон</strong> Δy<sub>i</sub> — из-за разности отсчётов\nуровня Талькотта при наблюдении E и W звёзд (труба могла немного\nнаклониться);</li>\n<li><strong>за суточную аберрацию</strong> Δy<sub>a</sub> (в способе\nЦингера она существенна — звёзды у первого вертикала: −0,021ˢ·cos\nz);</li>\n<li><strong>за ширину контактов и мёртвый ход</strong> Δy<sub>v</sub>\n(знак противоположен у E и W звёзд — в разности удваивается, поэтому\nучитывать обязательно);</li>\n<li><strong>за ускорение</strong> — при симметрии пары почти исключается\n(cos A<sub>E</sub> − cos A<sub>W</sub> = 0);</li>\n<li>параллакс перьев хронографа исключается переключением перьев между\nзвёздами.</li>\n</ul>\n<p><strong>2. Свободные члены и y<sub>i</sub>:</strong></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>y</mi><mi>i</mi></msub><mo>=</mo><mfrac><mrow><msub><mi>l</mi><mi>E</mi></msub><mo>−</mo><msub><mi>l</mi><mi>W</mi></msub></mrow><mrow><mn>2</mn><mo>sin</mo><msub><mi>A</mi><mi>W</mi></msub></mrow></mfrac><mo>+</mo><mi>Δ</mi><msub><mi>y</mi><mi>i</mi></msub><mo>+</mo><mi>Δ</mi><msub><mi>y</mi><mi>a</mi></msub><mo>+</mo><mi>Δ</mi><msub><mi>y</mi><mi>v</mi></msub><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>P</mi><msub><mi>y</mi><mi>i</mi></msub></msub><mo>=</mo><mn>2</mn><msup><mo>sin</mo><mn>2</mn></msup><msub><mi>A</mi><mi>W</mi></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">y_i = \\frac{l_E - l_W}{2\\sin A_W} + \\Delta y_i + \\Delta y_a + \\Delta y_v ,\\qquad P_{y_i} = 2\\sin^2 A_W .</annotation></semantics></math></p>\n<p><strong>3. Серия</strong> (между двумя приёмами сигналов):</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>y</mi><mtext mathvariant=\"normal\">ср</mtext></msub><mo>=</mo><mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><msub><mi>P</mi><mi>y</mi></msub><mspace width=\"0.167em\"></mspace><mi>y</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><msub><mi>P</mi><mi>y</mi></msub><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>λ</mi><mi>′</mi><mo>=</mo><msub><mi>λ</mi><mn>0</mn></msub><mo>+</mo><mfrac><msub><mi>y</mi><mtext mathvariant=\"normal\">ср</mtext></msub><mn>15</mn></mfrac><mo>sec</mo><mi>φ</mi><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>P</mi><mrow><mi>λ</mi><mi>′</mi></mrow></msub><mo>=</mo><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><msub><mi>P</mi><mi>y</mi></msub><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><msup><mo>cos</mo><mn>2</mn></msup><mi>φ</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">y_{\\text{ср}} = \\frac{[P_y\\,y]}{[P_y]},\\qquad \\lambda&#39; = \\lambda_0 + \\frac{y_{\\text{ср}}}{15}\\sec\\varphi,\\qquad P_{\\lambda&#39;} = [P_y]\\cos^2\\varphi .</annotation></semantics></math></p>\n<p><strong>4. Оценка точности серии:</strong></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi><mo>=</mo><msqrt><mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><msub><mi>P</mi><mi>y</mi></msub><msubsup><mi>v</mi><mi>y</mi><mn>2</mn></msubsup><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow></mfrac></msqrt><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>m</mi><msub><mi>y</mi><mtext mathvariant=\"normal\">ср</mtext></msub></msub><mo>=</mo><mfrac><mi>μ</mi><msqrt><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><msub><mi>P</mi><mi>y</mi></msub><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow></msqrt></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><msubsup><mi>m</mi><mi>λ</mi><mi>s</mi></msubsup><mo>=</mo><mfrac><msub><mi>m</mi><msub><mi>y</mi><mtext mathvariant=\"normal\">ср</mtext></msub></msub><mn>15</mn></mfrac><mo>sec</mo><mi>φ</mi><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\\mu = \\sqrt{\\frac{[P_y v_y^2]}{n-1}},\\qquad m_{y_{\\text{ср}}} = \\frac{\\mu}{\\sqrt{[P_y]}},\\qquad m_\\lambda^{s} = \\frac{m_{y_{\\text{ср}}}}{15}\\sec\\varphi ,</annotation></semantics></math></p>\n<p>где n — число пар, v<sub>y</sub> = y<sub>ср</sub> −\ny<sub>i</sub>.</p>\n<p><strong>5. Окончательная долгота</strong> из N серий — весовое\nсреднее λ = [P<sub>λ</sub>λ]/[P<sub>λ</sub>] с оценкой по уклонениям\nсерий. Поправки:</p>\n<ul>\n<li>короткопериодическая нутация (если не учтена в видимых местах);</li>\n<li><strong>лично-инструментальная разность</strong> Δλ (вопрос\n20);</li>\n<li>окончательные UT1 − UTC из бюллетеней;</li>\n<li><strong>приведение к среднему полюсу</strong> (МУН) и <strong>к\nцентру знака</strong>.</li>\n</ul>\n<p><strong>Точность.</strong> Способ один из самых точных: на пару ~5\nмин, условия не успевают измениться, систематика по z исключается в\nразности. Требование Инструкции m<sub>λ</sub> ≤ 0,03ˢ.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> y<sub>ср</sub> = [Py]/[P], λ′ =\nλ<sub>0</sub> + y<sub>ср</sub>·sec φ/15, μ = √([Pv²]/(n − 1)). Аберрация\nи контакты в Цингере существенны. Потом — личная разность и\nредукции.</p>\n</div>\n<p><span class=\"src\">Уралов, § 49.4–5, с. 296–305</span></p>"}, {"n": 29, "title": "Способ Певцова: теория, эфемериды, методика наблюдений", "block": 4, "short": "<p>Способ Певцова — определение\n<strong>широты</strong> по наблюдениям <strong>пар звёзд на равных\nвысотах</strong> вблизи меридиана: северная и южная звёзды расположены\n<strong>симметрично относительно первого вертикала</strong>\n(A<sub>S</sub> = 180° − A<sub>N</sub>), т. е. по одну сторону от\nмеридиана. Измеряют моменты прохождения звёзд через одни горизонтальные\nнити при неизменном наклоне трубы. В разности уравнений пары исключаются\nζ
