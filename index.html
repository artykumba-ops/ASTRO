(рефракция, гнутие, место зенита) и y (ошибка времени): x<sub>i</sub>\n= −[bl]/[bb], вес P<sub>x</sub> = 2·cos²A<sub>N</sub>. Это частный\nслучай способа равных высот, «зеркальный» Цингеру.</p>", "key": "<p>N и S на одной высоте, по одну сторону\nмеридиана, A<sub>S</sub> = 180° − A<sub>N</sub>. ζ и y исключаются. x =\n−[bl]/[bb], P = 2cos²A<sub>N</sub>. z 15–50°, интервал 26ˢ…15ᵐ.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Способ Певцова — определение\n<strong>широты</strong> по наблюдениям <strong>пар звёзд на равных\nвысотах</strong> вблизи меридиана: северная и южная звёзды расположены\n<strong>симметрично относительно первого вертикала</strong>\n(A<sub>S</sub> = 180° − A<sub>N</sub>), т. е. по одну сторону от\nмеридиана. Измеряют моменты прохождения звёзд через одни горизонтальные\nнити при неизменном наклоне трубы. В разности уравнений пары исключаются\nζ (рефракция, гнутие, место зенита) и y (ошибка времени): x<sub>i</sub>\n= −[bl]/[bb], вес P<sub>x</sub> = 2·cos²A<sub>N</sub>. Это частный\nслучай способа равных высот, «зеркальный» Цингеру.</p>\n</div>\n<h3 id=\"теория-28\">Теория</h3>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 400 360\" style=\"max-width:360px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><circle cx=\"200.0\" cy=\"170.0\" r=\"140.0\" stroke=\"#64748b\" stroke-width=\"1\" fill=\"none\"/><line x1=\"200.0\" y1=\"30.0\" x2=\"200.0\" y2=\"310.0\" stroke=\"#1e293b\" stroke-width=\"1\" stroke-dasharray=\"5 3\"/><line x1=\"60.0\" y1=\"170.0\" x2=\"340.0\" y2=\"170.0\" stroke=\"#1e293b\" stroke-width=\"1\" stroke-dasharray=\"5 3\"/><text x=\"200.0\" y=\"22.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">N</text><text x=\"200.0\" y=\"328.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">S</text><text x=\"354.0\" y=\"175.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">E</text><text x=\"46.0\" y=\"175.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">W</text><circle cx=\"200.0\" cy=\"170.0\" r=\"80.0\" stroke=\"#d97706\" stroke-width=\"2\" fill=\"none\"/><text x=\"263.6\" y=\"108.4\" fill=\"#d97706\" font-size=\"11\" text-anchor=\"start\">альмукантарат z = const</text><circle cx=\"200.0\" cy=\"170.0\" r=\"3.2\" fill=\"#1e293b\"/><text x=\"210.0\" y=\"184.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">Z</text><path d=\"M260.0,52.0 Q180.9,119.2 90.0,82.0\" stroke=\"#2563eb\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#arb)\"/><path d=\"M260.0,214.0 Q180.9,265.8 90.0,242.0\" stroke=\"#dc2626\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#arr)\"/><polygon points=\"177.9,87.1 179.5,90.9 183.7,91.2 180.5,93.9 181.5,98.0 177.9,95.8 174.4,98.0 175.4,93.9 172.2,91.2 176.4,90.9\" fill=\"#2563eb\"/><polygon points=\"177.9,240.9 179.5,244.7 183.7,245.0 180.5,247.7 181.5,251.8 177.9,249.6 174.4,251.8 175.4,247.7 172.2,245.0 176.4,244.7\" fill=\"#dc2626\"/><text x=\"165.9\" y=\"113.1\" fill=\"#2563eb\" font-size=\"11\" text-anchor=\"end\">N-звезда</text><text x=\"165.9\" y=\"236.9\" fill=\"#dc2626\" font-size=\"11\" text-anchor=\"end\">S-звезда</text><text x=\"200.0\" y=\"350.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"middle\">N и S — по одну сторону меридиана</text></svg><figcaption><b>Рис. 21.</b> Способ Певцова: пара звёзд N и S на одинаковой высоте вблизи меридиана (в разных вертикалах); измеряются моменты прохождения.</figcaption></figure>\n<p><strong>Почему симметрия относительно первого вертикала.</strong>\nУравнения пары:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mi>ζ</mi><mo>+</mo><mo>cos</mo><msub><mi>A</mi><mi>N</mi></msub><mspace width=\"0.167em\"></mspace><mi>x</mi><mo>+</mo><mo>sin</mo><msub><mi>A</mi><mi>N</mi></msub><mspace width=\"0.167em\"></mspace><mi>y</mi><mo>+</mo><msub><mi>l</mi><mi>N</mi></msub><mo>=</mo><msub><mi>v</mi><mi>N</mi></msub><mo>,</mo><mspace width=\"2.0em\"></mspace><mo>−</mo><mi>ζ</mi><mo>+</mo><mo>cos</mo><msub><mi>A</mi><mi>S</mi></msub><mspace width=\"0.167em\"></mspace><mi>x</mi><mo>+</mo><mo>sin</mo><msub><mi>A</mi><mi>S</mi></msub><mspace width=\"0.167em\"></mspace><mi>y</mi><mo>+</mo><msub><mi>l</mi><mi>S</mi></msub><mo>=</mo><msub><mi>v</mi><mi>S</mi></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">-\\zeta + \\cos A_N\\,x + \\sin A_N\\,y + l_N = v_N ,\\qquad -\\zeta + \\cos A_S\\,x + \\sin A_S\\,y + l_S = v_S .</annotation></semantics></math></p>\n<p>При A<sub>S</sub> = 180° − A<sub>N</sub>: sin A<sub>S</sub> = sin\nA<sub>N</sub>, cos A<sub>S</sub> = −cos A<sub>N</sub>. В разности\nисчезают ζ <strong>и y</strong> (время!), остаётся x:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>x</mi><mi>i</mi></msub><mo>=</mo><mo>−</mo><mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mi>l</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mi>b</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>P</mi><msub><mi>x</mi><mi>i</mi></msub></msub><mo>=</mo><mn>2</mn><msup><mo>cos</mo><mn>2</mn></msup><msub><mi>A</mi><mi>N</mi></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">x_i = -\\frac{[bl]}{[bb]},\\qquad P_{x_i} = 2\\cos^2 A_N .</annotation></semantics></math></p>\n<p>Веса: при отклонении от меридиана 10° — 1,94; 20° — 1,77; 30° — 1,50;\n40° — 1,18. Поэтому пары берут <strong>ближе к меридиану</strong>, но\n<strong>не в нём самом</strong> — в меридиане за короткое время нельзя\nнайти пары с равными z.</p>\n<p><strong>Зенитное расстояние пары</strong> (из равенства высот при\nсимметрии):</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>cos</mo><mi>z</mi><mo>=</mo><mfrac><mrow><mo>sin</mo><msub><mi>δ</mi><mi>N</mi></msub><mo>+</mo><mo>sin</mo><msub><mi>δ</mi><mi>S</mi></msub></mrow><mrow><mn>2</mn><mo>sin</mo><mi>φ</mi></mrow></mfrac><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\cos z = \\frac{\\sin\\delta_N + \\sin\\delta_S}{2\\sin\\varphi} .</annotation></semantics></math></p>\n<p><strong>История.</strong> Способ разрабатывал военный геодезист\n<strong>М. В. Певцов</strong> (1880-е), составил списки пар для широт\n+35…+65° и вспомогательные таблицы. Ранее пары наблюдал Федоренко, но в\nневыгодных условиях.</p>\n<p><strong>Эфемериды.</strong> Подбирают пары N и S с близкими z при\nданной φ. Для каждой пары вычисляют: z пары, азимуты, моменты (по\nзвёздному времени) прохождения альмукантарата обеими звёздами и\nпромежуток между ними. Условия Инструкции:</p>\n<ul>\n<li>z пары в пределах <strong>15–50°</strong> (в широтах 60–70° — до\n60°, чтобы брать яркие звёзды);</li>\n<li>промежуток между наблюдениями звёзд пары — <strong>не более 15ᵐ и не\nменее 26ˢ</strong>;</li>\n<li>симметрия относительно первого вертикала — для средней нити при\nустановке трубы на z<sub>эф</sub> с точностью 1–2′.</li>\n</ul>\n<p><strong>Методика наблюдений.</strong> Сигналы — n пар — сигналы.\nТруба на z<sub>эф</sub>, уровень Талькотта на середину. Первая звезда:\nмоменты прохождения через горизонтальные нити («глаз-ухо» или контактный\nмикрометр), отсчёты уровня. Затем алидаду ставят по азимуту второй\nзвезды, наклон трубы не меняют — вторая звезда так же. С контактным\nмикрометром пары Певцова наблюдают редко.</p>\n<p><strong>Недостатки:</strong> на звезду и пару уходит больше времени\n(до 15ᵐ), поэтому меньше пар в час, чем у Талькотта.\n<strong>Достоинства:</strong> не нужен окулярный микрометр с его ценой\nоборота, полностью исключаются рефракция и гнутие.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> N и S на одной высоте, по одну сторону\nмеридиана, A<sub>S</sub> = 180° − A<sub>N</sub>. ζ и y исключаются. x =\n−[bl]/[bb], P = 2cos²A<sub>N</sub>. z 15–50°, интервал 26ˢ…15ᵐ.</p>\n</div>\n<p><span class=\"src\">Уралов, § 50.1–3, с. 305–314</span></p>"}, {"n": 30, "title": "Способ Певцова: обработка, уравнивание, оценка точности", "block": 4, "short": "<p>Обработка журнала: средние моменты\nпрохождения звёзд, отсчёты уровня Талькотта, поправки за разность\nнаклонов трубы, ускорение, (при контактном микрометре — за контакты и\nмёртвый ход). По каждой паре вычисляют x<sub>i</sub> = −[bl]/[bb] с\nвесом 2cos²A<sub>N</sub>, учитывают поправку за неверно принятую долготу\nΔx<sub>y</sub> = −([bc]/[bb])·y (при неполной симметрии). Широта —\nвесовое среднее x<sub>φ</sub> = [P<sub>x</sub>x]/[P<sub>x</sub>], φ =\nφ<sub>0</sub> + x<sub>φ</sub>; μ = √([P v²]/(n − 1)), M<sub>φ</sub> =\nμ/√[P]. Для 1–2 класса Инструкция рекомендует 12–15 пар.</p>", "key": "<p>x<sub>φ</sub> =\n[P<sub>x</sub>x]/[P<sub>x</sub>], P = 2cos²A<sub>N</sub>; μ = √([Pv²]/(n\n− 1)); 12–15 пар для 0,3″.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Обработка журнала: средние моменты\nпрохождения звёзд, отсчёты уровня Талькотта, поправки за разность\nнаклонов трубы, ускорение, (при контактном микрометре — за контакты и\nмёртвый ход). По каждой паре вычисляют x<sub>i</sub> = −[bl]/[bb] с\nвесом 2cos²A<sub>N</sub>, учитывают поправку за неверно принятую долготу\nΔx<sub>y</sub> = −([bc]/[bb])·y (при неполной симметрии). Широта —\nвесовое среднее x<sub>φ</sub> = [P<sub>x</sub>x]/[P<sub>x</sub>], φ =\nφ<sub>0</sub> + x<sub>φ</sub>; μ = √([P v²]/(n − 1)), M<sub>φ</sub> =\nμ/√[P]. Для 1–2 класса Инструкция рекомендует 12–15 пар.</p>\n</div>\n<h3 id=\"теория-29\">Теория</h3>\n<p><strong>1. Журнал</strong> → средние моменты T<sub>N</sub>,\nT<sub>S</sub>, часовые углы t = T + u − α, z<sub>выч</sub> обеих звёзд с\nφ<sub>0</sub>, свободные члены l<sub>N</sub>, l<sub>S</sub> (по сути —\nразность z<sub>выч</sub> двух звёзд, так как измеренные z\nодинаковы).</p>\n<p><strong>2. Поправки к x пары:</strong></p>\n<ul>\n<li>за разность наклонов трубы (по уровню Талькотта) между\nзвёздами;</li>\n<li>за ускорение (если вычисляли со средним моментом);</li>\n<li><strong>за неверно принятую долготу/поправку часов</strong>: при\nнеполной симметрии [bc] ≠ 0, тогда Δx<sub>y</sub> = −([bc]/[bb])·y;\nпоэтому поправку часов нужно знать достаточно точно;</li>\n<li>суточная аберрация мала (звёзды близко к меридиану).</li>\n</ul>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>x</mi><mi>i</mi></msub><mo>=</mo><mo>−</mo><mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mi>l</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>b</mi><mi>b</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow></mfrac><mo>+</mo><mi>Δ</mi><msub><mi>x</mi><mtext mathvariant=\"normal\">нак</mtext></msub><mo>+</mo><mi>Δ</mi><msub><mi>x</mi><mi>w</mi></msub><mo>+</mo><mi>Δ</mi><msub><mi>x</mi><mi>y</mi></msub><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>P</mi><msub><mi>x</mi><mi>i</mi></msub></msub><mo>=</mo><mn>2</mn><msup><mo>cos</mo><mn>2</mn></msup><msub><mi>A</mi><mi>N</mi></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">x_i = -\\frac{[bl]}{[bb]} + \\Delta x_{\\text{нак}} + \\Delta x_w + \\Delta x_y ,\\qquad P_{x_i} = 2\\cos^2 A_N .</annotation></semantics></math></p>\n<p><strong>3. Уравненная широта:</strong></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>x</mi><mi>φ</mi></msub><mo>=</mo><mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><msub><mi>P</mi><mi>x</mi></msub><mi>x</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><msub><mi>P</mi><mi>x</mi></msub><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>φ</mi><mo>=</mo><msub><mi>φ</mi><mn>0</mn></msub><mo>+</mo><msub><mi>x</mi><mi>φ</mi></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">x_\\varphi = \\frac{[P_x x]}{[P_x]},\\qquad \\varphi = \\varphi_0 + x_\\varphi .</annotation></semantics></math></p>\n<p>Если видимые места не исправлялись за короткопериодическую нутацию —\nпоправка δx<sub>nut</sub> одна на вечер (если пары за 2–3 часа).</p>\n<p><strong>4. Оценка точности:</strong></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mi>x</mi></msub><mo>=</mo><msqrt><mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><msub><mi>P</mi><mi>x</mi></msub><msup><mi>v</mi><mn>2</mn></msup><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow></mfrac></msqrt><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>M</mi><mi>φ</mi></msub><mo>=</mo><mfrac><msub><mi>μ</mi><mi>x</mi></msub><msqrt><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><msub><mi>P</mi><mi>x</mi></msub><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow></msqrt></mfrac><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\\mu_x = \\sqrt{\\frac{[P_x v^2]}{n-1}},\\qquad M_\\varphi = \\frac{\\mu_x}{\\sqrt{[P_x]}} ,</annotation></semantics></math></p>\n<p>n — число пар, v = x<sub>φ</sub> − x<sub>i</sub>. Для m<sub>φ</sub> =\n0,3″ с АУ 2″/10″ — 12–15 пар (Инструкция, «с запасом»).</p>\n<p><strong>5.</strong> Редукции: к центру знака, к среднему полюсу.</p>\n<p><strong>Сравнение с Талькоттом:</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Талькотт</th>\n<th>Певцов</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Измеряется</td>\n<td>малая разность z (микрометром)</td>\n<td>моменты на равной высоте</td>\n</tr>\n<tr class=\"even\">\n<td>Нужна цена оборота R</td>\n<td>да (уточняется уравниванием)</td>\n<td>нет</td>\n</tr>\n<tr class=\"odd\">\n<td>Время</td>\n<td>почти не влияет</td>\n<td>исключается симметрией</td>\n</tr>\n<tr class=\"even\">\n<td>Скорость</td>\n<td>~9 пар/час</td>\n<td>медленнее (до 15ᵐ на пару)</td>\n</tr>\n</tbody>\n</table>\n<div class=\"key\">\n<p><strong>Запомни.</strong> x<sub>φ</sub> =\n[P<sub>x</sub>x]/[P<sub>x</sub>], P = 2cos²A<sub>N</sub>; μ = √([Pv²]/(n\n− 1)); 12–15 пар для 0,3″.</p>\n</div>\n<p><span class=\"src\">Уралов, § 50.4–5, с. 314–318</span></p>"}, {"n": 31, "title": "Азимут по часовому углу Полярной: теория, подготовка теодолита, методика наблюдений", "block": 5, "short": "<p>Азимут предмета a = A + Q: азимут Полярной\nA вычисляют по её <strong>часовому углу</strong> t = s − α (момент по\nхронометру + поправка), а угол Q между Полярной и предметом измеряют\nтеодолитом. Полярная выгодна: δ ≈ 89°, она всегда у меридиана (|A| ≤\n2–3°), и ошибка времени почти не влияет (входит с множителем cos δ).\nИнструкция рекомендует этот способ для пунктов южнее 70°. Для\nвысокоточных азимутов (0,5″) — астрономический теодолит с окулярным\nмикрометром, <strong>не менее 18 приёмов за не менее 3 дней</strong> с\nперестановкой лимба.</p>", "key": "<p>a = A + Q (a = M − M<sub>N</sub>). t = T +\nu − α. A<sub>N</sub> ≈ −Δ·sin t·sec(φ + Δ·cos t). Ошибка времени × cos\nδ. ≥ 18 приёмов, ≥ 3 дня; поправки: наклон b·ctg z, коллимация c·cosec\nz, суточная аберрация.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Азимут предмета a = A + Q: азимут Полярной\nA вычисляют по её <strong>часовому углу</strong> t = s − α (момент по\nхронометру + поправка), а угол Q между Полярной и предметом измеряют\nтеодолитом. Полярная выгодна: δ ≈ 89°, она всегда у меридиана (|A| ≤\n2–3°), и ошибка времени почти не влияет (входит с множителем cos δ).\nИнструкция рекомендует этот способ для пунктов южнее 70°. Для\nвысокоточных азимутов (0,5″) — астрономический теодолит с окулярным\nмикрометром, <strong>не менее 18 приёмов за не менее 3 дней</strong> с\nперестановкой лимба.</p>\n</div>\n<h3 id=\"теория-30\">Теория</h3>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 460 310\" style=\"max-width:400px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><line x1=\"210.0\" y1=\"300.0\" x2=\"210.0\" y2=\"20.0\" stroke=\"#64748b\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"216.0\" y=\"290.0\" fill=\"#64748b\" font-size=\"11\" text-anchor=\"start\">к зениту Z (вниз) — меридиан</text><circle cx=\"210.0\" cy=\"150.0\" r=\"85.0\" stroke=\"#2563eb\" stroke-width=\"1.4\" fill=\"none\" stroke-dasharray=\"4 3\"/><circle cx=\"210.0\" cy=\"150.0\" r=\"4\" fill=\"#1e293b\"/><text x=\"220.0\" y=\"142.0\" fill=\"#1e293b\" font-size=\"14\" text-anchor=\"start\" font-weight=\"600\">P</text><line x1=\"210.0\" y1=\"150.0\" x2=\"275.1\" y2=\"204.6\" stroke=\"#dc2626\" stroke-width=\"1.6\"/><polygon points=\"275.1,196.6 277.2,201.7 282.7,202.2 278.5,205.7 279.8,211.1 275.1,208.2 270.4,211.1 271.7,205.7 267.5,202.2 273.0,201.7\" fill=\"#dc2626\"/><text x=\"289.1\" y=\"208.6\" fill=\"#dc2626\" font-size=\"12\" text-anchor=\"start\">Полярная</text><line x1=\"275.1\" y1=\"204.6\" x2=\"210.0\" y2=\"204.6\" stroke=\"#059669\" stroke-width=\"1.6\" stroke-dasharray=\"3 2\"/><text x=\"242.6\" y=\"220.6\" fill=\"#059669\" font-size=\"12\" text-anchor=\"middle\" font-style=\"italic\">y = Δ·sin t</text><text x=\"202.0\" y=\"181.3\" fill=\"#d97706\" font-size=\"12\" text-anchor=\"end\" font-style=\"italic\">x = Δ·cos t</text><line x1=\"210.0\" y1=\"150.0\" x2=\"210.0\" y2=\"204.6\" stroke=\"#d97706\" stroke-width=\"2.2\"/><path d=\"M210.0,180.0 A30,30 0 0 0 233.0,169.3\" stroke=\"#1e293b\" stroke-width=\"1.4\" fill=\"none\"/><text x=\"228.0\" y=\"192.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">t</text><text x=\"268.5\" y=\"99.0\" fill=\"#2563eb\" font-size=\"12\" text-anchor=\"start\">Δ = 90° − δ ≈ 40′</text></svg><figcaption><b>Рис. 22.</b> Полярная обходит полюс по кругу радиуса Δ = 90° − δ. Проекции: на меридиан x = Δ·cos t (идёт в широту), поперёк y = Δ·sin t (даёт азимут).</figcaption></figure>\n<p><strong>Точная формула</strong> (из параллактического треугольника,\nазимут от севера):</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>tg</mo><msub><mi>A</mi><mi>N</mi></msub><mo>=</mo><mo>−</mo><mfrac><mrow><mo>sin</mo><mi>t</mi><mspace width=\"0.167em\"></mspace><mo>ctg</mo><mi>δ</mi><mspace width=\"0.167em\"></mspace><mo>sec</mo><mi>φ</mi></mrow><mrow><mn>1</mn><mo>−</mo><mo>ctg</mo><mi>δ</mi><mspace width=\"0.167em\"></mspace><mo>tg</mo><mi>φ</mi><mspace width=\"0.167em\"></mspace><mo>cos</mo><mi>t</mi></mrow></mfrac><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\operatorname{tg} A_N = -\\frac{\\sin t\\,\\operatorname{ctg}\\delta\\,\\sec\\varphi}{1 - \\operatorname{ctg}\\delta\\,\\operatorname{tg}\\varphi\\,\\cos t} .</annotation></semantics></math></p>\n<p><strong>Приближённая</strong> (для ошибок 15″ и грубее, Уралов §\n108): полярное расстояние Δ = 90° − δ &lt; 1°, поэтому маленький\nтреугольник у полюса решаем как плоский:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><mi>Δ</mi><mo>cos</mo><mi>t</mi><mo>,</mo><mspace width=\"1.0em\"></mspace><mi>y</mi><mo>=</mo><mi>Δ</mi><mo>sin</mo><mi>t</mi><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>A</mi><mi>N</mi></msub><mo>≈</mo><mo>−</mo><mspace width=\"0.167em\"></mspace><mi>y</mi><mspace width=\"0.167em\"></mspace><mo>sec</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>φ</mi><mo>+</mo><mi>x</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">x = \\Delta\\cos t,\\quad y = \\Delta\\sin t,\\qquad A_N \\approx -\\,y\\,\\sec(\\varphi + x) .</annotation></semantics></math></p>\n<p><strong>Дифференциальная формула</strong> показывает, почему\nПолярная:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Δ</mi><mi>A</mi><mo>=</mo><mn>15</mn><mfrac><mrow><mo>cos</mo><mi>δ</mi><mo>cos</mo><mi>q</mi></mrow><mrow><mo>sin</mo><mi>z</mi></mrow></mfrac><mspace width=\"0.167em\"></mspace><mi>Δ</mi><mi>t</mi><mo>+</mo><mfrac><mrow><mo>sin</mo><mi>A</mi></mrow><mrow><mo>tg</mo><mi>z</mi></mrow></mfrac><mspace width=\"0.167em\"></mspace><mi>Δ</mi><mi>φ</mi><mo>+</mo><mi>…</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta A = 15\\frac{\\cos\\delta\\cos q}{\\sin z}\\,\\Delta t + \\frac{\\sin A}{\\operatorname{tg} z}\\,\\Delta\\varphi + \\dots</annotation></semantics></math></p>\n<p>cos δ ≈ 0,014 → ошибка времени 1ˢ даёт в азимуте всего ≈ 0,2″·sec φ.\nПоэтому поправку часов достаточно знать до 0,1–0,2ˢ (для 15″ — даже до\n3–4ˢ), а широту — до нескольких секунд.</p>\n<p><strong>Место севера.</strong> Отсчёт горизонтального круга,\nсоответствующий направлению на север, — M<sub>N</sub>:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>M</mi><mi>N</mi></msub><mo>=</mo><msub><mi>N</mi><mtext mathvariant=\"normal\">испр</mtext></msub><mo>−</mo><mi>A</mi><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>a</mi><mo>=</mo><mi>M</mi><mo>−</mo><msub><mi>M</mi><mi>N</mi></msub><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">M_N = N_{\\text{испр}} - A,\\qquad a = M - M_N ,</annotation></semantics></math></p>\n<p>где N — отсчёт на Полярную (исправленный за наклон оси, коллимацию,\nмикрометр), M — на предмет.</p>\n<p><strong>Подготовка теодолита:</strong> установка на столбе (или\nштативе), тщательное горизонтирование, накладной уровень на\nгоризонтальную ось (поправка за наклон b·ctg z<sub>Пол</sub> велика —\nПолярная высоко!), определение коллимации, цены деления уровня, цены\nделения окулярного микрометра; ориентирование нулём лимба на север (по\nвычисленному азимуту Полярной); освещение нитей; предмет (марка/визирная\nцель) — хорошо видимый ночью, на расстоянии не менее нескольких\nкилометров (или светящаяся марка).</p>\n<p><strong>Методика приёма</strong> (с окулярным микрометром, в одном\nполуприёме):</p>\n<ol type=\"1\">\n<li>Наведение на земной предмет (отсчёт круга / микрометра).</li>\n<li>Наведение на Полярную: несколько (обычно 3) наведений подвижной\nвертикальной нитью микрометра на звезду с записью моментов по звёздному\nхронометру и отсчётов микрометра.</li>\n<li>Отсчёты накладного уровня (наклон горизонтальной оси).</li>\n<li>Перевод трубы через зенит (КП), то же в обратном порядке: Полярная —\nпредмет.</li>\n</ol>\n<p>Между приёмами лимб переставляют на 180°/n (при n = 18 — на 10°10′ с\nучётом цены деления). Контроль: место севера в полуприёмах не должно\nрасходиться более чем на 8″.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> a = A + Q (a = M − M<sub>N</sub>). t = T +\nu − α. A<sub>N</sub> ≈ −Δ·sin t·sec(φ + Δ·cos t). Ошибка времени × cos\nδ. ≥ 18 приёмов, ≥ 3 дня; поправки: наклон b·ctg z, коллимация c·cosec\nz, суточная аберрация.</p>\n</div>\n<p><span class=\"src\">Уралов, § 108, с. 555–562; Методические указания\nСуслина, задание 5</span></p>"}, {"n": 32, "title": "Азимут по часовому углу Полярной: обработка, место в производстве", "block": 5, "short": "<p>Обработка приёма: момент по хронометру → s\n= T + u → часовой угол t = s − α<sub>вид</sub>; видимые α, δ Полярной из\nАЕ на момент наблюдения; азимут Полярной A; поправки в направление на\nПолярную (окулярный микрометр, наклон оси b·ctg z, суточная аберрация);\nместо севера M<sub>N</sub> = N<sub>испр</sub> − A для КЛ и КП, среднее;\nпоправка за коллимацию; a = M − M<sub>N</sub>. По всем приёмам — среднее\na, m<sub>a</sub> = √([vv]/(n(n − 1))). Далее — геодезический азимут по\nуравнению Лапласа. Это основной способ азимутов Лапласа и азимутов\nориентирных направлений.</p>", "key": "<p>M<sub>N</sub> = N − A, a = M −\nM<sub>N</sub>; m<sub>a</sub> = √([vv]/(n(n − 1))); α<sub>г</sub> = a −\n15(λ − L) sin B.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Обработка приёма: момент по хронометру → s\n= T + u → часовой угол t = s − α<sub>вид</sub>; видимые α, δ Полярной из\nАЕ на момент наблюдения; азимут Полярной A; поправки в направление на\nПолярную (окулярный микрометр, наклон оси b·ctg z, суточная аберрация);\nместо севера M<sub>N</sub> = N<sub>испр</sub> − A для КЛ и КП, среднее;\nпоправка за коллимацию; a = M − M<sub>N</sub>. По всем приёмам — среднее\na, m<sub>a</sub> = √([vv]/(n(n − 1))). Далее — геодезический азимут по\nуравнению Лапласа. Это основной способ азимутов Лапласа и азимутов\nориентирных направлений.</p>\n</div>\n<h3 id=\"теория-31\">Теория</h3>\n<p><strong>Шаги обработки одного приёма:</strong></p>\n<ol type=\"1\">\n<li>Средний момент наведений T<sub>ср</sub>, поправка хронометра u на\nэтот момент.</li>\n<li>s = T<sub>ср</sub> + u, t = s − α. (При обычных часах среднего\nвремени: s = S<sub>0</sub> + (m − λ)(1 + μ) + λ.)</li>\n<li>Видимые α, δ Полярной на момент — интерполяция по таблице «Видимые\nместа близполюсных звёзд» АЕ.</li>\n<li>Азимут A по формуле (точной или приближённой).</li>\n<li>Поправки в направление на Полярную: за окулярный микрометр (ΔM·цена\nделения, «+» при КЛ, «−» при КП); <strong>за наклон оси</strong> b·ctg\nz; за суточную аберрацию (≈ 0,32″·cos φ·cos A·cosec z).</li>\n<li>Место севера в каждом полуприёме: M<sub>N</sub> = N<sub>испр</sub> −\nA; контроль расхождения (≤ 8″); среднее из КЛ и КП (исключает коллимацию\nдля Полярной).</li>\n<li>Поправка за коллимацию на предмет (если он и Полярная на разных z):\nразность c·(cosec z<sub>Пол</sub> − cosec z<sub>пред</sub>).</li>\n<li>a = M<sub>пред</sub> − M<sub>N испр</sub>.</li>\n</ol>\n<p><strong>Уравнивание на пункте:</strong> a = [a<sub>i</sub>]/n,\nv<sub>i</sub> = a − a<sub>i</sub>,</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mi>a</mi></msub><mo>=</mo><msqrt><mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>v</mi><mi>v</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mrow><mi>n</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>n</mi><mo>−</mo><mn>1</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow></mfrac></msqrt><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">m_a = \\sqrt{\\frac{[vv]}{n(n-1)}} .</annotation></semantics></math></p>\n<p>Пример (Уралов, табл. 129): 6 приёмов, m<sub>a</sub> = √(9,84/(6·5))\n= 0,6″.</p>\n<p><strong>Переход к геодезическому азимуту</strong> (уравнение\nЛапласа):</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>α</mi><mtext mathvariant=\"normal\">г</mtext></msub><mo>=</mo><mi>a</mi><mo>−</mo><mn>15</mn><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>λ</mi><mo>−</mo><mi>L</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>sin</mo><mi>B</mi><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>m</mi><msub><mi>α</mi><mtext mathvariant=\"normal\">г</mtext></msub></msub><mo>=</mo><msqrt><mrow><msubsup><mi>m</mi><mi>a</mi><mn>2</mn></msubsup><mo>+</mo><msup><mn>15</mn><mn>2</mn></msup><mo minsize=\"1.2\" maxsize=\"1.2\" stretchy=\"false\" form=\"prefix\">(</mo><msubsup><mi>m</mi><mi>λ</mi><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>m</mi><mi>L</mi><mn>2</mn></msubsup><mo minsize=\"1.2\" maxsize=\"1.2\" stretchy=\"false\" form=\"postfix\">)</mo><msup><mo>sin</mo><mn>2</mn></msup><mi>B</mi></mrow></msqrt><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\alpha_{\\text{г}} = a - 15(\\lambda - L)\\sin B,\\qquad m_{\\alpha_{\\text{г}}} = \\sqrt{m_a^2 + 15^2\\big(m_\\lambda^2 + m_L^2\\big)\\sin^2 B} .</annotation></semantics></math></p>\n<p>Видно, что ошибка долготы входит с множителем 15·sin B — поэтому для\nпункта Лапласа долгота нужна с точностью 0,03ˢ.</p>\n<p><strong>Место в производстве:</strong></p>\n<ul>\n<li>азимуты Лапласа на пунктах 1–2 класса (m ≤ 0,5″);</li>\n<li>азимуты ориентирных направлений при восстановлении пунктов ГГС, для\nтопосъёмок;</li>\n<li>приближённые азимуты (15″) — Theo 010, Т-2, обычные часы по\nдекретному времени, без отсчётов уровня;</li>\n<li>эталонирование гиротеодолитов, ориентирование сетей в прикладной\nгеодезии.</li>\n</ul>\n<p>Ограничение: в высоких широтах (севернее ~70°) Полярная слишком\nвысоко, растёт влияние наклона оси (b·ctg z) — там применяют звёзды у\nгоризонта.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> M<sub>N</sub> = N − A, a = M −\nM<sub>N</sub>; m<sub>a</sub> = √([vv]/(n(n − 1))); α<sub>г</sub> = a −\n15(λ − L) sin B.</p>\n</div>\n<p><span class=\"src\">Уралов, § 108, с. 555–562</span></p>"}, {"n": 33, "title": "Приближённая широта по зенитным расстояниям Полярной", "block": 5, "short": "<p>Полярная почти в полюсе, поэтому её высота\nпочти равна широте: φ ≈ h − Δ·cos t, где Δ = 90° − δ, t — часовой угол.\nБолее точно: φ = 90° − z − Δcos t + (Δ²/2ρ)·sin²t·ctg z. В АЕ есть\nтаблицы: φ = 90° − z + I + II + III (I — по звёздному времени s, II — по\ns и высоте, III — по s и дате). Измеряют z при КЛ и КП, учитывают\nрефракцию; время нужно знать до 0,1ᵐ. 2–3 приёма теодолитом Theo 010\nдают φ с ошибкой не более 3″.</p>", "key": "<p>φ = h − Δcos t + (Δ²/2ρ)sin²t·ctg z = h + I\n+ II + III. Δ ≈ 40′. Время — до 0,1ᵐ, 2–3 приёма — 3″.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Полярная почти в полюсе, поэтому её высота\nпочти равна широте: φ ≈ h − Δ·cos t, где Δ = 90° − δ, t — часовой угол.\nБолее точно: φ = 90° − z − Δcos t + (Δ²/2ρ)·sin²t·ctg z. В АЕ есть\nтаблицы: φ = 90° − z + I + II + III (I — по звёздному времени s, II — по\ns и высоте, III — по s и дате). Измеряют z при КЛ и КП, учитывают\nрефракцию; время нужно знать до 0,1ᵐ. 2–3 приёма теодолитом Theo 010\nдают φ с ошибкой не более 3″.</p>\n</div>\n<h3 id=\"теория-32\">Теория</h3>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 460 310\" style=\"max-width:400px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><line x1=\"210.0\" y1=\"300.0\" x2=\"210.0\" y2=\"20.0\" stroke=\"#64748b\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"216.0\" y=\"290.0\" fill=\"#64748b\" font-size=\"11\" text-anchor=\"start\">к зениту Z (вниз) — меридиан</text><circle cx=\"210.0\" cy=\"150.0\" r=\"85.0\" stroke=\"#2563eb\" stroke-width=\"1.4\" fill=\"none\" stroke-dasharray=\"4 3\"/><circle cx=\"210.0\" cy=\"150.0\" r=\"4\" fill=\"#1e293b\"/><text x=\"220.0\" y=\"142.0\" fill=\"#1e293b\" font-size=\"14\" text-anchor=\"start\" font-weight=\"600\">P</text><line x1=\"210.0\" y1=\"150.0\" x2=\"275.1\" y2=\"204.6\" stroke=\"#dc2626\" stroke-width=\"1.6\"/><polygon points=\"275.1,196.6 277.2,201.7 282.7,202.2 278.5,205.7 279.8,211.1 275.1,208.2 270.4,211.1 271.7,205.7 267.5,202.2 273.0,201.7\" fill=\"#dc2626\"/><text x=\"289.1\" y=\"208.6\" fill=\"#dc2626\" font-size=\"12\" text-anchor=\"start\">Полярная</text><line x1=\"275.1\" y1=\"204.6\" x2=\"210.0\" y2=\"204.6\" stroke=\"#059669\" stroke-width=\"1.6\" stroke-dasharray=\"3 2\"/><text x=\"242.6\" y=\"220.6\" fill=\"#059669\" font-size=\"12\" text-anchor=\"middle\" font-style=\"italic\">y = Δ·sin t</text><text x=\"202.0\" y=\"181.3\" fill=\"#d97706\" font-size=\"12\" text-anchor=\"end\" font-style=\"italic\">x = Δ·cos t</text><line x1=\"210.0\" y1=\"150.0\" x2=\"210.0\" y2=\"204.6\" stroke=\"#d97706\" stroke-width=\"2.2\"/><path d=\"M210.0,180.0 A30,30 0 0 0 233.0,169.3\" stroke=\"#1e293b\" stroke-width=\"1.4\" fill=\"none\"/><text x=\"228.0\" y=\"192.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">t</text><text x=\"268.5\" y=\"99.0\" fill=\"#2563eb\" font-size=\"12\" text-anchor=\"start\">Δ = 90° − δ ≈ 40′</text></svg><figcaption><b>Рис. 23.</b> Широта по Полярной: высота Полярной отличается от широты на x = Δ·cos t (плюс малый член второго порядка).</figcaption></figure>\n<p><strong>Вывод</strong> (Уралов, § 100). Опустим перпендикуляр из\nПолярной σ на меридиан PZ. Маленький треугольник у полюса — плоский:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi><mo>=</mo><mi>Δ</mi><mo>cos</mo><mi>t</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">f = \\Delta\\cos t .</annotation></semantics></math></p>\n<p>Широта «почти» равна высоте Полярной минус f. Точнее, учитывая малое\nсмещение по азимуту A<sub>N</sub> = Δ·sin t / sin z:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>φ</mi><mo>=</mo><msup><mn>90</mn><mo>∘</mo></msup><mo>−</mo><mi>z</mi><mo>−</mo><mi>Δ</mi><mo>cos</mo><mi>t</mi><mo>+</mo><mfrac><msup><mi>Δ</mi><mn>2</mn></msup><mrow><mn>2</mn><mi>ρ</mi><mi>″</mi></mrow></mfrac><msup><mo>sin</mo><mn>2</mn></msup><mi>t</mi><mspace width=\"0.167em\"></mspace><mo>ctg</mo><mi>z</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\varphi = 90^\\circ - z - \\Delta\\cos t + \\frac{\\Delta^2}{2\\rho&#39;&#39;}\\sin^2 t\\,\\operatorname{ctg} z .</annotation></semantics></math></p>\n<p><strong>Таблицы АЕ</strong> («Широта по Полярной»):</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>φ</mi><mo>=</mo><mi>h</mi><mo>+</mo><mi>I</mi><mo>+</mo><mi>I</mi><mi>I</mi><mo>+</mo><mi>I</mi><mi>I</mi><mi>I</mi><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>h</mi><mo>=</mo><msup><mn>90</mn><mo>∘</mo></msup><mo>−</mo><mi>z</mi><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\\varphi = h + I + II + III ,\\qquad h = 90^\\circ - z ,</annotation></semantics></math></p>\n<ul>\n<li>I = −Δ<sub>0</sub>·cos t<sub>0</sub> — по местному звёздному времени\ns (координаты на начало года);</li>\n<li>II = (Δ<sub>0</sub>²/2ρ)·sin²t<sub>0</sub>·ctg z — по s и h;</li>\n<li>III — поправка за изменение координат Полярной в течение года — по s\nи дате.</li>\n</ul>\n<p><strong>Порядок:</strong> z измеряют при двух кругах: z = ½(L − R)\nили L − MZ; z<sub>ист</sub> = z′ + ρ (ρ = ρ<sub>0</sub>γB, записывают t°\nи давление). Момент T → s = T + u (u до 0,1ᵐ). Пример Уралова: h =\n44°38′08″, I = +20′16″, II = +20″, III = −6″ → φ = 44°58′38″.</p>\n<p><strong>Почему хватает грубого времени:</strong> ∂φ/∂t = Δ·sin t; при\nΔ ≈ 40′ (2400″) ошибка времени 0,1ᵐ = 6ˢ (≈ 4·10⁻⁴ рад) даёт в широте не\nболее ~1″. Поэтому способ удобен для ориентирования, приближённых работ\nи для подготовки к точным способам (для Цингера φ нужна до 2″).</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> φ = h − Δcos t + (Δ²/2ρ)sin²t·ctg z = h + I\n+ II + III. Δ ≈ 40′. Время — до 0,1ᵐ, 2–3 приёма — 3″.</p>\n</div>\n<p><span class=\"src\">Уралов, § 100, с. 518–521</span></p>"}, {"n": 34, "title": "Особенности наблюдений Солнца", "block": 5, "short": "<p>Солнце — яркий <strong>диск</strong>\n(диаметр ≈ 32′), а не точка, поэтому визируют на <strong>края</strong>\n(касание нитей) и приводят к центру средним из наблюдений\nпротивоположных краёв или поправкой ±R<sub>⊙</sub>. Смотреть только\nчерез <strong>густой светофильтр</strong> (или проекцией на экран).\nСолнце близко — учитывают <strong>суточный параллакс</strong> p =\np<sub>0</sub>·sin z (p<sub>0</sub> ≈ 8,8″). Его α и δ быстро меняются (δ\n— до ~1′ в час) — интерполируют на момент наблюдения. Часовой угол —\nчерез уравнение времени: t<sub>⊙</sub> = m + E (E — уравнение времени +\n12ʰ из АЕ). Рефракция и нагрев прибора солнцем — серьёзные источники\nошибок.</p>", "key": "<p>Светофильтр! Края → центр (±R<sub>⊙</sub> ≈\n16′). Параллакс p<sub>0</sub>·sin z, p<sub>0</sub> ≈ 8,8″. t<sub>⊙</sub>\n= m + E. δ<sub>⊙</sub> интерполировать на момент.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Солнце — яркий <strong>диск</strong>\n(диаметр ≈ 32′), а не точка, поэтому визируют на <strong>края</strong>\n(касание нитей) и приводят к центру средним из наблюдений\nпротивоположных краёв или поправкой ±R<sub>⊙</sub>. Смотреть только\nчерез <strong>густой светофильтр</strong> (или проекцией на экран).\nСолнце близко — учитывают <strong>суточный параллакс</strong> p =\np<sub>0</sub>·sin z (p<sub>0</sub> ≈ 8,8″). Его α и δ быстро меняются (δ\n— до ~1′ в час) — интерполируют на момент наблюдения. Часовой угол —\nчерез уравнение времени: t<sub>⊙</sub> = m + E (E — уравнение времени +\n12ʰ из АЕ). Рефракция и нагрев прибора солнцем — серьёзные источники\nошибок.</p>\n</div>\n<h3 id=\"теория-33\">Теория</h3>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 520 250\" style=\"max-width:480px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><circle cx=\"140.0\" cy=\"120.0\" r=\"95.0\" stroke=\"#1e293b\" stroke-width=\"1.4\" fill=\"#0f172a\"/><line x1=\"46.0\" y1=\"120.0\" x2=\"234.0\" y2=\"120.0\" stroke=\"#94a3b8\" stroke-width=\"1\"/><line x1=\"140.0\" y1=\"26.0\" x2=\"140.0\" y2=\"214.0\" stroke=\"#94a3b8\" stroke-width=\"1\"/><circle cx=\"172.0\" cy=\"88.0\" r=\"32.0\" stroke=\"#fbbf24\" stroke-width=\"2\" fill=\"#fde68a\"/><text x=\"140.0\" y=\"238.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"middle\">касание краями (квадрант)</text><circle cx=\"380.0\" cy=\"120.0\" r=\"95.0\" stroke=\"#1e293b\" stroke-width=\"1.4\" fill=\"#0f172a\"/><line x1=\"286.0\" y1=\"120.0\" x2=\"474.0\" y2=\"120.0\" stroke=\"#94a3b8\" stroke-width=\"1\"/><circle cx=\"380.0\" cy=\"88.0\" r=\"32.0\" stroke=\"#fbbf24\" stroke-width=\"2\" fill=\"#fde68a\" stroke-dasharray=\"4 3\"/><circle cx=\"380.0\" cy=\"152.0\" r=\"32.0\" stroke=\"#fbbf24\" stroke-width=\"2\" fill=\"#fde68a\"/><text x=\"380.0\" y=\"238.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"middle\">верхний и нижний край → центр</text></svg><figcaption><b>Рис. 24.</b> Наблюдения Солнца: наводят нить на край диска (касание), затем на противоположный край; среднее отнесено к центру. Без светофильтра смотреть нельзя.</figcaption></figure>\n<p><strong>1. Безопасность и оптика.</strong> Светофильтр на окуляр —\nобязательно. Нагрев: прибор закрывают зонтом, наблюдения быстрые; нагрев\nискажает уровни и круги.</p>\n<p><strong>2. Визирование на края.</strong> Способы:</p>\n<ul>\n<li><strong>касание</strong> нитей краями (квадрант: горизонтальной\nнитью — верхний/нижний край, вертикальной — правый/левый);</li>\n<li>наблюдения противоположных краёв (верхний при КЛ — нижний при КП и\nт. д.), чтобы в среднем получить центр;</li>\n<li>если наблюдали один край — поправка за видимый радиус R<sub>⊙</sub>\nиз АЕ (≈ 15′45″–16′17″); для азимута — с множителем cosec z.</li>\n</ul>\n<p><strong>3. Поправки к z Солнца:</strong></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>z</mi><mo>⊙</mo></msub><mo>=</mo><mi>z</mi><mi>′</mi><mo>+</mo><mi>ρ</mi><mo>−</mo><msub><mi>p</mi><mn>0</mn></msub><mo>sin</mo><mi>z</mi><mo>±</mo><msub><mi>R</mi><mo>⊙</mo></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">z_\\odot = z&#39; + \\rho - p_0\\sin z \\pm R_\\odot .</annotation></semantics></math></p>\n<p><strong>4. Координаты Солнца.</strong> α<sub>⊙</sub>, δ<sub>⊙</sub>,\nE даны в АЕ на 0ʰ эфемеридного (земного) времени: δ<sub>⊙</sub> =\nδ<sub>0</sub> + v<sub>δ</sub>·ET<sup>h</sup>, где ET = T + u + ω(T − X)\n+ ΔT. Для δ с точностью 1″ время надо знать до 1–2ᵐ.</p>\n<p><strong>5. Часовой угол</strong> — двумя путями:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>t</mi><mo>⊙</mo></msub><mo>=</mo><mi>m</mi><mo>+</mo><mi>E</mi><mo>=</mo><mi>T</mi><mo>+</mo><msub><mi>u</mi><mn>0</mn></msub><mo>+</mo><mi>E</mi><mspace width=\"1.0em\"></mspace><mrow><mtext mathvariant=\"normal\">(среднее время; </mtext><mspace width=\"0.333em\"></mspace></mrow><mi>E</mi><mo>=</mo><mi>η</mi><mo>+</mo><msup><mn>12</mn><mi>h</mi></msup><mtext mathvariant=\"normal\">)</mtext><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>t</mi><mo>⊙</mo></msub><mo>=</mo><mi>s</mi><mo>−</mo><msub><mi>α</mi><mo>⊙</mo></msub><mo>=</mo><mi>T</mi><mo>+</mo><msup><mi>u</mi><mo>*</mo></msup><mo>−</mo><msub><mi>α</mi><mo>⊙</mo></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">t_\\odot = m + E = T + u_0 + E \\quad\\text{(среднее время; } E = \\eta + 12^h\\text{)},\\qquad t_\\odot = s - \\alpha_\\odot = T + u^{*} - \\alpha_\\odot .</annotation></semantics></math></p>\n<p><strong>6. Выгоднейшие условия</strong> — те же, что для звёзд:\nширота — у меридиана (наблюдения до и после полудня), время и азимут —\nутром и вечером, у первого вертикала. z ≤ 80° (рефракция).</p>\n<p><strong>7. Достоинства и недостатки.</strong> Можно работать днём,\nмалыми приборами (Theo 010, Т-2), без эфемерид звёзд. Но точность ниже:\nразмытость краёв, нагрев, «дрожание» изображения, рефракция у горизонта.\nПоэтому по Солнцу — только <strong>приближённые</strong>\nопределения.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> Светофильтр! Края → центр (±R<sub>⊙</sub> ≈\n16′). Параллакс p<sub>0</sub>·sin z, p<sub>0</sub> ≈ 8,8″. t<sub>⊙</sub>\n= m + E. δ<sub>⊙</sub> интерполировать на момент.</p>\n</div>\n<p><span class=\"src\">Уралов, § 101–103, 109, с. 521–540,\n562–565</span></p>"}, {"n": 35, "title": "Приближённые азимут и долгота по зенитным расстояниям Солнца", "block": 5, "short": "<p>По измеренному z Солнца решают\nпараллактический треугольник. <strong>Азимут:</strong> cos A<sub>N</sub>\n= (sin δ − sin φ·cos z)/(cos φ·sin z) — время нужно лишь для\nинтерполяции δ (до 1–2ᵐ); одновременно измеряют горизонтальный угол Q до\nпредмета: a = A + Q. <strong>Долгота:</strong> cos t = (cos z − sin\nφ·sin δ)/(cos φ·cos δ) → m = t − E → поправка часов u = m − T →\nсравнивают с UT1 из радиосигналов: λ = m − UT1. Наблюдают утром и\nвечером, <strong>вблизи первого вертикала</strong>, на z ≤ 80°.</p>", "key": "<p>Азимут по z: время почти не нужно. Долгота\nпо z: λ = m − UT1, m = t − E. Оба — у первого вертикала, утро/вечер, z ≤\n80°.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> По измеренному z Солнца решают\nпараллактический треугольник. <strong>Азимут:</strong> cos A<sub>N</sub>\n= (sin δ − sin φ·cos z)/(cos φ·sin z) — время нужно лишь для\nинтерполяции δ (до 1–2ᵐ); одновременно измеряют горизонтальный угол Q до\nпредмета: a = A + Q. <strong>Долгота:</strong> cos t = (cos z − sin\nφ·sin δ)/(cos φ·cos δ) → m = t − E → поправка часов u = m − T →\nсравнивают с UT1 из радиосигналов: λ = m − UT1. Наблюдают утром и\nвечером, <strong>вблизи первого вертикала</strong>, на z ≤ 80°.</p>\n</div>\n<h3 id=\"теория-34\">Теория</h3>\n<p><strong>Азимут по z</strong> (Уралов, § 103):</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>cos</mo><msub><mi>A</mi><mi>N</mi></msub><mo>=</mo><mfrac><mrow><mo>sin</mo><mi>δ</mi><mo>−</mo><mo>sin</mo><mi>φ</mi><mo>cos</mo><mi>z</mi></mrow><mrow><mo>cos</mo><mi>φ</mi><mspace width=\"0.167em\"></mspace><mo>sin</mo><mi>z</mi></mrow></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>A</mi><mo>=</mo><msub><mi>A</mi><mi>N</mi></msub><mspace width=\"0.222em\"></mspace><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mtext mathvariant=\"normal\">восток</mtext><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>,</mo><mspace width=\"1.0em\"></mspace><mi>A</mi><mo>=</mo><msup><mn>360</mn><mo>∘</mo></msup><mo>−</mo><msub><mi>A</mi><mi>N</mi></msub><mspace width=\"0.222em\"></mspace><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mtext mathvariant=\"normal\">запад</mtext><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\cos A_N = \\frac{\\sin\\delta - \\sin\\varphi\\cos z}{\\cos\\varphi\\,\\sin z},\\qquad A = A_N\\ (\\text{восток}),\\quad A = 360^\\circ - A_N\\ (\\text{запад}).</annotation></semantics></math></p>\n<p>Дифференциальная формула:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Δ</mi><msub><mi>A</mi><mi>N</mi></msub><mo>=</mo><mfrac><mrow><mo>cos</mo><mi>t</mi><mspace width=\"0.167em\"></mspace><mi>Δ</mi><mi>φ</mi><mo>−</mo><mo>cos</mo><mi>q</mi><mspace width=\"0.167em\"></mspace><mi>Δ</mi><mi>z</mi></mrow><mrow><mo>cos</mo><mi>φ</mi><mspace width=\"0.167em\"></mspace><mo>sin</mo><mi>t</mi></mrow></mfrac><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta A_N = \\frac{\\cos t\\,\\Delta\\varphi - \\cos q\\,\\Delta z}{\\cos\\varphi\\,\\sin t} .</annotation></semantics></math></p>\n<p>Значит, выгодно: t ≈ 6ʰ (Солнце у первого вертикала, cos t ≈ 0 —\nошибка широты не влияет) и малый cos q. Половину наблюдений — утром,\nполовину — вечером (или с востока/запада), чтобы ослабить\nсистематику.</p>\n<p><strong>Методика (приём):</strong> КЛ — предмет (горизонтальный\nкруг); Солнце: касание краёв, отсчёты вертикального и горизонтального\nкругов, время; КП — Солнце, предмет. Q = M − N, a = A + Q. Пример\nУралова: Theo 010, z = 69°06′, A = 279°44′15″, Q = 78°49′27″ → a =\n358°33′42″.</p>\n<p><strong>Долгота (поправка часов) по z Солнца</strong> (Уралов, §\n102):</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>cos</mo><msub><mi>t</mi><mo>⊙</mo></msub><mo>=</mo><mfrac><mrow><mo>cos</mo><mi>z</mi><mo>−</mo><mo>sin</mo><mi>φ</mi><mo>sin</mo><mi>δ</mi></mrow><mrow><mo>cos</mo><mi>φ</mi><mo>cos</mo><mi>δ</mi></mrow></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>m</mi><mo>=</mo><msub><mi>t</mi><mo>⊙</mo></msub><mo>−</mo><mi>E</mi><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>u</mi><mn>0</mn></msub><mo>=</mo><mi>m</mi><mo>−</mo><mi>T</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\cos t_\\odot = \\frac{\\cos z - \\sin\\varphi\\sin\\delta}{\\cos\\varphi\\cos\\delta},\\qquad m = t_\\odot - E,\\qquad u_0 = m - T .</annotation></semantics></math></p>\n<p>Знак t: утром t &lt; 0 (24ʰ − t), вечером t &gt; 0. Поправка часов в\nUT — из сигналов: U = UT1 − X. Тогда</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi><mo>=</mo><msub><mi>u</mi><mn>0</mn></msub><mo>−</mo><mi>U</mi><mspace width=\"1.0em\"></mspace><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mtext mathvariant=\"normal\">приведённые к одному моменту</mtext><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>,</mo><mspace width=\"2.0em\"></mspace><mtext mathvariant=\"normal\">т. е.</mtext><mspace width=\"0.222em\"></mspace><mspace width=\"0.222em\"></mspace><mi>λ</mi><mo>=</mo><mi>m</mi><mo>−</mo><mi>U</mi><mi>T</mi><mn>1</mn><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda = u_0 - U\\quad(\\text{приведённые к одному моменту}),\\qquad\\text{т. е.}\\ \\ \\lambda = m - UT1 .</annotation></semantics></math></p>\n<p><strong>Когда наблюдать:</strong> момент прохождения через первый\nвертикал cos t<sub>1</sub> = tg δ·ctg φ (если δ<sub>⊙</sub> &gt; 0);\nнаблюдают в пределах ±1,5 ч от него; z ≤ 80°. Широту знать заранее (у\nпервого вертикала её ошибка почти не влияет). Порядок: сигналы — z\nСолнца — сигналы.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> Азимут по z: время почти не нужно. Долгота\nпо z: λ = m − UT1, m = t − E. Оба — у первого вертикала, утро/вечер, z ≤\n80°.</p>\n</div>\n<p><span class=\"src\">Уралов, § 102–103, с. 526–536</span></p>"}, {"n": 36, "title": "Азимут по часовому углу Солнца", "block": 5, "short": "<p>Азимут Солнца вычисляют по его часовому\nуглу (по времени), без измерения z: tg A = sin t / (sin φ·cos t − cos\nφ·tg δ) (A от юга). Измеряют горизонтальные направления на Солнце (края)\nи на предмет: a = A + Q. Здесь время нужно знать <strong>точно</strong>:\nошибка 1ˢ в часовом угле даёт до 15″ в азимуте, поэтому поправка часов и\nдолгота нужны с ошибкой 0,5ˢ и лучше. Выгодные условия — утро и вечер, z\n= 50–80°.</p>", "key": "<p>tg A = sin t/(sin φ cos t − cos φ tg δ). 1ˢ\n→ до 15″. Время до 0,5ˢ. Утро/вечер, z 50–80°.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Азимут Солнца вычисляют по его часовому\nуглу (по времени), без измерения z: tg A = sin t / (sin φ·cos t − cos\nφ·tg δ) (A от юга). Измеряют горизонтальные направления на Солнце (края)\nи на предмет: a = A + Q. Здесь время нужно знать <strong>точно</strong>:\nошибка 1ˢ в часовом угле даёт до 15″ в азимуте, поэтому поправка часов и\nдолгота нужны с ошибкой 0,5ˢ и лучше. Выгодные условия — утро и вечер, z\n= 50–80°.</p>\n</div>\n<h3 id=\"теория-35\">Теория</h3>\n<p><strong>Формула</strong> (из параллактического треугольника, азимут\nот юга):</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>tg</mo><mi>A</mi><mo>=</mo><mfrac><mrow><mo>sin</mo><msub><mi>t</mi><mo>⊙</mo></msub></mrow><mrow><mo>sin</mo><mi>φ</mi><mo>cos</mo><msub><mi>t</mi><mo>⊙</mo></msub><mo>−</mo><mo>cos</mo><mi>φ</mi><mspace width=\"0.167em\"></mspace><mo>tg</mo><msub><mi>δ</mi><mo>⊙</mo></msub></mrow></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>t</mi><mo>⊙</mo></msub><mo>=</mo><mi>m</mi><mo>+</mo><mi>E</mi><mo>=</mo><mi>T</mi><mo>+</mo><msub><mi>u</mi><mn>0</mn></msub><mo>+</mo><mi>E</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\operatorname{tg} A = \\frac{\\sin t_\\odot}{\\sin\\varphi\\cos t_\\odot - \\cos\\varphi\\,\\operatorname{tg}\\delta_\\odot},\\qquad t_\\odot = m + E = T + u_0 + E .</annotation></semantics></math></p>\n<p><strong>Дифференциальная формула</strong> (Уралов, § 109):</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Δ</mi><mi>A</mi><mo>=</mo><mn>15</mn><mo>cos</mo><mi>δ</mi><mfrac><mrow><mo>cos</mo><mi>q</mi></mrow><mrow><mo>sin</mo><mi>z</mi></mrow></mfrac><mspace width=\"0.167em\"></mspace><mi>Δ</mi><mi>t</mi><mo>+</mo><mfrac><mrow><mo>sin</mo><mi>A</mi></mrow><mrow><mo>tg</mo><mi>z</mi></mrow></mfrac><mspace width=\"0.167em\"></mspace><mi>Δ</mi><mi>φ</mi><mo>+</mo><mfrac><mrow><mo>sin</mo><mi>q</mi></mrow><mrow><mo>sin</mo><mi>z</mi></mrow></mfrac><mspace width=\"0.167em\"></mspace><mi>Δ</mi><mi>δ</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta A = 15\\cos\\delta\\frac{\\cos q}{\\sin z}\\,\\Delta t + \\frac{\\sin A}{\\operatorname{tg} z}\\,\\Delta\\varphi + \\frac{\\sin q}{\\sin z}\\,\\Delta\\delta .</annotation></semantics></math></p>\n<p>Для Солнца cos δ ≈ 0,9–1, поэтому, в отличие от Полярной,\n<strong>ошибка времени входит почти полностью</strong>: 1ˢ → до 15″.\nОтсюда:</p>\n<ul>\n<li>время (поправку часов) и долготу знать с точностью <strong>≤\n0,5ˢ</strong> для азимута 10″;</li>\n<li>наблюдать на <strong>больших z</strong> (50–80°) — утром и вечером:\nтогда cos q/sin z и sin A/tg z меньше.</li>\n</ul>\n<p><strong>Методика.</strong> Порядок приёма: предмет (КЛ) — Солнце:\nвертикальная нить касается <strong>западного (переднего) края</strong>,\nмомент — по хронометру/секундомеру, отсчёт горизонтального круга; затем\n<strong>восточного</strong> края — момент, отсчёт (или касание\nквадрантом); перевод трубы — то же при КП; предмет. Среднее из краёв —\nцентр (или поправка R<sub>⊙</sub>·cosec z). Перед и после — сигналы\nвремени.</p>\n<p><strong>Сравнение двух способов по Солнцу:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>По z (вопрос 35)</th>\n<th>По часовому углу</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Нужно знать точно</td>\n<td>z (вертикальный круг, рефракция)</td>\n<td>время (u, λ)</td>\n</tr>\n<tr class=\"even\">\n<td>Время</td>\n<td>до 1–2ᵐ</td>\n<td>до 0,5ˢ</td>\n</tr>\n<tr class=\"odd\">\n<td>Чувствительность к рефракции</td>\n<td>высокая</td>\n<td>нет</td>\n</tr>\n</tbody>\n</table>\n<div class=\"key\">\n<p><strong>Запомни.</strong> tg A = sin t/(sin φ cos t − cos φ tg δ). 1ˢ\n→ до 15″. Время до 0,5ˢ. Утро/вечер, z 50–80°.</p>\n</div>\n<p><span class=\"src\">Уралов, § 109, с. 562–565</span></p>"}, {"n": 37, "title": "Широта по зенитным расстояниям Солнца", "block": 5, "short": "<p>Широту выгодно определять, наблюдая Солнце\n<strong>в меридиане или вблизи него</strong> (у полудня): в кульминации\nφ = z<sub>⊙</sub> + δ<sub>⊙</sub>. При наблюдениях вблизи меридиана\nрешают треугольник через вспомогательные углы: tg M = tg δ / cos t, cos\nN = cos z·sin M / sin δ, φ = M + N. Часть наблюдений — до полудня, часть\n— после (ослабляется влияние ошибки времени). z исправляют за рефракцию\nи параллакс: z<sub>⊙</sub> = z<sub>0</sub> + ρ − p, края — к центру. 2–3\nприёма теодолитом дают несколько секунд.</p>", "key": "<p>φ = z + δ (в кульминации). Иначе: tg M = tg\nδ/cos t, cos N = cos z·sin M/sin δ, φ = M + N. Поправки: ρ,\n−p<sub>0</sub>sin z, края.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Широту выгодно определять, наблюдая Солнце\n<strong>в меридиане или вблизи него</strong> (у полудня): в кульминации\nφ = z<sub>⊙</sub> + δ<sub>⊙</sub>. При наблюдениях вблизи меридиана\nрешают треугольник через вспомогательные углы: tg M = tg δ / cos t, cos\nN = cos z·sin M / sin δ, φ = M + N. Часть наблюдений — до полудня, часть\n— после (ослабляется влияние ошибки времени). z исправляют за рефракцию\nи параллакс: z<sub>⊙</sub> = z<sub>0</sub> + ρ − p, края — к центру. 2–3\nприёма теодолитом дают несколько секунд.</p>\n</div>\n<h3 id=\"теория-36\">Теория</h3>\n<p><strong>В момент кульминации</strong> (t = 0, Солнце к югу от\nзенита):</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>φ</mi><mo>=</mo><msub><mi>z</mi><mo>⊙</mo></msub><mo>+</mo><msub><mi>δ</mi><mo>⊙</mo></msub><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\\varphi = z_\\odot + \\delta_\\odot ,</annotation></semantics></math></p>\n<p>δ<sub>⊙</sub> интерполируют на момент <strong>истинного\nполудня</strong>.</p>\n<p><strong>При произвольном (малом) t</strong> — из формулы косинуса\nстороны через вспомогательные углы (Уралов, § 101):</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>tg</mo><mi>M</mi><mo>=</mo><mfrac><mrow><mo>tg</mo><msub><mi>δ</mi><mo>⊙</mo></msub></mrow><mrow><mo>cos</mo><msub><mi>t</mi><mo>⊙</mo></msub></mrow></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><mo>cos</mo><mi>N</mi><mo>=</mo><mfrac><mrow><mo>cos</mo><msub><mi>z</mi><mo>⊙</mo></msub><mspace width=\"0.167em\"></mspace><mo>sin</mo><mi>M</mi></mrow><mrow><mo>sin</mo><msub><mi>δ</mi><mo>⊙</mo></msub></mrow></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>φ</mi><mo>=</mo><mi>M</mi><mo>+</mo><mi>N</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\operatorname{tg} M = \\frac{\\operatorname{tg}\\delta_\\odot}{\\cos t_\\odot},\\qquad \\cos N = \\frac{\\cos z_\\odot\\,\\sin M}{\\sin\\delta_\\odot},\\qquad \\varphi = M + N .</annotation></semantics></math></p>\n<p>(Вывод: cos z = sin δ (sin φ + cos φ·cos t·ctg δ) = sin δ·cos(φ −\nM)/sin M.)</p>\n<p><strong>Часовой угол:</strong> t<sub>⊙</sub> = T + u<sub>0</sub> + E\n(среднее время) или T + u* − α<sub>⊙</sub> (звёздное); поправка часов —\nиз радиосигналов при известной долготе.</p>\n<p><strong>Истинное z Солнца:</strong></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>z</mi><mo>⊙</mo></msub><mo>=</mo><msub><mi>z</mi><mn>0</mn></msub><mo>+</mo><mi>ρ</mi><mo>−</mo><msub><mi>p</mi><mn>0</mn></msub><mo>sin</mo><mi>z</mi><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>p</mi><mn>0</mn></msub><mo>≈</mo><mn>8,8</mn><mi>″</mi><mspace width=\"0.222em\"></mspace><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mo>≈</mo><mn>9</mn><mi>″</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">z_\\odot = z_0 + \\rho - p_0\\sin z ,\\qquad p_0 \\approx 8{,}8&#39;&#39;\\ (\\approx 9&#39;&#39;) .</annotation></semantics></math></p>\n<p><strong>Методика приёма:</strong> перед началом определяют место\nзенита; КЛ: визирование на верхний (нижний) край — время — отсчёт\nвертикального круга; на нижний (верхний) край — время — отсчёт; перевод\nтрубы — то же при КП. Температура и давление — для рефракции. 2–3 приёма\nдо и после кульминации.</p>\n<p><strong>Почему у меридиана:</strong> ∂z/∂φ = cos A → 1, ∂z/∂t → 0 —\nошибка времени не влияет; наблюдения симметрично до и после полудня\nкомпенсируют остаточное влияние.</p>\n<p>Пример (Уралов, табл. 107–108): Theo/У5, КЛ и КП → 55°06′29″ и\n55°06′30″.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> φ = z + δ (в кульминации). Иначе: tg M = tg\nδ/cos t, cos N = cos z·sin M/sin δ, φ = M + N. Поправки: ρ,\n−p<sub>0</sub>sin z, края.</p>\n</div>\n<p><span class=\"src\">Уралов, § 101, с. 521–526</span></p>"}, {"n": 38, "title": "Приведение φ, λ и a к центру знака", "block": 6, "short": "<p>Астрономический столб I ставят в стороне от\nцентра пункта C (на 2–3 высоты знака), поэтому найденные φ<sub>0</sub>,\nλ<sub>0</sub>, a<sub>0</sub> приводят к центру. Измеряют\n<strong>элементы приведения</strong>: горизонтальное проложение l = IC\n(с ошибкой ≤ 5 см) и астрономический азимут a направления IC (≤ 30″).\nПоправки: Δφ″ = l·cos a / M<sub>0</sub>′′ (длина 1″ дуги меридиана), Δλˢ\n= l·sin a / (15·μ) (μ — длина 1″ дуги параллели = N·cos φ/ρ″). Для\nазимута — поправка за смещение точки стояния (как приведение направлений\nк центру).</p>", "key": "<p>Δφ″ = l·cos a / M″; Δλˢ = l·sin a / (15·μ),\nμ = N cos φ/ρ″. Допуски: l ≤ 5 см, a ≤ 30″. 1″ меридиана ≈ 31 м.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Астрономический столб I ставят в стороне от\nцентра пункта C (на 2–3 высоты знака), поэтому найденные φ<sub>0</sub>,\nλ<sub>0</sub>, a<sub>0</sub> приводят к центру. Измеряют\n<strong>элементы приведения</strong>: горизонтальное проложение l = IC\n(с ошибкой ≤ 5 см) и астрономический азимут a направления IC (≤ 30″).\nПоправки: Δφ″ = l·cos a / M<sub>0</sub>′′ (длина 1″ дуги меридиана), Δλˢ\n= l·sin a / (15·μ) (μ — длина 1″ дуги параллели = N·cos φ/ρ″). Для\nазимута — поправка за смещение точки стояния (как приведение направлений\nк центру).</p>\n</div>\n<h3 id=\"теория-37\">Теория</h3>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 440 260\" style=\"max-width:400px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><line x1=\"260.0\" y1=\"20.0\" x2=\"260.0\" y2=\"250.0\" stroke=\"#64748b\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"266.0\" y=\"30.0\" fill=\"#64748b\" font-size=\"11\" text-anchor=\"start\">меридиан центра C</text><line x1=\"120.0\" y1=\"200.0\" x2=\"120.0\" y2=\"60.0\" stroke=\"#64748b\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/><text x=\"114.0\" y=\"60.0\" fill=\"#1e293b\" font-size=\"12\" text-anchor=\"end\" font-weight=\"600\">N</text><line x1=\"120.0\" y1=\"200.0\" x2=\"260.0\" y2=\"70.0\" stroke=\"#2563eb\" stroke-width=\"2\"/><text x=\"178.0\" y=\"127.0\" fill=\"#2563eb\" font-size=\"15\" text-anchor=\"middle\" font-style=\"italic\">l</text><line x1=\"120.0\" y1=\"200.0\" x2=\"260.0\" y2=\"200.0\" stroke=\"#059669\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/><circle cx=\"260.0\" cy=\"200.0\" r=\"3.2\" fill=\"#1e293b\"/><text x=\"270.0\" y=\"204.0\" fill=\"#1e293b\" font-size=\"13\" text-anchor=\"start\">K</text><text x=\"268.0\" y=\"135.0\" fill=\"#dc2626\" font-size=\"12\" text-anchor=\"start\" font-style=\"italic\">Δφ ↔ l·cos a</text><text x=\"190.0\" y=\"218.0\" fill=\"#059669\" font-size=\"12\" text-anchor=\"middle\" font-style=\"italic\">l·sin a  ↔ Δλ</text><path d=\"M120.0,160.0 A40,40 0 0 1 149.3,172.8\" stroke=\"#d97706\" stroke-width=\"1.8\" fill=\"none\"/><text x=\"136.0\" y=\"154.0\" fill=\"#d97706\" font-size=\"14\" text-anchor=\"middle\" font-style=\"italic\">a</text><rect x=\"254\" y=\"64\" width=\"12\" height=\"12\" fill=\"#dc2626\"/><text x=\"272.0\" y=\"64.0\" fill=\"#dc2626\" font-size=\"12\" text-anchor=\"start\">C — центр знака</text><circle cx=\"120.0\" cy=\"200.0\" r=\"5\" fill=\"#2563eb\"/><text x=\"112.0\" y=\"218.0\" fill=\"#2563eb\" font-size=\"12\" text-anchor=\"end\">I — астростолб</text></svg><figcaption><b>Рис. 25.</b> Приведение к центру знака: измеряют расстояние l (≤ 5 см погрешность) и азимут a (≤ 30″) от столба на центр.</figcaption></figure>\n<p><strong>Вывод</strong> (Уралов, § 40.7). Опустим перпендикуляр IK на\nмеридиан C. Треугольник IKC мал — считаем плоским:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K</mi><mi>C</mi><mo>=</mo><mi>l</mi><mo>cos</mo><mi>a</mi><mspace width=\"0.222em\"></mspace><mo>⇒</mo><mspace width=\"0.222em\"></mspace><mi>Δ</mi><mi>φ</mi><mi>″</mi><mo>=</mo><mfrac><mrow><mi>l</mi><mo>cos</mo><mi>a</mi></mrow><msub><mi>M</mi><mn>0</mn></msub></mfrac><mi>ρ</mi><mi>″</mi><mo>=</mo><mfrac><mrow><mi>l</mi><mo>cos</mo><mi>a</mi></mrow><mrow><msub><mi>M</mi><mn>0</mn></msub><mi>″</mi></mrow></mfrac><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">KC = l\\cos a\\ \\Rightarrow\\ \\Delta\\varphi&#39;&#39; = \\frac{l\\cos a}{M_0}\\rho&#39;&#39; = \\frac{l\\cos a}{M_0&#39;&#39;},</annotation></semantics></math></p>\n<p>где M<sub>0</sub> — радиус кривизны меридиана, M<sub>0</sub>″ =\nM<sub>0</sub>/ρ″ — длина дуги 1″ меридиана (≈ 30,9 м; таблица 53 АТ по\nφ<sub>0</sub>).</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mi>K</mi><mo>=</mo><mi>l</mi><mo>sin</mo><mi>a</mi><mspace width=\"0.222em\"></mspace><mo>⇒</mo><mspace width=\"0.222em\"></mspace><mi>Δ</mi><msup><mi>λ</mi><mi>s</mi></msup><mo>=</mo><mfrac><mrow><mi>l</mi><mo>sin</mo><mi>a</mi></mrow><mrow><mn>15</mn><mspace width=\"0.167em\"></mspace><mi>μ</mi></mrow></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>μ</mi><mo>=</mo><mfrac><mrow><msub><mi>N</mi><mn>0</mn></msub><mo>cos</mo><msub><mi>φ</mi><mn>0</mn></msub></mrow><mrow><mi>ρ</mi><mi>″</mi></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">IK = l\\sin a\\ \\Rightarrow\\ \\Delta\\lambda^{s} = \\frac{l\\sin a}{15\\,\\mu},\\qquad \\mu = \\frac{N_0\\cos\\varphi_0}{\\rho&#39;&#39;}</annotation></semantics></math></p>\n<p>(μ — длина дуги 1″ параллели, ≈ 30,9·cos φ м; N<sub>0</sub> — радиус\nкривизны первого вертикала). Итог:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>φ</mi><mo>=</mo><msub><mi>φ</mi><mn>0</mn></msub><mo>+</mo><mfrac><mrow><mi>l</mi><mo>cos</mo><mi>a</mi></mrow><mrow><msub><mi>M</mi><mn>0</mn></msub><mi>″</mi></mrow></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>λ</mi><mo>=</mo><msub><mi>λ</mi><mn>0</mn></msub><mo>+</mo><mfrac><mrow><mi>l</mi><mo>sin</mo><mi>a</mi></mrow><mrow><mn>15</mn><mspace width=\"0.167em\"></mspace><mi>μ</mi></mrow></mfrac><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\varphi = \\varphi_0 + \\frac{l\\cos a}{M_0&#39;&#39;},\\qquad \\lambda = \\lambda_0 + \\frac{l\\sin a}{15\\,\\mu} .</annotation></semantics></math></p>\n<p><strong>Порядок величин:</strong> l = 30 м → до 1″ по широте и до\n0,1ˢ по долготе — значит, редукция обязательна (требования 0,3″ и\n0,03ˢ).</p>\n<p><strong>Приведение азимута.</strong> Направление с I на предмет W и с\nC на W расходятся на угол</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>δ</mi><mi>″</mi><mo>=</mo><mfrac><mrow><mi>l</mi><mo>sin</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>θ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><mi>D</mi></mfrac><mi>ρ</mi><mi>″</mi><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\\delta&#39;&#39; = \\frac{l\\sin(\\theta)}{D}\\rho&#39;&#39; ,</annotation></semantics></math></p>\n<p>где θ — угол при I между направлением на центр C и на предмет, D —\nрасстояние до предмета; это поправка за <strong>центрировку</strong>\n(как в триангуляции). Кроме того, меридианы в I и C не параллельны\n(сходимость), но на десятках метров это пренебрежимо. Если наблюдаемый\nпредмет — тоже не в центре, учитывают и <strong>редукцию</strong>\nвизирной цели.</p>\n<p><strong>Как измеряют элементы:</strong> l — рулеткой/лентой (≤ 5 см),\na — теодолитом от направления с известным азимутом или по Полярной (≤\n30″).</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> Δφ″ = l·cos a / M″; Δλˢ = l·sin a / (15·μ),\nμ = N cos φ/ρ″. Допуски: l ≤ 5 см, a ≤ 30″. 1″ меридиана ≈ 31 м.</p>\n</div>\n<p><span class=\"src\">Уралов, § 40.7, с. 196–197</span></p>"}, {"n": 39, "title": "Приведение φ, λ, a к среднему полюсу (МУН)", "block": 6, "short": "<p>Ось вращения Земли перемещается в теле\nЗемли (движение полюса: амплитуда ~0,3″ ≈ 10 м, главные периоды ~433 сут\n(Чандлер) и 1 год). Поэтому наблюдённые («мгновенные») φ′, λ′, a′\nотносятся к мгновенному полюсу и меняются со временем. Их приводят к\n<strong>международному условному началу</strong> (МУН, CIO; сейчас —\nIERS Reference Pole) по координатам мгновенного полюса x, y из\nбюллетеней службы времени: φ = φ′ − (x·cos λ − y·sin λ); λ = λ′ − (x·sin\nλ + y·cos λ)·tg φ (в секундах дуги, затем /15); a = a′ − (x·sin λ +\ny·cos λ)·sec φ.</p>", "key": "<p>φ = φ′ − (x cos λ − y sin λ); λ = λ′ − (x\nsin λ + y cos λ) tg φ / 15; a = a′ − (x sin λ + y cos λ) sec φ. x, y —\nиз бюллетеней на дату. Время — UT1.</p>", "body": "<div class=\"ans\">\n<p><strong>Коротко.</strong> Ось вращения Земли перемещается в теле\nЗемли (движение полюса: амплитуда ~0,3″ ≈ 10 м, главные периоды ~433 сут\n(Чандлер) и 1 год). Поэтому наблюдённые («мгновенные») φ′, λ′, a′\nотносятся к мгновенному полюсу и меняются со временем. Их приводят к\n<strong>международному условному началу</strong> (МУН, CIO; сейчас —\nIERS Reference Pole) по координатам мгновенного полюса x, y из\nбюллетеней службы времени: φ = φ′ − (x·cos λ − y·sin λ); λ = λ′ − (x·sin\nλ + y·cos λ)·tg φ (в секундах дуги, затем /15); a = a′ − (x·sin λ +\ny·cos λ)·sec φ.</p>\n</div>\n<h3 id=\"теория-38\">Теория</h3>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 440 265\" style=\"max-width:410px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><line x1=\"210.0\" y1=\"160.0\" x2=\"210.0\" y2=\"20.0\" stroke=\"#1e293b\" stroke-width=\"1.4\" marker-end=\"url(#ar)\"/><text x=\"218.0\" y=\"28.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"start\">X (к Гринвичу, λ = 0°)</text><line x1=\"210.0\" y1=\"160.0\" x2=\"40.0\" y2=\"160.0\" stroke=\"#1e293b\" stroke-width=\"1.4\" marker-end=\"url(#ar)\"/><text x=\"40.0\" y=\"152.0\" fill=\"#1e293b\" font-size=\"11\" text-anchor=\"start\">Y (к λ = 90° W)</text><path d=\"M225.0,120.0 L226.3,123.7 L227.0,127.8 L227.1,132.1 L226.5,136.6 L225.1,141.1 L223.0,145.5 L220.1,149.8 L216.4,153.6 L212.0,157.0 L207.0,159.8 L201.5,161.8 L195.5,163.1 L189.2,163.4 L182.7,162.8 L176.2,161.1 L169.9,158.5 L163.9,154.8 L158.4,150.2 L153.5,144.7 L149.3,138.4 L146.1,131.5 L143.9,123.9 L142.8,116.0 L142.8,107.8 L144.1,99.7 L146.6,91.6 L150.3,83.9 L155.2,76.7 L161.1,70.2 L168.0,64.6 L175.8,60.0 L184.2,56.5 L193.1,54.3 L202.3,53.3 L211.7,53.7 L221.0,55.5 L229.9,58.7 L238.4,63.1 L246.2,68.7 L253.1,75.4 L259.0,83.1 L263.7,91.6 L267.2,100.7 L269.3,110.3 L270.0,120.0 L269.3,129.7 L267.2,139.3 L263.7,148.4 L259.0,156.9 L253.1,164.6 L246.2,171.3 L238.4,176.9 L229.9,181.3 L221.0,184.5 L211.7,186.3 L202.3,186.7 L193.1,185.7 L184.2,183.5 L175.8,180.0 L168.0,175.4 L161.1,169.8 L155.2,163.3 L150.3,156.1 L146.6,148.4 L144.1,140.3 L142.8,132.2 L142.8,124.0 L143.9,116.1 L146.1,108.5 L149.3,101.6 L153.5,95.3 L158.4,89.8 L163.9,85.2 L169.9,81.5 L176.2,78.9 L182.7,77.2 L189.2,76.6 L195.5,76.9 L201.5,78.2 L207.0,80.2 L212.0,83.0 L216.4,86.4 L220.1,90.2 L223.0,94.5 L225.1,98.9 L226.5,103.4 L227.1,107.9 L227.0,112.2 L226.3,116.3 L225.0,120.0 \" stroke=\"#2563eb\" stroke-width=\"1.2\" fill=\"none\"/><circle cx=\"250.0\" cy=\"85.0\" r=\"5\" fill=\"#dc2626\"/><text x=\"260.0\" y=\"79.0\" fill=\"#dc2626\" font-size=\"12\" text-anchor=\"start\">P — мгновенный полюс</text><line x1=\"250.0\" y1=\"85.0\" x2=\"250.0\" y2=\"160.0\" stroke=\"#dc2626\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"250.0\" y1=\"85.0\" x2=\"210.0\" y2=\"85.0\" stroke=\"#dc2626\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><text x=\"254.0\" y=\"176.0\" fill=\"#dc2626\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">x</text><text x=\"198.0\" y=\"89.0\" fill=\"#dc2626\" font-size=\"13\" text-anchor=\"end\" font-style=\"italic\">y</text><circle cx=\"210.0\" cy=\"160.0\" r=\"5\" fill=\"#1e293b\"/><text x=\"200.0\" y=\"180.0\" fill=\"#1e293b\" font-size=\"12\" text-anchor=\"end\">МУН (средний полюс)</text><text x=\"90.0\" y=\"250.0\" fill=\"#2563eb\" font-size=\"11\" text-anchor=\"start\">траектория полюса: амплитуда ~0,3″ (≈ 10 м), период ~433 сут</text></svg><figcaption><b>Рис. 26.</b> Движение полюса относительно международного условного начала (МУН). Координаты x, y берут из бюллетеней службы времени (IERS).</figcaption></figure>\n<p><strong>Что такое МУН.</strong> Решение XIV Генеральной ассамблеи\nМГГС (1967–1969): за начало отсчёта движения полюса принято положение,\nсоответствующее принятым широтам пяти станций Международной службы\nшироты; номинально — средний полюс 1900–1905 гг. Ось X — к Гринвичу (λ =\n0°), ось Y — к долготе 90° W.</p>\n<p><strong>Формулы редукций</strong> (Уралов, § 40.8):</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>φ</mi><mo>=</mo><mi>φ</mi><mi>′</mi><mo>−</mo><mi>Δ</mi><msub><mi>φ</mi><mi>p</mi></msub><mo>=</mo><mi>φ</mi><mi>′</mi><mo>−</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>x</mi><mo>cos</mo><mi>λ</mi><mo>−</mo><mi>y</mi><mo>sin</mo><mi>λ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\\varphi = \\varphi&#39; - \\Delta\\varphi_p = \\varphi&#39; - (x\\cos\\lambda - y\\sin\\lambda),</annotation></semantics></math></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi><mo>=</mo><mi>λ</mi><mi>′</mi><mo>−</mo><mi>Δ</mi><msub><mi>λ</mi><mi>p</mi></msub><mo>=</mo><mi>λ</mi><mi>′</mi><mo>−</mo><mfrac><mn>1</mn><mn>15</mn></mfrac><mspace width=\"0.167em\"></mspace><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>x</mi><mo>sin</mo><mi>λ</mi><mo>+</mo><mi>y</mi><mo>cos</mo><mi>λ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>tg</mo><mi>φ</mi><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\\lambda = \\lambda&#39; - \\Delta\\lambda_p = \\lambda&#39; - \\frac{1}{15}\\,(x\\sin\\lambda + y\\cos\\lambda)\\operatorname{tg}\\varphi ,</annotation></semantics></math></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mi>a</mi><mi>′</mi><mo>−</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>x</mi><mo>sin</mo><mi>λ</mi><mo>+</mo><mi>y</mi><mo>cos</mo><mi>λ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>sec</mo><mi>φ</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">a = a&#39; - (x\\sin\\lambda + y\\cos\\lambda)\\sec\\varphi .</annotation></semantics></math></p>\n<p>(Знаки — при x, y в смысле IERS: Y положителен к 90° W; λ — восточная\nдолгота.)</p>\n<p><strong>Физический смысл.</strong> Если полюс сместился к нашему\nмеридиану на x, полюс мира для нас поднялся → наблюдённая широта больше\nна x·cos λ. Поправка в долготу приходит через изменение направления\nмеридиана (поворот плоскости меридиана), поэтому с множителем tg φ, а в\nазимут — с sec φ.</p>\n<p><strong>Формула долготы</strong> верна, если время взято в системе\n<strong>UT1</strong> (уже отнесённой к МУН). Если бы использовалось UT0\nстанции, понадобилась бы другая редукция.</p>\n<p><strong>Откуда x, y.</strong> Ранее — бюллетени «Всемирное время»\n(серии A, E) Межведомственной комиссии единой службы времени; сейчас —\nбюллетени IERS (Bulletin A, B) и ГСВЧ. Берут на эпоху (дату)\nнаблюдений.</p>\n<p><strong>Порядок величины:</strong> x, y до 0,3″ → поправка в широту\nдо 0,3–0,4″ — сопоставима с требуемой точностью 0,3″, поэтому для\nпунктов Лапласа учитывать <strong>обязательно</strong>.</p>\n<div class=\"key\">\n<p><strong>Запомни.</strong> φ = φ′ − (x cos λ − y sin λ); λ = λ′ − (x\nsin λ + y cos λ) tg φ / 15; a = a′ − (x sin λ + y cos λ) sec φ. x, y —\nиз бюллетеней на дату. Время — UT1.</p>\n</div>\n<p><span class=\"src\">Уралов, § 40.8, с. 197–198</span></p>"}], "extras": {"notation": "\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Символ</th>\n<th>Что это</th>\n<th>Как запомнить</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>φ</td>\n<td>астрономическая широта</td>\n<td>высота полюса мира над горизонтом</td>\n</tr>\n<tr class=\"even\">\n<td>λ</td>\n<td>астрономическая долгота</td>\n<td>разность местного и гринвичского времени</td>\n</tr>\n<tr class=\"odd\">\n<td>a</td>\n<td>астрономический азимут земного предмета</td>\n<td>от точки N по часовой стрелке</td>\n</tr>\n<tr class=\"even\">\n<td>A</td>\n<td>азимут светила</td>\n<td>у Уралова чаще от точки <strong>юга</strong> S</td>\n</tr>\n<tr class=\"odd\">\n<td>z</td>\n<td>зенитное расстояние</td>\n<td>z = 90° − h, h — высота</td>\n</tr>\n<tr class=\"even\">\n<td>α, δ</td>\n<td>прямое восхождение и склонение звезды</td>\n<td>«адрес» звезды, берут из АЕ (Астрономического ежегодника)</td>\n</tr>\n<tr class=\"odd\">\n<td>t</td>\n<td>часовой угол</td>\n<td>t = s − α</td>\n</tr>\n<tr class=\"even\">\n<td>s, S</td>\n<td>местное и гринвичское звёздное время</td>\n<td>λ = s − S</td>\n</tr>\n<tr class=\"odd\">\n<td>T, u, ω</td>\n<td>показание хронометра, его поправка, ход</td>\n<td>s = T + u</td>\n</tr>\n<tr class=\"even\">\n<td>x, y</td>\n<td>поправки предварительных координат</td>\n<td>x = Δφ, y = 15·cos φ·Δu (в секундах дуги)</td>\n</tr>\n</tbody>\n</table>\n<p>Главная формула всей дисциплины — <strong>формула косинуса\nстороны</strong> параллактического треугольника:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>cos</mo><mi>z</mi><mo>=</mo><mo>sin</mo><mi>φ</mi><mspace width=\"0.167em\"></mspace><mo>sin</mo><mi>δ</mi><mo>+</mo><mo>cos</mo><mi>φ</mi><mspace width=\"0.167em\"></mspace><mo>cos</mo><mi>δ</mi><mspace width=\"0.167em\"></mspace><mo>cos</mo><mi>t</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\\cos z = \\sin\\varphi\\,\\sin\\delta + \\cos\\varphi\\,\\cos\\delta\\,\\cos t .</annotation></semantics></math></p>\n<figure class=\"fig\"><svg role=\"img\" viewBox=\"0 0 430 270\" style=\"max-width:380px\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, sans-serif\" font-size=\"12\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1e293b\"/></marker><marker id=\"arb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2563eb\"/></marker><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#dc2626\"/></marker><marker id=\"arg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#059669\"/></marker></defs><path d=\"M90,70 Q210,40 330,60\" stroke=\"#1e293b\" stroke-width=\"1.8\" fill=\"none\"/><path d=\"M330,60 Q310,160 250,245\" stroke=\"#1e293b\" stroke-width=\"1.8\" fill=\"none\"/><path d=\"M90,70 Q140,190 250,245\" stroke=\"#1e293b\" stroke-width=\"1.8\" fill=\"none\"/><circle cx=\"90.0\" cy=\"70
