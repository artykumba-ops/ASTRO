.0\" r=\"3.2\" fill=\"#1e293b\"/><text x=\"76.0\" y=\"64.0\" fill=\"#1e293b\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"600\">P</text><circle cx=\"330.0\" cy=\"60.0\" r=\"3.2\" fill=\"#1e293b\"/><text x=\"344.0\" y=\"54.0\" fill=\"#1e293b\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"600\">Z</text><polygon points=\"250.0,237.0 252.1,242.1 257.6,242.5 253.4,246.1 254.7,251.5 250.0,248.6 245.3,251.5 246.6,246.1 242.4,242.5 247.9,242.1\" fill=\"#dc2626\"/><text x=\"254.0\" y=\"269.0\" fill=\"#dc2626\" font-size=\"13\" text-anchor=\"middle\">σ (светило)</text><text x=\"210.0\" y=\"36.0\" fill=\"#2563eb\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">90° − φ</text><text x=\"325.0\" y=\"165.0\" fill=\"#dc2626\" font-size=\"15\" text-anchor=\"middle\" font-style=\"italic\">z</text><text x=\"110.0\" y=\"175.0\" fill=\"#d97706\" font-size=\"13\" text-anchor=\"middle\" font-style=\"italic\">90° − δ</text><path d=\"M120,66 A30,30 0 0 1 112,92\" stroke=\"#059669\" stroke-width=\"1.6\" fill=\"none\"/><text x=\"130.0\" y=\"92.0\" fill=\"#059669\" font-size=\"14\" text-anchor=\"middle\" font-style=\"italic\">t</text><path d=\"M300,58 A30,30 0 0 0 324,88\" stroke=\"#059669\" stroke-width=\"1.6\" fill=\"none\"/><text x=\"284.0\" y=\"94.0\" fill=\"#059669\" font-size=\"12\" text-anchor=\"middle\" font-style=\"italic\">180° − A</text><path d=\"M236,221 A26,26 0 0 1 260,221\" stroke=\"#059669\" stroke-width=\"1.6\" fill=\"none\"/><text x=\"250.0\" y=\"211.0\" fill=\"#059669\" font-size=\"14\" text-anchor=\"middle\" font-style=\"italic\">q</text></svg><figcaption><b>Рис. 1.</b> Параллактический треугольник PZσ: стороны 90° − φ, z, 90° − δ; углы t (часовой), 180° − A (азимут от юга), q (параллактический).</figcaption></figure>\n", "cheat": "\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Что</th>\n<th>Значение / формула</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Точность (Инструкция)</td>\n<td>φ 0,3″ · λ 0,03ˢ · a 0,5″</td>\n</tr>\n<tr class=\"even\">\n<td>Пункты Лапласа</td>\n<td>через 70–110 км; 18–20 на полигон 1 класса; на концах базисных\nсторон</td>\n</tr>\n<tr class=\"odd\">\n<td>АГН</td>\n<td>астропункты ≤ 125 км (грависъёмка 1/200 км²), иначе ~60 км</td>\n</tr>\n<tr class=\"even\">\n<td>Хронометр</td>\n<td>вариация суточного хода ≤ 0,5ˢ, двухчасового ≤ 0,06ˢ</td>\n</tr>\n<tr class=\"odd\">\n<td>Основная формула</td>\n<td>cos z = sin φ sin δ + cos φ cos δ cos t</td>\n</tr>\n<tr class=\"even\">\n<td>Уравнение поправок</td>\n<td>−ζ + cos A·x + sin A·y + l = v; l = z<sub>выч</sub> −\nz<sub>изм</sub></td>\n</tr>\n<tr class=\"odd\">\n<td>x, y</td>\n<td>φ = φ<sub>0</sub> + x; λ = λ<sub>0</sub> + y·sec φ/15</td>\n</tr>\n<tr class=\"even\">\n<td>Веса</td>\n<td>равномерно: P<sub>x</sub> = P<sub>y</sub> = n/2; пара: 2cos²A (φ),\n2sin²A (время)</td>\n</tr>\n<tr class=\"odd\">\n<td>Рефракция</td>\n<td>z = z′ + ρ, ρ ≈ 60″·tg z</td>\n</tr>\n<tr class=\"even\">\n<td>Суточная аберрация</td>\n<td>0,32″·cos φ; ΔT<sub>a</sub> = −0,021ˢ·cos z</td>\n</tr>\n<tr class=\"odd\">\n<td>Контактный микрометр</td>\n<td>Δz = ±(±Ш<sub>к</sub> − M<sub>x</sub>)R/2; «+» запад</td>\n</tr>\n<tr class=\"even\">\n<td>Личная ошибка</td>\n<td>«глаз-ухо» до 0,5ˢ; Δλ = −ΔT</td>\n</tr>\n<tr class=\"odd\">\n<td>Талькотт</td>\n<td>φ = ½(δ<sub>S</sub> + δ<sub>N</sub>) + ½(z<sub>S</sub> −\nz<sub>N</sub>); Δz ≤ 20′; 10–12 пар (АУ), 16–18 (У5)</td>\n</tr>\n<tr class=\"even\">\n<td>Цингер</td>\n<td>A<sub>E</sub> = 360° − A<sub>W</sub>; z 18–55°; A<sub>W</sub>\n60–120°; ≥ 6 серий × 6–8 пар</td>\n</tr>\n<tr class=\"odd\">\n<td>Певцов</td>\n<td>A<sub>S</sub> = 180° − A<sub>N</sub>; z 15–50°; 26ˢ ≤ интервал ≤\n15ᵐ; 12–15 пар</td>\n</tr>\n<tr class=\"even\">\n<td>Сомнер</td>\n<td>n = 6–8 звёзд, z 10–60°, по кругу азимутов; ~1″</td>\n</tr>\n<tr class=\"odd\">\n<td>Полярная, азимут</td>\n<td>a = A + Q; ≥ 18 приёмов, ≥ 3 дня; A<sub>N</sub> ≈ −Δ sin t sec(φ + Δ\ncos t)</td>\n</tr>\n<tr class=\"even\">\n<td>Полярная, широта</td>\n<td>φ = h + I + II + III; 2–3 приёма → 3″</td>\n</tr>\n<tr class=\"odd\">\n<td>Солнце</td>\n<td>R<sub>⊙</sub> ≈ 16′; p<sub>0</sub> ≈ 8,8″; t = m + E; z ≤ 80°</td>\n</tr>\n<tr class=\"even\">\n<td>Уравнение Лапласа</td>\n<td>α<sub>г</sub> = a − 15(λ − L) sin B</td>\n</tr>\n<tr class=\"odd\">\n<td>Уклонения отвеса</td>\n<td>ξ = φ − B; η = (λ − L) cos φ</td>\n</tr>\n<tr class=\"even\">\n<td>Центр знака</td>\n<td>Δφ = l cos a / M″; Δλ = l sin a /(15 μ)</td>\n</tr>\n<tr class=\"odd\">\n<td>МУН</td>\n<td>φ = φ′ − (x cos λ − y sin λ)</td>\n</tr>\n<tr class=\"even\">\n<td>Шкалы времени</td>\n<td>UT1 = UTC + DUT1 (+dUT1);</td>\n</tr>\n</tbody>\n</table>\n"}, "cards": [{"id": "c0", "t": 1, "f": "Что изучает геодезическая астрономия?", "b": "Теорию и методы определения астрономических широты φ, долготы λ и азимута a направлений из наблюдений небесных светил."}, {"id": "c1", "t": 1, "f": "Астрономическая широта φ", "b": "Угол между отвесной линией в точке и плоскостью экватора. На небесной сфере — высота полюса мира над горизонтом и склонение зенита."}, {"id": "c2", "t": 1, "f": "Астрономическая долгота λ", "b": "Двугранный угол между плоскостями астрономического меридиана пункта и гринвичского меридиана; во времени λ = s − S."}, {"id": "c3", "t": 1, "f": "Астрономический азимут a", "b": "Двугранный угол между плоскостью меридиана и вертикальной плоскостью через предмет; от точки севера по часовой стрелке."}, {"id": "c4", "t": 1, "f": "Склонение и прямое восхождение зенита", "b": "δ<sub>Z</sub> = φ, α<sub>Z</sub> = s (местное звёздное время)."}, {"id": "c5", "t": 1, "f": "Основная формула (косинус стороны)", "b": "cos z = sin φ·sin δ + cos φ·cos δ·cos t"}, {"id": "c6", "t": 1, "f": "Часовой угол t через показание хронометра", "b": "t = s − α = T + u − α"}, {"id": "c7", "t": 1, "f": "Как найти азимут предмета?", "b": "a = A + Q: A — вычисленный азимут светила, Q — измеренный горизонтальный угол между светилом и предметом."}, {"id": "c8", "t": 1, "f": "Минимум светил для определения положения зенита", "b": "Два светила с известными α, δ; лучше всего — в двух взаимно перпендикулярных вертикалах."}, {"id": "c9", "t": 1, "f": "Параллактический треугольник PZσ: стороны", "b": "PZ = 90° − φ, Zσ = z, Pσ = 90° − δ; углы: t (при P), 180° − A (при Z), q (при σ)."}, {"id": "c10", "t": 1, "f": "Составляющие уклонения отвесной линии", "b": "ξ = φ − B, η = (λ − L)·cos φ"}, {"id": "c11", "t": 2, "f": "Уравнение Лапласа", "b": "α<sub>г</sub> = a − (λ − L)·sin φ (в секундах: a − 15(λ − L)ˢ·sin B)"}, {"id": "c12", "t": 2, "f": "Пункт Лапласа", "b": "Пункт, на котором определены астрономические φ, λ и a; даёт азимут Лапласа — «угловой базис» сети."}, {"id": "c13", "t": 2, "f": "Расстояние между пунктами Лапласа в рядах 1 класса", "b": "70–110 км"}, {"id": "c14", "t": 2, "f": "Сколько пунктов Лапласа в полигоне 1 класса", "b": "Минимум 18–20"}, {"id": "c15", "t": 2, "f": "Где ставят пункты Лапласа в сплошных сетях 1–2 класса", "b": "На обоих концах базисной стороны (в середине полигона)."}, {"id": "c16", "t": 2, "f": "Астропункты на линиях АГН", "b": "Не реже чем через 125 км при грависъёмке 1 пункт/200 км²; около 60 км, где детальной грависъёмки нет."}, {"id": "c17", "t": 2, "f": "Зачем нужны азимуты Лапласа", "b": "Ограничивают накопление азимутальных ошибок в рядах триангуляции и полигонометрии, ориентируют сеть."}, {"id": "c18", "t": 3, "f": "Точность широты по Инструкции", "b": "СКП не более 0,3″"}, {"id": "c19", "t": 3, "f": "Точность долготы по Инструкции", "b": "СКП не более 0,03ˢ"}, {"id": "c20", "t": 3, "f": "Точность астрономического азимута по Инструкции", "b": "СКП не более 0,5″"}, {"id": "c21", "t": 3, "f": "Допуск на вариацию суточного хода хронометра", "b": "≤ 0,5ˢ (вариация двухчасового хода ≤ 0,06ˢ)"}, {"id": "c22", "t": 3, "f": "Элементы приведения к центру: допуски", "b": "Расстояние l — с ошибкой ≤ 5 см, азимут — ≤ 30″."}, {"id": "c23", "t": 4, "f": "Зенитальные способы", "b": "Основаны на измерении зенитных расстояний светил или моментов, когда светила достигают одного z."}, {"id": "c24", "t": 4, "f": "Выгоднейшее положение светил для широты (зенитальные)", "b": "В меридиане: ∂z/∂φ = cos A = ±1, а ошибка времени не влияет (sin A = 0)."}, {"id": "c25", "t": 4, "f": "Выгоднейшее положение светил для времени (зенитальные)", "b": "В первом вертикале: ∂z/∂t = 15·cos φ·sin A максимально, ошибка широты не влияет."}, {"id": "c26", "t": 4, "f": "Дифференциальная формула Δz", "b": "Δz = cos A·Δφ + 15·cos φ·sin A·Δt − cos q·Δδ"}, {"id": "c27", "t": 4, "f": "Зачем наблюдают пары звёзд на равных z", "b": "Постоянные ошибки (рефракция, место зенита, гнутие) входят одинаково и сокращаются."}, {"id": "c28", "t": 4, "f": "Как растёт ошибка времени с широтой", "b": "Пропорционально sec φ."}, {"id": "c29", "t": 5, "f": "Азимутальные способы", "b": "Основаны на измерении горизонтальных направлений на светила (и предмет)."}, {"id": "c30", "t": 5, "f": "Место севера M<sub>N</sub>", "b": "Отсчёт горизонтального круга, соответствующий направлению на север: M<sub>N</sub> = N − A, a = M − M<sub>N</sub>."}, {"id": "c31", "t": 5, "f": "Формула азимута по часовому углу", "b": "ctg A = sin φ·ctg t − cos φ·tg δ·cosec t"}, {"id": "c32", "t": 5, "f": "Почему для азимута берут Полярную", "b": "Ошибка времени входит с множителем cos δ ≈ 0,014; звезда всегда у меридиана."}, {"id": "c33", "t": 5, "f": "Влияние наклона оси и коллимации на направления", "b": "Наклон: b·ctg z; коллимация: c·cosec z."}, {"id": "c34", "t": 6, "f": "Астрономические теодолиты (примеры)", "b": "АУ 2″/10″, АУ 01, У5, Wild T-4, ДКМ-3А"}, {"id": "c35", "t": 6, "f": "Зенит-телескоп", "b": "Инструмент для определения широты способом Талькотта (службы широты)."}, {"id": "c36", "t": 6, "f": "Пассажный инструмент", "b": "Определение времени по моментам прохождения звёзд через меридиан."}, {"id": "c37", "t": 6, "f": "Призменная астролябия", "b": "Наблюдение моментов прохождения звёзд через альмукантарат (способ равных высот)."}, {"id": "c38", "t": 7, "f": "Ломаная труба", "b": "Окуляр на конце горизонтальной оси — удобно наблюдать светила у зенита."}, {"id": "c39", "t": 7, "f": "Уровень Талькотта", "b": "Чувствительный уровень на трубе; сохраняет неизменный наклон трубы при её повороте на 180° по азимуту."}, {"id": "c40", "t": 7, "f": "Накладной уровень", "b": "Ставится на горизонтальную ось, измеряет её наклон."}, {"id": "c41", "t": 7, "f": "Три геометрических условия теодолита", "b": "Вертикальная ось отвесна; горизонтальная ⟂ вертикальной; визирная ⟂ горизонтальной."}, {"id": "c42", "t": 7, "f": "Гнутие трубы", "b": "Δz = g·sin z"}, {"id": "c43", "t": 8, "f": "Где ставят астрономический столб", "b": "В стороне от знака, на расстоянии 2–3 высот знака."}, {"id": "c44", "t": 8, "f": "Способ Комстока", "b": "Полевое определение цены деления уровня: повороты алидады вокруг наклонённой (~1°) вертикальной оси."}, {"id": "c45", "t": 8, "f": "Как определяют цену оборота окулярного микрометра", "b": "По наблюдениям звёзд в элонгации (движутся почти по вертикалу)."}, {"id": "c46", "t": 8, "f": "Ориентирование в меридиане для Талькотта на постоянных нитях", "b": "С ошибкой не более 1,5–2′."}, {"id": "c47", "t": 9, "f": "Типы хронометров", "b": "Механические (морские средние и звёздные), палубные часы, секундомеры; кварцевые (ПКХ-4, «Альтаир»); атомные стандарты."}, {"id": "c48", "t": 9, "f": "Чем определяется качество хронометра", "b": "Постоянством хода (малыми вариациями), а не величиной хода."}, {"id": "c49", "t": 9, "f": "Ход звёздного хронометра относительно среднего времени", "b": "≈ −3ᵐ56ˢ в сутки (большой, но постоянный — не вредит)."}, {"id": "c50", "t": 9, "f": "СКП вариации хода", "b": "m = √([Δω²]/(n − 1)), Δω = ω<sub>i</sub> − ω̄"}, {"id": "c51", "t": 10, "f": "Поправка хронометра u", "b": "Величина, которую прибавляют к показанию T, чтобы получить точное время: u = s − T (или m − T)."}, {"id": "c52", "t": 10, "f": "Ход хронометра ω", "b": "Изменение поправки за единицу времени: ω = (u₂ − u₁)/(T₂ − T₁)."}, {"id": "c53", "t": 10, "f": "ω < 0 означает…", "b": "Поправка уменьшается — хронометр спешит (уходит вперёд)."}, {"id": "c54", "t": 10, "f": "ω > 0 означает…", "b": "Поправка растёт — хронометр отстаёт."}, {"id": "c55", "t": 10, "f": "Передача поправки", "b": "u = u₁ + ω(T − T₁); внутри интервала — интерполирование, вне — экстраполирование."}, {"id": "c56", "t": 11, "f": "UT1", "b": "Всемирное время по вращению Земли, исправленное за движение полюса — нужно для долготы."}, {"id": "c57", "t": 11, "f": "UTC", "b": "Координированное время: атомная секунда, скачки по 1ˢ, |UT1 − UTC| < 0,9ˢ. В нём передаются сигналы."}, {"id": "c58", "t": 11, "f": "Связь UT1 и UTC", "b": "UT1 = UTC + DUT1 + dUT1"}, {"id": "c59", "t": 11, "f": "Поправка за распространение радиоволн", "b": "D/c (D — расстояние до станции, c ≈ 300 000 км/с)."}, {"id": "c60", "t": 11, "f": "TAI", "b": "Международное атомное время (секунда СИ)."}, {"id": "c61", "t": 12, "f": "Метод совпадений", "b": "Удары звёздного хронометра постепенно обгоняют сигналы среднего времени и совпадают с ними примерно каждые 6 минут; совпадение ловится точно."}, {"id": "c62", "t": 12, "f": "Гринвичское звёздное время по UT1", "b": "S = S₀ + UT1·(1 + μ), μ = 0,0027379"}, {"id": "c63", "t": 12, "f": "Местное звёздное время из сигналов", "b": "s = S + λ; u = s − T"}, {"id": "c64", "t": 12, "f": "Зачем принимать сигналы до и после наблюдений", "b": "Чтобы получить поправку и ход и интерполировать поправку на момент каждой звезды."}, {"id": "c65", "t": 13, "f": "Метод «глаз-ухо»", "b": "Оценка момента прохождения на глаз между ударами хронометра; личная ошибка до 0,5ˢ, нестабильная."}, {"id": "c66", "t": 13, "f": "Контактный (безличный) микрометр", "b": "Наблюдатель удерживает подвижную нить на звезде; контакты барабана автоматически пишут моменты на хронограф."}, {"id": "c67", "t": 13, "f": "Хронограф", "b": "Прибор, записывающий секундные контакты хронометра и отметки наблюдений."}, {"id": "c68", "t": 14, "f": "Зенитное расстояние при двух кругах", "b": "z = ½(L − R); место зенита MZ = ½(L + R)"}, {"id": "c69", "t": 14, "f": "Рефракция", "b": "Поднимает светило: z = z′ + ρ, ρ = ρ₀·γ·B, ρ₀ ≈ 60″·tg z."}, {"id": "c70", "t": 14, "f": "Поправка за ускорение", "b": "Нужна, если z вычислено со средним моментом; максимальна в меридиане, ноль в первом вертикале."}, {"id": "c71", "t": 14, "f": "Редукции к z Солнца", "b": "Рефракция +ρ, параллакс −p₀·sin z (p₀ ≈ 8,8″), радиус ±R<sub>⊙</sub>."}, {"id": "c72", "t": 15, "f": "Источники случайных ошибок z", "b": "Визирование, отсчёт круга, определение наклона по уровню, остаточная рефракция и гнутие."}, {"id": "c73", "t": 15, "f": "Ошибка визирования на неподвижный предмет", "b": "m = b/W (b = 30–60″ — разрешающая способность глаза, W — увеличение)."}, {"id": "c74", "t": 15, "f": "Формула Рейнгерца", "b": "m<sub>i</sub> = 0,20″·√τ — ошибка наклона по уровню."}, {"id": "c75", "t": 15, "f": "Суммарная случайная ошибка z (2″ теодолит)", "b": "≈ 1″ (для 5″ теодолита ≈ 1,6″)."}, {"id": "c76", "t": 15, "f": "Остаточная рефракция и гнутие", "b": "До 1–2″ при 10° < z < 70°; при равных z (разность ≤ 5–7°) — 0,2–0,3″."}, {"id": "c77", "t": 16, "f": "Уравнение поправок зенитальных способов", "b": "−ζ + cos A·x + sin A·y + l = v (A от юга)"}, {"id": "c78", "t": 16, "f": "Свободный член l", "b": "l = z<sub>выч</sub> − z<sub>изм</sub>"}, {"id": "c79", "t": 16, "f": "Неизвестные x и y", "b": "x = φ − φ₀, y = 15·cos φ·(u − u₀)"}, {"id": "c80", "t": 16, "f": "Широта и долгота из x, y", "b": "φ = φ₀ + x; λ = λ₀ + (y/15)·sec φ"}, {"id": "c81", "t": 16, "f": "Неизвестное ζ", "b": "Постоянная ошибка всех z: место зенита при одном круге, остаточная рефракция."}, {"id": "c82", "t": 16, "f": "Линия положения", "b": "Прямая ⟂ азимуту светила, смещённая на свободный член l от предполагаемого зенита; зенит — общая точка линий."}, {"id": "c83", "t": 17, "f": "Ошибка единицы веса", "b": "μ = √([pvv]/(n − k)), k — число неизвестных"}, {"id": "c84", "t": 17, "f": "Веса при равномерном распределении звёзд по азимутам", "b": "P<sub>x</sub> = P<sub>y</sub> = n/2, P<sub>ζ</sub> = n"}, {"id": "c85", "t": 17, "f": "Ошибка неизвестного", "b": "m<sub>x</sub> = μ/√P<sub>x</sub>"}, {"id": "c86", "t": 18, "f": "Вес пары для широты", "b": "P<sub>x</sub> = 2·cos²A"}, {"id": "c87", "t": 18, "f": "Вес пары для времени", "b": "P<sub>y</sub> = 2·sin²A"}, {"id": "c88", "t": 18, "f": "Предел зенитных расстояний", "b": "Обычно 10° < z < 60° (рефракция)."}, {"id": "c89", "t": 19, "f": "Три признака классификации зенитальных способов", "b": "Что измеряют (z / малую разность z / моменты на равных z); что определяют (φ+λ / φ / λ); число звёзд (n / пары / одно светило)."}, {"id": "c90", "t": 19, "f": "Способы на равных высотах", "b": "Певцова (широта), Цингера (время), Гаусса–Мазаева (φ и λ), призменная астролябия."}, {"id": "c91", "t": 20, "f": "Лично-инструментальное уравнение", "b": "Постоянная систематическая ошибка наблюдателя в фиксации моментов, ΔT; «глаз-ухо» — до 0,5ˢ."}, {"id": "c92", "t": 20, "f": "Влияние личной ошибки на долготу", "b": "Входит целиком: Δλ = −ΔT; никакой программой не исключается."}, {"id": "c93", "t": 20, "f": "Лично-инструментальная разность", "b": "Δλ = λ<sub>осн</sub> − λ′<sub>набл</sub> на основном пункте; определяют до и после сезона."}, {"id": "c94", "t": 20, "f": "Влияние личной ошибки на широту", "b": "Исключается при симметричном расположении звёзд (по азимутам, парами)."}, {"id": "c95", "t": 21, "f": "Постоянная суточной аберрации", "b": "0,32″·cos φ; смещение к точке востока E"}, {"id": "c96", "t": 21, "f": "Поправка момента за суточную аберрацию", "b": "ΔT<sub>a</sub> = −0,021ˢ·cos z (всегда вычитают)"}, {"id": "c97", "t": 21, "f": "Поправка за ширину контактов и мёртвый ход", "b": "Δz = ±(±Ш<sub>к</sub> − M<sub>x</sub>)·R/2; «+» для западных звёзд, «−» для восточных"}, {"id": "c98", "t": 21, "f": "Где суточная аберрация максимальна", "b": "В первом вертикале; в меридиане равна нулю."}, {"id": "c99", "t": 22, "f": "Способ Сомнера", "b": "Совместное определение φ и λ по z нескольких (6–8) светил, равномерно по азимутам, z = 10–60°."}, {"id": "c100", "t": 22, "f": "Кто решил задачу раньше Самнера", "b": "Русский моряк Акимов (1839); Самнер — 1843."}, {"id": "c101", "t": 22, "f": "Достоинства способа Сомнера", "b": "Гибкость: без эфемерид, яркие звёзды, просветы облаков, днём — Солнце."}, {"id": "c102", "t": 23, "f": "Недостаток способа Сомнера", "b": "Не исключает систематических ошибок по z (рефракция, гнутие) — только приближённые определения."}, {"id": "c103", "t": 23, "f": "Точность Сомнера (У5, 6 звёзд)", "b": "m<sub>φ</sub> ≈ 1,0″, m<sub>λ</sub> ≈ 0,07ˢ·sec φ (μ = 1,8″)."}, {"id": "c104", "t": 24, "f": "Формула Талькотта", "b": "φ = ½(δ<sub>S</sub> + δ<sub>N</sub>) + ½(z<sub>S</sub> − z<sub>N</sub>)"}, {"id": "c105", "t": 24, "f": "Допустимая разность z пары Талькотта", "b": "Не более 20′ (до 30′)."}, {"id": "c106", "t": 24, "f": "Чем измеряют разность z у Талькотта", "b": "Окулярным микрометром; наклон трубы контролирует уровень Талькотта."}, {"id": "c107", "t": 24, "f": "Автор идеи способа Талькотта", "b": "Датский астроном П. Горребоу (1740); Талькотт — практическая разработка (1857)."}, {"id": "c108", "t": 24, "f": "Рабочие эфемериды Талькотта", "b": "ГАО и ЦНИИГАиК (Положенцев): 2957 звёзд, 20154 пары, ~9 пар в час."}, {"id": "c109", "t": 25, "f": "Два метода наблюдений у Талькотта", "b": "В произвольных малых часовых углах и на постоянных вертикальных нитях."}, {"id": "c110", "t": 25, "f": "Пар Талькотта для 0,3″", "b": "10–12 пар (АУ 2″/10″), 16–18 пар (У5)."}, {"id": "c111", "t": 25, "f": "Что делают между звёздами пары", "b": "Поворачивают прибор на 180° по азимуту, не меняя наклона трубы."}, {"id": "c112", "t": 26, "f": "Неизвестные при уравнивании Талькотта", "b": "Δφ и поправка цены оборота микрометра ΔR."}, {"id": "c113", "t": 26, "f": "Уравнение поправок Талькотта", "b": "Δφ − b<sub>i</sub>·ΔR + l<sub>i</sub> = v<sub>i</sub>, b = ½(M<sub>S</sub> − M<sub>N</sub>), l = φ<sub>ср</sub> − φ<sub>i</sub>"}, {"id": "c114", "t": 26, "f": "Условие максимального веса широты у Талькотта", "b": "[b] = ½[(M<sub>S</sub> − M<sub>N</sub>)] ≈ 0 — пары с разными знаками."}, {"id": "c115", "t": 27, "f": "Способ Цингера", "b": "Время (долгота) по парам звёзд E и W на равных высотах вблизи первого вертикала."}, {"id": "c116", "t": 27, "f": "Условие симметрии пары Цингера", "b": "A<sub>E</sub> = 360° − A<sub>W</sub>, δ<sub>E</sub> ≈ δ<sub>W</sub>"}, {"id": "c117", "t": 27, "f": "y из пары Цингера", "b": "y = −[cl]/[cc] = (l<sub>E</sub> − l<sub>W</sub>)/(2·sin A<sub>W</sub>), вес 2·sin²A<sub>W</sub>"}, {"id": "c118", "t": 27, "f": "Что исключается в способе Цингера", "b": "ζ (рефракция, гнутие, место зенита) и x (ошибка широты)."}, {"id": "c119", "t": 27, "f": "Условия выбора пар Цингера", "b": "z от 18–20° до 50–55°, азимуты западных звёзд 60–120°."}, {"id": "c120", "t": 27, "f": "Программа Цингера для 1 класса", "b": "Не менее 6 серий по 6–8 пар."}, {"id": "c121", "t": 27, "f": "Время на одну пару Цингера", "b": "Около 5 минут."}, {"id": "c122", "t": 28, "f": "Долгота из серии Цингера", "b": "λ′ = λ₀ + (y<sub>ср</sub>/15)·sec φ, y<sub>ср</sub> = [P<sub>y</sub>y]/[P<sub>y</sub>]"}, {"id": "c123", "t": 28, "f": "Оценка точности серии Цингера", "b": "μ = √([P<sub>y</sub>v²]/(n − 1)), m<sub>y</sub> = μ/√[P<sub>y</sub>]"}, {"id": "c124", "t": 29, "f": "Способ Певцова", "b": "Широта по парам звёзд N и S на равных высотах вблизи меридиана."}, {"id": "c125", "t": 29, "f": "Условие симметрии пары Певцова", "b": "A<sub>S</sub> = 180° − A<sub>N</sub> (симметрия относительно первого вертикала)."}, {"id": "c126", "t": 29, "f": "Что исключается в способе Певцова", "b": "ζ и y (ошибка времени)."}, {"id": "c127", "t": 29, "f": "x из пары Певцова", "b": "x = −[bl]/[bb], вес P<sub>x</sub> = 2·cos²A<sub>N</sub>"}, {"id": "c128", "t": 29, "f": "Условия Инструкции для пар Певцова", "b": "z 15–50° (в 60–70° — до 60°); интервал между звёздами 26ˢ…15ᵐ."}, {"id": "c129", "t": 29, "f": "z пары Певцова", "b": "cos z = (sin δ<sub>N</sub> + sin δ<sub>S</sub>)/(2·sin φ)"}, {"id": "c130", "t": 30, "f": "Пар Певцова для 0,3″", "b": "12–15 пар (Инструкция)."}, {"id": "c131", "t": 30, "f": "Широта из пар Певцова", "b": "x<sub>φ</sub> = [P<sub>x</sub>x]/[P<sub>x</sub>], φ = φ₀ + x<sub>φ</sub>"}, {"id": "c132", "t": 31, "f": "Азимут Полярной (приближённо)", "b": "A<sub>N</sub> ≈ −Δ·sin t·sec(φ + Δ·cos t), Δ = 90° − δ"}, {"id": "c133", "t": 31, "f": "Склонение Полярной и Δ", "b": "δ ≈ +89°11′…+89°20′, Δ ≈ 40′"}, {"id": "c134", "t": 31, "f": "Программа азимута по Полярной (высокоточно)", "b": "Не менее 18 приёмов за не менее 3 дней, лимб переставляют."}, {"id": "c135", "t": 31, "f": "Влияние ошибки времени 1ˢ на азимут по Полярной", "b": "≈ 0,2″·sec φ (множитель cos δ)."}, {"id": "c136", "t": 31, "f": "Контроль места севера в полуприёмах", "b": "Расхождение не более 8″."}, {"id": "c137", "t": 32, "f": "Средняя ошибка азимута на пункте", "b": "m<sub>a</sub> = √([vv]/(n(n − 1)))"}, {"id": "c138", "t": 32, "f": "Ошибка геодезического азимута", "b": "m<sub>αг</sub> = √(m<sub>a</sub>² + 15²(m<sub>λ</sub>² + m<sub>L</sub>²)·sin²B)"}, {"id": "c139", "t": 33, "f": "Широта по Полярной (таблицы АЕ)", "b": "φ = h + I + II + III"}, {"id": "c140", "t": 33, "f": "Широта по Полярной (формула)", "b": "φ = 90° − z − Δ·cos t + (Δ²/2ρ)·sin²t·ctg z"}, {"id": "c141", "t": 33, "f": "Точность широты по Полярной (Theo 010)", "b": "2–3 приёма — до 3″; время нужно до 0,1ᵐ."}, {"id": "c142", "t": 34, "f": "Видимый радиус Солнца", "b": "≈ 16′ (15′45″–16′17″)"}, {"id": "c143", "t": 34, "f": "Горизонтальный параллакс Солнца", "b": "p₀ ≈ 8,8″ (≈ 9″); поправка −p₀·sin z"}, {"id": "c144", "t": 34, "f": "Часовой угол Солнца по среднему времени", "b": "t<sub>⊙</sub> = m + E (E — уравнение времени + 12ʰ из АЕ)"}, {"id": "c145", "t": 34, "f": "Главное правило безопасности при наблюдении Солнца", "b": "Только через густой светофильтр."}, {"id": "c146", "t": 35, "f": "Азимут по z светила", "b": "cos A<sub>N</sub> = (sin δ − sin φ·cos z)/(cos φ·sin z)"}, {"id": "c147", "t": 35, "f": "Часовой угол по z Солнца", "b": "cos t = (cos z − sin φ·sin δ)/(cos φ·cos δ)"}, {"id": "c148", "t": 35, "f": "Долгота по z Солнца", "b": "λ = m − UT1 (m = t<sub>⊙</sub> − E)"}, {"id": "c149", "t": 35, "f": "Когда наблюдать Солнце для времени и азимута по z", "b": "Утром/вечером, вблизи первого вертикала (±1,5 ч), z ≤ 80°."}, {"id": "c150", "t": 36, "f": "Азимут по часовому углу Солнца", "b": "tg A = sin t/(sin φ·cos t − cos φ·tg δ)"}, {"id": "c151", "t": 36, "f": "Ошибка 1ˢ во времени → азимут по Солнцу", "b": "До 15″; время нужно до 0,5ˢ."}, {"id": "c152", "t": 36, "f": "Выгодные z для азимута по часовому углу Солнца", "b": "50–80° (утро и вечер)."}, {"id": "c153", "t": 37, "f": "Широта по Солнцу в кульминации", "b": "φ = z<sub>⊙</sub> + δ<sub>⊙</sub>"}, {"id": "c154", "t": 37, "f": "Широта по Солнцу при малом t", "b": "tg M = tg δ/cos t; cos N = cos z·sin M/sin δ; φ = M + N"}, {"id": "c155", "t": 38, "f": "Поправка широты за центр знака", "b": "Δφ″ = l·cos a / M″ (M″ — длина 1″ дуги меридиана ≈ 31 м)"}, {"id": "c156", "t": 38, "f": "Поправка долготы за центр знака", "b": "Δλˢ = l·sin a /(15·μ), μ = N·cos φ/ρ″"}, {"id": "c157", "t": 39, "f": "МУН", "b": "Международное условное начало — средний полюс (около среднего положения 1900–1905 гг.)."}, {"id": "c158", "t": 39, "f": "Приведение широты к МУН", "b": "φ = φ′ − (x·cos λ − y·sin λ)"}, {"id": "c159", "t": 39, "f": "Приведение долготы к МУН", "b": "λ = λ′ − (x·sin λ + y·cos λ)·tg φ /15"}, {"id": "c160", "t": 39, "f": "Приведение азимута к МУН", "b": "a = a′ − (x·sin λ + y·cos λ)·sec φ"}, {"id": "c161", "t": 39, "f": "Амплитуда и период движения полюса", "b": "~0,3″ (≈ 10 м), период Чандлера ~433 сут + годовой."}], "quiz": [{"id": "q0", "t": 1, "q": "Чему равно склонение зенита?", "o": ["Широте φ", "Местному звёздному времени s", "Долготе λ", "90° − φ"], "a": 0, "e": "Зенит лежит на угловом расстоянии φ от экватора, поэтому δ<sub>Z</sub> = φ."}, {"id": "q1", "t": 1, "q": "Чему равно прямое восхождение зенита?", "o": ["Местному звёздному времени s", "Широте φ", "Гринвичскому звёздному времени S", "Часовому углу t"], "a": 0, "e": "α<sub>Z</sub> = s — определение местного звёздного времени."}, {"id": "q2", "t": 1, "q": "Как вычисляется часовой угол светила по хронометру?", "o": ["t = T + u − α", "t = T − u + α", "t = α − s", "t = T + λ"], "a": 0, "e": "t = s − α, а s = T + u."}, {"id": "q3", "t": 1, "q": "Астрономические координаты отнесены к…", "o": ["отвесной линии", "нормали к эллипсоиду", "оси вращения Земли", "радиус-вектору центра Земли"], "a": 0, "e": "Отличие от геодезических (нормаль) — уклонение отвеса."}, {"id": "q4", "t": 1, "q": "Что из перечисленного — составляющая уклонения отвеса?", "o": ["η = (λ − L)·cos φ", "η = λ − L", "ξ = B − φ", "ξ = (φ − B)·cos φ"], "a": 0, "e": "ξ = φ − B, η = (λ − L)·cos φ."}, {"id": "q5", "t": 2, "q": "Уравнение Лапласа:", "o": ["α<sub>г</sub> = a − (λ − L)·sin φ", "α<sub>г</sub> = a + (φ − B)·sin λ", "α<sub>г</sub> = a − (λ − L)·cos φ", "α<sub>г</sub> = a·cos φ"], "a": 0, "e": "Азимут Лапласа получают из астрономического азимута и разности долгот."}, {"id": "q6", "t": 2, "q": "Через какое расстояние размещают пункты Лапласа в рядах 1 класса?", "o": ["70–110 км", "20–30 км", "200–250 км", "5–10 км"], "a": 0, "e": "По Инструкции — 70–110 км."}, {"id": "q7", "t": 2, "q": "Сколько пунктов Лапласа минимум в полигоне 1 класса?", "o": ["18–20", "4–6", "50", "1"], "a": 0, "e": "Уралов, § 1."}, {"id": "q8", "t": 3, "q": "Требование Инструкции к СКП широты на пунктах Лапласа:", "o": ["0,3″", "0,03″", "1″", "0,5″"], "a": 0, "e": "φ — 0,3″, λ — 0,03ˢ, a — 0,5″."}, {"id": "q9", "t": 3, "q": "Требование Инструкции к СКП долготы:", "o": ["0,03ˢ", "0,3ˢ", "0,003ˢ", "0,5″"], "a": 0, "e": "0,03ˢ ≈ 0,45″·cos φ по дуге."}, {"id": "q10", "t": 3, "q": "Требование к СКП астрономического азимута:", "o": ["0,5″", "0,3″", "1,5″", "5″"], "a": 0, "e": "Азимут — 0,5″."}, {"id": "q11", "t": 3, "q": "Допустимая СКВ вариации суточного хода хронометра:", "o": ["0,5ˢ", "0,05ˢ", "2ˢ", "0,01ˢ"], "a": 0, "e": "Двухчасового — 0,06ˢ."}, {"id": "q12", "t": 4, "q": "Где выгоднее всего наблюдать светила для определения широты зенитальным способом?", "o": ["В меридиане", "В первом вертикале", "У горизонта", "В элонгации"], "a": 0, "e": "∂z/∂φ = cos A максимально, ошибка времени не влияет."}, {"id": "q13", "t": 4, "q": "Где выгоднее всего наблюдать светила для определения времени?", "o": ["В первом вертикале", "В меридиане", "В зените", "У полюса"], "a": 0, "e": "∂z/∂t = 15 cos φ sin A максимально при A = ±90°."}, {"id": "q14", "t": 4, "q": "Зачем звёзды наблюдают парами на равных z?", "o": ["Чтобы исключить постоянные ошибки (рефракция, место зенита)", "Чтобы не принимать радиосигналы", "Чтобы не нужен был каталог", "Чтобы ускорить вычисления"], "a": 0, "e": "Одинаковые для обеих звёзд ошибки сокращаются."}, {"id": "q15", "t": 4, "q": "Кто из авторов — русский военный геодезист, способ широты по равным высотам?", "o": ["Певцов", "Талькотт", "Горребоу", "Самнер"], "a": 0, "e": "Певцов — широта; Цингер — время."}, {"id": "q16", "t": 5, "q": "Отсчёт горизонтального круга, соответствующий направлению на север, называют…", "o": ["местом севера M<sub>N</sub>", "местом зенита", "коллимацией", "рэном"], "a": 0, "e": "a = M − M<sub>N</sub>."}, {"id": "q17", "t": 5, "q": "Влияние наклона горизонтальной оси на направление при зенитном расстоянии z:", "o": ["b·ctg z", "b·sin z", "b·cosec z", "b·cos z"], "a": 0, "e": "Коллимация — c·cosec z."}, {"id": "q18", "t": 5, "q": "Почему для азимута выгодна Полярная?", "o": ["Ошибка времени умножается на cos δ ≈ 0,014", "Она самая яркая", "У неё нет рефракции", "Она всегда в зените"], "a": 0, "e": "ΔA = 15 cos δ cos q / sin z · Δt."}, {"id": "q19", "t": 6, "q": "Для способа Талькотта специально предназначен…", "o": ["зенит-телескоп", "пассажный инструмент", "нивелир", "призменная астролябия"], "a": 0, "e": "Зенит-телескоп — уровень при трубе и окулярный микрометр."}, {"id": "q20", "t": 6, "q": "Призменная астролябия используется для…", "o": ["наблюдений на равных высотах", "измерения азимута по Полярной", "определения цены деления уровня", "приёма сигналов"], "a": 0, "e": "Моменты прохождения через альмукантарат 30° или 45°."}, {"id": "q21", "t": 7, "q": "Зачем у астрономического теодолита ломаная труба?", "o": ["Чтобы удобно наблюдать светила у зенита", "Чтобы уменьшить вес", "Чтобы исключить коллимацию", "Для увеличения поля зрения"], "a": 0, "e": "Окуляр выведен вдоль горизонтальной оси."}, {"id": "q22", "t": 7, "q": "Уровень Талькотта скреплён…", "o": ["с трубой", "с горизонтальным кругом", "с подставкой", "с микроскопом"], "a": 0, "e": "Сохраняет наклон трубы при повороте на 180°."}, {"id": "q23", "t": 8, "q": "На каком расстоянии от знака ставят астрономический столб?", "o": ["2–3 высоты знака", "1 м", "100 м", "Строго в центре"], "a": 0, "e": "Чтобы знак не закрывал небо; потом — приведение к центру."}, {"id": "q24", "t": 8, "q": "Способ Комстока служит для определения…", "o": ["цены деления уровня", "цены оборота микрометра", "места зенита", "хода хронометра"], "a": 0, "e": "Повороты алидады вокруг наклонённой вертикальной оси."}, {"id": "q25", "t": 9, "q": "Качество хронометра определяется…", "o": ["вариациями хода", "величиной хода", "величиной поправки", "размером циферблата"], "a": 0, "e": "Ход может быть большим, но должен быть постоянным."}, {"id": "q26", "t": 10, "q": "Ход хронометра отрицателен. Это значит, что хронометр…", "o": ["спешит", "отстаёт", "остановился", "идёт по звёздному времени"], "a": 0, "e": "Поправка уменьшается — показания убегают вперёд."}, {"id": "q27", "t": 10, "q": "u₁ = +2,40ˢ в 20ʰ, u₂ = +2,10ˢ в 22ʰ. Поправка в 21ʰ:", "o": ["+2,25ˢ", "+2,10ˢ", "+2,55ˢ", "+2,40ˢ"], "a": 0, "e": "ω = −0,15ˢ/ч; u = 2,40 − 0,15 = 2,25ˢ."}, {"id": "q28", "t": 11, "q": "Связь UT1 и UTC:", "o": ["UT1 = UTC + DUT1 + dUT1", "UTC = UT1 + TAI", "UT1 = UTC − λ", "UT1 = TAI + 32ˢ"], "a": 0, "e": "DUT1 передаётся в сигналах."}, {"id": "q29", "t": 11, "q": "Наибольшее допустимое |UT1 − UTC|:", "o": ["0,9ˢ", "0,1ˢ", "1 мин", "37ˢ"], "a": 0, "e": "Поддерживается скачками секунды."}, {"id": "q30", "t": 11, "q": "Задержка сигнала от станции в 3000 км:", "o": ["≈ 0,01ˢ", "≈ 1ˢ", "≈ 0,0001ˢ", "≈ 0,1ˢ"], "a": 0, "e": "3000/300000 = 0,01ˢ."}, {"id": "q31", "t": 12, "q": "В методе совпадений совпадения происходят примерно через…", "o": ["6 минут", "1 секунду", "1 час", "24 часа"], "a": 0, "e": "Звёздная секунда короче средней на 1/366."}, {"id": "q32", "t": 12, "q": "Местное звёздное время из гринвичского:", "o": ["s = S + λ", "s = S − λ", "s = S·λ", "s = S + 12ʰ"], "a": 0, "e": "Восточная долгота положительна."}, {"id": "q33", "t": 13, "q": "Какой метод регистрации даёт наименьшую и стабильную личную ошибку?", "o": ["Контактный микрометр", "«Глаз-ухо»", "Палубные часы с помощником", "Визуальная оценка без часов"], "a": 0, "e": "Сотые доли секунды."}, {"id": "q34", "t": 13, "q": "Личная ошибка при «глаз-ухо» может достигать…", "o": ["0,5ˢ", "0,005ˢ", "5ˢ", "1 мин"], "a": 0, "e": "Редко до 0,8ˢ."}, {"id": "q35", "t": 14, "q": "Как связаны видимое z′ и истинное z?", "o": ["z = z′ + ρ", "z = z′ − ρ", "z = z′·ρ", "z = ρ − z′"], "a": 0, "e": "Рефракция поднимает светило."}, {"id": "q36", "t": 14, "q": "Средняя рефракция приблизительно равна…", "o": ["60″·tg z", "60″·sin z", "1′·cos z", "0,32″·cos φ"], "a": 0, "e": "ρ₀ ≈ 60,4″·tg z."}, {"id": "q37", "t": 14, "q": "Поправка за ускорение максимальна…", "o": ["в меридиане", "в первом вертикале", "у горизонта", "везде одинакова"], "a": 0, "e": "В первом вертикале она равна нулю."}, {"id": "q38", "t": 15, "q": "Главная случайная ошибка z при наблюдениях на произвольных z:", "o": ["остаточная рефракция и гнутие (до 1–2″)", "ошибка уровня (0,01″)", "ошибка часов", "аберрация"], "a": 0, "e": "Поэтому наблюдают на равных z."}, {"id": "q39", "t": 15, "q": "Формула ошибки наклона по уровню (Рейнгерц):", "o": ["0,20″·√τ", "0,2·τ²", "τ/2", "√τ"], "a": 0, "e": "τ — цена деления."}, {"id": "q40", "t": 16, "q": "Свободный член уравнения поправок:", "o": ["l = z<sub>выч</sub> − z<sub>изм</sub>", "l = z<sub>изм</sub> + ζ", "l = φ − φ₀", "l = cos A"], "a": 0, "e": "Вычисленное минус измеренное."}, {"id": "q41", "t": 16, "q": "Коэффициент при x (A от юга):", "o": ["cos A", "sin A", "−1", "15 cos φ"], "a": 0, "e": "∂z/∂φ = cos A."}, {"id": "q42", "t": 16, "q": "Неизвестное y равно…", "o": ["15·cos φ·(u − u₀)", "φ − φ₀", "λ − L", "ζ·cos A"], "a": 0, "e": "λ = λ₀ + (y/15) sec φ."}, {"id": "q43", "t": 16, "q": "Линия положения ориентирована…", "o": ["перпендикулярно азимуту светила", "по азимуту светила", "по меридиану", "по первому вертикалу"], "a": 0, "e": "Смещена от Z₀ на l."}, {"id": "q44", "t": 17, "q": "Ошибка единицы веса при 3 неизвестных:", "o": ["√([vv]/(n − 3))", "√([vv]/n)", "√([vv]/(n − 1))", "[vv]/n"], "a": 0, "e": "n − k степеней свободы."}, {"id": "q45", "t": 17, "q": "При равномерном распределении n звёзд по азимутам P<sub>x</sub> =", "o": ["n/2", "n", "2n", "1"], "a": 0, "e": "[cos²A] = n/2."}, {"id": "q46", "t": 18, "q": "Вес пары звёзд для широты (A — азимут):", "o": ["2·cos²A", "2·sin²A", "cos A", "n/2"], "a": 0, "e": "Для времени — 2·sin²A."}, {"id": "q47", "t": 18, "q": "Вес пары Цингера при A<sub>W</sub> = 90°:", "o": ["2,00", "1,18", "1,50", "0"], "a": 0, "e": "2·sin²90° = 2."}, {"id": "q48", "t": 19, "q": "К способам, где измеряют моменты на равных высотах, относится…", "o": ["способ Цингера", "способ Талькотта", "способ Струве", "азимут по Полярной"], "a": 0, "e": "Также Певцов и Мазаев."}, {"id": "q49", "t": 19, "q": "Малую разность z окулярным микрометром измеряют в способе…", "o": ["Талькотта", "Сомнера", "Цингера", "Певцова"], "a": 0, "e": "Горребоу–Талькотт."}, {"id": "q50", "t": 20, "q": "Влияние личной ошибки ΔT на долготу:", "o": ["Δλ = −ΔT, не исключается", "исключается парами E–W", "равно нулю", "ΔT·sin φ"], "a": 0, "e": "Определяют личную разность на основном пункте."}, {"id": "q51", "t": 20, "q": "Лично-инструментальную разность определяют…", "o": ["на основном пункте до и после сезона", "на каждом пункте ночью", "по Солнцу", "по Полярной"], "a": 0, "e": "Δλ = λ<sub>осн</sub> − λ′<sub>набл</sub>."}, {"id": "q52", "t": 21, "q": "Поправка момента за суточную аберрацию:", "o": ["−0,021ˢ·cos z", "+0,32″·cos φ", "−0,021ˢ·sin z", "0,0027ˢ"], "a": 0, "e": "Из Δz = −0,32″ cos φ sin A cos z."}, {"id": "q53", "t": 21, "q": "Суточная аберрация смещает светило к…", "o": ["точке востока", "точке запада", "зениту", "полюсу"], "a": 0, "e": "Апекс суточного движения наблюдателя — E."}, {"id": "q54", "t": 21, "q": "Знак поправки за контакты для западной звезды:", "o": ["«+»", "«−»", "всегда 0", "зависит от широты"], "a": 0, "e": "Для восточных — «−»."}, {"id": "q55", "t": 22, "q": "Способ Сомнера определяет…", "o": ["φ и λ совместно", "только φ", "только азимут", "только время"], "a": 0, "e": "n светил в разных вертикалах."}, {"id": "q56", "t": 22, "q": "Рекомендуемые z в способе Сомнера:", "o": ["10–60°", "0–5°", "70–90°", "ровно 45°"], "a": 0, "e": "Ограничение по рефракции."}, {"id": "q57", "t": 23, "q": "Почему Сомнер не годится для пунктов Лапласа?", "o": ["Не исключает систематику по z", "Требует 100 звёзд", "Нельзя ночью", "Нет формул"], "a": 0, "e": "Звёзды на разных z."}, {"id": "q58", "t": 24, "q": "Формула Талькотта:", "o": ["φ = ½(δ<sub>S</sub> + δ<sub>N</sub>) + ½(z<sub>S</sub> − z<sub>N</sub>)", "φ = ½(δ<sub>S</sub> − δ<sub>N</sub>) + ½(z<sub>S</sub> + z<sub>N</sub>)", "φ = δ<sub>N</sub> + z<sub>N</sub>", "φ = (δ<sub>S</sub> + z<sub>N</sub>)/2"], "a": 0, "e": "Из φ = δ<sub>S</sub> + z<sub>S</sub> = δ<sub>N</sub> − z<sub>N</sub>."}, {"id": "q59", "t": 24, "q": "Разность z звёзд пары Талькотта не превышает…", "o": ["20–30′", "5°", "1″", "10°"], "a": 0, "e": "Измеряется микрометром."}, {"id": "q60", "t": 24, "q": "Идея способа Талькотта принадлежит…", "o": ["Горребоу (1740)", "Гауссу", "Цингеру", "Акимову"], "a": 0, "e": "Талькотт — практическая разработка."}, {"id": "q61", "t": 25, "q": "Что нельзя менять между звёздами пары Талькотта?", "o": ["Наклон трубы", "Азимут", "Освещение", "Положение помощника"], "a": 0, "e": "Поворачивают на 180° по азимуту."}, {"id": "q62", "t": 25, "q": "Сколько пар Талькотта нужно с АУ 2″/10″ для 0,3″?", "o": ["10–12", "2–3", "40–50", "100"], "a": 0, "e": "С У5 — 16–18."}, {"id": "q63", "t": 26, "q": "Зачем уравнивают широты Талькотта совместно?", "o": ["Уточнить цену оборота микрометра R", "Уточнить долготу", "Найти ход хронометра", "Найти место зенита"], "a": 0, "e": "R меняется на 0,2–0,3″."}, {"id": "q64", "t": 26, "q": "Коэффициент b<sub>i</sub> в уравнивании Талькотта:", "o": ["½(M<sub>S</sub> − M<sub>N</sub>)", "M<sub>S</sub> + M<sub>N</sub>", "cos A", "φ − φ₀"], "a": 0, "e": "Δφ − b·ΔR + l = v."}, {"id": "q65", "t": 27, "q": "Симметрия пары Цингера:", "o": ["A<sub>E</sub> = 360° − A<sub>W</sub>", "A<sub>S</sub> = 180° − A<sub>N</sub>", "A<sub>E</sub> = A<sub>W</sub>", "A<sub>E</sub> = 90°"], "a": 0, "e": "Относительно меридиана."}, {"id": "q66", "t": 27, "q": "Что исключается в способе Цингера?", "o": ["ζ и x", "только y", "y и ζ", "ничего"], "a": 0, "e": "Остаётся y — время."}, {"id": "q67", "t": 27, "q": "Время на наблюдение одной пары Цингера:", "o": ["≈ 5 мин", "≈ 1 ч", "≈ 30 с", "≈ 15 мин"], "a": 0, "e": "Условия не успевают измениться."}, {"id": "q68", "t": 28, "q": "Долгота из серии Цингера:", "o": ["λ′ = λ₀ + (y<sub>ср</sub>/15)·sec φ", "λ′ = λ₀ + y<sub>ср</sub>·cos φ", "λ′ = λ₀ − y<sub>ср</sub>", "λ′ = y<sub>ср</sub>/φ"], "a": 0, "e": "y = 15 cos φ Δu."}, {"id": "q69", "t": 29, "q": "Симметрия пары Певцова:", "o": ["A<sub>S</sub> = 180° − A<sub>N</sub>", "A<sub>E</sub> = 360° − A<sub>W</sub>", "A<sub>S</sub> = A<sub>N</sub>", "A<sub>S</sub> = 90°"], "a": 0, "e": "Относительно первого вертикала — звёзды по одну сторону меридиана."}, {"id": "q70", "t": 29, "q": "В способе Певцова исключается…", "o": ["ζ и ошибка времени y", "только ζ", "x и ζ", "рефракция не исключается"], "a": 0, "e": "sin A<sub>S</sub> = sin A<sub>N</sub>."}, {"id": "q71", "t": 29, "q": "Интервал между звёздами пары Певцова:", "o": ["от 26ˢ до 15ᵐ", "ровно 1 ч", "менее 1ˢ", "от 2 до 3 ч"], "a": 0, "e": "Требование Инструкции."}, {"id": "q72", "t": 30, "q": "Пар Певцова для 0,3″ (Инструкция):", "o": ["12–15", "3–4", "30–40", "1"], "a": 0, "e": "С запасом."}, {"id": "q73", "t": 31, "q": "Азимут предмета по Полярной:", "o": ["a = A + Q", "a = A − φ", "a = t − α", "a = Q·cos δ"], "a": 0, "e": "Или a = M − M<sub>N</sub>."}, {"id": "q74", "t": 31, "q": "Минимальная программа высокоточного азимута по Полярной:", "o": ["18 приёмов за 3 дня", "2 приёма", "6 пар звёзд", "1 приём"], "a": 0, "e": "Методические указания."}, {"id": "q75", "t": 31, "q": "Ошибка времени 1ˢ даёт в азимуте по Полярной около…", "o": ["0,2″·sec φ", "15″", "1′", "0"], "a": 0, "e": "Множитель cos δ."}, {"id": "q76", "t": 32, "q": "Средняя ошибка азимута из n приёмов:", "o": ["√([vv]/(n(n − 1)))", "√([vv]/n)", "[vv]/(n − 1)", "√([vv])"], "a": 0, "e": "Ошибка среднего арифметического."}, {"id": "q77", "t": 33, "q": "Широта по Полярной по таблицам АЕ:", "o": ["φ = h + I + II + III", "φ = z + δ", "φ = M + N", "φ = 90° − δ"], "a": 0, "e": "h = 90° − z."}, {"id": "q78", "t": 33, "q": "Главный член поправки широты по Полярной:", "o": ["−Δ·cos t", "Δ·sin t", "Δ²", "ctg z"], "a": 0, "e": "Проекция радиуса круга Полярной на меридиан."}, {"id": "q79", "t": 34, "q": "Горизонтальный параллакс Солнца:", "o": ["≈ 8,8″", "≈ 16′", "≈ 0,32″", "≈ 1°"], "a": 0, "e": "Поправка −p₀·sin z."}, {"id": "q80", "t": 34, "q": "Видимый радиус Солнца:", "o": ["≈ 16′", "≈ 8,8″", "≈ 1°", "≈ 30″"], "a": 0, "e": "Учитывают при визировании на край."}, {"id": "q81", "t": 35, "q": "Для азимута по z Солнца время нужно знать с точностью…", "o": ["1–2 мин", "0,01ˢ", "0,5ˢ", "1 ч"], "a": 0, "e": "Только для интерполирования δ."}, {"id": "q82", "t": 35, const TK = Object.fromEntries(D.tickets.map(t => [t.n, t]));
const blockOf = n => TK[n].block;
const BLOCK_SHORT = ['Общие', 'Инструменты', 'Время', 'Теория', 'Способы', 'Азимут/Солнце', 'Редукции'];
const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];

/* ---------- storage ---------- */
const KEY = 'ga.v1';
const blank = () => ({ cards: {}, star: {}, quiz: {}, tickets: {}, match: { best: null }, tests: [], days: {} });
let S;
try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { S = blank(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const today = () => new Date().toISOString().slice(0, 10);
const touchDay = () => { S.days[today()] = (S.days[today()] || 0) + 1; };

/* ---------- spaced repetition (Leitner) ---------- */
const INTERVALS = [0, 10 * 60e3, 864e5, 3 * 864e5, 7 * 864e5, 16 * 864e5];
const cs = id => S.cards[id] || { box: 0, due: 0, ok: 0, bad: 0, seen: 0 };
function gradeCard(id, g) { // g: 0 не знаю, 1 сомневаюсь, 2 знаю
  const c = cs(id);
  c.seen++;
  if (g === 0) { c.box = 0; c.bad++; }
  else if (g === 1) { c.box = Math.max(1, c.box); }
  else { c.box = Math.min(5, c.box + 1); c.ok++; }
  c.due = Date.now() + INTERVALS[c.box];
  S.cards[id] = c; touchDay(); save();
}
const isLearned = id => cs(id).box >= 3;
const isDue = id => { const c = S.cards[id]; return c && c.seen && c.due <= Date.now(); };
const isNew = id => !S.cards[id] || !S.cards[id].seen;

/* ---------- helpers ---------- */
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const strip = s => String(s).replace(/<[^>]+>/g, '');
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return n + ' ' + (m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c); };
const icon = {
  cards: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>',
  learn: '<svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M7 10.5V16c3 2 7 2 10 0v-5.5"/></svg>',
  test: '<svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  match: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7M17.5 14v7"/></svg>',
  tickets: '<svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',
  notes: '<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>',
  fig: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18"/></svg>',
  star: '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>',
  shuffle: '<svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>',
  swap: '<svg viewBox="0 0 24 24"><path d="M7 16V4M3 8l4-4 4 4M17 8v12M21 16l-4 4-4-4"/></svg>',

  right: '<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>',
  dice: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1"/><circle cx="15.5" cy="15.5" r="1"/><circle cx="12" cy="12" r="1"/></svg>',
  settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
};
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1800); }
let cleanup = null; // per-view teardown (timers, key handlers)
function setView(html, nav) {
  if (cleanup) { cleanup(); cleanup = null; }
  main.innerHTML = html;
  $$('[data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === nav));
  window.scrollTo(0, 0);
}
function onKeys(fn) { const h = e => { if (e.target.closest('input,select,textarea') || e.metaKey || e.ctrlKey || e.altKey) return; fn(e); }; document.addEventListener('keydown', h); return () => document.removeEventListener('keydown', h); }

/* block filter chips (shared) */
let blockSel = new Set(D.blocks.map((_, i) => i));
function blockChips() {
  return `<div class="chips" role="group" aria-label="Фильтр по блокам">${D.blocks.map((b, i) =>
    `<button class="chip" data-block="${i}" aria-pressed="${blockSel.has(i)}" title="${esc(b.title)}">${ROMAN[i]} · ${BLOCK_SHORT[i]}</button>`).join('')}
    <button class="chip" data-block="all">Все</button></div>`;
}
function bindChips(rerender) {
  $$('[data-block]').forEach(b => b.onclick = () => {
    const v = b.dataset.block;
    if (v === 'all') blockSel = new Set(D.blocks.map((_, i) => i));
    else { const i = +v; if (blockSel.has(i) && blockSel.size > 1) blockSel.delete(i); else blockSel.add(i); }
    rerender();
  });
}
const cardsInSel = () => D.cards.filter(c => blockSel.has(blockOf(c.t)));

/* ---------- HOME ---------- */
function viewHome() {
  const total = D.cards.length, learned = D.cards.filter(c => isLearned(c.id)).length;
  const due = D.cards.filter(c => isDue(c.id)).length, fresh = D.cards.filter(c => isNew(c.id)).length;
  const tk = D.tickets.filter(t => S.tickets[t.n] === 2).length;
  const qAll = Object.values(S.quiz).reduce((a, q) => [a[0] + q.ok, a[1] + q.ok + q.bad], [0, 0]);
  const acc = qAll[1] ? Math.round(100 * qAll[0] / qAll[1]) : null;
  const streak = (() => { let n = 0; const d = new Date(); for (;;) { const k = d.toISOString().slice(0, 10); if (S.days[k]) { n++; d.setDate(d.getDate() - 1); } else break; } return n; })();
  const nextAction = due ? `<a class="btn" href="#/cards?due">Повторить ${plural(due, 'карточку', 'карточки', 'карточек')}</a>`
    : fresh ? `<a class="btn" href="#/learn">Учить новые (${fresh})</a>` : `<a class="btn" href="#/test">Пройти тест</a>`;
  const modes = [
    ['cards', 'Карточки', 'Переворачивай и оценивай себя — алгоритм сам решит, когда показать карточку снова.'],
    ['learn', 'Заучивание', 'Раунды с выбором ответа: карточка уходит, только когда ответишь верно дважды подряд.'],
    ['test', 'Тест', `${D.quiz.length} вопросов с объяснениями, плюс вопросы по схемам и карточкам.`],
    ['match', 'Подбор', 'Соедини термин и определение на время. Побей свой рекорд.'],
    ['tickets', 'Билеты', 'Имитация экзамена: случайный билет, таймер подготовки, проверка по «Коротко».'],
    ['notes', 'Конспект', 'Вся методичка: теория, формулы и 26 схем по каждому вопросу.'],
  ];
  setView(`
  <h1 class="page">Геодезическая астрономия</h1>
  <p class="lead">39 экзаменационных вопросов в одном месте: ${D.cards.length} карточек, ${D.quiz.length} тестовых вопросов, ${D.figs.length} схем и полный конспект. Прогресс сохраняется в этом браузере.</p>
  <div class="hero">
    <div class="card primary">
      <div class="muted small">Сегодня</div>
      <div class="row" style="margin:10px 0 16px;gap:28px">
        <div class="stat"><span class="big-num">${due}</span><span class="muted small">к повторению</span></div>
        <div class="stat"><span class="big-num">${fresh}</span><span class="muted small">новых</span></div>
        <div class="stat"><span class="big-num">${streak}</span><span class="muted small">${streak === 1 ? 'день подряд' : 'дней подряд'}</span></div>
      </div>
      ${nextAction}
    </div>
    <div class="card">
      <div class="grid g2" style="gap:16px">
        <div class="stat"><span class="muted small">Выучено карточек</span><b>${learned}/${total}</b><div class="bar ok"><i style="width:${100 * learned / total}%"></i></div></div>
        <div class="stat"><span class="muted small">Билетов «знаю»</span><b>${tk}/39</b><div class="bar ok"><i style="width:${100 * tk / 39}%"></i></div></div>
        <div class="stat"><span class="muted small">Точность в тестах</span><b>${acc === null ? '—' : acc + '%'}</b></div>
        <div class="stat"><span class="muted small">Рекорд подбора</span><b>${S.match.best ? (S.match.best / 1000).toFixed(1) + ' с' : '—'}</b></div>
      </div>
    </div>
  </div>
  <div class="grid g3">${modes.map(([k, t, d]) => `<a class="card mode" href="#/${k}"><span class="ic">${icon[k]}</span><h3>${t}</h3><p>${d}</p></a>`).join('')}</div>
  <h2 class="section-title">Прогресс по блокам</h2>
  <div class="card">${D.blocks.map((b, i) => {
    const cc = D.cards.filter(c => blockOf(c.t) === i), l = cc.filter(c => isLearned(c.id)).length;
    const pct = Math.round(100 * l / cc.length);
    return `<div class="block-row"><div><b>${ROMAN[i]}.</b> ${esc(b.title.replace(/^[IVX]+\.\s*/, ''))}<div class="muted small">вопросы ${b.tickets[0]}–${b.tickets[b.tickets.length - 1]} · ${cc.length} карточек</div></div><div class="bar ok"><i style="width:${pct}%"></i></div><div class="small muted" style="text-align:right">${pct}%</div></div>`;
  }).join('')}</div>
  <h2 class="section-title">Самые трудные карточки</h2>
  ${(() => { const hard = D.cards.filter(c => cs(c.id).bad > 0).sort((a, b) => (cs(b.id).bad - cs(b.id).ok) - (cs(a.id).bad - cs(a.id).ok)).slice(0, 6);
    return hard.length ? `<div class="grid g2">${hard.map(c => `<div class="card"><div class="row"><span class="tag bad">ошибок: ${cs(c.id).bad}</span><span class="tag">вопрос ${c.t}</span></div><p style="margin:10px 0 4px;font-weight:600">${c.f}</p><p class="muted small" style="margin:0">${c.b}</p></div>`).join('')}</div>`
      : `<div class="card empty">Пока пусто — здесь появятся карточки, в которых вы ошибались.</div>`; })()}
  `, 'home');
}

/* ---------- FLASHCARDS ---------- */
let fcOpts = { reverse: false, starred: false };
function viewCards(q, fixed) {
  const onlyDue = q.has('due') || !!fixed;
  let deck = cardsInSel();
  if (fcOpts.starred) deck = deck.filter(c => S.star[c.id]);
  if (q.has('due')) deck = D.cards.filter(c => isDue(c.id));
  if (fixed) deck = fixed.slice();
  const heading = fixed ? 'Карточки · вопрос ' + fixed[0].t : 'Повторение';
  // order: due first, then new, then by box
  deck = shuffle(deck).sort((a, b) => (isDue(b.id) - isDue(a.id)) || (cs(a.id).box - cs(b.id).box));
  let i = 0, flipped = false, known = 0, unknown = 0;
  const render = () => {
    if (!deck.length) return setView(`<h1 class="page">Карточки</h1>${onlyDue ? '' : blockChips()}<div class="card empty" style="margin-top:16px">Нет карточек для этого фильтра. ${onlyDue ? '<a href="#/cards">Открыть все карточки</a>' : ''}</div>`, 'cards'), onlyDue || bindChips(() => viewCards(q));
    if (i >= deck.length) return finish();
    const c = deck[i], st = cs(c.id);
    const front = fcOpts.reverse ? c.b : c.f, back = fcOpts.reverse ? c.f : c.b;
    const boxTag = isNew(c.id) ? '<span class="tag pri">новая</span>' : `<span class="tag ${st.box >= 3 ? 'ok' : st.box ? 'warn' : 'bad'}">уровень ${st.box}/5</span>`;
    setView(`
      <div class="row"><h1 class="page" style="margin:0">${onlyDue ? heading : 'Карточки'}</h1><span class="spacer"></span>
        <button class="btn ghost sm" id="rev" aria-pressed="${fcOpts.reverse}">${icon.swap} ${fcOpts.reverse ? 'Ответ → вопрос' : 'Вопрос → ответ'}</button>
        <button class="chip" id="onlyStar" aria-pressed="${fcOpts.starred}">${icon.star.replace('<svg', '<svg width="16" height="16"')} Избранные</button></div>
      ${onlyDue ? `<p class="lead" style="margin-top:6px">${fixed ? 'Только карточки этого вопроса. <a href="#/cards">Все карточки</a>' : 'Карточки, срок повторения которых наступил.'}</p>` : `<div style="margin:14px 0">${blockChips()}</div>`}
      <div class="progress-line"><span>${i + 1} / ${deck.length}</span><div class="bar"><i style="width:${100 * i / deck.length}%"></i></div><span class="tag ok">${known}</span><span class="tag bad">${unknown}</span></div>
      <div class="fc-wrap"><button class="fc ${flipped ? 'flipped' : ''}" id="fc" aria-label="Карточка, нажмите чтобы перевернуть">
        <div class="fc-face"><div class="corner"><span>Вопрос ${c.t} · ${esc(BLOCK_SHORT[blockOf(c.t)])}</span>${boxTag}</div><div class="txt">${front}</div><div class="hint">нажмите или <kbd>Пробел</kbd>, чтобы перевернуть</div></div>
        <div class="fc-face fc-back"><div class="corner"><span>Ответ</span><a href="#/notes/${c.t}" onclick="event.stopPropagation()">к конспекту →</a></div><div class="txt">${back}</div></div>
      </button></div>
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <button class="icon-btn" id="prev" aria-label="Предыдущая">${icon.left}</button>
        <button class="star" id="star" aria-pressed="${!!S.star[c.id]}" aria-label="В избранное">${icon.star}</button>
        <button class="icon-btn" id="next" aria-label="Следующая (без оценки)">${icon.right}</button>
      </div>
      <div class="grade" ${flipped ? '' : 'style="opacity:.5"'}>
        <button class="btn bad" data-g="0">Не знаю<small>снова через минуту</small></button>
        <button class="btn warn" data-g="1">Сомневаюсь<small>скоро повторим</small></button>
        <button class="btn ok" data-g="2">Знаю<small>${['', '10 мин', '1 день', '3 дня', '7 дней', '16 дней'][Math.min(5, st.box + 1)]}</small></button>
      </div>
      <div class="kbd-help"><span><kbd>Пробел</kbd> перевернуть</span><span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> оценка</span><span><kbd>←</kbd><kbd>→</kbd> листать</span><span><kbd>S</kbd> избранное</span></div>
    `, 'cards');
    $('#fc').onclick = () => { flipped = !flipped; $('#fc').classList.toggle('flipped', flipped); $('.grade').style.opacity = flipped ? 1 : .5; };
    $('#prev').onclick = () => { if (i > 0) { i--; flipped = false; render(); } };
    $('#next').onclick = () => { i++; flipped = false; render(); };
    $('#star').onclick = () => { S.star[c.id] = !S.star[c.id]; if (!S.star[c.id]) delete S.star[c.id]; save(); $('#star').setAttribute('aria-pressed', !!S.star[c.id]); };
    $('#rev').onclick = () => { fcOpts.reverse = !fcOpts.reverse; flipped = false; render(); };
    $('#onlyStar').onclick = () => { fcOpts.starred = !fcOpts.starred; viewCards(q, fixed); };
    $$('[data-g]').forEach(b => b.onclick = () => grade(+b.dataset.g));
    if (!onlyDue) bindChips(() => viewCards(q));
    cleanup = onKeys(e => {
      if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); $('#fc').click(); }
      else if (e.key === 'ArrowRight') $('#next').click();
      else if (e.key === 'ArrowLeft') $('#prev').click();
      else if (['1', '2', '3'].includes(e.key)) grade(+e.key - 1);
      else if (e.key.toLowerCase() === 's' || e.key.toLowerCase() === 'ы') $('#star').click();
    });
  };
  const grade = g => {
    if (!flipped) { $('#fc').click(); return; }
    gradeCard(deck[i].id, g);
    if (g === 2) known++; else unknown++;
    if (g === 0) deck.splice(Math.min(deck.length, i + 4), 0, deck[i]); // вернётся через 3 карточки
    i++; flipped = false; render();
  };
  const finish = () => {
    setView(`<div class="card" style="text-align:center;padding:40px 20px">
      <h1 class="page">Колода пройдена</h1>
      <p class="lead" style="margin:8px auto 20px">Знаю: <b>${known}</b> · Повторить: <b>${unknown}</b>. Карточки с ошибками вернутся в следующей сессии раньше остальных.</p>
      <div class="row" style="justify-content:center"><button class="btn" id="again">Ещё раз</button><a class="btn ghost" href="#/learn">Заучивание</a><a class="btn ghost" href="#/test">Тест</a></div></div>`, 'cards');
    $('#again').onclick = () => viewCards(q, fixed);
  };
  render();
}

/* ---------- LEARN (раунды) ---------- */
function makeCardMCQ(c, reverse) {
  const pool = D.cards.filter(x => x.id !== c.id);
  const same = shuffle(pool.filter(x => blockOf(x.t) === blockOf(c.t)));
  const others = shuffle(pool);
  const pick = [];
  const field = reverse ? 'f' : 'b';
  for (const x of same.concat(others)) { if (pick.length === 3) break; if (!pick.some(p => strip(p[field]) === strip(x[field])) && strip(x[field]) !== strip(c[field])) pick.push(x); }
  const opts = shuffle([c, ...pick]);
  return { q: reverse ? c.b : c.f, o: opts.map(o => o[field]), a: opts.indexOf(c), card: c, reverse };
}
function viewLearn() {
  let pool = cardsInSel().sort((a, b) => (cs(a.id).box - cs(b.id).box) || (cs(b.id).bad - cs(a.id).bad));
  const ROUND = 8;
  let active = pool.slice(0, ROUND).map(c => ({ c, streak: 0 }));
  let rest = pool.slice(ROUND), done = 0, queue = [];
  const fill = () => { queue = shuffle(active.filter(x => x.streak < 2)); };
  fill();
  const step = () => {
    if (!queue.length) {
      active = active.filter(x => x.streak < 2);
      while (active.length < ROUND && rest.length) active.push({ c: rest.shift(), streak: 0 });
      if (!active.length) return setView(`<div class="card" style="text-align:center;padding:40px"><h1 class="page">Всё выучено!</h1><p class="lead" style="margin:8px auto 20px">Все карточки выбранных блоков пройдены дважды подряд без ошибок.</p><a class="btn" href="#/test">Проверить себя тестом</a></div>`, 'learn');
      fill();
    }
    const item = queue.shift();
    const m = makeCardMCQ(item.c, item.streak === 1 && Math.random() < .5);
    const totalN = pool.length;
    setView(`
      <div class="row"><h1 class="page" style="margin:0">Заучивание</h1></div>
      <div style="margin:14px 0">${blockChips()}</div>
      <div class="progress-line"><span>Освоено ${done} из ${totalN}</span><div class="bar ok"><i style="width:${100 * done / totalN}%"></i></div></div>
      <div class="card q-card" style="margin-top:14px">
        <div class="row"><span class="tag">Вопрос ${item.c.t}</span><span class="tag ${item.streak ? 'ok' : 'pri'}">${item.streak ? 'ещё раз для закрепления' : 'новая для раунда'}</span><span class="spacer"></span><span class="muted small">${m.reverse ? 'Выберите термин' : 'Выберите ответ'}</span></div>
        <div class="q-title">${m.q}</div>
        <div class="opts">${m.o.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${k + 1}</span><span>${o}</span></button>`).join('')}</div>
        <div id="fb"></div>
      </div>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost sm" id="dunno">Не знаю — показать</button></div>`, 'learn');
    bindChips(() => viewLearn());

      $('#fb').innerHTML = `<div class="explain ${ok ? 'ok' : 'bad'} reveal"><b>${ok ? 'Верно!' : 'Правильный ответ:'}</b> ${ok ? '' : m.o[m.a]}<div class="row" style="margin-top:10px"><button class="btn sm" id="go">Дальше <kbd style="background:none;color:inherit;border-color:currentColor">Enter</kbd></button></div></div>`;

}

/* ---------- TEST ---------- */
let testCfg = { n: 20, kinds: { quiz: true, fig: true, cards: true } };
function buildTest() {
  const items = [];
  if (testCfg.kinds.quiz) D.quiz.filter(q => blockSel.has(blockOf(q.t))).forEach(q => {
    const order = shuffle(q.o.map((_, i) => i));
    items.push({ kind: 'quiz', id: q.id, t: q.t, q: q.q, o: order.map(i => q.o[i]), a: order.indexOf(q.a), e: q.e });
  });
  if (testCfg.kinds.fig) D.figs.filter(f => blockSel.has(blockOf(f.t))).forEach((f, i) => {
    const wrong = shuffle(D.tickets.filter(t => t.n !== f.t && !D.figs.some(x => x.t === t.n && x.svg === f.svg))).slice(0, 3);
    const opts = shuffle([TK[f.t], ...wrong]);
    items.push({ kind: 'fig', id: 'f' + i, t: f.t, q: 'К какому вопросу относится эта схема?', svg: f.svg, o: opts.map(t => `${t.n}. ${esc(t.title)}`), a: opts.indexOf(TK[f.t]), e: f.cap });
  });
  if (testCfg.kinds.cards) shuffle(cardsInSel()).slice(0, 25).forEach(c => {
    const m = makeCardMCQ(c, false);
    items.push({ kind: 'card', id: c.id, t: c.t, q: m.q, o: m.o, a: m.a, e: '' });
  });
  return shuffle(items).slice(0, testCfg.n === 'all' ? items.length : testCfg.n);
}

function runTest(items) {
  if (!items.length) return toast('Нет вопросов для выбранных фильтров');
  let i = 0; const res = [];
  const t0 = Date.now();

    if (i >= items.length) return testResult(items, res, Date.now() - t0);
    const it = items[i];
    setView(`
      <div class="progress-line"><span>${i + 1} / ${items.length}</span><div class="bar"><i style="width:${100 * i / items.length}%"></i></div><span class="tag ok">${res.filter(Boolean).length}</span><span class="tag bad">${res.filter(r => r === false).length}</span><button class="btn ghost sm" id="quit">Завершить</button></div>
      <div class="card q-card" style="margin-top:14px">
        <div class="row"><span class="tag">Вопрос ${it.t}</span><span class="tag pri">${{ quiz: 'теория', fig: 'схема', card: 'карточка' }[it.kind]}</span></div>
        <div class="q-title">${it.q}</div>

    let answered = false;
    const answer = k => {
      if (answered) return; answered = true;
      const ok = k === it.a; res[i] = ok; it.picked = k;
      $$('.opt').forEach((b, j) => { b.disabled = true; if (j === it.a) b.classList.add('right'); else if (j === k) b.classList.add('wrong'); });
      if (it.kind === 'quiz') { const q = S.quiz[it.id] || { ok: 0, bad: 0 }; ok ? q.ok++ : q.bad++; S.quiz[it.id] = q; }
      if (it.kind === 'card') gradeCard(it.id, ok ? 2 : 0);
      touchDay(); save();
      $('#fb').innerHTML = `<div class="explain ${ok ? 'ok' : 'bad'} reveal"><b>${ok ? 'Верно.' : 'Неверно.'}</b> ${it.e || (ok ? '' : 'Правильный ответ выделен зелёным.')}
        <div class="row" style="margin-top:10px"><button class="btn sm" id="go">${i + 1 < items.length ? 'Следующий' : 'Результат'}</button><a class="btn ghost sm" href="#/notes/${it.t}" target="_blank" rel="noopener">Открыть вопрос ${it.t} в конспекте</a></div></div>`;

    };
    $$('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
    $('#quit').onclick = () => testResult(items.slice(0, i), res.slice(0, i), Date.now() - t0);
    cleanup = onKeys(e => { if (/^[1-4]$/.test(e.key)) answer(+e.key - 1); else if (e.key === 'Enter' && answered) { i++; step(); } });
  };
  step();
}
function testResult(items, res, ms) {
  const ok = res.filter(Boolean).length, n = items.length, pct = n ? Math.round(100 * ok / n) : 0;
  if (n) { S.tests.push({ date: today(), score: ok, total: n }); S.tests = S.tests.slice(-30); save(); }
  const wrong = items.filter((_, k) => res[k] === false);
  const byT = {}; wrong.forEach(w => byT[w.t] = (byT[w.t] || 0) + 1);
  const C = 2 * Math.PI * 62;
  const col = pct >= 85 ? 'var(--ok)' : pct >= 60 ? 'var(--warn)' : 'var(--bad)';
  setView(`
    <div class="card" style="text-align:center;padding:28px 20px">
      <svg class="result-ring" viewBox="0 0 150 150" aria-label="Результат ${pct}%"><circle cx="75" cy="75" r="62" stroke="var(--surface-2)"/><circle cx="75" cy="75" r="62" stroke="${col}" stroke-dasharray="${C * pct / 100} ${C}" transform="rotate(-90 75 75)" style="transition:stroke-dasharray 1s"/><text x="75" y="84" text-anchor="middle" font-size="30" font-weight="700" fill="currentColor" stroke="none">${pct}%</text></svg>
      <h1 class="page" style="margin-top:10px">${ok} из ${n}</h1>
      <p class="lead" style="margin:4px auto 18px">${pct >= 85 ? 'Отлично — материал уверенно держится.' : pct >= 60 ? 'Хорошо, но есть пробелы — разберите ошибки ниже.' : 'Стоит вернуться к конспекту по вопросам с ошибками.'} Время: ${Math.round(ms / 1000)} с.</p>
      <div class="row" style="justify-content:center">${wrong.length ? '<button class="btn" id="redo">Повторить ошибки</button>' : ''}<button class="btn ghost" id="newt">Новый тест</button></div>
    </div>
    ${Object.keys(byT).length ? `<h2 class="section-title">Что подтянуть</h2><div class="chips">${Object.entries(byT).sort((a, b) => b[1] - a[1]).map(([t, c]) => `<a class="chip" href="#/notes/${t}">Вопрос ${t} · ${c}</a>`).join('')}</div>` : ''}
    ${wrong.length ? `<h2 class="section-title">Разбор ошибок</h2><div class="grid">${wrong.map(w => `<div class="card"><div class="row"><span class="tag">Вопрос ${w.t}</span></div><p style="font-weight:600;margin:10px 0">${w.q}</p>${w.svg ? `<div class="fig-q" style="max-width:420px">${w.svg}</div>` : ''}<p style="margin:8px 0 0"><span class="tag bad">ваш ответ</span> ${w.picked >= 0 ? w.o[w.picked] : '—'}</p><p style="margin:6px 0 0"><span class="tag ok">верно</span> ${w.o[w.a]}</p>${w.e ? `<p class="muted small" style="margin:8px 0 0">${w.e}</p>` : ''}</div>`).join('')}</div>` : ''}`, 'test');
  $('#newt').onclick = viewTestSetup;
  if ($('#redo')) $('#redo').onclick = () => runTest(shuffle(wrong.map(w => Object.assign({}, w, { picked: undefined }))));
}

function viewMatch() {
  const eligible = cardsInSel().filter(c => strip(c.b).length <= 70 && strip(c.f).length <= 60);
  const pairs = shuffle(eligible).slice(0, 6);
  if (pairs.length < 3) return setView(`<h1 class="page">Подбор</h1>${blockChips()}<div class="card empty">Мало коротких карточек в выбранных блоках.</div>`, 'match'), bindChips(viewMatch);
  const tiles = shuffle(pairs.flatMap(c => [{ id: c.id, side: 'f', html: c.f }, { id: c.id, side: 'b', html: c.b }]));
  setView(`
    <div class="row"><h1 class="page" style="margin:0">Подбор</h1><span class="spacer"></span><span class="timer" id="tm" aria-live="off">0.0</span></div>
    <p class="lead" style="margin-top:6px">Нажмите на термин, потом на его определение. Ошибка — +1 секунда. Рекорд: <b>${S.match.best ? (S.match.best / 1000).toFixed(1) + ' с' : '—'}</b></p>
    <div style="margin:0 0 14px">${blockChips()}</div>
    <div class="match-grid">${tiles.map((t, k) => `<button class="tile ${t.side === 'f' ? 'term' : ''}" data-k="${k}">${t.html}</button>`).join('')}</div>`, 'match');
  bindChips(viewMatch);
  const t0 = performance.now(); let penalty = 0, sel = null, left = pairs.length;
  const iv = setInterval(() => { const el = $('#tm'); if (el) el.textContent = ((performance.now() - t0 + penalty) / 1000).toFixed(1); }, 100);
  cleanup = () => clearInterval(iv);
  $$('.tile').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, t = tiles[k];
    if (sel === null) { sel = k; b.classList.add('sel'); return; }
    if (sel === k) { b.classList.remove('sel'); sel = null; return; }
    const s = tiles[sel], sb = $(`.tile[data-k="${sel}"]`);
    if (s.id === t.id && s.side !== t.side) {
      [b, sb].forEach(x => { x.classList.remove('sel'); x.classList.add('done'); x.disabled = true; });
      left--;
      if (!left) {
        clearInterval(iv); const ms = performance.now() - t0 + penalty;
        const rec = !S.match.best || ms < S.match.best; if (rec) S.match.best = Math.round(ms); touchDay(); save();
        setTimeout(() => { setView(`<div class="card" style="text-align:center;padding:40px 20px"><div class="timer" style="font-size:48px">${(ms / 1000).toFixed(1)} с</div><h1 class="page" style="margin-top:10px">${rec ? 'Новый рекорд!' : 'Готово'}</h1><p class="lead" style="margin:6px auto 20px">Рекорд: ${(S.match.best / 1000).toFixed(1)} с</p><button class="btn" id="again">Ещё раз</button></div>`, 'match'); $('#again').onclick = viewMatch; }, 350);
      }
    } else {
      penalty += 1000;
      [b, sb].forEach(x => { x.classList.remove('sel'); x.classList.add('bad'); setTimeout(() => x.classList.remove('bad'), 400); });
    }
    sel = null;
  });
}

    <div class="grid g2">${D.blocks.map(b => `<div class="card"><h3 style="margin:0 0 8px">${esc(b.title)}</h3>${b.tickets.map(t => `<div><a href="#/notes/${t}">${t}. ${esc(TK[t].title)}</a></div>`).join('')}</div>`).join('')}</div>
    <div class="row" style="margin-top:16px"><a class="btn ghost" href="#/notes/notation">Обозначения</a><a class="btn ghost" href="#/notes/cheat">Шпаргалка чисел</a></div>`;
  setView(`<div class="notes-layout">${toc}<article>${content}</article></div>`, 'notes');
  $('#jump').onchange = e => { if (e.target.value) location.hash = '#/notes/' + e.target.value; };
  const act = $('.toc-list a.active'), lst = $('.toc-list'); if (act && lst.offsetParent) lst.scrollTop = act.offsetTop - lst.offsetTop - lst.clientHeight / 2;
  if (TK[n]) cleanup = onKeys(e => { if (e.key === 'ArrowRight' && n < 39) location.hash = '#/notes/' + (n + 1); if (e.key === 'ArrowLeft' && n > 1) location.hash = '#/notes/' + (n - 1); });
}

/* ---------- MORE / SETTINGS ---------- */
function viewMore() {
  setView(`<h1 class="page">Ещё</h1>
    <div class="grid g2" style="margin-top:14px">
      <a class="card mode" href="#/learn"><span class="ic">${icon.learn}</span><h3>Заучивание</h3><p>Раунды с выбором ответа</p></a>
      <a class="card mode" href="#/match"><span class="ic">${icon.match}</span><h3>Подбор</h3><p>Игра на время</p></a>
      <a class="card mode" href="#/notes"><span class="ic">${icon.notes}</span><h3>Конспект</h3><p>Теория и схемы</p></a>
      <a class="card mode" href="#/settings"><span class="ic">${icon.settings}</span><h3>Настройки</h3><p>Тема, перенос и сброс прогресса</p></a>
    </div>`, 'more');
}
function viewSettings() {
  const th = document.documentElement.dataset.theme || 'auto';
  setView(`<h1 class="page">Настройки</h1>
    <div class="card grid" style="gap:22px;margin-top:14px">
      <div><div class="muted small" style="font-weight:600;margin-bottom:8px">Тема</div><div class="chips">${[['auto', 'Как в системе'], ['light', 'Светлая'], ['dark', 'Тёмная']].map(([k, l]) => `<button class="chip" data-theme-set="${k}" aria-pressed="${th === k}">${l}</button>`).join('')}</div></div>
      <div><div class="muted small" style="font-weight:600;margin-bottom:8px">Перенос прогресса на другое устройство</div>
        <p class="small muted" style="margin:0 0 10px">Прогресс хранится только в этом браузере. Скачайте файл и загрузите его на другом устройстве.</p>
        <div class="row"><button class="btn ghost" id="exp">Скачать прогресс</button><label class="btn ghost" for="imp" tabindex="0">Загрузить прогресс</label><input type="file" id="imp" accept="application/json" hidden></div></div>
      <div><div class="muted small" style="font-weight:600;margin-bottom:8px">Сброс</div><button class="btn bad" id="reset">Сбросить весь прогресс</button></div>
      <div class="small muted">Горячие клавиши: <kbd>/</kbd> поиск · <kbd>Пробел</kbd> перевернуть карточку · <kbd>1</kbd>–<kbd>4</kbd> выбор ответа · <kbd>←</kbd><kbd>→</kbd> листать</div>
    </div>`, 'more');
  $$('[data-theme-set]').forEach(b => b.onclick = () => { setTheme(b.dataset.themeSet); viewSettings(); });
  $('#exp').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' })); a.download = `geoastro-progress-${today()}.json`; a.click(); };
  $('#imp').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { S = Object.assign(blank(), JSON.parse(t)); save(); toast('Прогресс загружен'); } catch (er) { toast('Файл не распознан'); } }); };
  $('#reset').onclick = () => { if (confirm('Сбросить весь прогресс? Это нельзя отменить.')) { S = blank(); save(); toast('Прогресс сброшен'); } };
}
function setTheme(k) {
  if (k === 'auto') { delete document.documentElement.dataset.theme; try { localStorage.removeItem('ga.theme'); } catch (e) {} }
  else { document.documentElement.dataset.theme = k; try { localStorage.setItem('ga.theme', k); } catch (e) {} }
}
$('#themeBtn').onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(dark ? 'light' : 'dark');
};

/* ---------- SEARCH ---------- */
const sm = $('#searchModal'), si = $('#searchInput'), sr = $('#searchResults');
const norm = s => strip(s).toLowerCase().replace(/ё/g, 'е');
const IDX = [
  ...D.tickets.map(t => ({ href: `#/notes/${t.n}`, title: `${t.n}. ${t.title}`, sub: strip(t.short), hay: norm(t.title + ' ' + t.short + ' ' + t.key + ' ' + t.body) })),
  ...D.cards.map(c => ({ href: `#/cards?t=${c.t}`, title: strip(c.f), sub: strip(c.b), hay: norm(c.f + ' ' + c.b) })),
];
function openSearch() { sm.hidden = false; si.value = ''; sr.innerHTML = '<div class="empty small">Начните вводить — поиск по билетам, конспекту и карточкам.</div>'; si.focus(); }
function closeSearch() { sm.hidden = true; }
$('#searchBtn').onclick = openSearch; $('#searchClose').onclick = closeSearch;
sm.onclick = e => { if (e.target === sm) closeSearch(); };
si.oninput = () => {
  const q = norm(si.value.trim()); if (q.length < 2) { sr.innerHTML = ''; return; }
  const words = q.split(/\s+/);
  const hits = IDX.filter(x => words.every(w => x.hay.includes(w))).slice(0, 30);
  const hl = s => { let h = esc(s.length > 160 ? s.slice(0, 160) + '…' : s); words.forEach(w => { h = h.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>'); }); return h; };
  sr.innerHTML = hits.length ? hits.map(x => `<a href="${x.href}">${hl(x.title)}<span class="sub">${hl(x.sub)}</span></a>`).join('') : '<div class="empty small">Ничего не найдено</div>';
  $$('a', sr).forEach(a => a.onclick = closeSearch);
};
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !sm.hidden) closeSearch();
  else if (e.key === '/' && sm.hidden && !e.target.closest('input,textarea,select')) { e.preventDefault(); openSearch(); }
});

/* ---------- ROUTER ---------- */
function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  const q = new URLSearchParams(qs || '');
  const [a, b] = path.split('/');
  if (q.has('t')) { // карточки конкретного вопроса
    const n = +q.get('t');
    if (a === 'cards' && TK[n]) { cardsOfTicket(n); return; }
  }
  switch (a) {
    case 'cards': return viewCards(q);
    case 'learn': return viewLearn();
    case 'test': return viewTestSetup();
    case 'match': return viewMatch();
    case 'tickets': return viewTickets();
    case 'ticket': return viewTicket(+b);
    case 'notes': return viewNotes(b || '');
    case 'more': return viewMore();
    case 'settings': return viewSettings();
    default: return viewHome();
  }
}
function cardsOfTicket(n) { viewCards(new URLSearchParams(), D.cards.filter(c => c.t === n)); }
window.addEventListener('hashchange', route);
route();
})();

</script>
</body>
</html>
